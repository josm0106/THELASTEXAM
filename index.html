<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#24433a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>전문의 시험 공부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sidebar-w:254px;--memo-w:346px;
  /* 🌿 딥 포레스트 그린 + 아이보리 + 브라스 골드 — 정통 호텔 무드 */
  --bg:#f0eadd;
  --sidebar-bg:#f8f3ea;
  --panel:#f2ece0;
  --card-bg:#fcf9f3;
  --accent:#24433a;--accent2:#356055;--accent-deep:#142b25;
  --accent-soft:rgba(36,67,58,.09);--accent-glow:rgba(36,67,58,.16);
  --mint:#e7ece2;--mint2:#dde4d6;--mint3:#cbd5c4;
  --border:rgba(22,45,38,.13);--border2:rgba(22,45,38,.22);
  --heading1:#172620;--heading2:#1f322a;--heading3:#2f4035;--body-text:#36423a;
  --text2:#687468;--text3:#98a193;
  --correct:#4f8a45;--correct-bg:rgba(79,138,69,.12);
  --wrong:#c0533c;--wrong-bg:rgba(192,83,60,.10);
  --repeat:#b08d57;
  --gold:#b08d57;--gold-soft:rgba(176,141,87,.15);--gold-deep:#8c6d3e;
  --shadow-sm:0 1px 3px rgba(40,38,22,.06),0 1px 2px rgba(40,38,22,.04);
  --shadow:0 4px 16px rgba(40,38,22,.09),0 2px 6px rgba(40,38,22,.05);
  --shadow-lg:0 16px 44px rgba(35,40,28,.18),0 6px 16px rgba(35,40,28,.10);
  --shadow-accent:0 10px 30px rgba(36,67,58,.28);
  --glass:rgba(248,243,234,.76);--glass-strong:rgba(248,243,234,.9);
  --radius:16px;--radius-lg:22px;
  --ring-track:#e1ddcc;
  --serif:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;
}
html,body{height:100%}
body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;background:var(--bg);color:var(--body-text);display:flex;height:100vh;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(900px 600px at 12% -8%,rgba(53,96,85,.15),transparent 60%),radial-gradient(760px 520px at 105% 8%,rgba(36,67,58,.12),transparent 55%),radial-gradient(680px 680px at 50% 118%,rgba(176,141,87,.13),transparent 60%);background-attachment:fixed}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.05ms!important}}

/* ====== SIDEBAR ====== */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-bg);color:var(--body-text);display:flex;flex-direction:column;height:100vh;overflow:hidden;border-right:1px solid var(--border)}
.sidebar-header{padding:20px 20px 17px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%)}
.sidebar-header h1{font-size:15.5px;font-weight:800;color:#fff;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.sidebar-header .sub{font-size:10.5px;color:rgba(255,255,255,.88);margin-top:5px;font-weight:500}
.user-bar{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--mint)}
.user-bar .user-info{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:7px;font-weight:600}
.user-bar .user-icon{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.user-bar .logout-btn{padding:4px 10px;border:1px solid var(--border2);border-radius:7px;background:#fff;color:var(--text2);font-size:10.5px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.user-bar .logout-btn:hover{border-color:var(--wrong);color:var(--wrong)}

.book-list{flex:1;overflow-y:auto;padding:12px}
.book-list::-webkit-scrollbar{width:6px}.book-list::-webkit-scrollbar-thumb{background:var(--mint3);border-radius:3px}
.book-item{padding:13px 15px;margin-bottom:9px;border-radius:14px;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:var(--panel);position:relative}
.book-item:hover{background:var(--mint);border-color:var(--mint3);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.book-item.active{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 16px var(--accent-glow)}
.book-item .book-icon{font-size:19px;margin-bottom:5px}
.book-item .book-title{font-size:12.8px;font-weight:700;color:var(--heading2);line-height:1.4}
.book-item.active .book-title{color:var(--accent-deep)}
.book-item .book-stats{display:flex;gap:6px;margin-top:9px;font-size:10px;flex-wrap:wrap;align-items:center}
.book-item .book-stats span{padding:2px 8px;border-radius:8px;font-weight:700}
.book-stat-total{background:var(--mint2);color:var(--text2)}
.book-stat-done{background:rgba(21,163,74,.14);color:var(--correct)}
.book-stat-wrong{background:rgba(239,83,80,.12);color:var(--wrong)}
.book-stat-pct{margin-left:auto;background:var(--accent-soft);color:var(--accent-deep);font-weight:800}
.book-stat-empty{background:var(--mint2);color:var(--text3);font-weight:600}
.book-item .book-progress{margin-top:9px;height:4px;background:var(--mint2);border-radius:3px;overflow:hidden}
.book-item .book-progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .3s}

.sidebar-bottom{padding:0 12px 14px;display:flex;flex-direction:column;gap:7px}
.sidebar-bottom button{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--body-text);font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;font-family:inherit;font-weight:600}
.sidebar-bottom button:hover{background:var(--mint);border-color:var(--mint3)}
.sidebar-bottom .count{margin-left:auto;background:var(--accent);color:#fff;font-size:9.5px;padding:2px 8px;border-radius:9px;font-weight:700}
.sidebar-bottom .wrong-count{background:var(--wrong)}

/* ====== MAIN ====== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.main-header{padding:11px 28px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.72);backdrop-filter:blur(10px);font-size:13px;color:var(--text2);display:flex;align-items:center;gap:14px;min-height:48px;font-weight:600}
.main-header .back-btn{padding:6px 14px;border:1px solid var(--border2);border-radius:9px;background:#fff;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;display:none}
.main-header .back-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.main-header #headerTitle{font-weight:700;color:var(--heading2)}
.main-header #headerProgress{margin-left:auto;font-size:11.5px;color:var(--accent);font-weight:700}
.content-area{flex:1;overflow-y:auto;padding:22px 40px 70px}
.content-area::-webkit-scrollbar{width:8px}
.content-area::-webkit-scrollbar-thumb{background:var(--mint3);border-radius:4px}
.content-area::-webkit-scrollbar-thumb:hover{background:var(--accent2)}

/* ====== WELCOME ====== */
.welcome{text-align:center;padding-top:50px;max-width:780px;margin:0 auto}
.welcome .welcome-badge{display:inline-block;font-size:42px;margin-bottom:6px}
.welcome h2{font-size:27px;color:var(--heading1);margin-bottom:10px;font-weight:800;letter-spacing:-.5px}
.welcome p{color:var(--text2);font-size:14px;line-height:1.7}
.welcome .stats{display:flex;gap:16px;justify-content:center;margin-top:36px;flex-wrap:wrap}
.welcome .stats>div{background:var(--card-bg);border:1px solid var(--border);border-radius:18px;padding:20px 28px;min-width:118px;box-shadow:var(--shadow-sm)}
.welcome .stat-num{font-size:34px;font-weight:800;letter-spacing:-.5px}
.welcome .stat-num.blue{color:var(--accent)}.welcome .stat-num.green{color:var(--correct)}.welcome .stat-num.red{color:var(--wrong)}.welcome .stat-num.orange{color:var(--repeat)}
.welcome .stat-label{font-size:12px;color:var(--text2);margin-top:4px;font-weight:600}
.welcome .reset-views{margin-top:30px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.welcome .reset-views button{padding:9px 20px;border:1px solid var(--border2);border-radius:10px;background:#fff;color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit;font-weight:600}
.welcome .reset-views button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ====== QUESTION GRID ====== */
.grid-view{max-width:920px;margin:0 auto}
.grid-view h2{font-size:23px;font-weight:800;color:var(--heading1);margin-bottom:6px;letter-spacing:-.4px}
.grid-view .grid-sub{font-size:13px;color:var(--text2);margin-bottom:22px}
.grid-view .grid-controls{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.grid-controls button{padding:7px 15px;border:1px solid var(--border2);border-radius:9px;background:#fff;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.grid-controls button:hover{border-color:var(--accent);color:var(--accent)}
.grid-controls button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:9px}
.q-group{margin-bottom:24px}
.q-group-title{font-size:14px;font-weight:700;color:var(--accent-deep);margin-bottom:11px;padding:9px 15px;background:var(--accent-soft);border-radius:10px;border-left:3px solid var(--accent);display:flex;align-items:center;justify-content:space-between;gap:8px}
.q-group-stats{font-size:11px;color:var(--text2);font-weight:600}
.q-card{aspect-ratio:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--border2);background:#fff;transition:all .18s;position:relative;overflow:hidden}
.q-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 16px var(--accent-glow)}
.q-card .q-card-num{font-size:18px;font-weight:800;color:var(--heading2)}
.q-card .q-card-views{font-size:9px;color:var(--text3);margin-top:2px;font-weight:700}
.q-card.answered-correct{border-color:var(--correct);background:var(--correct-bg)}
.q-card.answered-correct .q-card-num{color:var(--correct)}
.q-card.answered-wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.q-card.answered-wrong .q-card-num{color:var(--wrong)}
.q-card.has-note::after{content:'';position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--repeat)}
.empty-state{text-align:center;padding:60px 24px;color:var(--text2)}
.empty-state .es-icon{font-size:54px;margin-bottom:14px}
.empty-state h3{font-size:18px;color:var(--heading2);font-weight:800;margin-bottom:10px}
.empty-state p{font-size:13.5px;line-height:1.8;color:var(--text2)}
.empty-state .es-file{display:inline-block;margin-top:14px;padding:8px 16px;background:var(--mint);border:1px solid var(--mint3);border-radius:10px;font-size:12.5px;color:var(--accent-deep);font-weight:700;word-break:break-all}

/* ====== QUIZ CARD ====== */
.quiz-card{max-width:840px;margin:0 auto}
.quiz-meta{background:linear-gradient(135deg,var(--mint) 0%,var(--mint2) 100%);border-radius:12px;padding:11px 16px;margin-bottom:13px;border-left:4px solid var(--accent);box-shadow:var(--shadow-sm)}
.quiz-meta .meta-section{font-size:11px;color:var(--accent-deep);font-weight:800;letter-spacing:.3px}
.quiz-meta .meta-num{font-size:13px;color:var(--text2);font-weight:600}
.quiz-meta .meta-views{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:rgba(31,157,107,.12);border-radius:12px;font-size:11px;color:var(--accent-deep);font-weight:600}
.quiz-meta .meta-minus-btn,.quiz-meta .meta-reset-btn{background:#fff;border:1px solid var(--border2);color:var(--accent-deep);padding:1px 7px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;transition:all .15s;margin-left:4px;font-family:inherit}
.quiz-meta .meta-minus-btn:hover,.quiz-meta .meta-reset-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.quiz-question{font-size:15.5px;font-weight:700;color:var(--heading1);line-height:1.6;margin-bottom:14px;padding:14px 18px;background:#fff;border-radius:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.quiz-question img{max-width:100%;border-radius:10px;margin:12px 0;box-shadow:var(--shadow);cursor:zoom-in;transition:transform .2s}
.quiz-question img:hover{transform:scale(1.01)}
.quiz-choices{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.choice-btn{display:flex;align-items:center;gap:11px;padding:11px 15px;border:2px solid var(--border2);border-radius:12px;background:#fff;cursor:pointer;transition:all .18s;text-align:left;font-family:inherit;font-size:14px;line-height:1.5;color:var(--body-text)}
.choice-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(4px)}
.choice-btn .choice-num{min-width:27px;height:27px;border-radius:50%;background:var(--mint2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--text2);flex-shrink:0;transition:all .18s}
.choice-btn:hover .choice-num{background:var(--accent);color:#fff}
.choice-btn .choice-text{flex:1}
.choice-btn.correct{border-color:var(--correct);background:var(--correct-bg)}
.choice-btn.correct .choice-num{background:var(--correct);color:#fff}
.choice-btn.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.choice-btn.wrong .choice-num{background:var(--wrong);color:#fff}
.choice-btn.disabled{pointer-events:none}
.choice-btn.dimmed{opacity:.55}
.result-banner{padding:12px 16px;border-radius:12px;margin-bottom:13px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.result-banner.correct{background:var(--correct-bg);color:var(--correct);border:1px solid rgba(21,163,74,.25)}
.result-banner.wrong{background:var(--wrong-bg);color:var(--wrong);border:1px solid rgba(239,83,80,.2)}
.result-banner .result-icon{font-size:22px}
.retry-btn{background:#fff;color:var(--text2);border:1px solid var(--border2);border-radius:9px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.retry-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow-sm)}
.explanation-box{background:#fff;border-radius:12px;padding:14px 18px;border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:13px;animation:slideIn .4s ease}
.explanation-box h3{font-size:14.5px;font-weight:800;color:var(--heading1);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.explanation-box .expl-text{font-size:13.8px;line-height:1.65;color:var(--body-text);white-space:pre-wrap}
.explanation-box .expl-ref{margin-top:9px;font-size:12px;color:var(--accent-deep);font-weight:700;padding:4px 11px;background:var(--accent-soft);border-radius:8px;display:inline-block}
.explanation-box .expl-images{margin-top:11px;display:flex;flex-direction:column;gap:9px}
.explanation-box .expl-images img{max-width:100%;border-radius:10px;box-shadow:var(--shadow);cursor:zoom-in;transition:transform .2s}
.explanation-box .expl-images img:hover{transform:scale(1.01)}
.note-section{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.note-input-row{display:flex;gap:8px}
.note-input{flex:1;padding:11px 15px;border:1px solid var(--border2);border-radius:11px;font-size:13px;font-family:inherit;resize:none;outline:none;min-height:42px;max-height:120px;line-height:1.5;transition:border .2s;background:#fff;color:var(--body-text)}
.note-input:focus{border-color:var(--accent)}
.note-input::placeholder{color:var(--text3)}
.note-add-btn{padding:11px 18px;border:none;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.note-add-btn.memo-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.note-add-btn.memo-btn:hover{filter:brightness(1.06);box-shadow:var(--shadow-sm)}
.note-list{margin-top:8px}
.note-item{background:#fff;border-radius:11px;padding:12px 16px;margin-bottom:8px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:13px;line-height:1.6;position:relative;box-shadow:var(--shadow-sm)}
.note-item .note-del{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--text3);font-size:16px;transition:color .15s;background:none;border:none}
.note-item .note-del:hover{color:var(--wrong)}
.note-item .note-time{font-size:10px;color:var(--text3);margin-top:4px}
.quiz-nav{display:flex;gap:10px;margin-top:16px;justify-content:space-between}
.quiz-nav button{padding:11px 24px;border:1px solid var(--border2);border-radius:11px;background:#fff;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;transition:all .15s}
.quiz-nav button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.quiz-nav button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.quiz-nav button.primary:hover{filter:brightness(1.06)}
.lightbox{position:fixed;inset:0;z-index:99999;background:rgba(10,30,20,.88);display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:95vw;max-height:95vh;border-radius:10px;box-shadow:0 4px 40px rgba(0,0,0,.5)}

/* ====== MEMO PANEL ====== */
.memo-panel{width:0;min-width:0;background:var(--sidebar-bg);color:var(--body-text);transition:all .3s ease;overflow:hidden;display:flex;flex-direction:column;height:100vh;border-left:1px solid var(--border);position:relative;box-shadow:-3px 0 14px rgba(20,80,55,.05)}
.memo-panel.open{width:var(--memo-w);min-width:var(--memo-w)}
.memo-panel-header{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--mint)}
.memo-panel-header h3{font-size:14px;font-weight:800;color:var(--heading2);display:flex;align-items:center;gap:6px}
.memo-close{cursor:pointer;color:var(--text2);font-size:20px;padding:4px;transition:color .15s;background:none;border:none}
.memo-close:hover{color:var(--wrong)}
.memo-filter-bar{display:flex;gap:6px;padding:9px 12px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--panel)}
.memo-filter-bar::-webkit-scrollbar{height:4px}.memo-filter-bar::-webkit-scrollbar-thumb{background:var(--mint3);border-radius:2px}
.memo-filter-chip{padding:5px 11px;border:1px solid var(--border2);border-radius:13px;background:#fff;color:var(--text2);font-size:10.5px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:600;transition:all .15s}
.memo-filter-chip:hover{border-color:var(--accent);color:var(--accent)}
.memo-filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.memo-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.memo-tab-content{display:none;flex:1;flex-direction:column;overflow:hidden}
.memo-tab-content.active{display:flex}
.memo-list{flex:1;overflow-y:auto;padding:10px}
.memo-list::-webkit-scrollbar{width:6px}.memo-list::-webkit-scrollbar-thumb{background:var(--mint3);border-radius:3px}
.memo-empty{text-align:center;padding:48px 18px;color:var(--text3);font-size:12.5px;line-height:1.7}
.memo-item{background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:12.5px;line-height:1.55;position:relative;border-left:3px solid var(--accent);transition:background .15s;cursor:pointer}
.memo-item:hover{background:var(--mint)}
.memo-item.wrong{border-left-color:var(--wrong)}.memo-item.note{border-left-color:var(--accent)}
.memo-item .memo-q{font-size:10.5px;color:var(--accent-deep);margin-bottom:5px;font-weight:700}
.memo-item .memo-text{color:var(--body-text)}
.memo-item .memo-del{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--text3);font-size:15px;transition:color .15s;background:none;border:none}
.memo-item .memo-del:hover{color:var(--wrong)}
.memo-item.selected{background:var(--accent-soft);border-left:3px solid var(--accent)}
.memo-export{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px;background:var(--panel)}
.memo-export button{width:100%;padding:10px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:12.5px;cursor:pointer;font-weight:700;font-family:inherit;transition:all .15s}
.memo-export button:hover{filter:brightness(1.06)}
.memo-export .btn-secondary{background:#fff;border:1px solid var(--border2);color:var(--text2)}
.memo-export .btn-secondary:hover{filter:none;border-color:var(--wrong);color:var(--wrong)}
.memo-resize-handle{width:6px;cursor:col-resize;background:transparent;position:absolute;left:0;top:0;bottom:0;z-index:10;transition:background .2s}
.memo-resize-handle:hover,.memo-resize-handle.active{background:var(--accent)}
.memo-wrong-preview{border-top:1px solid var(--border);padding:14px 16px;max-height:45%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);flex-shrink:0}
.memo-wrong-preview .preview-header{font-size:12px;font-weight:800;color:var(--accent-deep);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.memo-wrong-preview .preview-header button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:2px 6px}
.memo-wrong-preview .preview-q{font-size:13px;line-height:1.6;color:var(--body-text);margin-bottom:8px}
.memo-wrong-preview .preview-choices{font-size:12px;color:var(--text2);line-height:1.7}
.memo-wrong-preview .preview-choices .correct-choice{color:var(--correct);font-weight:700}
.memo-wrong-preview .preview-choices .wrong-choice{color:var(--wrong);text-decoration:line-through}
.memo-wrong-preview .preview-go{margin-top:10px;padding:7px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700}
.memo-wrong-preview .preview-go:hover{background:var(--accent);color:#fff}

/* ====== LOGIN ====== */
.login-overlay{position:fixed;inset:0;z-index:99999;background:linear-gradient(140deg,#f3eee2 0%,#e3ddd0 45%,#d3d6c6 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border:1px solid var(--border);border-radius:22px;padding:42px 38px 34px;width:360px;max-width:92vw;box-shadow:var(--shadow-lg)}
.login-box .login-logo{text-align:center;font-size:40px;margin-bottom:6px}
.login-box h2{color:var(--heading1);font-size:22px;text-align:center;margin-bottom:5px;font-weight:800;letter-spacing:-.4px}
.login-box .login-sub{color:var(--text2);font-size:12px;text-align:center;margin-bottom:22px;line-height:1.5}
.login-box label{display:block;color:var(--text2);font-size:11.5px;font-weight:700;margin-bottom:6px;margin-top:14px}
.login-box input[type="text"],.login-box input[type="password"]{width:100%;padding:12px 15px;border:1px solid var(--border2);border-radius:11px;background:var(--panel);color:var(--body-text);font-size:14px;font-family:inherit;outline:none;transition:all .2s}
.login-box input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.login-box .login-btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;margin-top:22px;font-family:inherit;transition:all .15s}
.login-box .login-btn:hover{filter:brightness(1.06);box-shadow:var(--shadow)}
.login-box .login-btn:disabled{opacity:.55;cursor:not-allowed}
.login-box .login-error{color:var(--wrong);font-size:12px;text-align:center;margin-top:12px;min-height:18px;font-weight:600}
.login-box .login-hint{color:var(--text3);font-size:11px;text-align:center;margin-top:14px;line-height:1.6}

.sync-indicator{position:fixed;top:10px;right:12px;z-index:9999;padding:5px 12px;border-radius:9px;font-size:11px;font-weight:700;display:none;box-shadow:var(--shadow);align-items:center}
.sync-indicator.syncing{display:flex;background:var(--accent);color:#fff}
.sync-indicator.synced{display:flex;background:var(--correct);color:#fff}
.sync-indicator.error{display:flex;background:var(--wrong);color:#fff}

.hamburger{display:none;position:fixed;top:9px;left:9px;z-index:200;width:42px;height:42px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--accent);font-size:20px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(10,40,28,.4);z-index:90;backdrop-filter:blur(2px)}
.mobile-memo-fab{display:none;position:fixed;bottom:22px;right:22px;z-index:140;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-size:23px;cursor:pointer;box-shadow:var(--shadow-lg);align-items:center;justify-content:center}

@media(max-width:768px){
  .hamburger{display:flex}.mobile-memo-fab{display:flex!important}
  .sidebar{position:fixed;left:-290px;top:0;width:272px;min-width:272px;z-index:100;transition:left .3s ease;box-shadow:4px 0 24px rgba(20,80,55,.2)}
  .sidebar.open{left:0}.sidebar-overlay.open{display:block}
  .main{width:100%}.main-header{padding:11px 16px 11px 60px;font-size:12px;gap:10px}
  .content-area{padding:14px 13px 90px}
  .quiz-card{padding:0}
  .quiz-meta{padding:12px 14px}
  .quiz-question{font-size:14.5px;padding:13px 15px;line-height:1.7}
  .quiz-question img{max-width:100%;height:auto}
  .choice-btn{padding:12px 13px;font-size:13.5px;gap:9px;border-radius:11px}
  .choice-btn:hover{transform:none}
  .choice-btn .choice-num{min-width:26px;height:26px;font-size:12px}
  .result-banner{padding:12px 14px;font-size:13.5px;gap:8px;flex-wrap:wrap}
  .retry-btn{padding:6px 12px;font-size:12px}
  .explanation-box{padding:14px 16px}
  .q-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px}
  .q-card{border-radius:10px}.q-card .q-card-num{font-size:15px}
  .q-group-title{font-size:13px;padding:8px 12px;flex-wrap:wrap}
  .note-input{font-size:13.5px}
  .quiz-nav button{font-size:13px;padding:11px 16px}
  .welcome{padding-top:30px}.welcome h2{font-size:22px}
  .welcome .stats{gap:10px}.welcome .stats>div{padding:16px 18px;min-width:0;flex:1;border-radius:14px}
  .welcome .stat-num{font-size:26px}
  .memo-panel.open{width:100%;min-width:100%;position:fixed;left:0;top:0;z-index:150}
  .main-header #headerProgress{display:none}
}
@media(max-width:400px){
  .content-area{padding:10px 9px 90px}
  .quiz-question{font-size:14px;padding:11px 13px}
  .choice-btn{padding:11px;font-size:13px}
  .q-grid{grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:5px}
  .q-card .q-card-num{font-size:14px}
}
::selection{background:var(--accent-glow)}

/* ==================================================================
   ✨ PREMIUM ENHANCEMENTS — 프리미엄 라이트 (기존 규칙 위에 덧입힘)
   ================================================================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes qPop{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(79,138,69,.42)}70%{box-shadow:0 0 0 14px rgba(79,138,69,0)}100%{box-shadow:0 0 0 0 rgba(79,138,69,0)}}
@keyframes popCheck{0%{transform:scale(.4);opacity:0}55%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes confettiFall{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--cx,0),105vh,0) rotate(var(--cr,540deg));opacity:0}}
@keyframes shimmer{0%{background-position:-380px 0}100%{background-position:380px 0}}
@keyframes flameFlicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(3deg)}}
@keyframes floatIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* glass header + sidebar shine */
.main-header{background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.6);box-shadow:0 1px 0 var(--border),0 6px 20px -16px rgba(20,80,55,.5)}
.sidebar{box-shadow:1px 0 0 var(--border),6px 0 24px -20px rgba(20,80,55,.4)}
.sidebar-header{position:relative;overflow:hidden}
.sidebar-header::after{content:'';position:absolute;top:-60%;right:-20%;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);pointer-events:none}
.sidebar-header h1{position:relative;z-index:1}

/* book items — richer depth + animated bar shimmer */
.book-item{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s,border-color .2s}
.book-item:hover{transform:translateX(3px) translateY(-1px);box-shadow:var(--shadow)}
.book-item.active{transform:translateX(2px)}
.book-progress-bar{position:relative;overflow:hidden}
.book-progress-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:200px 100%;animation:shimmer 2.6s linear infinite}

/* sidebar nav (대시보드/암기카드/모의고사) */
.sidebar-nav{padding:10px 12px 4px;display:flex;flex-direction:column;gap:6px}
.sidebar-nav .nav-btn{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--heading2);font-size:12.8px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:9px;font-family:inherit;transition:all .16s}
.sidebar-nav .nav-btn:hover{background:var(--mint);border-color:var(--mint3);transform:translateX(2px)}
.sidebar-nav .nav-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:var(--shadow-accent)}
.sidebar-nav .nav-btn .nav-ico{font-size:16px}
.sidebar-nav .nav-btn .nav-mini{margin-left:auto;font-size:9.5px;font-weight:800;background:var(--gold-soft);color:var(--gold);padding:2px 8px;border-radius:9px}
.sidebar-nav .nav-btn.active .nav-mini{background:rgba(255,255,255,.25);color:#fff}
.sidebar-divider{height:1px;background:var(--border);margin:10px 14px 4px}

/* q-card pop + deeper hover */
.q-card{animation:qPop .42s cubic-bezier(.2,.8,.2,1) both;box-shadow:var(--shadow-sm)}
.q-card:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 12px 24px var(--accent-glow)}
.q-grid .q-card:nth-child(1){animation-delay:.01s}.q-grid .q-card:nth-child(2){animation-delay:.03s}.q-grid .q-card:nth-child(3){animation-delay:.05s}.q-grid .q-card:nth-child(4){animation-delay:.07s}.q-grid .q-card:nth-child(5){animation-delay:.09s}.q-grid .q-card:nth-child(6){animation-delay:.11s}.q-grid .q-card:nth-child(7){animation-delay:.13s}.q-grid .q-card:nth-child(8){animation-delay:.15s}.q-grid .q-card:nth-child(9){animation-delay:.17s}.q-grid .q-card:nth-child(10){animation-delay:.19s}.q-grid .q-card:nth-child(n+11){animation-delay:.21s}

/* choice + nav micro-interactions */
.choice-btn{transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .16s,background .16s,box-shadow .16s}
.choice-btn:hover{box-shadow:0 6px 16px -8px var(--accent)}
.choice-btn.correct{animation:floatIn .35s ease both}
.quiz-nav button.primary{box-shadow:var(--shadow-accent)}
.quiz-nav button.primary:hover{transform:translateY(-2px)}

/* result banner pulse + icon pop */
.result-banner.correct{animation:slideIn .3s ease,pulseRing 1.2s ease .15s}
.result-banner .result-icon{display:inline-block;animation:popCheck .45s cubic-bezier(.2,.9,.3,1.3) both}

/* views fade up */
.grid-view,.quiz-card,#dashView,#flashView,#examView{animation:fadeUp .4s ease both}

/* ===== progress rings ===== */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.pring{transform:rotate(-90deg)}
.pring-track{stroke:var(--ring-track)}
.pring-fill{stroke:var(--rc,var(--accent));stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.ring-center .ring-val{font-size:24px;font-weight:800;color:var(--heading1);letter-spacing:-.5px}
.ring-center .ring-lbl{font-size:10.5px;color:var(--text2);font-weight:700;margin-top:3px}

/* ===== confetti ===== */
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:99998;overflow:hidden}
.confetti-piece{position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;animation:confettiFall linear forwards}

/* ===== DASHBOARD ===== */
.dash{max-width:960px;margin:0 auto}
.dash-hero{background:linear-gradient(135deg,var(--accent-deep) 0%,var(--accent) 58%,#3d6a5b 100%);border-radius:var(--radius-lg);padding:24px 26px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-accent)}
.dash-hero::after{content:'';position:absolute;top:-40%;right:-6%;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
.dash-hero .dh-hi{font-size:13px;font-weight:600;opacity:.92}
.dash-hero .dh-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
.dash-hero .dh-row{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.streak-badge{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);padding:9px 15px;border-radius:14px}
.streak-badge .flame{font-size:22px;animation:flameFlicker 1.6s ease-in-out infinite;transform-origin:center bottom}
.streak-badge .sb-num{font-size:19px;font-weight:800;line-height:1}
.streak-badge .sb-lbl{font-size:10.5px;opacity:.9;font-weight:600;margin-top:1px}
.goal-chip{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);padding:9px 15px;border-radius:14px;font-size:12px;font-weight:600}
.goal-chip .goal-bar{width:96px;height:7px;border-radius:5px;background:rgba(255,255,255,.28);overflow:hidden}
.goal-chip .goal-bar i{display:block;height:100%;background:#fff;border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.goal-chip .goal-edit{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;width:24px;height:24px;cursor:pointer;font-size:13px;font-family:inherit}
.goal-chip .goal-edit:hover{background:rgba(255,255,255,.35)}

.dash-rings{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.ring-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s}
.ring-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ring-card .rc-sub{font-size:11.5px;color:var(--text2);font-weight:600}

.dash-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-top:16px;box-shadow:var(--shadow-sm)}
.dash-card .dc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.dash-card .dc-title{font-size:15px;font-weight:800;color:var(--heading1);display:flex;align-items:center;gap:7px}
.dash-card .dc-hint{font-size:11px;color:var(--text3);font-weight:600}

/* heatmap */
.heatmap{display:flex;flex-direction:column;gap:8px}
.heat-row{display:flex;align-items:center;gap:11px;cursor:pointer;padding:5px 7px;border-radius:10px;transition:background .15s}
.heat-row:hover{background:var(--mint)}
.heat-row .hr-name{flex:1;font-size:12.8px;font-weight:700;color:var(--heading2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.heat-row .hr-bar{flex:2;height:12px;border-radius:7px;background:var(--mint2);overflow:hidden;position:relative}
.heat-row .hr-bar i{display:block;height:100%;border-radius:7px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.heat-row .hr-pct{min-width:88px;text-align:right;font-size:11.5px;font-weight:700;color:var(--text2)}
.heat-row .hr-empty{flex:2;font-size:11px;color:var(--text3);font-weight:600}

/* weakness + quick actions */
.weak-tag{display:inline-flex;align-items:center;gap:6px;background:var(--wrong-bg);color:var(--wrong);border:1px solid rgba(239,83,80,.2);padding:6px 12px;border-radius:11px;font-size:12px;font-weight:700;margin:3px 5px 3px 0;cursor:pointer;transition:all .15s}
.weak-tag:hover{background:var(--wrong);color:#fff}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.qa-btn{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-family:inherit;text-align:left;transition:all .18s}
.qa-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--mint3);background:#fff}
.qa-btn .qa-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--accent-soft)}
.qa-btn .qa-tt{font-size:13.5px;font-weight:800;color:var(--heading1)}
.qa-btn .qa-ds{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px}

/* activity bars */
.activity-bars{display:flex;align-items:flex-end;gap:9px;min-height:112px;padding-top:6px}
.act-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
.act-day .ad-bar{width:100%;max-width:32px;border-radius:7px 7px 4px 4px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:4px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.act-day .ad-bar.zero{background:var(--mint2)}
.act-day .ad-num{font-size:10px;font-weight:800;color:var(--accent-deep)}
.act-day .ad-lbl{font-size:9.5px;color:var(--text3);font-weight:600}
.act-day.today .ad-lbl{color:var(--accent-deep);font-weight:800}

/* ===== MNEMONIC (암기법) in quiz ===== */
.mnem-box{margin-top:11px;background:linear-gradient(135deg,var(--gold-soft),rgba(240,168,24,.04));border:1px solid rgba(240,168,24,.25);border-radius:12px;padding:12px 15px}
.mnem-box .mnem-head{font-size:13px;font-weight:800;color:#9a6a06;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mnem-input-row{display:flex;gap:8px}
.mnem-input{flex:1;padding:10px 13px;border:1px solid rgba(240,168,24,.4);border-radius:10px;font-size:13px;font-family:inherit;resize:none;outline:none;min-height:40px;max-height:120px;line-height:1.5;background:#fff;color:var(--body-text)}
.mnem-input:focus{border-color:var(--gold)}
.mnem-add{padding:10px 15px;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;background:linear-gradient(135deg,var(--gold),#e89a10);color:#fff;transition:filter .15s}
.mnem-add:hover{filter:brightness(1.06)}
.mnem-item{background:#fff;border-radius:10px;padding:10px 14px;margin-top:7px;border-left:3px solid var(--gold);font-size:13px;line-height:1.6;position:relative;box-shadow:var(--shadow-sm)}
.mnem-item .mnem-del{position:absolute;top:7px;right:9px;cursor:pointer;color:var(--text3);font-size:15px;background:none;border:none}
.mnem-item .mnem-del:hover{color:var(--wrong)}

/* ===== FLASHCARD ===== */
.flash-wrap{max-width:680px;margin:0 auto}
.flash-setup h2,.exam-setup h2{font-size:22px;font-weight:800;color:var(--heading1);margin-bottom:6px;letter-spacing:-.4px}
.flash-setup .fs-sub,.exam-setup .es-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.deck-btn{padding:18px 16px;border-radius:15px;border:1px solid var(--border);background:var(--card-bg);cursor:pointer;font-family:inherit;text-align:left;transition:all .18s;box-shadow:var(--shadow-sm)}
.deck-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.deck-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}

function _mergeArrById(a,b){const seen=new Set();const out=[];for(const it of [...(a||[]),...(b||[])]){if(!it||it.id==null)continue;if(seen.has(it.id))continue;seen.add(it.id);out.push(it);}return out;}
function _mergeObjByKey(a,b,timeKey){const out={...(a||{})};for(const k of Object.keys(b||{})){if(!out[k]){out[k]=b[k];}else{const t1=(out[k]&&out[k][timeKey])||0,t2=(b[k]&&b[k][timeKey])||0;if(t2>t1)out[k]={...b[k]};if(timeKey==='lastViewed'&&out[k].count!=null&&b[k].count!=null)out[k].count=Math.max(out[k].count,b[k].count);}}return out;}
async function loadFromFirestore(){
  if(!currentUser)return;showSync('syncing','☁️ 동기화 중...');loadLocalData();
  try{
    const d=await db.collection('users').doc(currentUser.uid).get();
    if(d.exists){
      const data=d.data();
      const cw=data.jm_wrongNotes||[],cm=data.jm_memoNotes||[],cv=data.jm_viewData||{},ca=data.jm_answerData||{},cr=data.jm_repeatMarks||{};
      const cmn=data.jm_mnemonics||[],csl=data.jm_studyLog||{},ceh=data.jm_examHistory||[],cdg=data.jm_dailyGoal,cue=data.jm_userExpl||[];
      const mw=_mergeArrById(cw,wrongNotes),mm=_mergeArrById(cm,memoNotes),mv=_mergeObjByKey(cv,viewData,'lastViewed'),ma=_mergeObjByKey(ca,answerData,'timestamp'),mr=_mergeObjByKey(cr,repeatMarks,'ts');
      const mmn=_mergeArrById(cmn,mnemonics),msl=_mergeStudyLog(csl,studyLog),meh=_mergeArrById(ceh,examHistory),mue=_mergeArrById(cue,userExpl);
      const mdg=(typeof cdg==='number'&&cdg>0)?cdg:dailyGoal;
      const upload=mw.length>cw.length||mm.length>cm.length||Object.keys(mv).length>Object.keys(cv).length||Object.keys(ma).length>Object.keys(ca).length||Object.keys(mr).length>Object.keys(cr).length||mmn.length>cmn.length||meh.length>ceh.length||Object.keys(msl).length>Object.keys(csl).length||mue.length>cue.length;
      wrongNotes=mw;memoNotes=mm;viewData=mv;answerData=ma;repeatMarks=mr;mnemonics=mmn;studyLog=msl;examHistory=meh;dailyGoal=mdg;userExpl=mue;
      if(upload){_saveLocal();await saveToFirestore();showSync('synced','✅ 머지 완료');return;}
    }else{
      if(wrongNotes.length||memoNotes.length||Object.keys(viewData).length||Object.keys(answerData).length||Object.keys(repeatMarks).length||mnemonics.length||examHistory.length||Object.keys(studyLog).length||userExpl.length){await saveToFirestore();showSync('synced','✅ 데이터 이전 완료');return;}
    }
    showSync('synced','✅ 동기화 완료');
  }catch(e){console.error('[Firestore] 로드 실패:',e);showSync('error','❌ 동기화 실패');}
}
function _saveLocal(){
  localStorage.setItem(PREFIX+'_wrong',JSON.stringify(wrongNotes));
  localStorage.setItem(PREFIX+'_memos',JSON.stringify(memoNotes));
  localStorage.setItem(PREFIX+'_views',JSON.stringify(viewData));
  localStorage.setItem(PREFIX+'_answers',JSON.stringify(answerData));
  localStorage.setItem(PREFIX+'_repeat',JSON.stringify(repeatMarks));
  localStorage.setItem(PREFIX+'_mnem',JSON.stringify(mnemonics));
  localStorage.setItem(PREFIX+'_uexpl',JSON.stringify(userExpl));
  localStorage.setItem(PREFIX+'_studylog',JSON.stringify(studyLog));
  localStorage.setItem(PREFIX+'_examhist',JSON.stringify(examHistory));
  localStorage.setItem(PREFIX+'_dailygoal',String(dailyGoal));
}
function syncToCloud(){_saveLocal();if(!firestoreReady||!currentUser)return;clearTimeout(syncDebounceTimer);syncDebounceTimer=setTimeout(()=>saveToFirestore(0),1500);}
async function saveToFirestore(retryCount){
  if(retryCount==null)retryCount=0;if(!currentUser)return;
  try{
    await db.collection('users').doc(currentUser.uid).set({jm_wrongNotes:wrongNotes,jm_memoNotes:memoNotes,jm_viewData:viewData,jm_answerData:answerData,jm_repeatMarks:repeatMarks,jm_mnemonics:mnemonics,jm_studyLog:studyLog,jm_examHistory:examHistory,jm_dailyGoal:dailyGoal,jm_userExpl:userExpl,jm_lastUpdated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  }catch(e){console.error('[Firestore] 저장 실패('+retryCount+'):',e);showSync('error','❌ 저장 실패');if(retryCount<3){setTimeout(()=>saveToFirestore(retryCount+1),2000*(retryCount+1));}}
}
</script>

  {num:1,section:"2026 해설정리",chapter:"기타",question:"점액낭염, 건초염등에사용하는물리치료들중조직에직접 전도열을전달하는치료는? (사진들로보기제시)",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n점액낭염, 건초염등에사용하는물리치료들중조직에직접\n전도열을전달하는치료는?\n(사진들로보기제시)\n1.\n간섭파치료\n2.\n회전욕\n3.\n경피적전기신경자극\n4.\n파라핀욕\n5.\n초음파치료\n1차 시험 문제",question_images:[],explanation_images:["images/2026_s1.png"]},
  {num:2,section:"2026 해설정리",chapter:"기타",question:"다음 사진 중 부갑상선호르몬이 직접 작용하는 세포는 무엇",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n다음 사진 중 부갑상선호르몬이 직접 작용하는 세포는 무엇\n인가?\n1차 시험 문제",question_images:[],explanation_images:["images/2026_s2.png"]},
  {num:3,section:"2026 해설정리",chapter:"기타",question:"다음 제 1형 교원질 및 아래 사진을 이루는 물질들을 생성하 는데 중요한 역할을 하는 것은?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n다음 제 1형 교원질 및 아래 사진을 이루는 물질들을 생성하\n는데 중요한 역할을 하는 것은?\n1.\n비타민 C\n2.\n요오드\n3.\n인산\n4.\n칼슘\n5.\n칼시토닌\n1차 시험 문제",question_images:[],explanation_images:["images/2026_s3.png"]},
  {num:4,section:"2026 해설정리",chapter:"기타",question:"수술 중 free running EMG, 다음 A: base, B: 어떤 신호. B 신호는 수술 중 어떤 일이 일어나서 나타난 파동인가? A : B : 규칙적인 진동파 - 똑같지는 않으나, 이런파형이랑비슷",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n수술 중 free running EMG, 다음 A: base, B: 어떤 신호.\nB 신호는 수술 중 어떤 일이 일어나서 나타난 파동인가?\nA :\nB : 규칙적인 진동파 - 똑같지는 않으나,\n이런파형이랑비슷\n1.\n주변에서 bovie 전기신호로 인한 artifact\n2.\n혈압 떨어져서 혈류 감소\n3.\n의도적으로 MEP (motor evoked potentials) 자극을 줌\n4.\n신경이 traction되고 있음\n5.\n신경 회복으로 MUAP(motor unit action potential)가 나오고 있음\n1차 시험 문제",question_images:[],explanation_images:["images/2026_s4.png"]},
  {num:5,section:"2026 해설정리",chapter:"기타",question:"55세 여자, 인공슬관절치환술 예정이다. 현재 RA에 대하여 Sulfasalazine, Methotraxate를 복용중에 있다. 상처회복을 위하여 위 환자에게서 Sulfasal zine, MTX 를 수술전에 언제 중단해야하는가?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n55세 여자, 인공슬관절치환술 예정이다. 현재 RA에 대하여 Sulfasalazine,\nMethotraxate를 복용중에 있다. 상처회복을 위하여 위 환자에게서 Sulfasal\nzine, MTX 를 수술전에 언제 중단해야하는가?\n1.\nSulfasalazine, MTX 모두 중단할 필요 없다.\n2.\nSulfasalazine, MTX 모두 2일전 중단한다.\n3.\nSulfasalazine만 3일전 중단한다.\n4.\nMTX만 3일전 중단한다.\n5.\nSulfasalazine, MTX 모두 7일전 중단한다.\n1차 시험 문제\nRA환자 약물 중에는 Conventional drug, TNF-α Inhibitors 있다. 그 중 TNF-α Inhibitors (ex. Etaner\ncpet, Infliximab) 등은 wound problem으로 반드시 수술 전 중단을 권고하고 있다.  단, Convention\nal drug (Methotraxate, Sulfasalazine, Hydroxyquinolone, Leflunomide) 은약제중단이 필요\n치않으며 hold 없이 수술할 수 있다.",question_images:[],explanation_images:["images/2026_s5.png"]},
  {num:6,section:"2026 해설정리",chapter:"기타",question:"1)인공슬관절에서 주로 마모가 되는 기전은 무엇인가?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n1)인공슬관절에서 주로 마모가 되는 기전은 무엇인가?\n(2차)인공고관절치환술 중 대퇴 경부 절제 후 actabulum에 거즈 넣어놓는 사진, 예방하고자하는 마모 기전은?\n1차 시험 문제\n<족보>\nTKA : 피로마모\nTHA : 점착, 연마마모\n3rd body wear : 연마",question_images:[],explanation_images:["images/2026_s6.png"]},
  {num:7,section:"2026 해설정리",chapter:"고관절",question:"- THA 수술 관절면 선택 시 골두 세라믹 liner의 장단점. A 골두시 B골두 보다 발생할 가능성이 높은것은?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- THA 수술 관절면 선택 시 골두 세라믹 liner의 장단점. A 골두시 B골두 보다 발생할 가능성이 높은것은?\n1.\n골두골절 (ceramic head 골절)\n2.\n임플란트 주위 감염  (PJI)\n3.\n임플란트 주위 골절 (periprosthetic Fx)\n4.\n탈구 (dislocation)\n5.\nALVAL (Aseptic Lymphocyte-Dominant Vasculitis-Associated Lesions)\n고관절\nA :  3세대 세라믹골두 (베이지색)\nB :  4세대 세라믹 골두 (분홍색) <- 지르코니윰 들어간 new 버젼.\n** ALVAL (Aseptic Lymphocyte-Dominant Vasculitis-Associated Lesions\n)이라는 금속-금속 고관절 인공관절 관련 부작용, 마모된 금속 파편이 주\n변 조직에 염증 반응을 일으켜 림프구 중심의 혈관염을 유발하는 상태입\n니다.\nA\nB",question_images:[],explanation_images:["images/2026_s7.png"]},
  {num:8,section:"2026 해설정리",chapter:"고관절",question:"- Trendelenburg gait 영상, THA 시행시 이와 같은 합병증이 가장 잘 발생하는 접근법은?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- Trendelenburg gait 영상, THA 시행시 이와 같은 합병증이 가장 잘 발생하는 접근법은?\n고관절",question_images:[],explanation_images:["images/2026_s8.png"]},
  {num:9,section:"2026 해설정리",chapter:"고관절",question:"- Pelvic ring fracture x-ray, 진단명?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- Pelvic ring fracture x-ray, 진단명?\n1.\n양 골주 골절\n2.\n전주 골절 + 후방 반 횡골절\n3.\n후주 골절 + 후벽 골절\n4.\nTransverse + posterior acetabular wall Fx.\n5.\nT type fracture\n고관절\n- pelvic spur sign\n: pathognomonic for a both column acetabular fracture.\n- AP or obturator oblique x-ray\n- spur : the intact portion of the ilium, still attached to the axial\nskeleton and seen posterosuperior to the displaced acetabulum\n(typically medially displaced)",question_images:[],explanation_images:["images/2026_s9.png"]},
  {num:10,section:"2026 해설정리",chapter:"고관절",question:"- Pelvic ring fracture x-ray, 진단명?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- Pelvic ring fracture x-ray, 진단명?\n• 양 골주 골절\n• 전주 골절 + 후방 반 횡골절\n• 후주 골절 + 후벽 골절\n• Transverse + posterior acetabular wall Fx.\n• T type fracture\n고관절",question_images:[],explanation_images:["images/2026_s10.png"]},
  {num:11,section:"2026 해설정리",chapter:"고관절",question:"- Hip internal impingement에 대하여 보존적 치료 시행하였으나 호전 없어서 Arthroscopic decompression 수술하였다.  수술 후 배가 아프고 빵빵해져서 촬영한 APCT, 이러한 합병증을 줄이기 위해서 해야하는 것은?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- Hip internal impingement에 대하여 보존적 치료 시행하였으나 호전 없어서\nArthroscopic decompression 수술하였다.  수술 후 배가 아프고 빵빵해져서\n촬영한 APCT, 이러한 합병증을 줄이기 위해서 해야하는 것은?\n1.\n과도한 견인 자제\n2.\n충분한 관절낭 절제\n3.\n관류압을 50mmHg로 유지\n4.\nTenotomy를 관절경적 술기 제일 마지막에 해야한다\n고관절",question_images:[],explanation_images:["images/2026_s11.png"]},
  {num:12,section:"2026 해설정리",chapter:"고관절",question:"- Hip internal impingement에 대하여 보존적 치료 시행하였으나 호전 없어서 Arthroscopic decompression 수술하였다.  수술 후 배가 아프고 빵빵해져서 촬영한 APCT, 이러한 합병증을 줄이기 위해서 해야하는 것은?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- Hip internal impingement에 대하여 보존적 치료 시행하였으나 호전 없어서\nArthroscopic decompression 수술하였다.  수술 후 배가 아프고 빵빵해져서\n촬영한 APCT, 이러한 합병증을 줄이기 위해서 해야하는 것은?\n고관절",question_images:[],explanation_images:["images/2026_s12.png"]},
  {num:13,section:"2026 해설정리",chapter:"슬관절",question:"- 68세 여자환자 X-ray, MRI / 2주전부터 극심한 통증으로 보행이 어렵다. 치료는?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- 68세 여자환자 X-ray, MRI / 2주전부터 극심한 통증으로 보행이 어렵다. 치료는?\n1. 경과관찰\n2. A/S debridement\n3. A/S 천공술\n4. HTO / 인공관절관련보기없었음\n슬관절",question_images:[],explanation_images:["images/2026_s13.png"]},
  {num:14,section:"2026 해설정리",chapter:"슬관절",question:"SIFK (subchondral insufficiency fracture knee)",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\nSIFK (subchondral insufficiency fracture knee)\n슬관절",question_images:[],explanation_images:["images/2026_s14.png"]},
  {num:15,section:"2026 해설정리",chapter:"슬관절",question:"- Shatzker type III, 수술 중 screw 2개 박혀있는 X-ray. screw가 저항하는 것은?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- Shatzker type III, 수술 중 screw 2개 박혀있는 X-ray. screw가 저항하는 것은?\n1.\n각 안정성\n2.\n골편간 압력\n3.\n전단력 저항\n4.\n축성부하 저항\n5.\n회전부하 저항\n슬관절\n축성부하? -> 전단력 아닌가요?\n> schaztker 3 여서 rafting 축성\n부하가 더 맞을듯\n--> Rafting screw(buttress)는\n축성부하에 의한 골절편의 전단\n력에 저항하기 위한 screw 라\n생각돼서 전단력->저도 같은이\n유로 shearing force",question_images:[],explanation_images:["images/2026_s15.png"]},
  {num:16,section:"2026 해설정리",chapter:"척추",question:"- 53세 여자 편두통이 있고, 후두부 표시한 부위의 통증이 지속된다. 진단적으로block 해줄때에 맞는 부위는?",choices:["","","","",""],answer:2,explanation:"- 53세 여자 편두통이 있고, 후두부 표시한 부위의 통증이 지속된다.\n진단적으로block 해줄때에 맞는 부위는?\n1.\nC1 신경근\n2.\nC1-C2 척추간관절\n3.\nC2-C3 후관절\n4.\nC3-C4 후관절\n5.\nC4-C5 후관절\n척추\n답: 2? 3?\n-> 증상완화를 위한 GONB면 2번인데, 진단\n적으로라서 C2-3 facet SD 감별위해 3번 같\n습니다.",question_images:[],explanation_images:["images/2026_s16.png"]},
  {num:17,section:"2026 해설정리",chapter:"기타",question:"Netter’s anatomy",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\nNetter’s anatomy\n2번이라는 해설\n해당 부위 Dermatome은 C2 입니다.\n더 자세하게는, 증상부위가 greater occipital nerve의 지배를\n받고, Greater occipital nerve는 C2 에서 유래되기 때문에\nC1-C2 level 이 됩니다.\n3번이라는 해설\n저는 extension시 악화된다고 해서 C2-3했어요\nC1-2는 flex-ext 때 영향거의 없고,\ndermatome상으로도 C2-3에 가까워서…\n>>ㅇㅇ 그림이 딱 C2-3 골라라 그림이었어요",question_images:[],explanation_images:["images/2026_s17.png"]},
  {num:18,section:"2026 해설정리",chapter:"척추",question:"- 53세 여자 편두통이 있고, 후두부 표시한 부위의 통증이 지속된다. 진단적으로block 해줄때에 맞는 부위는?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- 53세 여자 편두통이 있고, 후두부 표시한 부위의 통증이 지속된다.\n진단적으로block 해줄때에 맞는 부위는?\n척추",question_images:[],explanation_images:["images/2026_s18.png"]},
  {num:19,section:"2026 해설정리",chapter:"척추",question:"- 8세 여아가 오늘 아침부터 목이 기울었으며 신경학적 증상은 없다. 치료는?",choices:["","","","",""],answer:1,explanation:"※ 슬라이드에 정답이 명시되지 않았습니다 — 아래 해설·이미지를 참고하세요.\n\n- 8세 여아가 오늘 아침부터 목이 기울었으며 신경학적 증상은 없다. 치료는?\n1.\nSkeletal traction\n2.\n관혈적 정복술\n3.\n연성 보조기\n4.\nHalo 보조기\n5.\nHalter traction\n척추\nElite 척추 p.66\n증상기간 < 1주: soft collar\n증상기간 > 1주: head halter traction\n증상기간 > 1개월: Skeletal traction",question_images:[],explanation_images:["images/2026_s19.png"]},

  {num:33,section:"2026 해설정리",chapter:"소아",question:"-2세 환아가 내반슬로 내원하였다. XR 소견은 아래와 같다. (양측 genu varum 및 epiphys eal cupping 저명한 teleradiogram) Lab 검사 상 inorganic P 3.3 (정상 3.9-5.8), ALP 1177 , 25 hydroxyvitamin D 9.0pg 확인되었다. PHEX 유전자 이상이 확인되었다. XR에서 보이 는 이상 소견의 원인은?",choices:["","","","",""],answer:3,explanation:"-2세 환아가 내반슬로 내원하였다. XR 소견은 아래와 같다. (양측 genu varum 및 epiphys\neal cupping 저명한 teleradiogram) Lab 검사 상 inorganic P 3.3 (정상 3.9-5.8), ALP 1177\n, 25 hydroxyvitamin D 9.0pg 확인되었다. PHEX 유전자 이상이 확인되었다. XR에서 보이\n는 이상 소견의 원인은?\n1.\n랑비에구에서 골 용적 성장 제한\n2.\n성장판 정지대에서 연골세포 분열 제한\n3.\n성장판 비후대 연골세포 사멸 문제\n4.\n성장판 연골세포 증식 제한\n5.\n유기질 합성 문제\n소아\n답: ③성장판 비후대 연골세포 사멸 문제\n해설 PHEX loss-of-function → FGF23↑ → 신장 phosphate wastin\ng → 만성 저인산혈증 → 성장판(특히 hypertrophic zone)에서 ter\nminal differentiation/무기질화 실패 + phosphate 유도 apoptosis\n(연골세포 사멸) 장애→ 성장판이넓고불규칙해지고, metaphysi\ns에서 mineralized bone으로의 전환이 지연/실패 → fraying/splayi\nng/cupping이 나타납니다.",question_images:[],explanation_images:["images/2026_s33.png"]},

<script>
const SECTION_DEFS=[

  {name:"2023년 1차 1교시",icon:"📘",file:"2023 전문의 BOARD 1차 1교시-2023.02.07 2차 편집.docx"},
  {name:"2023년 1차 2교시",icon:"📗",file:"2023 전문의 BOARD 1차 2교시-2023.02.07 2차 편집.docx"},
  {name:"2023년 2차",icon:"📕",file:"2023 2차 시험 복원 최종본.pdf"},
  {name:"2024년 1차 1교시",icon:"📘",file:"2024년 1차 1교시.pdf"},
  {name:"2024년 1차 2교시",icon:"📗",file:"2024년 1차 2교시.pdf"},
  {name:"2024년 2차",icon:"📕",file:"2024년 2차.pdf"},
  {name:"2025 인트레이닝",icon:"📙",file:"2025 인트레이닝 복원.pdf"},
  {name:"2025년 1차 기출",icon:"📒",file:"2025 전문의 1차 기출.docx"},
  {name:"2026 해설정리",icon:"📝",file:"2026 전문의 시험 해설정리.pptx"}
];
const SECTIONS=SECTION_DEFS.map(s=>({...s,questions:QUESTIONS.filter(q=>q.section===s.name)}));

let currentQ=null,currentQIdx=-1,currentSectionIdx=-1,wrongNotes=[],memoNotes=[],viewData={},answerData={},repeatMarks={},currentMemoTab='wrong',currentMemoFilter='all',appInitialized=false;
let viewMode='welcome';
/* ☕ 신규 기능 상태 */
let mnemonics=[],studyLog={},examHistory=[],dailyGoal=20,pendingMemoImg=null,userExpl=[],pendingExplImg=null;
let flashDeck=[],flashIdx=0,flashFlipped=false,flashStudied=null,flashTitle='',flashTotal=0;
let examQuestions=[],examIdx=0,examAnswers={},examStartTs=0,examTimerId=null,examLimitSec=0,examConfig={sections:[],count:20,timer:true};

function escapeHtml(t){const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;}
function timeAgo(ts){const d=Date.now()-ts,s=Math.floor(d/1000);if(s<60)return'방금 전';const m=Math.floor(s/60);if(m<60)return m+'분 전';const h=Math.floor(m/60);if(h<24)return h+'시간 전';const dy=Math.floor(h/24);if(dy<30)return dy+'일 전';return new Date(ts).toLocaleDateString('ko-KR');}
function getQKey(q){return q.section+'_'+(q.chapter||'')+'_'+q.num;}

function migrateAnswerData(){let changed=0;const qMap={};QUESTIONS.forEach(q=>{qMap[getQKey(q)]=q;});Object.keys(answerData).forEach(k=>{const q=qMap[k];if(!q)return;const a=answerData[k];const qAns=parseInt(q.answer,10);const shouldBeCorrect=a.selected===qAns;if(a.correct!==shouldBeCorrect){a.correct=shouldBeCorrect;changed++;}});if(changed>0)syncToCloud();return changed;}

function initApp(){
  if(appInitialized)return;appInitialized=true;
  document.getElementById('userBar').style.display='flex';
  migrateAnswerData();
  buildBookList();updateStats();updateMemoCount();renderMemoPanel();initMemoResize();
  renderDashboard();updateNavMini();
}

function buildBookList(){
  const list=document.getElementById('bookList');list.innerHTML='';
  SECTIONS.forEach((sec,si)=>{
    const qs=sec.questions;
    const done=qs.filter(q=>answerData[getQKey(q)]).length;
    const correct=qs.filter(q=>{const a=answerData[getQKey(q)];return a&&a.correct;}).length;
    const wrong=done-correct;
    const pct=qs.length?Math.round(done/qs.length*100):0;
    const item=document.createElement('div');
    item.className='book-item'+(currentSectionIdx===si?' active':'');
    item.onclick=()=>showGrid(si);
    let stats;
    if(qs.length===0){stats='<span class="book-stat-empty">문제 준비 중</span>';}
    else{stats='<span class="book-stat-total">'+qs.length+'문제</span>'+(correct?'<span class="book-stat-done">✓'+correct+'</span>':'')+(wrong?'<span class="book-stat-wrong">✗'+wrong+'</span>':'')+'<span class="book-stat-pct">'+pct+'%</span>';}
    item.innerHTML='<div class="book-icon">'+sec.icon+'</div><div class="book-title">'+sec.name+'</div><div class="book-stats">'+stats+'</div>'+(qs.length?'<div class="book-progress"><div class="book-progress-bar" style="width:'+pct+'%"></div></div>':'');
    list.appendChild(item);
  });
}

function showGrid(si){
  currentSectionIdx=si;viewMode='grid';currentQ=null;
  document.getElementById('welcomeScreen').style.display='none';
  document.getElementById('quizContainer').style.display='none';
  document.getElementById('flashContainer').style.display='none';
  document.getElementById('examContainer').style.display='none';
  document.getElementById('gridContainer').style.display='block';
  document.getElementById('backBtn').style.display='none';
  stopExamTimer();setNav(null);
  document.getElementById('headerTitle').textContent=SECTIONS[si].name;
  document.getElementById('headerProgress').textContent='';
  buildBookList();
  if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');}
  renderGrid(si);
  document.getElementById('contentArea').scrollTop=0;
}

function renderGrid(si){
  const sec=SECTIONS[si],qs=sec.questions;
  if(qs.length===0){
    document.getElementById('gridContainer').innerHTML='<div class="grid-view"><h2>'+sec.icon+' '+sec.name+'</h2><div class="empty-state"><div class="es-icon">🗂️</div><h3>아직 문제가 등록되지 않았습니다</h3><p>이 섹션의 원본 파일에서 문제를 추출해 채워 넣을 예정입니다.<br>원하시는 파일을 알려주시면 문제를 입력해 드립니다.</p><div class="es-file">📄 '+escapeHtml(sec.file)+'</div></div></div>';
    return;
  }
  const done=qs.filter(q=>answerData[getQKey(q)]).length;
  const correct=qs.filter(q=>{const a=answerData[getQKey(q)];return a&&a.correct;}).length;
  let h='<div class="grid-view"><h2>'+sec.icon+' '+sec.name+'</h2>';
  h+='<div class="grid-sub">'+qs.length+'문제 · '+done+'문제 풀이 완료 (정답 '+correct+', 오답 '+(done-correct)+')</div>';
  h+='<div class="grid-controls"><button class="active" onclick="gridFilter(\'all\',this)">전체</button><button onclick="gridFilter(\'unsolved\',this)">안 푼 문제</button><button onclick="gridFilter(\'wrong\',this)">오답만</button></div>';
  const hasChapters=qs.some(q=>q.chapter&&q.chapter!=='일반');
  if(hasChapters){
    const chapterOrder=[];const chapterMap={};
    qs.forEach((q,qi)=>{const ch=q.chapter||'기타';if(!chapterMap[ch]){chapterMap[ch]=[];chapterOrder.push(ch);}chapterMap[ch].push({q,qi});});
    chapterOrder.forEach(ch=>{
      const items=chapterMap[ch];
      const gDone=items.filter(it=>answerData[getQKey(it.q)]).length;
      const gCorrect=items.filter(it=>{const a=answerData[getQKey(it.q)];return a&&a.correct;}).length;
      h+='<div class="q-group"><div class="q-group-title"><span>📂 '+escapeHtml(ch)+' ('+items.length+')</span><span class="q-group-stats">'+gDone+'/'+items.length+' 풀이'+(gCorrect?' · ✓'+gCorrect:'')+'</span></div><div class="q-grid">';
      items.forEach(it=>{h+=qCardHtml(it.q,si,it.qi);});
      h+='</div></div>';
    });
  }else{
    const CHUNK=30;const numGroups=Math.ceil(qs.length/CHUNK);
    for(let g=0;g<numGroups;g++){
      const start=g*CHUNK,end=Math.min((g+1)*CHUNK,qs.length);
      const groupQs=qs.slice(start,end);
      const gDone=groupQs.filter(q=>answerData[getQKey(q)]).length;
      const gCorrect=groupQs.filter(q=>{const a=answerData[getQKey(q)];return a&&a.correct;}).length;
      const label=groupQs[0].num+'~'+groupQs[groupQs.length-1].num+'번';
      h+='<div class="q-group"><div class="q-group-title"><span>📂 '+label+'</span><span class="q-group-stats">'+gDone+'/'+groupQs.length+' 풀이'+(gCorrect?' · ✓'+gCorrect:'')+'</span></div><div class="q-grid">';
      groupQs.forEach((q,gi)=>{h+=qCardHtml(q,si,start+gi);});
      h+='</div></div>';
    }
  }
  h+='</div>';
  document.getElementById('gridContainer').innerHTML=h;
}
function qCardHtml(q,si,qi){
  const k=getQKey(q),a=answerData[k],v=viewData[k];
  let cls='q-card';if(a){cls+=a.correct?' answered-correct':' answered-wrong';}
  if(wrongNotes.some(n=>n.qKey===k))cls+=' has-note';
  const views=v?v.count+'회':'';
  return '<div class="'+cls+'" data-qkey="'+k+'" data-status="'+(a?(a.correct?'correct':'wrong'):'unsolved')+'" data-noted="'+(wrongNotes.some(n=>n.qKey===k)?'1':'0')+'" onclick="loadQuestion(SECTIONS['+si+'].questions['+qi+'])"><div class="q-card-num">'+q.num+'</div>'+(views?'<div class="q-card-views">'+views+'</div>':'')+'</div>';
}

function gridFilter(mode,btn){
  document.querySelectorAll('.grid-controls button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.q-card').forEach(c=>{
    const status=c.getAttribute('data-status'),noted=c.getAttribute('data-noted');let show=true;
    if(mode==='unsolved')show=status==='unsolved';else if(mode==='wrong')show=status==='wrong';else if(mode==='noted')show=noted==='1';
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.q-group').forEach(g=>{const cards=g.querySelectorAll('.q-card');const anyVisible=Array.from(cards).some(c=>c.style.display!=='none');g.style.display=anyVisible?'':'none';});
}

function goBack(){
  if(viewMode==='quiz'&&currentSectionIdx>=0){showGrid(currentSectionIdx);}
  else{goHome();}
}

function openLightbox(src){const lb=document.createElement('div');lb.className='lightbox';lb.onclick=()=>lb.remove();lb.innerHTML='<img src="'+src+'">';document.body.appendChild(lb);}

function loadQuestion(q){
  currentQ=q;currentQIdx=QUESTIONS.indexOf(q);viewMode='quiz';pendingMemoImg=null;pendingExplImg=null;
  const k=getQKey(q);
  if(!viewData[k])viewData[k]={count:0,lastViewed:0};
  viewData[k].count++;viewData[k].lastViewed=Date.now();syncToCloud();
  document.getElementById('welcomeScreen').style.display='none';
  document.getElementById('gridContainer').style.display='none';
  document.getElementById('flashContainer').style.display='none';
  document.getElementById('examContainer').style.display='none';
  document.getElementById('quizContainer').style.display='block';
  document.getElementById('backBtn').style.display='inline-block';
  stopExamTimer();setNav(null);
  document.getElementById('headerTitle').textContent=q.section+' · Q'+q.num;
  const secQs=SECTIONS.find(s=>s.name===q.section);
  const doneInSec=secQs?secQs.questions.filter(qq=>answerData[getQKey(qq)]).length:0;
  const totalInSec=secQs?secQs.questions.length:0;
  document.getElementById('headerProgress').textContent=doneInSec+'/'+totalInSec+' 풀이 완료';
  if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');}
  renderQuiz();buildBookList();
  document.getElementById('contentArea').scrollTop=0;
}

function renderQuiz(){
  const q=currentQ,k=getQKey(q),c=document.getElementById('quizContainer');
  const v=viewData[k];let vh='';
  if(v&&v.count>0)vh='<div class="meta-views">👁 '+v.count+'회 · '+timeAgo(v.lastViewed)+' <button class="meta-minus-btn" onclick="decrementView(\''+k+'\')">−1</button><button class="meta-reset-btn" onclick="resetView(\''+k+'\')">✕</button></div>';
  const isMarked=isMarkedForRepeat(k);
  const repeatBtn='<button class="meta-repeat-btn" onclick="toggleRepeatMark(\''+k+'\')" title="'+(isMarked?'반복 표시 해제':'반복 표시 추가')+'" style="background:'+(isMarked?'var(--repeat)':'#fff')+';color:'+(isMarked?'#fff':'var(--text2)')+';border:1px solid '+(isMarked?'var(--repeat)':'var(--border2)')+';padding:4px 11px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;margin-left:auto;font-family:inherit">🔁 '+(isMarked?'반복 표시됨':'반복 표시')+'</button>';
  let h='<div class="quiz-card"><div class="quiz-meta" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><div class="meta-section">'+escapeHtml(q.section)+'</div><div class="meta-num">문제 '+q.num+'</div>'+repeatBtn+vh+'</div>';
  h+='<div class="quiz-question">'+escapeHtml(q.question);
  if(q.question_images&&q.question_images.length)q.question_images.forEach(img=>{h+='<br><img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});
  h+='</div>';
