  q.choices.forEach((ch,i)=>{const n=i+1;let cls='choice-btn';if(ea){cls+=' disabled';if(n===qAns)cls+=' correct';else if(n===ea.selected)cls+=' wrong';else cls+=' dimmed';}h+='<button class="'+cls+'" data-choice="'+n+'" onclick="selectAnswer('+n+')"><span class="choice-num">'+n+'</span><span class="choice-text">'+escapeHtml(ch)+'</span></button>';});
  h+='</div>';
  if(ea)h+=renderResult(q,ea.selected);
  h+=userExplSectionHtml(q);
  h+=renderNoteSection(q);
  h+=mnemSectionHtml(q);
  const secQs=SECTIONS.find(s=>s.name===q.section);
  if(secQs){
    const qi=secQs.questions.indexOf(q);
    h+='<div class="quiz-nav">';
    if(qi>0)h+='<button onclick="loadQuestion(SECTIONS['+SECTIONS.indexOf(secQs)+'].questions['+(qi-1)+'])">← 이전</button>';else h+='<div></div>';
    if(qi<secQs.questions.length-1)h+='<button class="primary" onclick="loadQuestion(SECTIONS['+SECTIONS.indexOf(secQs)+'].questions['+(qi+1)+'])">다음 →</button>';
    h+='</div>';
  }
  h+='</div>';c.innerHTML=h;renderPendingImg();renderPendingExplImg();
}

function selectAnswer(num){
  const q=currentQ,k=getQKey(q);if(answerData[k])return;
  const qAns=parseInt(q.answer,10);const ic=num===qAns;
  answerData[k]={selected:num,correct:ic,timestamp:Date.now()};recordStudy(ic);syncToCloud();
  document.querySelectorAll('.choice-btn').forEach(b=>{const n=parseInt(b.getAttribute('data-choice'));b.classList.add('disabled');if(n===qAns)b.classList.add('correct');else if(n===num&&!ic)b.classList.add('wrong');else b.classList.add('dimmed');});
  document.getElementById('choicesArea').insertAdjacentHTML('afterend',renderResult(q,num));
  if(ic)launchConfetti();
  buildBookList();updateStats();updateMemoCount();
}
function renderResult(q,sel){
  const qAns=parseInt(q.answer,10);const ic=sel===qAns;
  let h='<div class="result-banner '+(ic?'correct':'wrong')+'"><span style="flex:1"><span class="result-icon">'+(ic?'✅':'❌')+'</span> '+(ic?'정답입니다!':'오답 — 정답은 '+qAns+'번입니다')+'</span><button class="retry-btn" onclick="resetOneAnswer()">🔄 다시 풀기</button></div>';
  if(q.explanation||q.reference||(q.explanation_images&&q.explanation_images.length)){
    h+='<div class="explanation-box"><h3>📖 해설</h3>';
    if(q.explanation)h+='<div class="expl-text">'+escapeHtml(q.explanation)+'</div>';
    if(q.reference)h+='<div class="expl-ref">📚 '+escapeHtml(q.reference)+'</div>';
    if(q.explanation_images&&q.explanation_images.length){h+='<div class="expl-images">';q.explanation_images.forEach(img=>{h+='<img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});h+='</div>';}
    h+='</div>';
  }
  return h;
}
function renderNoteSection(q){
  const k=getQKey(q);
  let h='<div class="note-section"><div class="note-input-row"><textarea class="note-input" id="memoNoteInput" placeholder="외워야 할 내용 메모...  ( 📷 스크린샷 복사 후 Ctrl+V 로 붙여넣기 )" onpaste="handleMemoPaste(event)"></textarea><button class="note-add-btn memo-btn" onclick="addMemoNote()">📝 메모</button></div>';
  h+='<div id="memoImgPreview" class="memo-img-preview" style="display:none"></div>';
  const mn=memoNotes.filter(n=>n.qKey===k);
  if(mn.length){h+='<div class="note-list">';mn.forEach(n=>{h+='<div class="note-item">'+(n.text?'<div>'+escapeHtml(n.text)+'</div>':'')+(n.img?'<img class="note-img" src="'+n.img+'" onclick="openLightbox(this.src)">':'')+'<div class="note-time">'+timeAgo(n.created)+'</div><button class="note-del" onclick="deleteNote(\'memo\','+n.id+')">×</button></div>';});h+='</div>';}
  h+='</div>';return h;
}
function decrementView(k){if(viewData[k]&&viewData[k].count>0){viewData[k].count--;if(viewData[k].count===0)delete viewData[k];syncToCloud();buildBookList();if(currentQ&&getQKey(currentQ)===k)renderQuiz();}}
function resetView(k){delete viewData[k];syncToCloud();buildBookList();if(currentQ&&getQKey(currentQ)===k)renderQuiz();}
function resetAllViews(){if(!confirm('전체 조회수를 초기화하시겠습니까?'))return;viewData={};syncToCloud();buildBookList();updateStats();}
function resetOneAnswer(){if(!currentQ)return;const k=getQKey(currentQ);if(!answerData[k])return;delete answerData[k];syncToCloud();renderQuiz();buildBookList();updateStats();updateMemoCount();}
function resetAllAnswers(){if(!confirm('모든 풀이 기록을 초기화하시겠습니까?'))return;answerData={};syncToCloud();buildBookList();updateStats();if(viewMode==='grid'&&currentSectionIdx>=0)renderGrid(currentSectionIdx);}
function addMemoNote(){const i=document.getElementById('memoNoteInput'),t=i.value.trim();if((!t&&!pendingMemoImg)||!currentQ)return;const k=getQKey(currentQ);memoNotes.push({id:Date.now(),qKey:k,section:currentQ.section,qNum:currentQ.num,qText:currentQ.question.substring(0,50),text:t,img:pendingMemoImg||null,created:Date.now()});i.value='';pendingMemoImg=null;syncToCloud();renderQuiz();updateMemoCount();renderMemoPanel();}
function deleteNote(type,id){if(type==='wrong')wrongNotes=wrongNotes.filter(n=>n.id!==id);else memoNotes=memoNotes.filter(n=>n.id!==id);syncToCloud();if(currentQ)renderQuiz();buildBookList();updateStats();updateMemoCount();renderMemoPanel();}
function _setTxt(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
function updateStats(){const wc=Object.values(answerData).filter(a=>!a.correct).length;const cc=Object.values(answerData).filter(a=>a.correct).length;_setTxt('statTotal',QUESTIONS.length);_setTxt('statCorrect',cc);_setTxt('statWrong',wc);_setTxt('statNotes',memoNotes.length);_setTxt('wrongCount',wc);}
function updateMemoCount(){document.getElementById('memoCount').textContent=memoNotes.length;updateRepeatCount();}
function updateRepeatCount(){const el=document.getElementById('repeatCount');if(el)el.textContent=Object.keys(repeatMarks).filter(k=>repeatMarks[k]&&repeatMarks[k].marked).length;}
function isMarkedForRepeat(qKey){return !!(repeatMarks[qKey]&&repeatMarks[qKey].marked);}
function toggleRepeatMark(qKey){const cur=isMarkedForRepeat(qKey);repeatMarks[qKey]={marked:!cur,ts:Date.now()};syncToCloud();updateRepeatCount();if(currentQ&&getQKey(currentQ)===qKey)renderQuiz();if(document.getElementById('memoPanel').classList.contains('open')&&currentMemoTab==='repeat')renderRepeatList();buildBookList();}
function showRepeatNote(){const p=document.getElementById('memoPanel');if(!p.classList.contains('open'))p.classList.add('open');switchMemoTab('repeat');document.getElementById('memoWrongPreview').style.display='none';}
function renderRepeatList(){
  const markedKeys=Object.keys(repeatMarks).filter(k=>repeatMarks[k]&&repeatMarks[k].marked);
  const markedQs=QUESTIONS.filter(q=>markedKeys.includes(getQKey(q)));
  const f=currentMemoFilter==='all'?markedQs:markedQs.filter(q=>q.section===currentMemoFilter);
  const l=document.getElementById('repeatList');
  if(!f.length){l.innerHTML='<div class="memo-empty">반복 표시한 문제가 없습니다<br><span style="font-size:11px;color:var(--text3);margin-top:8px;display:block">문제 풀이 화면에서 🔁 버튼을 누르면 여기에 모입니다</span></div>';return;}
  let h='';
  f.sort((a,b)=>{const ta=repeatMarks[getQKey(a)].ts||0;const tb=repeatMarks[getQKey(b)].ts||0;return tb-ta;}).forEach(q=>{
    const k=getQKey(q);const ans=answerData[k];let statusBadge='';
    if(ans){if(ans.correct)statusBadge='<span style="background:var(--correct);color:#fff;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:4px">정답</span>';else statusBadge='<span style="background:var(--wrong);color:#fff;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:4px">오답('+ans.selected+'→'+q.answer+')</span>';}
    h+='<div class="memo-item" data-qkey="'+k+'" onclick="jumpToQ(\''+k+'\',\''+String(q.section).replace(/\x27/g,"\\\x27")+'\','+q.num+')" title="클릭 → 문제로 이동"><div class="memo-q">🔁 '+escapeHtml(q.section)+' Q'+q.num+statusBadge+'</div><div class="memo-text" style="font-size:12px;color:var(--text2);margin-top:2px">'+escapeHtml(q.question.substring(0,60))+'...</div><button class="memo-del" title="반복 표시 해제" onclick="event.stopPropagation();toggleRepeatMark(\''+k+'\')">×</button></div>';
  });
  l.innerHTML=h;
}
function toggleMemo(){const p=document.getElementById('memoPanel');p.classList.toggle('open');if(p.classList.contains('open'))switchMemoTab('memo');}
function closeMemo(e){if(e){e.stopPropagation();e.preventDefault();}document.getElementById('memoPanel').classList.remove('open');}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');}
function switchMemoTab(t){
  currentMemoTab=t;
  document.getElementById('memoTabWrong').style.display=t==='wrong'?'':'none';document.getElementById('memoTabWrong').classList.toggle('active',t==='wrong');
  document.getElementById('memoTabMemo').style.display=t==='memo'?'':'none';document.getElementById('memoTabMemo').classList.toggle('active',t==='memo');
  const repTab=document.getElementById('memoTabRepeat');if(repTab){repTab.style.display=t==='repeat'?'':'none';repTab.classList.toggle('active',t==='repeat');}
  document.getElementById('memoPanelTitle').innerHTML=t==='wrong'?'❌ 오답노트':(t==='repeat'?'🔁 반복노트':'📝 메모');
  const prev=document.getElementById('memoWrongPreview');if(t!=='wrong')prev.style.display='none';
  const cb=document.getElementById('clearTabBtn');if(cb)cb.innerHTML=t==='wrong'?'🗑 오답 전체 초기화':(t==='repeat'?'🗑 반복 전체 해제':'🗑 메모 전체 삭제');
  renderFilterChips();renderMemoPanel();
}
function renderFilterChips(){
  const b=document.getElementById('memoFilterBar');b.innerHTML='';
  const a=document.createElement('button');a.className='memo-filter-chip'+(currentMemoFilter==='all'?' active':'');a.textContent='전체';a.onclick=()=>{currentMemoFilter='all';renderFilterChips();renderMemoPanel();};b.appendChild(a);
  SECTIONS.forEach(s=>{
    let cnt=0;
    if(currentMemoTab==='wrong'){cnt=QUESTIONS.filter(q=>q.section===s.name&&answerData[getQKey(q)]&&!answerData[getQKey(q)].correct).length;}
    else if(currentMemoTab==='repeat'){cnt=QUESTIONS.filter(q=>q.section===s.name&&isMarkedForRepeat(getQKey(q))).length;}
    else{cnt=memoNotes.filter(n=>n.section===s.name).length;}
    if(cnt===0)return;
    const c=document.createElement('button');c.className='memo-filter-chip'+(currentMemoFilter===s.name?' active':'');c.textContent=s.name+' ('+cnt+')';c.onclick=()=>{currentMemoFilter=s.name;renderFilterChips();renderMemoPanel();};b.appendChild(c);
  });
}
function renderMemoPanel(){
  renderFilterChips();
  if(currentMemoTab==='wrong'){renderWrongList();return;}
  if(currentMemoTab==='repeat'){renderRepeatList();return;}
  const ns=memoNotes;const f=currentMemoFilter==='all'?ns:ns.filter(n=>n.section===currentMemoFilter);
  const l=document.getElementById('memoList');
  if(!f.length){l.innerHTML='<div class="memo-empty">메모가 없습니다<br><span style="font-size:11px;color:var(--text3);margin-top:8px;display:block">문제 아래 메모 입력란에서 추가하세요</span></div>';return;}
  let h='';
  f.sort((a,b)=>b.created-a.created).forEach(n=>{h+='<div class="memo-item note" onclick="jumpToQ(\''+n.qKey+'\',\''+String(n.section).replace(/\x27/g,"\\\x27")+'\','+n.qNum+')" title="클릭 → 문제로 이동"><div class="memo-q">'+escapeHtml(n.section)+' Q'+n.qNum+' · '+escapeHtml(n.qText)+'...</div>'+(n.text?'<div class="memo-text">'+escapeHtml(n.text)+'</div>':'')+(n.img?'<img class="memo-img" src="'+n.img+'" onclick="event.stopPropagation();openLightbox(this.src)">':'')+'<button class="memo-del" onclick="event.stopPropagation();deleteNote(\'memo\','+n.id+')">×</button></div>';});
  l.innerHTML=h;
}
function renderWrongList(){
  const wrongQs=QUESTIONS.filter(q=>{const a=answerData[getQKey(q)];return a&&!a.correct;});
  const f=currentMemoFilter==='all'?wrongQs:wrongQs.filter(q=>q.section===currentMemoFilter);
  const l=document.getElementById('wrongList');
  if(!f.length){l.innerHTML='<div class="memo-empty">오답이 없습니다 🎉</div>';document.getElementById('memoWrongPreview').style.display='none';return;}
  let h='';
  f.forEach(q=>{const k=getQKey(q);const a=answerData[k];const txt=q.question.substring(0,60);h+='<div class="memo-item wrong" data-qkey="'+k+'" onclick="jumpToQ(\''+k+'\',\''+String(q.section).replace(/\x27/g,"\\\x27")+'\','+q.num+')" title="클릭 → 문제로 이동"><div class="memo-q">'+escapeHtml(q.section)+' Q'+q.num+'</div><div class="memo-text" style="font-size:12px;color:var(--text2);margin-top:2px">'+escapeHtml(txt)+'...</div><div style="font-size:11px;color:var(--wrong);margin-top:3px;font-weight:600">내 답: '+a.selected+'번 → 정답: '+q.answer+'번</div><button class="memo-del" title="이 오답 기록 삭제(재풀이 가능)" onclick="event.stopPropagation();deleteWrongOne(\''+k+'\')">×</button></div>';});
  l.innerHTML=h;
}
function deleteWrongOne(qKey){if(!confirm('이 문제의 오답 기록을 삭제할까요? (다시 풀 수 있습니다)'))return;delete answerData[qKey];syncToCloud();renderMemoPanel();updateMemoCount();updateStats();buildBookList();if(currentQ&&getQKey(currentQ)===qKey)renderQuiz();}
function jumpToQ(qKey,fbSection,fbNum){
  let q=QUESTIONS.find(q=>getQKey(q)===qKey);
  if(!q&&fbSection!=null&&fbNum!=null){q=QUESTIONS.find(qq=>qq.section===fbSection&&String(qq.num)===String(fbNum));}
  if(!q){alert('해당 문제를 찾을 수 없습니다.');return;}
  const si=SECTIONS.findIndex(s=>s.name===q.section);if(si>=0)currentSectionIdx=si;
  if(window.innerWidth<=900){const p=document.getElementById('memoPanel');if(p)p.classList.remove('open');}
  loadQuestion(q);
}
function showWrongNote(){const p=document.getElementById('memoPanel');if(!p.classList.contains('open'))p.classList.add('open');switchMemoTab('wrong');document.getElementById('memoWrongPreview').style.display='none';}
function exportNotes(){
  let t='===== 전문의 시험 공부 노트 =====\n\n';
  const wrongQs=QUESTIONS.filter(q=>{const a=answerData[getQKey(q)];return a&&!a.correct;});
  if(wrongQs.length){t+='[ 오답노트 ]\n\n';wrongQs.forEach(q=>{const a=answerData[getQKey(q)];t+='['+q.section+' Q'+q.num+'] '+q.question.substring(0,80)+'\n  내 답: '+a.selected+'번 / 정답: '+q.answer+'번\n\n';});}
  const repQs=QUESTIONS.filter(q=>isMarkedForRepeat(getQKey(q)));
  if(repQs.length){t+='\n[ 반복노트 ]\n\n';repQs.forEach(q=>{t+='['+q.section+' Q'+q.num+'] '+q.question.substring(0,80)+'\n\n';});}
  if(memoNotes.length){t+='\n[ 메모 ]\n\n';memoNotes.forEach(n=>{t+='['+n.section+' Q'+n.qNum+'] '+n.text+'\n\n';});}
  const b=new Blob([t],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='전문의시험_노트.txt';a.click();
}
function clearCurrentTab(){
  if(currentMemoTab==='wrong'){if(!confirm('모든 오답 기록을 초기화하시겠습니까?'))return;answerData={};syncToCloud();renderMemoPanel();updateMemoCount();updateStats();if(currentQ)renderQuiz();buildBookList();return;}
  if(currentMemoTab==='repeat'){if(!confirm('모든 반복 표시를 해제하시겠습니까?'))return;repeatMarks={};syncToCloud();renderMemoPanel();updateRepeatCount();if(currentQ)renderQuiz();buildBookList();return;}
  if(!confirm('현재 탭의 모든 메모를 삭제하시겠습니까?'))return;memoNotes=[];syncToCloud();renderMemoPanel();updateMemoCount();if(currentQ)renderQuiz();
}
function initMemoResize(){
  const p=document.getElementById('memoPanel'),h=document.getElementById('memoResizeHandle');if(!h||!p)return;
  let sx,sw,r=false;
  h.addEventListener('mousedown',e=>{e.preventDefault();r=true;sx=e.clientX;sw=p.offsetWidth;h.classList.add('active');document.body.style.cursor='col-resize';document.body.style.userSelect='none';});
  document.addEventListener('mousemove',e=>{if(!r)return;p.style.width=Math.max(280,Math.min(800,sw+(sx-e.clientX)))+'px';p.style.minWidth=p.style.width;});
  document.addEventListener('mouseup',()=>{if(!r)return;r=false;h.classList.remove('active');document.body.style.cursor='';document.body.style.userSelect='';});
}
document.addEventListener('keydown',e=>{
  if(!currentQ||viewMode!=='quiz')return;
  if(document.activeElement.tagName==='TEXTAREA'||document.activeElement.tagName==='INPUT')return;
  const k=getQKey(currentQ);
  if(answerData[k]){
    if(e.key==='ArrowRight'){const sec=SECTIONS.find(s=>s.name===currentQ.section);if(sec){const qi=sec.questions.indexOf(currentQ);if(qi<sec.questions.length-1)loadQuestion(sec.questions[qi+1]);}}
    if(e.key==='ArrowLeft'){const sec=SECTIONS.find(s=>s.name===currentQ.section);if(sec){const qi=sec.questions.indexOf(currentQ);if(qi>0)loadQuestion(sec.questions[qi-1]);}}
    if(e.key==='Escape'||e.key==='Backspace')goBack();
    return;
  }
  const n=parseInt(e.key);if(n>=1&&n<=currentQ.choices.length)selectAnswer(n);
});
</script>

<!-- ===== ☕ 신규 기능: 대시보드 · 암기카드 · 모의고사 · 니모닉 · 시각효과 ===== -->
<script>
/* ---------- 공통 유틸 ---------- */
function jsStr(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function _dateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
function todayStr(){return _dateStr(new Date());}
function _examDateStr(ms){const d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtTime(s){s=Math.max(0,s|0);const m=Math.floor(s/60),ss=s%60;return m+':'+String(ss).padStart(2,'0');}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function closeSidebarMobile(){const s=document.getElementById('sidebar');if(s)s.classList.remove('open');const o=document.getElementById('sidebarOverlay');if(o)o.classList.remove('open');}
function _mergeStudyLog(a,b){const out=Object.assign({},a||{});const bb=b||{};for(const k of Object.keys(bb)){if(!out[k])out[k]={solved:bb[k].solved||0,correct:bb[k].correct||0};else out[k]={solved:Math.max(out[k].solved||0,bb[k].solved||0),correct:Math.max(out[k].correct||0,bb[k].correct||0)};}return out;}

/* ---------- 학습 로그 / 스트릭 ---------- */
function recordStudy(correct){const d=todayStr();if(!studyLog[d])studyLog[d]={solved:0,correct:0};studyLog[d].solved++;if(correct)studyLog[d].correct++;}
function computeStreak(){const day=new Date();if(!(studyLog[_dateStr(day)]&&studyLog[_dateStr(day)].solved>0))day.setDate(day.getDate()-1);let streak=0;while(streak<2000){const ds=_dateStr(day);if(studyLog[ds]&&studyLog[ds].solved>0){streak++;day.setDate(day.getDate()-1);}else break;}return streak;}
function last7Days(){const out=[],wd=['일','월','화','수','목','금','토'],today=new Date();for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(today.getDate()-i);const ds=_dateStr(d),e=studyLog[ds];out.push({solved:e?e.solved:0,label:wd[d.getDay()],today:i===0});}return out;}

/* ---------- 내비 / 홈 ---------- */
function setNav(which){['navHome','navFlash','navExam'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.remove('active');});const map={home:'navHome',flash:'navFlash',exam:'navExam'};if(which&&map[which]){const e=document.getElementById(map[which]);if(e)e.classList.add('active');}updateNavMini();}
function updateNavMini(){const w=QUESTIONS.filter(q=>{const a=answerData[getQKey(q)];return a&&!a.correct;}).length;const r=Object.keys(repeatMarks).filter(k=>repeatMarks[k]&&repeatMarks[k].marked).length;const n=w+r;const e=document.getElementById('navFlashMini');if(e){if(n>0){e.textContent=n;e.style.display='';}else{e.style.display='none';}}}
function goHome(){
  viewMode='welcome';currentQ=null;currentSectionIdx=-1;stopExamTimer();
  ['gridContainer','quizContainer','flashContainer','examContainer'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});
  document.getElementById('welcomeScreen').style.display='';
  document.getElementById('backBtn').style.display='none';
  document.getElementById('headerTitle').textContent='홈 · 대시보드';
  document.getElementById('headerProgress').textContent='';
  setNav('home');renderDashboard();buildBookList();
  if(window.innerWidth<=768)closeSidebarMobile();
  document.getElementById('contentArea').scrollTop=0;
}

/* ---------- 진도링 / 카운트업 / 색상 / 애니메이션 ---------- */
function ringHtml(pct,color,valText,label,size){
  size=size||120;pct=Math.max(0,Math.min(100,pct||0));
  const r=52,C=2*Math.PI*r,off=C*(1-pct/100),sw=12;
  return '<div class="ring-wrap" style="width:'+size+'px;height:'+size+'px">'
   +'<svg class="pring" width="'+size+'" height="'+size+'" viewBox="0 0 120 120">'
   +'<circle class="pring-track" cx="60" cy="60" r="'+r+'" fill="none" stroke-width="'+sw+'"/>'
   +'<circle class="pring-fill" cx="60" cy="60" r="'+r+'" fill="none" stroke-width="'+sw+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-off="'+off.toFixed(1)+'" style="--rc:'+color+'"/>'
   +'</svg><div class="ring-center"><div class="ring-val">'+valText+'</div><div class="ring-lbl">'+label+'</div></div></div>';
}

function launchConfetti(){
  const layer=document.createElement('div');layer.className='confetti-layer';
  const colors=['#24433a','#356055','#b08d57','#4f8a45','#caa86a','#f0eadd','#3d6a5b'];
  for(let i=0;i<22;i++){const p=document.createElement('div');p.className='confetti-piece';
    p.style.left=(Math.random()*100)+'vw';p.style.background=colors[i%colors.length];
    p.style.setProperty('--cx',(Math.random()*200-100)+'px');p.style.setProperty('--cr',(Math.random()*720-220)+'deg');
    p.style.animationDuration=(1.6+Math.random()*1.5)+'s';p.style.animationDelay=(Math.random()*0.25)+'s';

function handleExplPaste(e){
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(let i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image')===0){
      const file=items[i].getAsFile();if(!file)continue;e.preventDefault();
      try{showSync('syncing','🖼 이미지 처리 중...');}catch(_){}
      compressImage(file,function(d){pendingExplImg=d;renderPendingExplImg();try{showSync('synced','✅ 사진 첨부됨');}catch(_){}});
      return;
    }
  }
}

/* ---------- 모의고사 ---------- */
function examPoolCount(){let n=0;examConfig.sections.forEach(name=>{const s=SECTIONS.find(x=>x.name===name);if(s)n+=s.questions.filter(q=>q.choices&&q.choices.length>0).length;});return n;}
function _examShow(){['welcomeScreen','gridContainer','quizContainer','flashContainer'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});document.getElementById('examContainer').style.display='block';document.getElementById('backBtn').style.display='none';document.getElementById('headerProgress').textContent='';setNav('exam');if(window.innerWidth<=768)closeSidebarMobile();}
function openExamSetup(){
  viewMode='exam';currentQ=null;stopExamTimer();_examShow();
  document.getElementById('headerTitle').textContent='📝 모의고사';
  const secs=SECTIONS.filter(s=>s.questions.length>0&&s.name!=='📖 사용법');
  examConfig.sections=(examConfig.sections||[]).filter(n=>secs.some(s=>s.name===n));
  if(!examConfig.sections.length)examConfig.sections=secs.map(s=>s.name);
  renderExamSetup(secs);
}
function renderExamSetup(secs){
  const c=document.getElementById('examContainer');
  let h='<div class="exam-wrap"><div class="exam-setup"><h2>📝 모의고사</h2><div class="es-sub">실제 시험처럼 풀어보세요. 푸는 동안엔 정답이 보이지 않고, 제출하면 채점·분석해 드립니다.</div>';
  h+='<div class="exam-cfg"><span class="ec-label">📂 출제 범위 (섹션)</span><div class="exam-sec-list">';
  secs.forEach(s=>{const on=examConfig.sections.includes(s.name);h+='<button class="exam-sec-chip'+(on?' on':'')+'" onclick="toggleExamSec(\''+jsStr(s.name)+'\')">'+escapeHtml(s.icon+' '+s.name)+' ('+s.questions.length+')</button>';});
  h+='</div>';
  const avail=examPoolCount();
  h+='<span class="ec-label">🔢 문항 수 <span style="color:var(--text3);font-weight:600">(범위 내 '+avail+'문제)</span></span><div class="exam-count-row" id="examCountRow">';
  [10,20,40].forEach(n=>{h+='<button class="count-chip'+(examConfig.count===n?' on':'')+'" onclick="setExamCount('+n+',this)">'+n+'문제</button>';});
  h+='<button class="count-chip'+(examConfig.count==='all'?' on':'')+'" onclick="setExamCount(\'all\',this)">전체</button></div>';
  h+='<span class="ec-label">⏱ 타이머</span><div class="toggle-row"><div class="tg'+(examConfig.timer?' on':'')+'" id="examTimerToggle" onclick="toggleExamTimer()"></div><span>제한 시간 사용 (문항당 약 1분)</span></div>';
  h+='</div>';
  h+='<button class="exam-start-btn"'+(avail===0?' disabled':'')+' onclick="startExam()">🚀 모의고사 시작</button>';
  if(examHistory.length){
    h+='<div class="dash-card" style="margin-top:18px"><div class="dc-head"><div class="dc-title">📊 최근 모의고사 기록</div><button onclick="clearExamHistory()" style="background:none;border:none;color:var(--text3);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit">전체 삭제</button></div><div class="heatmap">';
    examHistory.slice(0,10).forEach(r=>{const pct=Math.round(r.correct/r.total*100);h+='<div class="heat-row exam-hist-row" onclick="openExamResult('+r.id+')" title="클릭 → 결과·해설 다시보기"><div class="hr-name">'+_examDateStr(r.date)+'</div><div class="hr-bar"><i data-fill="'+pct+'%" style="width:0;background:'+heatColor(pct)+'"></i></div><div class="hr-pct">'+r.correct+'/'+r.total+' · '+pct+'%</div><button class="exam-hist-del" title="이 기록 삭제" onclick="event.stopPropagation();deleteExam('+r.id+')">×</button></div>';});
    h+='</div><div class="dc-hint" style="margin-top:9px">기록을 클릭하면 그때 푼 문제와 해설을 다시 볼 수 있어요.</div></div>';
  }
  h+='</div></div>';
  c.innerHTML=h;animateDash();
}
function toggleExamSec(name){const i=examConfig.sections.indexOf(name);if(i>=0){if(examConfig.sections.length<=1)return;examConfig.sections.splice(i,1);}else{examConfig.sections.push(name);}const secs=SECTIONS.filter(s=>s.questions.length>0&&s.name!=='📖 사용법');renderExamSetup(secs);}
function setExamCount(n,btn){examConfig.count=n;document.querySelectorAll('#examCountRow .count-chip').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');}
function toggleExamTimer(){examConfig.timer=!examConfig.timer;const t=document.getElementById('examTimerToggle');if(t)t.classList.toggle('on',examConfig.timer);}
function startExam(){
  let pool=[];examConfig.sections.forEach(name=>{const s=SECTIONS.find(x=>x.name===name);if(s)pool=pool.concat(s.questions);});
  pool=pool.filter(q=>q.choices&&q.choices.length>0);
  if(!pool.length){alert('출제할 문제가 없습니다. 범위를 확인하세요.');return;}
  pool=shuffle(pool);
  const cnt=examConfig.count==='all'?pool.length:Math.min(examConfig.count,pool.length);
  examQuestions=pool.slice(0,cnt);examAnswers={};examIdx=0;examStartTs=Date.now();examLimitSec=examConfig.timer?cnt*60:0;
  stopExamTimer();if(examLimitSec>0)examTimerId=setInterval(examTick,1000);
  _examShow();document.getElementById('headerTitle').textContent='📝 모의고사 진행 중';
  renderExam();document.getElementById('contentArea').scrollTop=0;
}
function examTick(){if(examLimitSec<=0)return;const elapsed=Math.floor((Date.now()-examStartTs)/1000);const rem=examLimitSec-elapsed;const el=document.getElementById('examTimer');if(el){el.textContent='⏱ '+fmtTime(Math.max(0,rem));el.classList.toggle('warn',rem<=60);}if(rem<=0){stopExamTimer();alert('⏰ 시간이 종료되어 자동 제출합니다.');submitExam(true);}}
function stopExamTimer(){if(examTimerId){clearInterval(examTimerId);examTimerId=null;}}
function renderExam(){
  const c=document.getElementById('examContainer');const q=examQuestions[examIdx];if(!q)return;
  const total=examQuestions.length,answered=Object.keys(examAnswers).length;
  let h='<div class="exam-wrap"><div class="exam-topbar">';
  if(examLimitSec>0){const rem=Math.max(0,examLimitSec-Math.floor((Date.now()-examStartTs)/1000));h+='<div class="exam-timer'+(rem<=60?' warn':'')+'" id="examTimer">⏱ '+fmtTime(rem)+'</div>';}
  else{h+='<div class="exam-timer" id="examTimer">⏱ '+fmtTime(Math.floor((Date.now()-examStartTs)/1000))+'</div>';}
  h+='<div class="et-prog">'+answered+' / '+total+' 응답</div><button class="et-submit" onclick="submitExam(false)">제출</button></div>';
  h+='<div class="exam-omr">';
  examQuestions.forEach((qq,i)=>{h+='<button class="omr-cell'+(examAnswers[i]?' answered':'')+(i===examIdx?' current':'')+'" onclick="examGoto('+i+')">'+(i+1)+'</button>';});
  h+='</div>';
  h+='<div class="quiz-meta" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><div class="meta-section">'+escapeHtml(q.section)+'</div><div class="meta-num">'+(examIdx+1)+'번째 · 원본 Q'+q.num+'</div></div>';
  h+='<div class="quiz-question">'+escapeHtml(q.question);
  if(q.question_images&&q.question_images.length)q.question_images.forEach(img=>{h+='<br><img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});
  h+='</div><div class="quiz-choices">';
  const sel=examAnswers[examIdx];
  q.choices.forEach((ch,i)=>{const n=i+1,on=sel===n;h+='<button class="choice-btn" style="'+(on?'border-color:var(--accent);background:var(--accent-soft)':'')+'" onclick="examSelect('+n+')"><span class="choice-num"'+(on?' style="background:var(--accent);color:#fff"':'')+'>'+n+'</span><span class="choice-text">'+escapeHtml(ch)+'</span></button>';});
  h+='</div><div class="quiz-nav"><button onclick="examPrev()"'+(examIdx===0?' disabled style="opacity:.4"':'')+'>← 이전</button>';
  h+=(examIdx<total-1)?'<button class="primary" onclick="examNext()">다음 →</button>':'<button class="primary" onclick="submitExam(false)">✅ 제출하기</button>';
  h+='</div></div>';
  c.innerHTML=h;
}
function examSelect(n){examAnswers[examIdx]=n;renderExam();}
function examGoto(i){examIdx=i;renderExam();}
function examPrev(){if(examIdx>0){examIdx--;renderExam();document.getElementById('contentArea').scrollTop=0;}}
function examNext(){if(examIdx<examQuestions.length-1){examIdx++;renderExam();document.getElementById('contentArea').scrollTop=0;}}
function submitExam(auto){
  const total=examQuestions.length,answered=Object.keys(examAnswers).length;
  if(!auto&&answered<total){if(!confirm((total-answered)+'문제가 아직 비어 있습니다. 그래도 제출할까요?'))return;}
  stopExamTimer();
  let correct=0;const wrong=[],perSection={};
  examQuestions.forEach((q,i)=>{const sel=examAnswers[i]||null,ans=parseInt(q.answer,10),ok=sel===ans,sn=q.section;if(!perSection[sn])perSection[sn]={total:0,correct:0};perSection[sn].total++;if(ok){correct++;perSection[sn].correct++;}else{wrong.push({qKey:getQKey(q),section:q.section,num:q.num,sel:sel,ans:ans});}});
  const items=examQuestions.map((q,i)=>({qKey:getQKey(q),sel:examAnswers[i]||null}));
  const res={id:Date.now(),date:Date.now(),total:total,correct:correct,timeSec:Math.floor((Date.now()-examStartTs)/1000),sections:examConfig.sections.slice(),perSection:perSection,wrong:wrong,items:items};
  examHistory.unshift(res);if(examHistory.length>30)examHistory=examHistory.slice(0,30);syncToCloud();
  if(total&&correct/total>=0.6)launchConfetti();
  renderExamResult(res);document.getElementById('contentArea').scrollTop=0;
}
function renderExamResult(res){
  const c=document.getElementById('examContainer');const pct=res.total?Math.round(res.correct/res.total*100):0;
  const items=_examItems(res);
  const grade=pct>=80?'🏆 우수':pct>=60?'👍 양호':pct>=40?'💪 분발':'🌱 기초부터';
  let h='<div class="exam-result"><div class="er-hero">'+ringHtml(pct,heatColor(pct),pct+'%',res.correct+'/'+res.total,140);
  h+='<div class="er-score" style="color:'+heatColor(pct)+'">'+res.correct+' / '+res.total+'</div><div class="er-grade">'+grade+'</div>';
  h+='<div class="er-meta"><span>⏱ 소요 <b>'+fmtTime(res.timeSec)+'</b></span><span>✅ 정답 <b>'+res.correct+'</b></span><span>❌ 오답 <b>'+(res.total-res.correct)+'</b></span></div></div>';
  h+='<div class="dash-card"><div class="dc-head"><div class="dc-title">📂 범위별 정답률</div></div><div class="heatmap">';
  Object.keys(res.perSection).forEach(sn=>{const p=res.perSection[sn],sp=Math.round(p.correct/p.total*100);h+='<div class="heat-row" style="cursor:default"><div class="hr-name">'+escapeHtml(sn)+'</div><div class="hr-bar"><i data-fill="'+sp+'%" style="width:0;background:'+heatColor(sp)+'"></i></div><div class="hr-pct">'+p.correct+'/'+p.total+' · '+sp+'%</div></div>';});
  h+='</div></div>';
  if(res.wrong.length){h+='<div class="dash-card"><div class="dc-head"><div class="dc-title">❌ 틀린/안 푼 문제 ('+res.wrong.length+')</div><div class="dc-hint">클릭 → 해설 보기</div></div><div class="memo-list" style="padding:0">';
    res.wrong.forEach(w=>{const selTxt=w.sel?('내 답 '+w.sel+'번'):'미응답';const ri=items.findIndex(it=>it.qKey===w.qKey);h+='<div class="memo-item wrong" onclick="startExamReview('+res.id+','+(ri<0?0:ri)+')"><div class="memo-q">'+escapeHtml(w.section)+' Q'+w.num+'</div><div style="font-size:11.5px;color:var(--wrong);margin-top:3px;font-weight:600">'+selTxt+' → 정답 '+w.ans+'번</div></div>';});
    h+='</div></div>';}
  h+='<button class="exam-start-btn" style="margin-top:16px" onclick="startExamReview('+res.id+',0)">📖 푼 문제 · 해설 전체 다시보기</button>';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">';
  h+='<button class="exam-start-btn" style="flex:1;min-width:140px" onclick="openExamSetup()">🔁 새 모의고사</button>';
  if(res.wrong.some(w=>w.sel))h+='<button class="exam-start-btn" style="flex:1;min-width:140px;background:linear-gradient(135deg,var(--wrong),#d8654d)" onclick="examApplyWrong('+res.id+')">📌 오답을 오답노트에</button>';
  h+='<button class="exam-start-btn" style="flex:1;min-width:140px;background:#fff;color:var(--text2);border:1px solid var(--border2);box-shadow:none" onclick="goHome()">🏠 홈으로</button>';
  h+='</div></div>';
  c.innerHTML=h;animateDash();
}
function examApplyWrong(id){const res=examHistory.find(r=>r.id===id);if(!res)return;if(!confirm('이 모의고사에서 틀린 문제들을 오답노트에 저장할까요? (기존 풀이 기록을 덮어쓸 수 있습니다)'))return;let n=0;res.wrong.forEach(w=>{if(w.sel){answerData[w.qKey]={selected:w.sel,correct:false,timestamp:Date.now()};n++;}});syncToCloud();updateStats();buildBookList();updateMemoCount();renderMemoPanel();updateNavMini();alert(n+'문제를 오답노트에 저장했어요.');}
function deleteExam(id){if(!confirm('이 모의고사 기록을 삭제할까요?'))return;examHistory=examHistory.filter(r=>r.id!==id);syncToCloud();openExamSetup();}
function clearExamHistory(){if(!examHistory.length)return;if(!confirm('모든 모의고사 기록을 삭제할까요?'))return;examHistory=[];syncToCloud();openExamSetup();}
function openExamResult(id){const res=examHistory.find(r=>r.id===id);if(!res)return;_examShow();document.getElementById('headerTitle').textContent='📝 모의고사 결과';renderExamResult(res);document.getElementById('contentArea').scrollTop=0;}

/* ---------- 모의고사 풀이 다시보기 ---------- */
function _examItems(res){return (res.items&&res.items.length)?res.items:((res.wrong||[]).map(w=>({qKey:w.qKey,sel:w.sel})));}
function startExamReview(id,idx){const res=examHistory.find(r=>r.id===id);if(!res)return;_examShow();document.getElementById('headerTitle').textContent='📖 모의고사 다시보기';renderExamReview(res,idx||0);document.getElementById('contentArea').scrollTop=0;}
function renderExamReview(res,idx){
  const items=_examItems(res);const total=items.length;if(!total){openExamResult(res.id);return;}
  if(idx<0)idx=0;if(idx>=total)idx=total-1;
  const it=items[idx];const q=QUESTIONS.find(qq=>getQKey(qq)===it.qKey);
  const c=document.getElementById('examContainer');
  let h='<div class="exam-wrap">';
  h+='<div class="exam-topbar"><button class="et-submit" style="background:#fff;color:var(--text2);border:1px solid var(--border2)" onclick="openExamResult('+res.id+')">← 결과</button><div class="et-prog">다시보기 '+(idx+1)+' / '+total+'</div></div>';
  h+='<div class="exam-omr">';
  items.forEach((iit,i)=>{const qq=QUESTIONS.find(x=>getQKey(x)===iit.qKey);const ok=qq&&iit.sel&&iit.sel===parseInt(qq.answer,10);let st='';if(iit.sel)st=ok?'background:var(--correct-bg);border-color:var(--correct);color:var(--correct)':'background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)';h+='<button class="omr-cell'+(i===idx?' current':'')+'" style="'+st+'" onclick="startExamReview('+res.id+','+i+')">'+(i+1)+'</button>';});
  h+='</div>';
  if(!q){h+='<div class="empty-state"><div class="es-icon">❓</div><p>이 문제 데이터를 찾을 수 없습니다.</p></div></div>';c.innerHTML=h;return;}
  const ans=parseInt(q.answer,10);const ok=it.sel===ans;
  h+='<div class="quiz-meta" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><div class="meta-section">'+escapeHtml(q.section)+'</div><div class="meta-num">원본 Q'+q.num+'</div>';
  h+='<span style="margin-left:auto;padding:3px 11px;border-radius:12px;font-size:11.5px;font-weight:800;'+(it.sel?(ok?'background:var(--correct-bg);color:var(--correct)':'background:var(--wrong-bg);color:var(--wrong)'):'background:var(--mint2);color:var(--text2)')+'">'+(it.sel?(ok?'✅ 정답':'❌ 오답'):'⬜ 미응답')+'</span></div>';
  h+='<div class="quiz-question">'+escapeHtml(q.question);
  if(q.question_images&&q.question_images.length)q.question_images.forEach(img=>{h+='<br><img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});
  h+='</div><div class="quiz-choices">';
  q.choices.forEach((ch,i)=>{const n=i+1;let cls='choice-btn disabled';if(n===ans)cls+=' correct';else if(n===it.sel)cls+=' wrong';else cls+=' dimmed';h+='<button class="'+cls+'"><span class="choice-num">'+n+'</span><span class="choice-text">'+escapeHtml(ch)+'</span></button>';});
  h+='</div>';
  h+='<div style="font-size:12.5px;color:var(--text2);font-weight:700;margin:2px 0 12px">내 답: '+(it.sel?it.sel+'번':'미응답')+' · 정답: '+ans+'번</div>';
  if(q.explanation||q.reference||(q.explanation_images&&q.explanation_images.length)){
    h+='<div class="explanation-box"><h3>📖 해설</h3>';
    if(q.explanation)h+='<div class="expl-text">'+escapeHtml(q.explanation)+'</div>';
    if(q.reference)h+='<div class="expl-ref">📚 '+escapeHtml(q.reference)+'</div>';
    if(q.explanation_images&&q.explanation_images.length){h+='<div class="expl-images">';q.explanation_images.forEach(img=>{h+='<img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});h+='</div>';}
    h+='</div>';
  }else{h+='<div class="explanation-box" style="color:var(--text2);font-size:13px">등록된 해설이 없습니다.</div>';}
  h+='<div class="quiz-nav"><button onclick="startExamReview('+res.id+','+(idx-1)+')"'+(idx===0?' disabled style="opacity:.4"':'')+'>← 이전</button>';
  h+=(idx<total-1)?'<button class="primary" onclick="startExamReview('+res.id+','+(idx+1)+')">다음 →</button>':'<button class="primary" onclick="openExamResult('+res.id+')">결과로 →</button>';
  h+='</div></div>';
  c.innerHTML=h;
}

/* ---------- 메모 이미지 붙여넣기 ---------- */
function handleMemoPaste(e){
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(let i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image')===0){
      const file=items[i].getAsFile();if(!file)continue;
      e.preventDefault();
      try{showSync('syncing','🖼 이미지 처리 중...');}catch(_){}
      compressImage(file,function(dataUrl){pendingMemoImg=dataUrl;renderPendingImg();try{showSync('synced','✅ 이미지 첨부됨');}catch(_){}});
      return;
    }
  }
}
function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      let w=img.width,h=img.height;const maxD=1000;
      if(w>=h&&w>maxD){h=Math.round(h*maxD/w);w=maxD;}else if(h>w&&h>maxD){w=Math.round(w*maxD/h);h=maxD;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      let q=0.72,out;try{out=cv.toDataURL('image/jpeg',q);}catch(err){out=ev.target.result;}
      while(out.length>300000&&q>0.4){q-=0.1;out=cv.toDataURL('image/jpeg',q);}
      cb(out);
    };
    img.onerror=function(){alert('이미지를 읽지 못했습니다.');};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function renderPendingImg(){
  const el=document.getElementById('memoImgPreview');if(!el)return;
  if(pendingMemoImg){el.style.display='';el.innerHTML='<div class="mip-wrap"><img src="'+pendingMemoImg+'"><button class="mip-del" onclick="clearPendingImg()">✕ 이미지 제거</button><span class="mip-tag">📷 첨부됨 — [📝 메모]를 누르면 함께 저장됩니다</span></div>';}
  else{el.style.display='none';el.innerHTML='';}
}
function clearPendingImg(){pendingMemoImg=null;renderPendingImg();}
</script>
