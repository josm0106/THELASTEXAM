function _mergeArrById(a,b){const seen=new Set();const out=[];for(const it of [...(a||[]),...(b||[])]){if(!it||it.id==null)continue;if(seen.has(it.id))continue;seen.add(it.id);out.push(it);}return out;}
function _mergeObjByKey(a,b,timeKey){const out={...(a||{})};for(const k of Object.keys(b||{})){if(!out[k]){out[k]=b[k];}else{const t1=(out[k]&&out[k][timeKey])||0,t2=(b[k]&&b[k][timeKey])||0;if(t2>t1)out[k]={...b[k]};if(timeKey==='lastViewed'&&out[k].count!=null&&b[k].count!=null)out[k].count=Math.max(out[k].count,b[k].count);}}return out;}
/* 같은 키를 양쪽 기기서 답했을 때(개수는 동일) 로컬에 '더 최신' 값이 있으면 true → 클라우드로 다시 올려 전파.
   업로드 후엔 클라우드가 같아져 다음 로드때 false가 되므로 무한 업로드 루프 없음 */
function _hasNewerLocal(cloud,local,timeKey){const c=cloud||{},l=local||{};for(const k of Object.keys(l)){if(c[k]===undefined)continue;if((((l[k]||{})[timeKey])||0)>(((c[k]||{})[timeKey])||0))return true;}return false;}
function _studyLogNewer(cloud,merged){const c=cloud||{},m=merged||{};for(const k of Object.keys(m)){const a=m[k]||{},b=c[k]||{};if((a.solved||0)>(b.solved||0)||(a.correct||0)>(b.correct||0))return true;}return false;}
/* ===== 🖼️ 이미지(내 해설/메모 사진) 별도 저장 =====
   Firestore 문서 1개는 1MB 한도라, 이미지를 메인 문서에 넣으면 몇 장만 쌓여도 저장이 통째로 실패함.
   → 이미지는 users/{uid}/blobs/{id} 서브컬렉션에 '항목당 1문서'로 저장(각 ~300KB<1MB), 메인 문서엔 _img 플래그만. */
const _uploadedBlobs=new Set();/* 이미 클라우드에 올라간 blob id (재업로드 방지). 로드 시 채워짐 */
function _blobId(type,id){return type+'_'+id;}
/* id로 union 병합하되 로컬의 실제 이미지(img)는 보존. 클라우드 항목은 _img 플래그만 있고 img는 blob에서 따로 가져옴 */
function _mergeItemsKeepImg(cloudArr,localArr){
  const out={};const t=x=>((x&&(x.edited||x.created))||0);
  (cloudArr||[]).forEach(it=>{if(it&&it.id!=null)out[it.id]={...it};});
  (localArr||[]).forEach(it=>{if(!it||it.id==null)return;const cur=out[it.id];
    if(!cur){out[it.id]={...it};return;}
    let base=t(it)>=t(cur)?{...cur,...it}:{...it,...cur};/* 더 최신 메타데이터 우선 */
    if(it.img)base.img=it.img;else if(cur.img)base.img=cur.img;/* 실제 이미지 보존 */
    out[it.id]=base;});
  return Object.values(out);
}
/* 메인 문서에 쓸 경량 버전 — img(base64) 제거하고 _img:1 플래그만 남김 */
function _lightItems(arr){return (arr||[]).map(it=>{const o={...it};if(o.img){delete o.img;o._img=1;}else{delete o.img;delete o._img;}return o;});}
/* 로컬에 이미지가 있는 항목을 blob으로 업로드(아직 클라우드에 없는 것만). 전부 성공하면 true */
async function _uploadBlobs(){
  if(!currentUser)return false;
  const col=db.collection('users').doc(currentUser.uid).collection('blobs');
  const list=[];
  (userExpl||[]).forEach(e=>{if(e&&e.img)list.push([_blobId('e',e.id),e.img]);});
  (memoNotes||[]).forEach(m=>{if(m&&m.img)list.push([_blobId('m',m.id),m.img]);});
  let ok=true;
  for(const [bid,img] of list){
    if(_uploadedBlobs.has(bid))continue;
    if(typeof img!=='string'||img.length>1040000){console.warn('[blob] 이미지가 너무 커서 클라우드 저장 불가',bid,img&&img.length);ok=false;continue;}
    try{await col.doc(bid).set({img});_uploadedBlobs.add(bid);}
    catch(e){console.error('[blob] 업로드 실패',bid,e.code||e.message);ok=false;}
  }
  return ok;
}
/* _img 플래그가 있는데 메모리에 img가 없는 항목(다른 기기가 올린 것·새 기기)의 이미지를 blob에서 가져와 붙임 */
async function _fetchBlobs(){
  if(!currentUser)return;
  const col=db.collection('users').doc(currentUser.uid).collection('blobs');
  const need=[];
  (userExpl||[]).forEach(e=>{if(e&&e._img&&!e.img)need.push(['e',e]);});
  (memoNotes||[]).forEach(m=>{if(m&&m._img&&!m.img)need.push(['m',m]);});
  await Promise.all(need.map(async ([type,it])=>{
    const bid=_blobId(type,it.id);
    try{const d=await col.doc(bid).get();if(d.exists&&d.data()&&d.data().img){it.img=d.data().img;_uploadedBlobs.add(bid);}}catch(e){}
  }));
}
async function loadFromFirestore(){

      const data=d.data();
      /* 🔒 초기화 토큰이 클라우드에 이미 기록돼 있으면(=계정 단위로 1회 초기화 완료) 이 기기에서도 재초기화 금지 */
      if(data.jm_resetToken===RESET_TOKEN){try{localStorage.setItem(PREFIX+'_resetToken',RESET_TOKEN);}catch(e){}}
      const cw=data.jm_wrongNotes||[],cm=data.jm_memoNotes||[],cv=data.jm_viewData||{},ca=data.jm_answerData||{},cr=data.jm_repeatMarks||{};

        /* 개수는 같지만 로컬이 더 최신인 경우(같은 문제 재답/수정)도 전파 */
        ||_hasNewerLocal(ca,answerData,'timestamp')||_hasNewerLocal(cv,viewData,'lastViewed')||_hasNewerLocal(cr,repeatMarks,'ts')||_studyLogNewer(csl,msl);
      wrongNotes=mw;memoNotes=mm;viewData=mv;answerData=ma;repeatMarks=mr;mnemonics=mmn;studyLog=msl;examHistory=meh;dailyGoal=mdg;userExpl=mue;examUsed=meu;
      _saveLocal();/* 머지 결과는 항상 로컬에 영속화 — 순수 pull(다른 기기 기록만 받은 경우)도 저장돼 새로고침 후에도 유지 */
      await _fetchBlobs();/* 다른 기기가 올린 이미지(_img 플래그) 가져와 붙임 */_saveLocal();
      if(upload){await saveToFirestore();showSync('synced','✅ 머지 완료');return;}
    }else{
      if(wrongNotes.length||memoNotes.length||Object.keys(viewData).length||Object.keys(answerData).length||Object.keys(repeatMarks).length||mnemonics.length||examHistory.length||Object.keys(studyLog).length||userExpl.length){await saveToFirestore();showSync('synced','✅ 데이터 이전 완료');return;}
    }
    setLastSync(Date.now());showSync('synced','✅ 동기화 완료');
  }catch(e){console.error('[Firestore] 로드 실패:',e);showSync('error','❌ 동기화 실패');}
}
function _saveLocal(){
  localStorage.setItem(PREFIX+'_wrong',JSON.stringify(wrongNotes));
  localStorage.setItem(PREFIX+'_memos',JSON.stringify(memoNotes));
  localStorage.setItem(PREFIX+'_views',JSON.stringify(viewData));
  localStorage.setItem(PREFIX+'_answers',JSON.stringify(answerData));
  localStorage.setItem(PREFIX+'_repeat',JSON.stringify(repeatMarks));
  localStorage.setItem(PREFIX+'_mnem',JSON.stringify(mnemonics));
  localStorage.setItem(PREFIX+'_uexpl',JSON.stringify(userExpl));
  localStorage.setItem(PREFIX+'_studylog',JSON.stringify(studyLog));
  localStorage.setItem(PREFIX+'_examhist',JSON.stringify(examHistory));
  localStorage.setItem(PREFIX+'_dailygoal',String(dailyGoal));
  localStorage.setItem(PREFIX+'_examused',JSON.stringify(examUsed));
}
function syncToCloud(){_saveLocal();pendingSync=true;if(!firestoreReady||!currentUser)return;clearTimeout(syncDebounceTimer);syncDebounceTimer=setTimeout(()=>saveToFirestore(0),1500);}
/* 디바운스(1.5s)를 기다리지 않고 즉시 클라우드로 밀어냄 — 화면 숨김/탭 종료 직전에 호출. 바뀐 게 없으면 no-op */
function flushSync(){if(firestoreReady&&currentUser&&pendingSync){clearTimeout(syncDebounceTimer);saveToFirestore(0);}}
async function saveToFirestore(retryCount){
  if(retryCount==null)retryCount=0;if(!currentUser)return false;
  if(syncInFlight){pendingSync=true;return false;}/* 동시 쓰기는 1건으로 직렬화(flush·디바운스·머지업로드 경합/3중 set() 방지) */
  syncInFlight=true;pendingSync=false;let ok=false;
  try{
    const ref=db.collection('users').doc(currentUser.uid);
    /* 🛡️ 클로버(덮어쓰기) 방지: set({...},{merge:true})는 jm_ 필드를 '통째로' 교체하므로,
       쓰기 직전 클라우드 현재값을 읽어 union 머지한 뒤 써야 다른 기기의 더 최신 기록을 절대 안 지운다. */
    try{
      const cd=await ref.get();
      if(cd.exists){const c=cd.data()||{};
        wrongNotes=_mergeArrById(c.jm_wrongNotes,wrongNotes);
        memoNotes=_mergeItemsKeepImg(c.jm_memoNotes,memoNotes);
        mnemonics=_mergeArrById(c.jm_mnemonics,mnemonics);
        examHistory=_mergeArrById(c.jm_examHistory,examHistory);
        userExpl=_mergeItemsKeepImg(c.jm_userExpl,userExpl);
        viewData=_mergeObjByKey(c.jm_viewData,viewData,'lastViewed');
        answerData=_mergeObjByKey(c.jm_answerData,answerData,'timestamp');
        repeatMarks=_mergeObjByKey(c.jm_repeatMarks,repeatMarks,'ts');
        studyLog=_mergeStudyLog(c.jm_studyLog,studyLog);
        examUsed={...(c.jm_examUsed||{}),...examUsed};
        if(typeof c.jm_dailyGoal==='number'&&c.jm_dailyGoal>0&&dailyGoal===20)dailyGoal=c.jm_dailyGoal;
        if(c.jm_resetToken===RESET_TOKEN){try{localStorage.setItem(PREFIX+'_resetToken',RESET_TOKEN);}catch(e){}}
        _saveLocal();
      }
    }catch(preErr){/* 오프라인 등 사전 읽기 실패 → 로컬 그대로 큐잉(다음 온라인때 정상화) */}
    /* 🖼️ 이미지는 blob 서브컬렉션으로 따로 업로드 → 메인 문서엔 경량(_img 플래그)만 기록해 1MB 한도 회피 */
    await _uploadBlobs();
    const rt=localStorage.getItem(PREFIX+'_resetToken');/* 토큰을 클라우드에도 기록해 다른 기기의 재초기화 방지 */
    await ref.set({jm_wrongNotes:wrongNotes,jm_memoNotes:_lightItems(memoNotes),jm_viewData:viewData,jm_answerData:answerData,jm_repeatMarks:repeatMarks,jm_mnemonics:mnemonics,jm_studyLog:studyLog,jm_examHistory:examHistory,jm_dailyGoal:dailyGoal,jm_userExpl:_lightItems(userExpl),jm_examUsed:examUsed,...(rt?{jm_resetToken:rt}:{}),jm_lastUpdated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    setLastSync(Date.now());ok=true;
  }catch(e){console.error('[Firestore] 저장 실패('+retryCount+'):',e);showSync('error','❌ 저장 실패');pendingSync=true;if(retryCount<3){setTimeout(()=>saveToFirestore(retryCount+1),2000*(retryCount+1));}}
  finally{syncInFlight=false;}
  return ok;
}
/* 🗑️ 1회성 전체 기록 초기화 — 토큰이 일치하면 건너뜀. 클라우드를 비운 뒤에만 토큰 기록(미완료 시 다음 로드때 재시도) */
const RESET_TOKEN='reset-20260602';
async function maybeResetAll(){
  try{
    if(localStorage.getItem(PREFIX+'_resetToken')===RESET_TOKEN)return;
    /* 🛟 이미 기록(클라우드 머지 포함)이 있으면 = 1회 초기화는 과거에 끝났고 이후 쌓인 데이터 → 절대 지우지 않고
       토큰만 남겨(로컬+클라우드) 재초기화를 영구 차단. 새 기기/스토리지 비운 기기가 폰 기록을 지우는 사고를 막음 */
    const hasData=Object.keys(answerData).length||wrongNotes.length||memoNotes.length||mnemonics.length||userExpl.length||examHistory.length||Object.keys(repeatMarks).length||Object.keys(studyLog).length||Object.keys(viewData).length;
    if(hasData){try{localStorage.setItem(PREFIX+'_resetToken',RESET_TOKEN);}catch(e){}if(currentUser){try{await saveToFirestore();}catch(e){}}return;}
    wrongNotes=[];memoNotes=[];viewData={};answerData={};repeatMarks={};mnemonics=[];studyLog={};examHistory=[];userExpl=[];dailyGoal=20;examUsed={};
    _saveLocal();
    if(currentUser){
      try{await saveToFirestore();localStorage.setItem(PREFIX+'_resetToken',RESET_TOKEN);showSync('synced','🗑️ 전체 기록 초기화 완료');}
      catch(e){console.warn('[reset] 클라우드 초기화 실패 — 다음 로드때 재시도',e);}
    }
  }catch(e){console.warn('[reset] 실패',e);}
}
/* 🔄 현재 보고 있는 화면을 클라우드 머지 결과로 다시 그림(비파괴적).
   다른 기기에서 푼 문제·메모·오답이 '지금 화면'에 즉시 반영되게 함.
   입력/편집/시험 중에는 메인 콘텐츠를 건드리지 않아 작업 유실을 막음. */
function refreshCurrentView(){
  const memoEl=document.getElementById('memoNoteInput'),explEl=document.getElementById('uexplInput');
  const typing=(memoEl&&memoEl.value.trim())||(explEl&&explEl.value.trim());
  /* 사이드바·카운트·동기화시각은 항상 안전하게 갱신 */
  updateStats();buildBookList();updateMemoCount();updateNavMini();updateLastSyncTxt();
  /* 메모/오답/반복 패널이 열려 있으면 목록 갱신(목록엔 입력칸 없음 → 안전) */
  const mp=document.getElementById('memoPanel');if(mp&&mp.classList.contains('open'))renderMemoPanel();
  if(explEditOpen||editingExplId)return;          /* 내 해설 편집 중 → 메인 보존 */
  if(typing)return;                                /* 메모/해설 입력 중 → 메인 보존 */
  switch(viewMode){
    case 'welcome':renderDashboard();break;
    case 'grid':if(currentSectionIdx>=0)renderGrid(currentSectionIdx);break;   /* 그리드 셀 풀이상태 갱신 */
    case 'topicselect':renderTopicSelect();break;                              /* 주제 카드 통계 갱신 */
    case 'topiclist':if(currentTopicGenre)renderTopicList(currentTopicGenre);break;
    case 'quiz':if(currentQ)renderQuiz();break;    /* 기답/미답 모두 — renderQuiz가 답 유무로 알아서 분기 */
    /* exam·flash 는 진행 중 보호: 재렌더 안 함 */
  }
}
/* 💾 수동 '저장 & 동기화' — 스로틀/디바운스를 무시하고 즉시 업로드 후 즉시 당겨 양방향 동기화.
   공부 끝에 한 번 눌러 '확실히 저장 + 다른 기기 반영'을 보장하는 안전장치. */
async function manualSync(){
  if(!currentUser){showSync('error','로그인이 필요합니다');return;}
  if(navigator.onLine===false){showSync('error','❌ 오프라인 — 인터넷 연결 확인');return;}
  const btns=[document.getElementById('manualSyncBtn'),document.getElementById('syncFab')];btns.forEach(b=>{if(b)b.disabled=true;});
  showSync('syncing','☁️ 저장 & 동기화 중...');
  try{
    _saveLocal();                                  /* 메모리 → 로컬 보장 */
    clearTimeout(syncDebounceTimer);
    /* ① 업로드 강제 — 진행 중이면 잠깐 대기 후 재시도(최대 ~0.7초). 실제 성공여부를 saveOk로 받음 */
    let saveOk=null;
    for(let i=0;i<4;i++){if(!syncInFlight){saveOk=await saveToFirestore(0);break;}await new Promise(r=>setTimeout(r,180));}
    /* ② 다운로드 강제 — 15초 스로틀/조기반환 우회하고 직접 머지 */
    lastPullAt=0;
    await loadFromFirestore();
    /* ③ 현재 화면 다시 그림 */
    refreshCurrentView();
    setLastSync(Date.now());
    if(saveOk===false)showSync('error','❌ 일부 저장 실패 — 이미지가 너무 크거나 네트워크 문제. 다시 시도해 주세요');
    else showSync('synced','✅ 저장 & 동기화 완료');
  }catch(e){console.error('[manualSync] 실패',e);showSync('error','❌ 동기화 실패 — 잠시 후 다시');}
  finally{btns.forEach(b=>{if(b)b.disabled=false;});}
}
/* 📲 클라우드 당겨오기(비파괴적) — 다른 기기(아이패드·폰)의 새 기록을 이미 열린 탭에도 반영.
   안전가드 모두 통과할 때만 머지하며, 막힌 상태(보류 업로드/시작 실패)는 스스로 복구 */
function pullFromCloud(){
  if(!currentUser||navigator.onLine===false)return;
  if(!firestoreReady){loadFromFirestore().then(()=>{firestoreReady=true;}).catch(()=>{});return;}/* 시작 시 로드 실패한 탭 자가복구 */
  if(syncInFlight)return;
  if(pendingSync){flushSync();return;}            /* 보류된 로컬 변경을 먼저 업로드 → 다음 주기에 당김(머지 부활 방지) */
  if(explEditOpen||editingExplId)return;          /* 내 해설 편집기 열려있으면 보류 */
  if(Date.now()-lastPullAt<15000)return;          /* 15초 스로틀 */
  lastPullAt=Date.now();
  loadFromFirestore().then(()=>{refreshCurrentView();}).catch(()=>{});  /* 현재 보고 있는 화면까지 갱신 */
}
/* 📲 화면 전환 핸들러
   ① 숨김(잠금/앱전환/탭종료) 직전 → 디바운스 기다리지 말고 즉시 클라우드 저장(모바일 기록 유실 방지)
   ② 다시 보일 때 → 클라우드 당김 */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){flushSync();return;}
  pullFromCloud();
});
/* ⏱️ 항상 화면에 보이는 탭(멀티 모니터 PC 등)은 visibilitychange가 안 일어나므로 60초마다 주기적으로 당김 */
setInterval(()=>{if(document.visibilityState==='visible')pullFromCloud();},60000);
window.addEventListener('pagehide',flushSync);    /* bfcache 친화적, beforeunload보다 모바일서 신뢰성 높음 */
</script>

  {num:1,section:"유니온 1권",chapter:"총론",question:"관절연골에서 정상적인 노화 과정 시 발생하는 신체 내 대사의 변화 중 옳은 것은?",choices:["연골세포 증가", "교원질 감소", "수분함량 감소", "단백 다당 감소", "대사 증가"],answer:3,explanation:"",question_images:["images/유니온_1권_q001.jpg"],explanation_images:["images/유니온_1권_e001.jpg"]},
  {num:2,section:"유니온 1권",chapter:"총론",question:"손 세정제 사용 시 그람양성균, 그람음성균, 결핵균, 진균, 바이러스에 효과적이며 효 과 시간이 가장 빠른 것은?",choices:["alcohols", "chlorohexidine", "chloroxylenol", "iodophor", "triclosan"],answer:1,explanation:"",question_images:["images/유니온_1권_q002.jpg"],explanation_images:["images/유니온_1권_e002.jpg"]},
  {num:3,section:"유니온 1권",chapter:"총론",question:"20세 남자 무릎의 종창을 주소로 내원하였다. 평소에도 멍이 잘 들었으며 내원하여 시행한 방사선 사진상 연부조직의 종창과 대퇴 과간 절흔이 넓어져 있었다. 질환은?",choices:["류마티스 관절염", "골화석증", "통풍", "색소 융모 결절성 활막염", "혈우병성 관절증"],answer:5,explanation:"",question_images:["images/유니온_1권_q003.jpg"],explanation_images:["images/유니온_1권_e003.jpg"]},
  {num:4,section:"유니온 1권",chapter:"총론",question:"칼슘과 비타민 D는 골다공증의 예방과 치료에서 반드시 병합 처방해야 하는 약제이 다. 대한 골대사학회에서 권장하는 50세 이상의 성인의 하루 비타민 D 복용 용량은?",choices:["10 IU", "100 IU", "800 IU", "1500 IU", "10000 IU"],answer:3,explanation:"",question_images:["images/유니온_1권_q004.jpg"],explanation_images:["images/유니온_1권_e004.jpg"]},
  {num:5,section:"유니온 1권",chapter:"총론",question:"류마티스 환자에서 수술을 준비할 때 감염의 위험성이 있어서 수술 전 중단을 고려 해야 하는 약물은?",choices:["Etanercept", "Sulfasalazine", "Methotrexate", "NSAID", "Hydroxyquinolone"],answer:1,explanation:"",question_images:["images/유니온_1권_q005.jpg"],explanation_images:["images/유니온_1권_e005.jpg"]},
  {num:6,section:"유니온 1권",chapter:"총론",question:"67세 남자가 경골의 개방성 골절로 수술 후 유합을 얻었다. 하지만 지속적인 배농 및 만성 골수염으로 curettage and debridement, anti-cement insertion 이후 tissue c니tore에서 MRSA가 동정 되었다. 퇴원 시 oral로 처방할 항생제로 적당한 것은?",choices:["Amoxicilin", "Cefotaxime", "Quinolone", "Metronidaz이e", "Rifampin"],answer:3,explanation:"",question_images:["images/유니온_1권_q006.jpg"],explanation_images:["images/유니온_1권_e006.jpg"]},
  {num:7,section:"유니온 1권",chapter:"총론",question:"정맥 혈전 색전증으로 치료받은 병력이 있는 기세 여성이 비스포스포네이트를 5년 복용하던 중 개인 치과 의원에서 발치 후 턱뼈 골괴사가 발생하여 병원에 내원하였 다. 하악골 괴사 치료 후 골다공증 치료를 계속하려고 할 때 적절한 골다공증 치료제 는?",choices:["Calcitonin", "Denosumab", "Ibandronate", "Parathyroid hormone", "Raloxifen"],answer:4,explanation:"",question_images:["images/유니온_1권_q007.jpg"],explanation_images:["images/유니온_1권_e007.jpg"]},
  {num:8,section:"유니온 1권",chapter:"총론",question:"32세 여자 환자가 경골 간부 골절로 골수강내 금속정 수술을 시행 받았다. 수술 후 모든 생체 징후는 정상이며 감염 징후는 없었다. 9개월 뒤 추시한 방사선 사진에서 atrophic non-union 소견이 관찰되어 골이식을 시행하였다. 감염 징후는 관찰되지 않았으나, 수술 중 시행한 균 배양 검사에서 총 3군데에서 MSSA가 동정되었다. 시 행할 조치는?",choices:["변연절제술", "Saucerization", "Nail removal", "정맥 항생제 주입", "항생제 시멘트 삽입"],answer:4,explanation:"",question_images:["images/유니온_1권_q008.jpg"],explanation_images:["images/유니온_1권_e008.jpg"]},
  {num:9,section:"유니온 1권",chapter:"소아",question:"선천성 근성 사경이 있는 2세 환자에 대하여 bipolar release을 시행하였다. 수술 후 환측 견관절 위약감 및 90도 이상의 능동 외전에 제한이 생겼다. 다음 중 손상 가능 성이 높은 신경은?",choices:["근피신경", "액와신경", "상견갑신경", "장흉신경", "척추부신경"],answer:5,explanation:"",question_images:["images/유니온_1권_q009.jpg"],explanation_images:["images/유니온_1권_e009.jpg"]},
  {num:10,section:"유니온 1권",chapter:"소아",question:"선천성 경골 및 비골 가관절증 있는 환자에서 원위 경비골 유합술을 통해 경골의 골 유합을 얻었으나 비골은 유합되지 않아 가관절증이 남았다. 향후 발생할 수 있는 흔 한 합병증은?",choices:["거골두 아탈구", "외반슬", "전족부 회내전", "족관절 외반", "하지부동"],answer:4,explanation:"",question_images:["images/유니온_1권_q010.jpg"],explanation_images:["images/유니온_1권_e010.jpg"]},
  {num:11,section:"유니온 1권",chapter:"소아",question:"생후 2개월 환아가 발달성 고관절 이형성증으로 진단 받아 파블릭 보장구 치료를 시 작하였다. 고관절을 내전하여 무릎을 맞닿으려고 했을 때 양쪽 무릎이 붙었다. 보조 기를 어떻게 조절해야 하는가?",choices:["anteromedial strap을 길게", "anteromedial strap을 짧게", "posterolateral strap을 길게", "posterolateral strap을 짧게", "shoulder strap을 짧게"],answer:4,explanation:"",question_images:["images/유니온_1권_q011.jpg"],explanation_images:["images/유니온_1권_e011.jpg"]},
  {num:12,section:"유니온 1권",chapter:"소아",question:"Clubfoot에서 ponseti method로 교정할 때 직접적인 조작에 의한 변형이 아닌 골 배열 회복 시 이로 인해 간접적으로 자연적 교정이 되는 변형은?",choices:["Ankle equinus", "Heel varus", "Forefoot adduction", "Cavus", "Pronation"],answer:2,explanation:"",question_images:["images/유니온_1권_q012.jpg"],explanation_images:["images/유니온_1권_e012.jpg"]},
  {num:13,section:"유니온 1권",chapter:"소아",question:"유전성 저 신장 질환 중 관절염에 대한 위험성이 없어 신연 골 연장술이 적합한 질환 은?",choices:["Pseudoachondroplasia", "Multiple epiphyseal dysplasia", "Spondyloepiphyseal dysplasia", "Achondroplasia", "Progressive pseudorheumatoid dysplasia"],answer:4,explanation:"",question_images:["images/유니온_1권_q013.jpg"],explanation_images:["images/유니온_1권_e013.jpg"]},
  {num:14,section:"유니온 1권",chapter:"소아",question:"내반슬을 보이는 16개월 환아가 생후 6개월까지 모유를 복용하였고, 6개월부터는 분유와 모유수유를 같이 하고, 생후 14개월부터 이유식을 시작하였다. 혈액검사 상 Ca 9.1mg/dL, P 3.0mg/dL, ALP 110U/L 였다. 이 환자의 진단으로 가장 가능성이 높은 것은?",choices:["저인산 혈증병", "비타민 D 결핍성 구루병", "생리적 내반슬", "Fibrous dysplasia", "Metaphyseal chondrodysplasia"],answer:3,explanation:"",question_images:["images/유니온_1권_q014.jpg"],explanation_images:["images/유니온_1권_e014.jpg"]},
  {num:15,section:"유니온 1권",chapter:"소아",question:"첨족 보행을 주소로 내원한 환아로, 슬관절에 굴곡 구축이 없다. 이 환아가 입각기에 서 보일 수 있는 보행 양상은?",choices:["Back-knee gait", "Steppage gait", "Trendelengurg gait", "Stiff-knee gait", "Crouch gait"],answer:1,explanation:"",question_images:["images/유니온_1권_q015.jpg"],explanation_images:["images/유니온_1권_e015.jpg"]},
  {num:16,section:"유니온 1권",chapter:"소아",question:"경직성 뇌성마비를 앓는 5세 환아는 독립적으로 앉거나 서지 못한다. 비구지수는 15/15, 대퇴경간각은 150/150, 골두 외측이동은 5%/5% 이다. 고관절에 대하여 적 절한 치료는?",choices:["방사선 사진 추적", "관혈적 정복", "대퇴 내반 절골술", "Dega osteotomy", "대퇴 내반 절골술 + Dega osteotomy"],answer:1,explanation:"",question_images:["images/유니온_1권_q016.jpg"],explanation_images:["images/유니온_1권_e016.jpg"]},
  {num:17,section:"유니온 1권",chapter:"소아",question:"특발성 대퇴골두 무혈성 괴사 환자에서 보존적 치료보다 수술적 치료가 더 좋은 결 과를 가져올 역연령 및 Herring 분류는 어떻게 되는가?",choices:["6세, A", "6세, B, B/C", "6세, C", "8세, A", "8세, B, B/C"],answer:5,explanation:"",question_images:["images/유니온_1권_q017.jpg"],explanation_images:["images/유니온_1권_e017.jpg"]},
  {num:18,section:"유니온 1권",chapter:"소아",question:"내원 하루 전 발생한 40도의 전위각을 보이는 대퇴골두 골단분리증이 있는 13세 여 아에게 경피적 원위치 핀 삽입술을 시행하였다. 나사는 골단판 중앙, 수직으로 고정 되었으며 나사산 5개가 성장판을 관통하고 있었다. 이후 발생 가능성이 가장 높은 합 병증은?",choices:["대퇴골두 연골 용해증", "대퇴골두 무혈성 괴사", "관절내 유리체 발생", "하지부동", "대퇴골두 충돌 증후군"],answer:4,explanation:"",question_images:["images/유니온_1권_q018.jpg"],explanation_images:["images/유니온_1권_e018.jpg"]},
  {num:19,section:"유니온 1권",chapter:"소아",question:"12세 여아가 하지 외반증을 주소로 내원하였다. 방사선 촬영에서 해부학적 외측 원 위 대퇴각(LDFA)은 75도, 해부학적 내측 근위 경골각(MPTA)은 95 도, joint line convergency angle은 3도였다. 이 환자에게 성장판 유합술을 시행할 위치는?",choices:["근위 경골 내측", "근위 경골 외측", "원위 대퇴골 내측", "원위 대퇴골 외측", "근위 경골 내측 + 원위 대퇴골 내측"],answer:5,explanation:"",question_images:["images/유니온_1권_q019.jpg"],explanation_images:["images/유니온_1권_e019.jpg"]},
  {num:20,section:"유니온 1권",chapter:"소아",question:"5세 환아가 내족지 보행을 주소로 내원하였다. 고관절 내회전은 80/80, 외회전은 10/10, 대퇴-족부각은 +10/+10, 발뒤꿈치 이분선이 제 2-3족지 사이를 통과하였다. 가장 적절한 치료는?",choices:["경과관찰", "Denis brown brace", "외회전 보조기", "원위 경골 외회전 절골술", "대퇴골 감염 절골술"],answer:1,explanation:"",question_images:["images/유니온_1권_q020.jpg"],explanation_images:["images/유니온_1권_e020.jpg"]},
  {num:21,section:"유니온 1권",chapter:"소아",question:"15세 환아가 대퇴골 연장술을 시행하였다. 근위 및 원위 골편에 각각 4개의 핀을 삽 입하여 외고정기를 장착하였으며 골간부에서 절골을 시행하였다. 수술 5일째에 슬 관절 관절운동 및 부분적 체중 부하를 시작하였으며 수술 7일째에 하루에 1mm, 4번 에 나눠서 신연을 시행하였다. 수술 6주째에 시행한 단순방사선 사진상 절골부의 골 형성 부족이 관찰되었다. 가장 의심되는 원인은?",choices:["근위, 원위부에 4개의 핀 삽입", "하루에 1mm 신연", "하루에 4번 신연", "골간부에서 절골", "수술 7일째 신연 시작"],answer:4,explanation:"",question_images:["images/유니온_1권_q021.jpg"],explanation_images:["images/유니온_1권_e021.jpg"]},
  {num:22,section:"유니온 1권",chapter:"소아",question:"10세 환아로 5개월 전 우측 근위 경골의 S-H type 2의 골절로 수술받았던 기왕력이 있다. 1년 뒤 방사선 추시에서 내반 변형 10도, 변연부 골극이 관절면의 25% 침범하 였을 때 해야 하는 치료는?",choices:["경과관찰", "골교절제술", "교정절골술", "골교절제술+교정절골술", "epiphysiodesis"],answer:2,explanation:"",question_images:["images/유니온_1권_q022.jpg"],explanation_images:["images/유니온_1권_e022.jpg"]},
  {num:23,section:"유니온 1권",chapter:"소아",question:"9세 환아가 과상부 완전 전위골절로 관혈적 정복술 및 핀고정술을 시행 받았다. 이 후 6주간 장상지 석고 고정을 시행하였다. 석고 고정을 제거한 뒤 관절구축 방지를 위해 수동적 관절운동을 시행하였다. 3개월 뒤 추시관찰에서 굴곡 35도, 신전 80도 로 구축이 남아있었으며 방사선 검사상 myositis ossifcans가 관찰되었다. Myositis ossificans와 연관이 있는 것은?",choices:["9세 환아", "완전 전위 과상부골절", "관혈적 정복", "6주간 석고고정", "수동적 관절운동"],answer:3,explanation:"",question_images:["images/유니온_1권_q023.jpg"],explanation_images:["images/유니온_1권_e023.jpg"]},
  {num:24,section:"유니온 1권",chapter:"소아",question:"2세 환아가 금일 넘어진 뒤 발생한 주관절 변형을 주소로 내원하였다. 내원하여 시 행한 방사선 검사상 탈구, 골절 소견은 관찰되지 않았다. Radiocapiteallar line 정렬 은 정상이였다. Ulnohumeral line은 후내측으로 전위된 소견을 보이고 있다. 이때 석고 고정으로만 치료하였을 경우 문제가 될 수 있는 것은?",choices:["내반주변형", "외반주변형", "성장판 조기 닫힘", "불유합", "관절운동장애"],answer:1,explanation:"",question_images:["images/유니온_1권_q024.jpg"],explanation_images:["images/유니온_1권_e024.jpg"]},
  {num:25,section:"유니온 1권",chapter:"소아",question:"8세 여아가 6개월 전 척골 골절로 보존적 치료를 시행하였다. 주관절의 통증과 굴곡 구축이 있었고, 방사선학적 검사상 요골의 전방 탈구와 척골의 부정유합이 확인되었 다. 치료를 위해 반드시 해야 할 것은?",choices:["관혈적 요골두 정복술", "소두 요골두 핀고정", "윤상인대 재건술", "요골두 절제술", "척골 교정 절골술"],answer:5,explanation:"",question_images:["images/유니온_1권_q025.jpg"],explanation_images:["images/유니온_1권_e025.jpg"]},
  {num:26,section:"유니온 1권",chapter:"소아",question:"8세 남아에게 발생한 비전위성 경골 근위 골간단 골절에 대해 단순 석고 고정을 시 행하였다. 이 경우 가장 흔히 발생할 수 있는 경골 변형의 맞는 조합은?",choices:["외반 및 단축", "외반 및 과성장", "외반 및 외회전", "내반 및 단축", "내반 및 과성장"],answer:2,explanation:"",question_images:["images/유니온_1권_q026.jpg"],explanation_images:["images/유니온_1권_e026.jpg"]},
  {num:27,section:"유니온 1권",chapter:"소아",question:"아동학대에 의해 발생할 가능성이 높은 골절은?",choices:["경골 근위 모서리 골절", "쇄골 골절", "척추체 골절", "두개골 선상골절", "상완골 원위 골단 골절"],answer:1,explanation:"",question_images:["images/유니온_1권_q027.jpg"],explanation_images:["images/유니온_1권_e027.jpg"]},
  {num:28,section:"유니온 1권",chapter:"척추",question:"경골 근위 간부 다음 중 성인 추간판의 영양공급을 담당하는 것은?",choices:["동맥혈관", "모세혈관", "림프관", "세포외액 확산", "정맥혈관"],answer:4,explanation:"",question_images:["images/유니온_1권_q028.jpg"],explanation_images:["images/유니온_1권_e028.jpg"]},
  {num:29,section:"유니온 1권",chapter:"척추",question:"75세의 척추 변형 환자가 있다. 수술 전 계획을 위해 cobb’s angle을 재려고 한다면 가장 먼저 측정해야 할 것은?",choices:["stable vertebra", "end vertebra", "apical vertebra", "C7 plumb line", "central sacral vertebral line"],answer:2,explanation:"",question_images:["images/유니온_1권_q029.jpg"],explanation_images:["images/유니온_1권_e029.jpg"]},
  {num:30,section:"유니온 1권",chapter:"척추",question:"성인의 요추 전만 형성에 가장 기여가 큰 것은 어느 분절인가?",choices:["제 1요추 - 제 2요추간", "제 2요추-제 3요추간", "제 3요추-제 4요추간", "제 4요추-제 5요추간", "제 5요추- 제 1천추간"],answer:5,explanation:"",question_images:["images/유니온_1권_q030.jpg"],explanation_images:["images/유니온_1권_e030.jpg"]},
  {num:31,section:"유니온 1권",chapter:"척추",question:"75세 여자 환자가 허리 통증을 주소로 내원하였다. 내리막길을 내려가기 어렵고, 몸 앞쪽에서 무거운 물건을 잘 들지 못하며, 설거지 할 때나 세수 할 때 몸이 앞으로 굽 어지며 팔꿈치를 세면대나 싱크대에 기댄다. 이 환자의 방사선 사진에서 관련있는 방사선 지표는?",choices:["C7 sagittal vertical axis", "C lordosis", "L lordosis", "Pelvic incidence", "T kyphosis"],answer:1,explanation:"",question_images:["images/유니온_1권_q031.jpg"],explanation_images:["images/유니온_1권_e031.jpg"]},
  {num:32,section:"유니온 1권",chapter:"척추",question:"56세 남자가 운전 도중 교통사고를 당하였다. 현재 신경학적 증상은 없습니다. 제 5 경추의 상부 종판에는 tear drop signO| 관찰되며, 제 4-5경추의 양측 후관절 탈구 가 있다. 경추 골절 정복 후 신경 손상 가능성으로 수술 전 확인해야 하는 것은?",choices:["Artic니ar process fracture", "Spinous process fracture", "Interspinous ligament injury", "Traumatic HNP", "Facet capsule"],answer:4,explanation:"",question_images:["images/유니온_1권_q032.jpg"],explanation_images:["images/유니온_1권_e032.jpg"]},
  {num:33,section:"유니온 1권",chapter:"척추",question:"골다공증이 있는 80세 여환에서 제 1,2,3요추에 골다공증성 압박 골절 소견 있어 추 체 성형술을 시행하였다. 수술 후 호흡곤란 증세를 보이면서 저혈압 및 저산소증을 보였다. 시멘트와 관련된 합병증의 원인은?",choices:["세포독성", "동맥폐색", "정맥내 유출", "신경관내 유출", "추간판내 유출"],answer:3,explanation:"",question_images:["images/유니온_1권_q033.jpg"],explanation_images:["images/유니온_1권_e033.jpg"]},
  {num:34,section:"유니온 1권",chapter:"척추",question:"선천성 척추측만증 환자에서 아래 신체검진 소견 중 척추 기형에 의한 신경학적 증 상이 있을 가능성이 가장 높은 소견은 무엇인가?",choices:["Multiple level unsegmented bar", "One level hemivertebra", "Horse-shoe shape kidney", "Dorsal nevus with hair", "Cardiac septum deficiency"],answer:4,explanation:"",question_images:["images/유니온_1권_q034.jpg"],explanation_images:["images/유니온_1권_e034.jpg"]},
  {num:35,section:"유니온 1권",chapter:"척추",question:"경추부 전방의 종양 제거를 위한 수술에서 수술 중 감시에 유용한 방법은 무엇인가?",choices:["감각신경전도 검사", "운동신경 전도 검사", "운동 유발전위 검사 (MEP)", "체성감각 유발전위 검사 (SSEP)", "근전도 검사"],answer:3,explanation:"",question_images:["images/유니온_1권_q035.jpg"],explanation_images:["images/유니온_1권_e035.jpg"]},
  {num:36,section:"유니온 1권",chapter:"척추",question:"30세 남자가 낙상으로 수상한 뒤 경부 통증 및 사지 불완전 마비를 호소하며 내원하 였다. 이때 손상을 파악할 수 있는 가장 빠르고 정확한 검사는 무엇인가?",choices:["C-spine flexion/extension view", "C-spine oblique view", "M니tidetector- CT (MD-CT)", "MRI", "Whole body bone scan"],answer:3,explanation:"",question_images:["images/유니온_1권_q036.jpg"],explanation_images:["images/유니온_1권_e036.jpg"]},
  {num:37,section:"유니온 1권",chapter:"척추",question:"70세 폐암 환자가 경추부로의 전이가 관찰되었다. 흉부 방사선 사진에서 한쪽 횡격 막이 상승되어 있으며, 한쪽 흉곽의 움직임이 저하되어 있었다. 적합한 병변의 위치 는?",choices:["제 4경추체", "제 5경추체", "제 6경추체", "제 7경추체", "제 8경추체"],answer:1,explanation:"",question_images:["images/유니온_1권_q037.jpg"],explanation_images:["images/유니온_1권_e037.jpg"]},
  {num:38,section:"유니온 1권",chapter:"척추",question:"67세 여자로 제 3-4 요추간 극외측 추체간 유합술을 시행한 후 좌측 대퇴 전면의 통 증과 고관절 굴곡력 감소가 발생하였다. 하지만 수술 후 2주째 증상 호전 및 고관절 굴곡력 감소가 호전되었다. 상기 증상 발생의 원인은?",choices:["L3 nerve root injury", "L4 nerve root injury", "Lumbar plexus injury", "Lateral femoral cutaneous nerve injury", "Psoas m. injury"],answer:5,explanation:"",question_images:["images/유니온_1권_q038.jpg"],explanation_images:["images/유니온_1권_e038.jpg"]},
  {num:39,section:"유니온 1권",chapter:"척추",question:"40세 남자 환자가 결핵 치료를 받던 중 2일 전부터 양측 하지마비를 호소하였다. 점 차 하지마비가 진행하였고, MRI 상 제 1-2요추 사이 추간판에 음영이 증가한 소견과 psoas major muscle에 농양이 관찰되었다. 이후 제 1-2 요추부에서 후만 변형이 진 행됐을 때 적절한 치료는?",choices:["병소절제술", "항결핵제복용", "보조기착용", "후방절제술 및 유합술", "전방절제술 및 전후방 유합술"],answer:5,explanation:"",question_images:["images/유니온_1권_q039.jpg"],explanation_images:["images/유니온_1권_e039.jpg"]},
  {num:40,section:"유니온 1권",chapter:"척추",question:"33세 남자 환자가 우하지에 심한 통증을 호소하였다. 신체 검진상 족저굴곡 약화와 우측 종아리 부위 및 5 족지 감각 저하 소견이 동반되어 있었다. 위 환자에서 신경차 단술 시행시 적절한 위치는?",choices:["제 4요추 척추경 직하방", "제 4요추 척추경 직상방", "제 5요추 척추경 직하방", "제 5요추 척추경 직상방", "제 1천추 천추경 직하방"],answer:5,explanation:"",question_images:["images/유니온_1권_q040.jpg"],explanation_images:["images/유니온_1권_e040.jpg"]},
  {num:41,section:"유니온 1권",chapter:"척추",question:"70세 여환이 10년 전 제 1요추부터 제 1천추까지 다분절 유합술을 시행 받았다. 최 근 요추 전만이 다시 감소하여 시상면 불균형이 발생하였다. 이에 대해서 교정술을 시행하려고 할 때 수술로 적절한 것은?",choices:["사측간 요추추체간 유합술", "후측방요추체간유합술", "전후방유합술", "척추경절골술", "후주 절골술"],answer:4,explanation:"",question_images:["images/유니온_1권_q041.jpg"],explanation_images:["images/유니온_1권_e041.jpg"]},
  {num:42,section:"유니온 1권",chapter:"척추",question:"70세 남자 환자가 제3-6 경추 후종인대골화증 진단을 받았다. 이에 대해 후궁성형 술을 시행 예정이다. 이 수술의 특별한 합병증으로, 환자에게 반드시 설명해야 하는 것은?",choices:["견관절 외전 약화", "견관절 외회전 약화", "수근관절 신전 약화", "주관절 굴곡 약화", "주관절 신전 약화"],answer:1,explanation:"",question_images:["images/유니온_1권_q042.jpg"],explanation_images:["images/유니온_1권_e042.jpg"]},
  {num:43,section:"유니온 1권",chapter:"척추",question:"흉요추부 골절 시 척수 손상을 평가하기 위해 T니CS(Thoracolumbar Injury Classification and Severity Score)를 사용한다. 이 중 가장 큰 점수인 손상은 무엇 인가?",choices:["방출 (Burst)", "신연 (Distraction)", "완전척수손상 (Complete cord injury)", "전위/회전 (Translation/rotation)", "후방인대복합체 손상 (PLC injury)"],answer:2,explanation:"",question_images:["images/유니온_1권_q043.jpg"],explanation_images:["images/유니온_1권_e043.jpg"]},
  {num:44,section:"유니온 1권",chapter:"척추",question:"제 11번, 12번 흉추 골절 및 탈구가 발생한 환자로, 하지근력 및 감각이 전부 소실되 었다. 항문 반사 및 bulbocavernosus reflex 또한 없었다. 1주일 뒤，항문 주위 감 각이 50%로 회복되었다. 그리고 여전히 big toe flexor, extensor power는 모두 grade I이었다. 또한 항문 반사 및 bulbocavernosus reflex 또한 없었다. 이 환자의 상태는?",choices:["척수성 쇼크", "마미증후군", "척수 원추 증후군", "Ant cord syndrome", "Post cord syndrome"],answer:3,explanation:"",question_images:["images/유니온_1권_q044.jpg"],explanation_images:["images/유니온_1권_e044.jpg"]},
  {num:45,section:"유니온 1권",chapter:"척추",question:"경추 경막외 스테로이드 주사 시 사지마비 등 심각한 신경학적 합병증이 보고된 방 법（가）와 손상되는 구조물（나）이 가장 적절한 것은?",choices:["가: interlaminar injection, 나: dura", "가: interlaminar injection, 나: epidural vein", "가: transforaminal injection, 나: cervical root", "가: transforaminal injection, 나: radicular artery", "가: transforaminal injection, 나: sympathetic chain"],answer:4,explanation:"",question_images:["images/유니온_1권_q045.jpg"],explanation_images:["images/유니온_1권_e045.jpg"]},
  {num:46,section:"유니온 1권",chapter:"고관절",question:"고도 결합 폴리에틸렌(highly cross-linked polyethylene) 제조 과정에서 유리기 (free radical)를 거의 완전히 제거 할 수 있으나, 결정화(crystallity)를 감소하여 파 괴인성(fracture toughness)를 약화시켜 비구컵 마모와 같은 합병증을 유발할 수 있 는것은?",choices:["Annealing", "Electron-beam irradiation", "Gamma irradiation", "Remelting", "Vit-E soaking"],answer:4,explanation:"",question_images:["images/유니온_1권_q046.jpg"],explanation_images:["images/유니온_1권_e046.jpg"]},
  {num:47,section:"유니온 1권",chapter:"고관절",question:"고관절 관절경 수술을 받은 25세 남자 환자가 있다. 수술 후 대퇴부의 전외측 피부의 이상감각을 호소하였다. 다음 증상은 어떠한 portal에 의해 발생하였는가?",choices:["근위 전내측 삽입구", "내측 삽입구", "전방 삽입구", "전내측 삽입구", "후내측 삽입구"],answer:3,explanation:"",question_images:["images/유니온_1권_q047.jpg"],explanation_images:["images/유니온_1권_e047.jpg"]},
  {num:48,section:"유니온 1권",chapter:"고관절",question:"무시멘트형 인공 고관절 전치환술을 시행하던 중에 소전자의 근위부로 비전위 골절 이 발생하였다. 다음 중 가장 적합한 처치는?",choices:["체중 부하 제한", "금속판과 나사못을 이용한 고정", "골이식", "환형 강선 고정", "환형 강선 고정 긴 대퇴 주대로 교체 후 재고정"],answer:4,explanation:"",question_images:["images/유니온_1권_q048.jpg"],explanation_images:["images/유니온_1권_e048.jpg"]},
  {num:49,section:"유니온 1권",chapter:"고관절",question:"고관절의 수술적 접근법 중에서 봉중근과 대퇴 근막 장근 사이로 접근하였다. 이러 한 접근을 할 때 관절막을 가로질러 위치하여 결착 해야하는 혈관은?",choices:["Medial femoral cutaneous artery", "Obturator artery", "Lateral femoral cutaneous artery", "Superior gluteal artery.", "Inferior gluteal artery."],answer:5,explanation:"",question_images:["images/유니온_1권_q049.jpg"],explanation_images:["images/유니온_1권_e049.jpg"]},
  {num:50,section:"유니온 1권",chapter:"고관절",question:"고관절 무혈성 괴사에서 촬영한 고관절 MRI에서 가장 초기에 보이는 소견은?",choices:["골두 함물", "골부 부종", "관절내 삼출액", "연골 내 골절", "T1 에서 저신호강도의 띠 (Low signal band)"],answer:5,explanation:"",question_images:["images/유니온_1권_q050.jpg"],explanation_images:["images/유니온_1권_e050.jpg"]},
  {num:51,section:"유니온 1권",chapter:"고관절",question:"어릴 적 DDH를 앓고 비구 이형성증이 있는 33세 여자 환자가 내원하였다. 골반 절 골술을 시행 예정이다. 수술 종류 결정 및 예후 예측에 가장 필요한 엑스레이는?",choices:["Femoral maximum abduction & adduction view", "Obturator view", "False profile view", "Luenstein view", "Frog view"],answer:1,explanation:"",question_images:["images/유니온_1권_q051.jpg"],explanation_images:["images/유니온_1권_e051.jpg"]},
  {num:52,section:"유니온 1권",chapter:"고관절",question:"43세 환자가 의자에 오래 앉아 있거나, 차에 타고 내릴 때 심해지는 고관절 동통을 호소하였다. 임상 검사에서 하지 직거상 검사 음성이고, 패트릭 검사 음성이었다. 하 지를 90도 굴곡, 내전, 내회전 할 때 서혜부에 동통이 있었다. 가장 가능성이 높은 진 단은?",choices:["골낭종", "장요 점액낭", "대퇴비구 충돌증후군", "대전자부점액낭", "좌둔 점액낭"],answer:3,explanation:"",question_images:["images/유니온_1권_q052.jpg"],explanation_images:["images/유니온_1권_e052.jpg"]},
  {num:53,section:"유니온 1권",chapter:"고관절",question:"45세 여자 환자로 내원 수 일전부터 발생한 우측 둔부 통증으로 내원하였다. 진찰 소 견상 환측 고관절을 90도 굴곡, 내전, 내회전 하였을 때 서혜부 부위에 통증은 없었 다. 대퇴 경부의 알파각은 60도와 경부 접합부위에 골 융기 소견이 있었다. 자기공 명 영상 상 고관절 관절와순의 파열 소견이 있었다. 이 환자에게 가장 적절한 치료 는?",choices:["경과관찰", "근위 대퇴골 외반 절골술", "관절경하 골 융기 제거술", "관절경하 관절와순 봉합술", "관절경 하 골 융기 제거술 및 관절와순 봉합술"],answer:1,explanation:"",question_images:["images/유니온_1권_q053.jpg"],explanation_images:["images/유니온_1권_e053.jpg"]},
  {num:54,section:"유니온 1권",chapter:"고관절",question:"고관절의 굴곡근을 이용하여 체중의 약 2배 정도 되는 힘을 고관절에 가하여 해당 질환의 유무를 파악하는 신체검사법으로 동일 환자에서 재현성이 높아 자주 사용되 는 검사법은?",choices:["Active SRL test", "Ant. Impingement test", "Rog roll test", "Patrick test", "Piriformis sign"],answer:1,explanation:"",question_images:["images/유니온_1권_q054.jpg"],explanation_images:["images/유니온_1권_e054.jpg"]},
  {num:55,section:"유니온 1권",chapter:"고관절",question:"25세 남자가 우측 고관절의 탄발음과 불편감을 주소로 내원하였다. 신체검진 소견 상 고관절이 굴곡, 외전, 외회전 된 상태에서 신전, 내회전 될 때 탄발음과 함께 불편 감을 호소하였다. 진단을 위한 추가 검사로 가장 적절한 것은?",choices:["단순 방사선 사진", "자기 공명 영상 검사(MRI)", "자기 공명 영상 관절조영술(MR arthrogram)", "초음파", "골 주사 검사"],answer:4,explanation:"",question_images:["images/유니온_1권_q055.jpg"],explanation_images:["images/유니온_1권_e055.jpg"]},
  {num:56,section:"유니온 1권",chapter:"고관절",question:"요추의 후만 변형이 있는 73세 여환이 인공고관절 전치환술을 고려한다. 이때 골반 의 회전 방향（가）과 발생할 가능성이 높은 탈구 방향（나）의 조합으로 옳은 것은?",choices:["가: 내전, 나: 후방", "가: 전방, 나: 전방", "가: 전방, 나: 후방", "가: 후방, 나: 전방", "가: 후방, 나: 후방"],answer:4,explanation:"",question_images:["images/유니온_1권_q056.jpg"],explanation_images:["images/유니온_1권_e056.jpg"]},
  {num:57,section:"유니온 1권",chapter:"고관절",question:"인공 고관절 전치환술을 위한 templating 순서 중 가장 먼저 해야 하는 것은?",choices:["femur cutting level", "femur stem size", "acetabulum size", "acetabulum center", "femur stem neck length"],answer:3,explanation:"",question_images:["images/유니온_1권_q057.jpg"],explanation_images:["images/유니온_1권_e057.jpg"]},
  {num:58,section:"유니온 1권",chapter:"고관절",question:"Crowe type 2의 비구 이형성증 환자가 인공고관절 전치환술을 받게 되었다. 환자에 게 인공고관절 전치환술 시행시 비구 확공을 할 때, 작은 리머로 시행할 확공의 방향 은?",choices:["내측", "상방", "후상방", "전상방", "전방"],answer:1,explanation:"",question_images:["images/유니온_1권_q058.jpg"],explanation_images:["images/유니온_1권_e058.jpg"]},
  {num:59,section:"유니온 1권",chapter:"고관절",question:"어깨가 넓고 골반이 좁은 남자에게서 인공고관절 치환술을 시행하였다. 일반 사람과 동일한 concept으로 시행 할 경우 범하기 쉬운 오류는?",choices:["Femoral stem anteversion 증가", "Femoral stem anteversion 감소", "Acetabulum cup inclination 증가", "Acetabulum cup inclination 감소", "Acetabulum cup anteversion 증가"],answer:3,explanation:"",question_images:["images/유니온_1권_q059.jpg"],explanation_images:["images/유니온_1권_e059.jpg"]},
  {num:60,section:"유니온 1권",chapter:"고관절",question:"무시멘트성 스템을 이용한 인공고관절 전치환술 시행 시 Stress shielding 이 가장 많이 일어나는 stem은?",choices:["Single wedge stem", "Distal fitted stem", "Mod니ar stem", "Short stem", "Anatomical stem"],answer:2,explanation:"",question_images:["images/유니온_1권_q060.jpg"],explanation_images:["images/유니온_1권_e060.jpg"]},
  {num:61,section:"유니온 1권",chapter:"고관절",question:"30세 마라톤선수가 서혜부 통증이 있다. Patrick test 양성, 저항성 하지 직거상 검 사 양성이었다. 방사선 검사상 대퇴골 경부 하부에 경화성 변화가 있었고, MRI 검사 상 대퇴 경부 하부에 20%°| 신호 강도 변화가 있었다. 이 환자의 치료는?",choices:["부분 체중부하", "골이식", "내고정술", "고관절 반치환술", "고관절 전치환술"],answer:1,explanation:"",question_images:["images/유니온_1권_q061.jpg"],explanation_images:["images/유니온_1권_e061.jpg"]},
  {num:62,section:"유니온 1권",chapter:"고관절",question:"78세 남자 환자가 안정형 대퇴 전자간 골절에 대해 압박고나사 고정술을 시행하였 다. 지연나사 삽입을 위한 확공술 중 대퇴 외측 피질골의 완전 파열이 발생하였다. 다 음 후속 조치로 알맞은 것은?",choices:["소파술 및 골이식", "인공관절 치환술", "골수강 내 금속정 삽입술", "환형강선고정술", "경과 관찰"],answer:3,explanation:"",question_images:["images/유니온_1권_q062.jpg"],explanation_images:["images/유니온_1권_e062.jpg"]},
  {num:63,section:"유니온 1권",chapter:"슬관절",question:"전방십자인대 손상 시 가장 sensitive한 신체검진으로, 전방십자인대 재건술 결정에 가장 신뢰도 있는 검사는?",choices:["External rotation recurvatum test", "Anterior drawer test", "Pivot shift test", "Anterolateral drawer test", "Lachman test"],answer:5,explanation:"",question_images:["images/유니온_1권_q063.jpg"],explanation_images:["images/유니온_1권_e063.jpg"]},
  {num:64,section:"유니온 1권",chapter:"슬관절",question:"50세 환자가 1주일 전 버스에서 내리다 뚝 소리가 나면서 발생한 슬관절 통증을 주 소로 내원하였다. 슬관절 내측 관절면 통증 및 tenderness가 있었다. 방사선 검사상 하지 정렬은 정상이며, MRI상 내측 반월상 연골판의 posterior horn의 matrix에는 이상이 없으나, tibia plateau와의 접합부에서 cleft sign(fluid-filled defect)이 관찰 되었다. 내측 대퇴골 관절면과 경골 내측 관절면의 연골 상태는 ICRS grade 1 이었다. 내측 반월상 연골판에 대한 수술적 치료는?",choices:["Debridement", "봉합술", "연골판 전 절제술", "연골판 부분 절제술", "연골판이식술"],answer:2,explanation:"",question_images:["images/유니온_1권_q064.jpg"],explanation_images:["images/유니온_1권_e064.jpg"]},
  {num:65,section:"유니온 1권",chapter:"슬관절",question:"무릎 관절 운동 범위 확인시 goniometer의 hinge를 고정해야 하는 위치는?",choices:["대퇴골 과상부", "대퇴골 관절면", "경골관절면", "대퇴골 내측상과", "대퇴골 외측상과"],answer:5,explanation:"",question_images:["images/유니온_1권_q065.jpg"],explanation_images:["images/유니온_1권_e065.jpg"]},
  {num:66,section:"유니온 1권",chapter:"슬관절",question:"다발성 인대 손상 환자가 내원하였다. 전방십자인대, 후방십자인대, 후외측 복합구 조물 손상을 모두 한 번에 수술할 때 재건하는 수술 순서는?",choices:["PCL -> ACL -> PLC", "PCL -> PLC -> ACL", "ACL -> PCL -> PLC", "ACL -> PLC -> PCL", "PLC -> PCL -> ACL"],answer:1,explanation:"",question_images:["images/유니온_1권_q066.jpg"],explanation_images:["images/유니온_1권_e066.jpg"]},
  {num:67,section:"유니온 1권",chapter:"슬관절",question:"40대 남자가 3일 전부터 발생한 슬관절 통증 및 부종 주소로 내원하였다. 최근 주 사 치료등 침습적인 치료를 받은 적은 없다. 관절천자 검사상 WBC 20,000, PMN 80%이며, 혈액 검사상 CRP 12.0, glucose 120이었다. 편광현미경 검사상 약한 이 중 양성 굴절성을 보였으며 장사방형의 결정이 관찰되었다. 가장 적절한 약제는?",choices:["요산 억제제", "요산 배설제", "항생제", "NSAID", "콜키친"],answer:4,explanation:"",question_images:["images/유니온_1권_q067.jpg"],explanation_images:["images/유니온_1권_e067.jpg"]},
  {num:68,section:"유니온 1권",chapter:"슬관절",question:"인공 슬관절 전치환술 시 굴곡 구축을 해결하기 위해서 후방 관절막 유리술을 시행 할 때 견인되어 손상될 수 있는 혈관을 고르시오.",choices:["superomedial genicular artery", "popliteal artery", "inferomedial genicular artery", "inferolateral genicular artery", "middle genicular artery"],answer:1,explanation:"",question_images:["images/유니온_1권_q068.jpg"],explanation_images:["images/유니온_1권_e068.jpg"]},
  {num:69,section:"유니온 1권",chapter:"슬관절",question:"류마티스 관절염을 앓고 있는 환자가 40도의 슬관절 굴곡성 강직이 있다. 인공슬관 절 전치환술을 시행하였다. 수술 후 슬관절 외측부에 감각 이상이 발견되었다. 다만 운동 기능에는 이상이 없었다. 이때 손상 받았을 것으로 예상되는 신경은?",choices:["tibial nerve", "infrapatellar br. of saphenous nerve", "lateral sural cutaneous nerve", "common peroneal nerve", "sciatic nerve"],answer:3,explanation:"",question_images:["images/유니온_1권_q069.jpg"],explanation_images:["images/유니온_1권_e069.jpg"]},
  {num:70,section:"유니온 1권",chapter:"슬관절",question:"슬관절 통증 및 잠김 증상을 호소하는 13세 남아가 내원하였다. 대퇴 내과 체중 부하 부위에 1.5cm2 가량의 골 결손이 관찰될 때 적절한 치료는?",choices:["다발성 천골술", "소파술 + 골편 고정술", "골편 제거술", "골편 제거술 + 자가 골연골 이식술", "골편 제거술 + 자가 연골세포 이식술"],answer:2,explanation:"",question_images:["images/유니온_1권_q070.jpg"],explanation_images:["images/유니온_1권_e070.jpg"]},
  {num:71,section:"유니온 1권",chapter:"슬관절",question:"후방 십자인대 대치형의 인공슬관절 전치환술 후 1년이 경과한 환자가 수술 한 무릎 에서 clunk 및 crepitus를 호소하였다. 이와 동시에 전방 슬관절의 통증을 호소하였 다. 이에 대한 원인은?",choices:["대퇴 치환물의 길이", "대퇴치환물 길이와 intercondylar 박스의 비", "슬개골 치환물 좌우의 길이", "슬개골 치환물 두께", "슬개골 치환물 좌우 길이와 두께의 비"],answer:2,explanation:"",question_images:["images/유니온_1권_q071.jpg"],explanation_images:["images/유니온_1권_e071.jpg"]},
  {num:72,section:"유니온 1권",chapter:"슬관절",question:"인공슬관절 전치환술에서 원위 대퇴골을 절골하였다. 이후 sizer로 anterior referencing을 하여 측정한 대퇴골 삽입물의 크기가 2와 3번 사이였다. 3번을 선택 하였을 때 발생할 수 있는 문제점을 해결하는 방법은?",choices:["대퇴골 원위부 추가 절제", "경골 후면 경사 추가 절제", "더 작은 PE 사용", "경골 근위부 추가 절제", "후방 유리술"],answer:2,explanation:"",question_images:["images/유니온_1권_q072.jpg"],explanation_images:["images/유니온_1권_e072.jpg"]},
  {num:73,section:"유니온 1권",chapter:"슬관절",question:"슬관절이 10도 과신전이 되며 동시에 후방 불안정성을 보이는 환자가 내원하였다. 단순 방사선 검사상 퇴행성 슬관절염 소견이 관찰되었고, K-L grade 4였다. 인공슬 관절 전치환술 시, 슬관절 과신전에 대한 적절한 처치는?",choices:["경골 후방경사 증가", "내측 측부 인대 유리술", "varus-valgus constrained type stem의 시용", "후방 대퇴골 절제 및 두꺼운 Pe의 사용", "원위 대퇴골 절제 줄이기"],answer:5,explanation:"",question_images:["images/유니온_1권_q073.jpg"],explanation_images:["images/유니온_1권_e073.jpg"]},
  {num:74,section:"유니온 1권",chapter:"슬관절",question:"15년 전 후방십자인대 보존형 슬관절 전치환술을 시행 받은 80대 환자가 내원하였 다. 방사선 검사에서 삽입물 주위의 골용해 및 해리 소견은 없었다. 하지만 신체검진 상 내외반 불안정성 및 보행 시 슬관절 과신전 양상을 보여 인공관절 재치환술을 시 행하려 한다. 이때 사용할 수 있는 component type은?",choices:["Varus-valgus constrained type", "Anterior stabilized prosthesis", "Posterior stabilized prosthesis", "전후방 십자인대 대치형 치환물", "Hinge prosthesis"],answer:5,explanation:"",question_images:["images/유니온_1권_q074.jpg"],explanation_images:["images/유니온_1권_e074.jpg"]},
  {num:75,section:"유니온 1권",chapter:"슬관절",question:"과차 47세 여자가 무릎 외측 통증을 호소하며 내원하였다. 방사선 검사에서 하지 정렬은 tibiofemoral angle은 외반 14도, mechanical LDFA 기도, MPTA 83도였다. 슬관절 전후방 불안정성은 없었으며 MRI상 외측 반월상연골판 복합 파열과 대퇴골 외측과 의 체중 부하 부위에 1cm x 1cm의 연골 손상 소견이 보였다. 이에 대한 치료는?",choices:["HTO", "UKA", "TKA", "자가 연골세포 이식술", "DFO"],answer:5,explanation:"",question_images:["images/유니온_1권_q075.jpg"],explanation_images:["images/유니온_1권_e075.jpg"]},
  {num:76,section:"유니온 1권",chapter:"슬관절",question:"21세 남자 환자가 반복되는 좌측 슬관절 통증과 부종으로 내원하였다. Q-angle은 25도, TT-TG은 23mm, Insall-salvati ratio는 1.2로 관측되었다. 하지 정렬은 정상이 였으며, 슬개골 외측 관절연골에 전층 결손 chondromalacia 소견이 있었다. 이 환자 에게 적절한 수술적 치료를 고르시오",choices:["경골결절 내측이전술", "경골결절 전내측이전술", "내측슬개대퇴인대 재건술", "내측슬개대퇴인대 경첩술", "외측지대 이완술"],answer:2,explanation:"",question_images:["images/유니온_1권_q076.jpg"],explanation_images:["images/유니온_1권_e076.jpg"]},
  {num:77,section:"유니온 1권",chapter:"슬관절",question:"12세 남자 환아가 슬관절의 locking과 giving way 증상으로 내원하였다. MRI 검사 상 외측 완전형 원판형 연골판과, 외측 원판형 연골판 후각부에 15mm의 종파열이 연골판-관절낭 접합부에 있었다. 가장 적절한 치료는?",choices:["연골판 후각부 봉합술", "연골판 부분 절제술 및 후각부 봉합술", "아전절제술 및 연골판이식", "전절제술 및 연골판이식", "전절제술"],answer:2,explanation:"",question_images:["images/유니온_1권_q077.jpg"],explanation_images:["images/유니온_1권_e077.jpg"]},
  {num:78,section:"유니온 1권",chapter:"슬관절",question:"전방십자인대 재건술 후 3개월 된 환자가 슬관절 통증 및 관절운동 제한이 발생하여 내원하였다. 이학적 검사상 전방 불안정성은 보이지 않았고 굴곡 제한은 20도, 후속 굴곡은 120도로 확인되었다. 이 환자의 원인으로 가능성 높은 것은?",choices:["경골 터널 전방", "경골 터널 후방", "과도한 과간절흔 성형", "대퇴 터널 전방", "대퇴 터널 후방"],answer:1,explanation:"",question_images:["images/유니온_1권_q078.jpg"],explanation_images:["images/유니온_1권_e078.jpg"]},
  {num:79,section:"유니온 1권",chapter:"슬관절",question:"쳐 - 절 19세 축구선수로 후방십자인대 재건술을 1년 전 시행 받았으나 슬관절 통증 이 지속되어 내원하였다. Posterior drawer test에서 심한 후방 전위를 보였고, posterolateral drawer test에서도 양성을 보였다. MRI에서 후방십자인대의 연속성 은 유지되고 있으나 외측 측부인대가 얇아져 있다. 이에 적절한 수술적 치료는?",choices:["후방십자인대 재건술", "근위경골절골술", "전방십자인대 재건술", "후방십자인대 재건술 + 후외측 구조물 재건술", "후방십자인대 재건술 + 내측 측부인대 재건술"],answer:4,explanation:"",question_images:["images/유니온_1권_q079.jpg"],explanation_images:["images/유니온_1권_e079.jpg"]},
  {num:80,section:"유니온 1권",chapter:"슬관절",question:"22세 남자 환자가 오토바이 운전 중 수상하여 우측 슬관절 탈구 발생 후 정복되어 응 급실로 내원하였다. 응급실에서 시행한 검사상 우측 슬관절 및 하지에 부종이 있었 고 골절 및 탈구의 소견은 없었다. 하지 도플러 검사에서 우측 하지의 맥박이 있음을 확인하였고 ABI는 0.9였으며, 하지 구획압력은 15mmHg였다. 이후 시행해야 할 처 치로 옳은 것은?",choices:["부목고정 후 외래추시", "혈관조영술", "근막절개술", "혈관 수술", "입원 후 주기적 관찰"],answer:5,explanation:"",question_images:["images/유니온_1권_q080.jpg"],explanation_images:["images/유니온_1권_e080.jpg"]},
  {num:81,section:"유니온 1권",chapter:"총론",question:"이 정상 보행에서 중간 입각기때 족부굴곡을 조절하고 체중을 무릎 전방으로 이동시키 게 된다. 이때 주로 작용하는 근육 및 작용은?",choices:["전경골근 동심선 수축", "전경골근 편심성수축", "전경골근 하퇴삼두근 동시 수축", "하퇴삼두근 동심성 수축", "하퇴삼두근 편심성 수축"],answer:5,explanation:"",question_images:["images/유니온_1권_q081.jpg"],explanation_images:["images/유니온_1권_e081.jpg"]},
  {num:82,section:"유니온 1권",chapter:"총론",question:"인공관절 수술 시 골 시멘트를 이용하여 인공관절을 견고히 고정한다. 골시멘트가 생체 내에서 고정되는 기전은?",choices:["골유도(osteoinduction)", "기계적 맞물림(interdigitation)", "신생혈관 형성(neovascularization)", "생체 결합(biointegration)", "화학적 결합(chemical integration)"],answer:2,explanation:"",question_images:["images/유니온_1권_q082.jpg"],explanation_images:["images/유니온_1권_e082.jpg"]},
  {num:83,section:"유니온 1권",chapter:"총론",question:"마취시 감각신경에 주로 작용하고 운동신경 차단은 적으며 작용시간은 2-4 시간으 로 긴 편이나 정맥 주입시 심독성을 일으켜서 주의를 요하는 약은?",choices:["로피바케인", "부피바케인", "레보부피바케인", "리도케인", "메피바케인"],answer:2,explanation:"",question_images:["images/유니온_1권_q083.jpg"],explanation_images:["images/유니온_1권_e083.jpg"]},
  {num:84,section:"유니온 1권",chapter:"총론",question:"고관절의 인공관절 치환술 후 발생하는 대표적인 마모의 조합으로 옳은 것은?",choices:["부식-연마", "부식-점착", "연마-점착", "연마-피로", "점착-피로"],answer:3,explanation:"",question_images:["images/유니온_1권_q084.jpg"],explanation_images:["images/유니온_1권_e084.jpg"]},
  {num:85,section:"유니온 1권",chapter:"총론",question:"정형외과 수술에 예방적으로 쓰는 항생제는 A 세대 세팔로스포린이며, 수술 B 시간 전 투여해야 한다. A와 B의 알맞은 조합은?",choices:["1-1", "1-2", "2-1", "-1", "3-2"],answer:1,explanation:"",question_images:["images/유니온_1권_q085.jpg"],explanation_images:["images/유니온_1권_e085.jpg"]},
  {num:86,section:"유니온 1권",chapter:"총론",question:"주관절 굴곡구축이 있는 환자를 30초-1분간 지속적으로 신연시 서서히 관절 운동범 위가 늘어났다. 이 기전을 설명하는 용어는?",choices:["네킹", "응력이완", "포복", "인성", "취성"],answer:3,explanation:"",question_images:["images/유니온_1권_q086.jpg"],explanation_images:["images/유니온_1권_e086.jpg"]},
  {num:87,section:"유니온 1권",chapter:"총론",question:"원위 대퇴골 골절로 관혈적 정복 및 금속판 고정술을 시행한 환자에서 온열 치료를 시행하고자 한다. 이때 적절한 심부열 치료 방법은?",choices:["극초단파치료", "단파투열치료", "온습포（핫팩）", "적외선 온열 램프", "초음파 치료"],answer:5,explanation:"",question_images:["images/유니온_1권_q087.jpg"],explanation_images:["images/유니온_1권_e087.jpg"]},
  {num:88,section:"유니온 1권",chapter:"총론",question:"교통사고로 인한 다발성 골절로 치료를 받은 50세 환자가 내원하였다. 골절부가 모 두 유합되고 증상이 고정된 후에 맥브라이드 법으로 평가한 장애율이 우측 고관절 20%, 좌측 슬관절 10%였다. 이 환자의 복합 장애를 모두 합산하면 몇 %로 평가할 수 있겠는가?",choices:["22%", "24%", "26%", "28%", "30%"],answer:4,explanation:"",question_images:["images/유니온_1권_q088.jpg"],explanation_images:["images/유니온_1권_e088.jpg"]},
  {num:89,section:"유니온 1권",chapter:"총론",question:"개방성 골절로 입원한 환자에게 항생제 피부검사를 시행하여 적절한 예방적 항생제 를 투여하였으나, 약물 알레르기 과거력을 확인하지 않고 tramadol을 통증 조절을 위해 투여한 다음 과민성 쇼크(anaphylactic shock)가 발생하였다. 법적 분쟁이 발 생하였다면 의료진은 어떠한 의무를 다하지 못한 것에 대한 책임을 져야 하는가?",choices:["기록 의무", "동의 의무", "설명 의무", "주의 의무", "지도 의무"],answer:4,explanation:"",question_images:["images/유니온_1권_q089.jpg"],explanation_images:["images/유니온_1권_e089.jpg"]},
  {num:90,section:"유니온 1권",chapter:"종양",question:"악성 골종양의 병기(stage)를 구분한 AJCC 분류법에서 사용되는 병기 II와 III를 구분하기 위해 반드시 시행해야 하는 검사는?",choices:["혈액 검사", "골 주사 검사", "흉부 전산화 단층 촬영", "생검", "복부 전산화 단층 촬영"],answer:2,explanation:"",question_images:["images/유니온_1권_q090.jpg"],explanation_images:["images/유니온_1권_e090.jpg"]},
  {num:91,section:"유니온 1권",chapter:"종양",question:"대퇴골 전자하부에 발생한 전이성 골조양에 대해 철저한 소파술(extended curettage) 후 예방적 골수강내 금속적 삽입술을 시행하였다. 이에 해당하는 절제연 은?",choices:["Intralesional", "Marginal", "Wide", "Contaminated wide", "Radical"],answer:1,explanation:"",question_images:["images/유니온_1권_q091.jpg"],explanation_images:["images/유니온_1권_e091.jpg"]},
  {num:92,section:"유니온 1권",chapter:"종양",question:"46세 여자 환자가 3개월 전부터 대퇴부 통증이 발생하여 내원하였다. 방사선 검사 상 좌측 대퇴 원위부에 병변이 보였다. 병변 주위로는 감소된 음영이, 병변 내에는 불 규칙한 석회화가 관찰되었으며, 병변은 피질골 외측으로 자라는 양상을 보였다. 양 측 원위 경골 및 근위 경골에 다발성 병변이 관절면으로부터 멀어지는 양상으로 있 었다. 진단은?",choices:["골육종", "다발성 골수종", "섬유육종", "연골육종", "유잉육종"],answer:4,explanation:"",question_images:["images/유니온_1권_q092.jpg"],explanation_images:["images/유니온_1권_e092.jpg"]},
  {num:93,section:"유니온 1권",chapter:"종양",question:"분야: 종양 12세 환아가 3개월 전부터 발생하여 점점 심해지는 대퇴부 통증으로 내원하였다. 방 사선 검사상 대퇴골 간부에 moth-eaten 골용해 소견과 동시에 골형성 소견이 관찰 되었다. 또 onion-skin 골막반응이 관찰되었다. 조직검사상 작은 원형의 세포들이 비교적 일정한 모양으로 밀집되어있는 소견이 관찰되었을 때 진단은?",choices:["골육종", "다발성골수종", "악성 골 림프종", "연골육종", "유잉육종"],answer:5,explanation:"",question_images:["images/유니온_1권_q093.jpg"],explanation_images:["images/유니온_1권_e093.jpg"]},
  {num:94,section:"유니온 1권",chapter:"종양",question:"41세 남자 환자로, 경미한 외상 후 촬영한 단순 방사선 검사에서 상완골 근위부에 경 계가 명확한 점상 석회화 병변이 발견되었다. 자기 공명 검사에서 병변의 장축 지름 은 3cm으로, 골수강내에 국한되어 있었고, 피질골 침범은 없었다. 적절한 치료는?",choices:["추시 관찰", "고주파 용해술", "방사선 치료", "소파술", "범위 절제술"],answer:1,explanation:"",question_images:["images/유니온_1권_q094.jpg"],explanation_images:["images/유니온_1권_e094.jpg"]},
  {num:95,section:"유니온 1권",chapter:"종양",question:"13세 환아가 넘어지면서 발생한 우측 경골 간부의 통증으로 내원하였다. 단순 방사 선 검사 상에서 피질골 내의 경화성 골에 의해 구분되는 다발성 낭포 모양의 용해성 병소가 1 x 2cm 크기로 경골 간부에 발생하였고, 골막반응은 없었다. 1년 추시 후 크 기가 1.2 x 2.2cm 크기로 되었다. 다음 처치는?",choices:["추시 관찰", "MRI", "생검", "소파술", "광범위 절제술"],answer:1,explanation:"",question_images:["images/유니온_1권_q095.jpg"],explanation_images:["images/유니온_1권_e095.jpg"]},
  {num:96,section:"유니온 1권",chapter:"종양",question:"50세 남자가 대퇴부 종괴를 주소로 내원하였다. MRI에서 근육 내부에 11cm 크기의 종괴가 확인되었다. 조직검사 상, grade 3의 육종이 확인되었다. 위 연부조직 종양의 AJCC grade는?",choices:["1B", "2A", "2B", "3", "4"],answer:4,explanation:"",question_images:["images/유니온_1권_q096.jpg"],explanation_images:["images/유니온_1권_e096.jpg"]},
  {num:97,section:"유니온 1권",chapter:"종양",question:"양성 종양이지만 매우 침습적이며, 변연절제술 시 재발이 많아 광범위 절제술이 권 고되는 양성 종양은?",choices:["색소융모결절활액막염(pigmented villonodular synovitis)", "섬유종증(fibromatosis)", "신경초종(neurilemmoma)", "점액종(myxoma)", "평활근종(leiomyoma)"],answer:2,explanation:"",question_images:["images/유니온_1권_q097.jpg"],explanation_images:["images/유니온_1권_e097.jpg"]},
  {num:98,section:"유니온 1권",chapter:"종양",question:"62세 환자가 2개월부터 시작된 좌측 발목 통증으로 내원하였다. 방사선 사진 상 거 골에 골 용해성 병변이 확인되었다. 악성 전이성 종양이라면 가장 가능성이 높은 원 발암은?",choices:["갑상선암", "위암", "간암", "폐암", "전립선암"],answer:4,explanation:"",question_images:["images/유니온_1권_q098.jpg"],explanation_images:["images/유니온_1권_e098.jpg"]},
  {num:99,section:"유니온 1권",chapter:"종양",question:"40세 여자 환자가 신장암으로 4년 전부터 치료받고 있었다. 대퇴골 경부부터 소전 자하부까지 신장암 골전이가 있다. 이에 대한 치료는?",choices:["소파술", "소파술후 골이식", "소파술후 시멘트", "내고정", "절제술 후 종양대치술"],answer:5,explanation:"",question_images:["images/유니온_1권_q099.jpg"],explanation_images:["images/유니온_1권_e099.jpg"]},
  {num:100,section:"유니온 1권",chapter:"외상",question:"근위 경골 고평부에 골절이 있었다. Medial plateau의 posterior에 전단 골절이 발 생하였다. 이때 손상시 femu「의 손상 기전과 위치는?",choices:["내반 + 내회전 +굴곡", "내반 + 외회전 + 굴곡", "내반 + 외회전 + 신전", "외반+ 내회전 + 신전", "외반 + 외회전 + 신전"],answer:1,explanation:"",question_images:["images/유니온_1권_q100.jpg"],explanation_images:["images/유니온_1권_e100.jpg"]},
  {num:101,section:"유니온 1권",chapter:"외상",question:"근위 경골 고평부 골절이 외측 고평부에 분리 골절이 있어서 외측에 금속판 고정을 하였다. 이와 같은 원리의 금속판 고정은?",choices:["근위 경골 골간단부 분쇄 골절", "근위 상완골 사선 골절", "원위 상완골 나선형 골절", "요골 간부 횡골절", "발목 내과 수직 골절"],answer:5,explanation:"",question_images:["images/유니온_1권_q101.jpg"],explanation_images:["images/유니온_1권_e101.jpg"]},
  {num:102,section:"유니온 1권",chapter:"외상",question:"45세 건강한 남자가 경골 간부 골절이 있어 골수강내 금속정 고정술을 시행하였다. 수술 이후 수술 부위 발적 및 종창과 배농루를 동반한 감염 소견이 관찰되었다. 이때 조직검사를 시행하려고 한다. 적절한 항생제 치료를 위한 조직검사의 위치는?",choices:["괴사조직", "농", "배농루 swab", "심부조직", "피부 swab"],answer:4,explanation:"",question_images:["images/유니온_1권_q102.jpg"],explanation_images:["images/유니온_1권_e102.jpg"]},
  {num:103,section:"유니온 1권",chapter:"외상",question:"60세 남자가 교통사고로 다발성 외상이 발생하였다. 개방성 경골 간부 골절로 Gustilo-anderson grade 3였다. 다량의 수혈에도 수축기혈압이 85mmHg이고 distal pulse가 없다면 치료는?",choices:["임시 외고정", "IM nail", "MIP0", "동맥 탐색술", "하지 절단"],answer:5,explanation:"",question_images:["images/유니온_1권_q103.jpg"],explanation_images:["images/유니온_1권_e103.jpg"]},
  {num:104,section:"유니온 1권",chapter:"외상",question:"원위 대퇴골 골절에 대하여 locking compression plate 댈 때 intercondylar notch 에 screw 삽입을 피하기 위한 x-ray는?",choices:["AP", "Int. oblique", "Ext. oblique", "Merchant view", "Tunnel view"],answer:5,explanation:"",question_images:["images/유니온_1권_q104.jpg"],explanation_images:["images/유니온_1권_e104.jpg"]},
  {num:105,section:"유니온 1권",chapter:"외상",question:"고관절 비구의 횡 골절 환자에서 kocher-langenbeck approach로 수술할 때 좌골 신경 손상을 최소화할 수 있는 고관절과 슬관절의 포지션은?",choices:["고관절 굴곡 슬관절 굴곡", "고관절 굴곡 슬관절 신전", "고관절 신전 슬관절 굴곡", "고관절 신전 슬관절 신전", "고관절 신전 슬관절 중립"],answer:3,explanation:"",question_images:["images/유니온_1권_q105.jpg"],explanation_images:["images/유니온_1권_e105.jpg"]},
  {num:106,section:"유니온 1권",chapter:"외상",question:"개방성 골절에 대해 외고정기로 고정하였다. 이때 외고정기 핀 주위에서 화농성 삼 출물이 나왔다. 방사선 사진에서 핀 주위 골 용해 소견 관찰되었다. 적절한 치료는?",choices:["1 주일에 한번 핀소독", "매일마다 핀 소독", "매일마다 핀 소독 및 변연절제", "핀 제거 및 변연절제", "광범위 절제 및 골수염 치료"],answer:4,explanation:"",question_images:["images/유니온_1권_q106.jpg"],explanation_images:["images/유니온_1권_e106.jpg"]},
  {num:107,section:"유니온 1권",chapter:"외상",question:"대퇴 간부 횡골절에 대해 골수강내 금속정 고정술 치료 후, 9개월에 비후성 불유합 소견이 관찰되었다. 골수정과 교합성 나사 주위로 골음영 감소되었다. 감염소견은 없으며, 하지 정렬은 괜찮았다. 이때 적절한 치료 방침은?",choices:["골수강내 금속정 교체", "교합성 나사 교체", "교합성 나사 제거", "골이식 및 교합성 나사 교체", "지연 나사 추가 삽입"],answer:1,explanation:"",question_images:["images/유니온_1권_q107.jpg"],explanation_images:["images/유니온_1권_e107.jpg"]},
  {num:108,section:"유니온 1권",chapter:"외상",question:"경골 근위 간부 골절에서 골수강내 금속정 삽입을 계획하고 있다. 이때 삽입할 입구 로 적절한 것은?",choices:["내측 경골과간 융기극의 외측 / 경골 조면 직상방", "내측 경골과간 융기극의 외측 / 경골 고평부 관절면 전방", "양 경골과간 융기극 사이 / 경골 조면 직상방", "외측 경골과간 융기극의 내측 / 경골 조면 직상방", "외측 경골과간 융기극의 내측 / 경골 고평부 관절면 전방"],answer:5,explanation:"",question_images:["images/유니온_1권_q108.jpg"],explanation_images:["images/유니온_1권_e108.jpg"]},
  {num:109,section:"유니온 1권",chapter:"외상",question:"전후방 골반환 손상시 골반 압박대 착용을 고려하고 있다. 착용시 올바른 부위와 하 지의 상태를 고르시오.",choices:["위치: 대전자, 하지 상태: 내전 내회전", "위치: 대전자, 하지 상태: 내전 외회전", "위치: 장골능, 하지 상태: 내전 내회전", "위치: 장골능, 하지 상태: 내전 외회전", "위치: 장골능, 하지 상태: 외전 내회전"],answer:1,explanation:"",question_images:["images/유니온_1권_q109.jpg"],explanation_images:["images/유니온_1권_e109.jpg"]},
  {num:110,section:"유니온 1권",chapter:"외상",question:"대퇴 전자하 골절에서 상대적으로 곧은 골수강내 금속정을 사용을 계획하고 있다. 예상되는 합병증?",choices:["골두괴사", "경부골절", "근위부 의인성 골절", "원위부 전방천공", "대퇴 전자 하부 내전"],answer:4,explanation:"",question_images:["images/유니온_1권_q110.jpg"],explanation_images:["images/유니온_1권_e110.jpg"]},
  {num:111,section:"유니온 1권",chapter:"외상",question:"대퇴골 간부 골절에서 골수강내 금속정 고정술 중 관상면상 하지의 부정정렬을 확인 할 수 있는 방법은?",choices:["Back-striking technique", "Cortical step sign", "Diameter difference sign", "Electro-cautery cable technique", "Lesser trochanter shape sign"],answer:4,explanation:"",question_images:["images/유니온_1권_q111.jpg"],explanation_images:["images/유니온_1권_e111.jpg"]},
  {num:112,section:"유니온 1권",chapter:"외상",question:"대퇴골 원위부 골절에서 역행성 골수강내 금속정 고정술을 시행 시 전방 각형성을 예방하기 위한 blocking screw의 위치는?",choices:["원위 골편의 후방", "원위 골편의 전방", "근위 골편의 후방", "근위 골편의 전방", "근위 골편의 내측"],answer:1,explanation:"",question_images:["images/유니온_1권_q112.jpg"],explanation_images:["images/유니온_1권_e112.jpg"]},
  {num:113,section:"유니온 1권",chapter:"외상",question:"수근관절 척측전위(ulnar deviation)시 주상골 및 월상골의 운동 방향으로 옳은 것 은?",choices:["주상골-신전/월상골-신전", "주상골-중립/월상골-신전", "주상골-굴곡/월상골-굴곡", "주상골-굴곡/월상골-신전", "주상골-중립/월상골-굴곡"],answer:1,explanation:"",question_images:["images/유니온_1권_q113.jpg"],explanation_images:["images/유니온_1권_e113.jpg"]},
  {num:114,section:"유니온 1권",chapter:"외상",question:"30세 환자가 2주 전 주먹으로 벽을 가격한 후 발생한 통증으로 내원하였다. 신체검 진 상, 제 3 중수지 관절 후방에서 신전건이 탈구된 모습이 관찰된다. 손상된 구조물 은?",choices:["시상대 (Sagittal band)", "신전 연결건 (Juncturae tendinum)", "신전건 (Extensor tendon)", "Oblique lateral ligament", "종말건 (Terminal tendon)"],answer:1,explanation:"",question_images:["images/유니온_1권_q114.jpg"],explanation_images:["images/유니온_1권_e114.jpg"]},
  {num:115,section:"유니온 1권",chapter:"외상",question:"38세 볼링 선수가 손목 통증을 주소로 내원하였다. 손목의 요배부측에서 4cm 근위 부위 통증을 호소하였고, 신체검진에서 손목 요배부 마찰음과 압통이 있었다. 환자 의 적절한 진단명은?",choices:["교차증후군", "드퀘르뱅 병", "류마티스 관절염", "ECU 건초염", "FCR 건초염"],answer:1,explanation:"",question_images:["images/유니온_1권_q115.jpg"],explanation_images:["images/유니온_1권_e115.jpg"]},
  {num:116,section:"유니온 1권",chapter:"수부",question:"그 수부 20세 여자 환자가 수개월 전부터 발생한 우측 제 4, 5수지의 감각 둔화와 저린감을 주소로 내원하였다. 경추 MRI상 특이소견은 없었다. 신체검진 상 주관절 굴곡, 견관 절 외전, 견관절 외회전시 증상이 악화되었다. 가장 가능성이 있는 진단은?",choices:["경수척수증", "척골관 증후군", "수근관 증후군", "주관 증후군", "흉곽출구증후군"],answer:5,explanation:"",question_images:["images/유니온_1권_q116.jpg"],explanation_images:["images/유니온_1권_e116.jpg"]},
  {num:117,section:"유니온 1권",chapter:"수부",question:"수지 절단으로 내원한 환자를 재접합술 하였다. 수술 6시간 경과 한 후 절단단이 차 가워지고 창백하게 변하였다. 이때 시행할 치료는?",choices:["동맥 혈전 제거 후 혈관 재문합", "수지 거상", "와파린 투여", "혈압 상승제 투여", "정맥 혈전 제거 후 혈관 재문합"],answer:1,explanation:"",question_images:["images/유니온_1권_q117.jpg"],explanation_images:["images/유니온_1권_e117.jpg"]},
  {num:118,section:"유니온 1권",chapter:"수부",question:"32세 남자로 좌측 제 3수지 근위지골 간부의 완전 절단되어 내원하였다. 절단면은 깨끗하였다. 절단 2시간 경과 후 수지 재접합술 시행하였을 때, 골 고정 후 시행할 술 기는?",choices:["건 봉합", "신경 봉합", "동맥 문합", "정맥 문합", "인대 봉합"],answer:1,explanation:"",question_images:["images/유니온_1권_q118.jpg"],explanation_images:["images/유니온_1권_e118.jpg"]},
  {num:119,section:"유니온 1권",chapter:"수부",question:"F 궇 I 21세 남자가 6개월 전 교통사고 후 상완신경총 손상이 발생하여 내원하였다. 근전도 검사에서 제 5, 6 경추 신경근의 완전 손상 소견이 관찰되었고, 그 외 다른 신경근은 모두 정상이었다. 상지의 기능 회복을 위한 신경 이전술을 계획 할 때 알맞게 짝지어 진 것은?",choices:["장흉신경-견갑상신경/액와신경-근피신경", "장흉신경-견갑상신경/척골신경-요골신경", "척추부신경-견갑상신경/액와신경-정중신경", "척추부신경-견갑상신경/척골신경-근피신경", "늑간신경-견갑상신경/액와신경-정중신경"],answer:4,explanation:"",question_images:["images/유니온_1권_q119.jpg"],explanation_images:["images/유니온_1권_e119.jpg"]},
  {num:120,section:"유니온 1권",chapter:"수부",question:"65세 환자가 수근관 증후군을 앓고 있으며 환측 무지구근의 심한 위축이 발생하였 다. 또한 신체검진 상 대립기능의 약화가 관찰되었다. 무지 대립기능의 회복을 위하 여 건 이전술을 고려할 때 가장 적절한 공여건은?",choices:["Extensor carpi radialis brevis", "Abductor digiti minimi", "Flexor digitorum profundus", "Flexor carpi radialis", "Palmaris longus"],answer:5,explanation:"",question_images:["images/유니온_1권_q120.jpg"],explanation_images:["images/유니온_1권_e120.jpg"]},
  {num:121,section:"유니온 1권",chapter:"수부",question:"62세 환자가 3년 전부터 무지 수근중수관절의 통증이 있었다. 신체검사에서 무지 중 수골에 축성 압력을 가하면서 무지를 회전 시켰을 때 심한 통증이 발생하였다. 방사 선 검사에서 대능형중수관절의 관절 간격 감소, 골 경화, 연골하 골낭종, 4mm 크기 의 골극이 있었으며 주상대능형골간 관절에도 진행된 관절염이 있었다. 가장 적절한 치료는?",choices:["대능형골부분절제술 + 개재관절성형술", "대능형 골완전절제술 + 개재관절성형 술", "수근중수관절 고정술", "수근중수관절 관절경적 변연절제술", "수근중수관절 인대 재건술"],answer:2,explanation:"",question_images:["images/유니온_1권_q121.jpg"],explanation_images:["images/유니온_1권_e121.jpg"]},
  {num:122,section:"유니온 1권",chapter:"수부",question:"35세 환자가 8개월 전 넘어진 뒤 발생한 손목관절의 통증으로 내원하였다. 전후방 방사선 사진에서 주상월상골 간격이 5mm였고, 측면 방사선 사진에서 주상월상골 각이 80도 였으며 수근관절의 관절염은 없었다. 수술 소견 상 주상월상골간인대는 완전히 파열되었고 봉합은 불가능해 보였으나, 주상골의 정복은 가능한 상태였다. 가장 적절한 치료는?",choices:["경피적 핀 고정술", "근위 수근골 절제술", "수근관절 유합술", "주상월상골간 인대 재건술", "후방 관절낭 봉합술"],answer:4,explanation:"",question_images:["images/유니온_1권_q122.jpg"],explanation_images:["images/유니온_1권_e122.jpg"]},
  {num:123,section:"유니온 1권",chapter:"수부",question:"32세 환자가 2년 전 류마티스 관절염으로 진단 후 약물치료 시행 중이다. 6개월 전 부터 손목의 통증 및 종창을 호소하며 방사선상 손목관절의 간격은 유지되고 있다. 적절한 치료는?",choices:["Proximal row carpectomy", "4-corner fusion", "Wrist arthrodesis", "Wrist arthroplasty", "Synovectomy"],answer:5,explanation:"",question_images:["images/유니온_1권_q123.jpg"],explanation_images:["images/유니온_1권_e123.jpg"]},
  {num:124,section:"유니온 1권",chapter:"수부",question:"50세 환자가 2년전 부터 발생한 lateral epicondylitis에 대하여 수술적 치료를 계획 중이다. 관절경적 수술보다 관혈적 수술에 적합한 것은?",choices:["우세수", "1년 이상의 이환기간", "극심한 통증", "활동적인 환자", "후외측 불안정성 동반"],answer:5,explanation:"",question_images:["images/유니온_1권_q124.jpg"],explanation_images:["images/유니온_1권_e124.jpg"]},
  {num:125,section:"유니온 1권",chapter:"수부",question:"27세 환자가 액와 부위의 열상으로 척골신경의 손상을 입었다. 열상부위에서 척골신 경에 대한 봉합을 시행하였다. 이에 추가적으로 기능 회복을 위해 신경 이전을 할 때 적절한 공여부위는?",choices:["근피신경", "액와신경", "Anterior interosseous nerve", "Posterior interosseous nerve", "흉배신경"],answer:3,explanation:"",question_images:["images/유니온_1권_q125.jpg"],explanation_images:["images/유니온_1권_e125.jpg"]},
  {num:126,section:"유니온 1권",chapter:"수부",question:"키엔벡 환자에서 치료 방침을 정할 때, 월상골 보존 수술과 구제 수술을 결정하는 가 장 중요한 인자는?",choices:["월상골 경화", "월상골 골절", "월상골 높이", "월상골 혈액순환", "주상골의 고정된 회전"],answer:5,explanation:"",question_images:["images/유니온_1권_q126.jpg"],explanation_images:["images/유니온_1권_e126.jpg"]},
  {num:127,section:"유니온 1권",chapter:"수부",question:"30세 컴퓨터 프로그램 개발자가 외상력 없이 2년 전부터 손목의 척측부위 통증을 호소했다. 신체검진 상 손목을 신전, 척측 변위, 회내전 시 통증이 발생하였고, 수근 관절 불안정성은 없었다. 방사선 소견상 관절면은 잘 보존되어있었고, 3mm의 척골 양성 변위가 확인되었다. 1년간의 보존적 치료에도 통증 호전 없었다. 이에 가장 적 절한 치료 방법은?",choices:["요골 경상돌기 제거", "DRUJ 제거술", "척골 단축술", "Sauve-kapandji procedure", "수근관절 유합술"],answer:3,explanation:"",question_images:["images/유니온_1권_q127.jpg"],explanation_images:["images/유니온_1권_e127.jpg"]},
  {num:128,section:"유니온 1권",chapter:"수부",question:"35세 남성이 5년 전 넘어지면서 발생한 손목 통증을 주소로 내원하였다. 손목 요측 에 통증이 있으며, 수근관절에 중등도의 운동 제한이 있었다. 방사선 검사상 주상골 요부의 불유합 및 굴곡 변형이 동반되었으며 관절염은 없었다. 주상-월상각은 70도 로 확인되었다. 이에 대한 치료로 적절한 것을 고르시오",choices:["경피적 내고정", "근위 수근골 절제술", "전방골이식+내고정", "4-코너 유합술", "혈관부착 골이식"],answer:3,explanation:"",question_images:["images/유니온_1권_q128.jpg"],explanation_images:["images/유니온_1권_e128.jpg"]},
  {num:129,section:"유니온 1권",chapter:"수부",question:"원위지골의 배부에 5mm 크기의 종괴를 주소로 내원하였다. 종괴를 터트리니 볏짚 같은 진물이 나왔다. 그동안 수 차례 반복적인 종괴의 호전과 재발을 보인 경우 가장 적절한 치료는?",choices:["항생제", "물리치료", "석고붕대 고정", "종괴제거 및 골극제거", "절단"],answer:4,explanation:"",question_images:["images/유니온_1권_q129.jpg"],explanation_images:["images/유니온_1권_e129.jpg"]},
  {num:130,section:"유니온 1권",chapter:"수부",question:"65세 환자가 제 5 중수지관절과 근위지 관절의 구축을 주소로 내원하였다. 중수지관 절의 굴곡 구축은 40도이고 근위지 관절은 30도이다. 현재 일상생활을 하기에 불편 감이 매우 심하였다. 적절한 치료는?",choices:["스테로이드 주사", "건막절개술", "건막절제술", "보존적 치료", "건이식술"],answer:3,explanation:"",question_images:["images/유니온_1권_q130.jpg"],explanation_images:["images/유니온_1권_e130.jpg"]},
  {num:131,section:"유니온 1권",chapter:"견·주관절",question:"교시견주관절 젊은 남자가 경부 후방 삼각에서 조직검사를 시행하였다. 조직검사 이후 동측 견관 절의 전방 굴곡 및 외회전이 되지 않아 내원하였다. 내원하여 시행한 신체검사 상 견 갑골이 후방 돌출 되었으며, 외측 하방 전위를 보였다. 관련 있는 구조물은?",choices:["Trapezius", "Serratus anterior", "Rhomboid", "Levator scapulae", "Latissimus dorsi"],answer:1,explanation:"",question_images:["images/유니온_1권_q131.jpg"],explanation_images:["images/유니온_1권_e131.jpg"]},
  {num:132,section:"유니온 1권",chapter:"견·주관절",question:"주관절 외상성 탈구를 도수 정복 이후 보존적 치료 하였다. 이후 주관절 굴곡 구축이 50도, 후속 굴곡이 135도로 관찰되었다. 방사선 사진 상, 이소성 골화는 보이지 않았 다. 주관절 구축의 원인은?",choices:["내측측부인대의 전방 밴드", "내측측부인대의 사선 밴드", "내측측부인대의 후방 밴드", "주두 골극", "전방 관절낭"],answer:5,explanation:"",question_images:["images/유니온_1권_q132.jpg"],explanation_images:["images/유니온_1권_e132.jpg"]},
  {num:133,section:"유니온 1권",chapter:"견·주관절",question:"쇄골 간부의 분쇄 골절에 대해 관혈적 정복술 및 금속판 고정을 시행하였다. 이후 견 관절 외전 장애와 주관절 신전 장애, 수근관절 신전 장애 와 중수지관절의 신전 장애 가 발생하였다. 손상된 부위는?",choices:["상완신경총의 제 5,6 경추 신경근", "상완신경총의 제 8 경추 신경근, 제 1 흉추 신경근", "상완신경총의 외측 코드", "상완신경총의 후방 코드", "상완신경총의 내측 코드"],answer:4,explanation:"",question_images:["images/유니온_1권_q133.jpg"],explanation_images:["images/유니온_1권_e133.jpg"]},
  {num:134,section:"유니온 1권",chapter:"견·주관절",question:"65세 여자기 우측 견관절 전방 탈구로 내원하여 도수 정복 후 보존적 치료를 시행하 였다. 3개월 후 우측 견관절의 외전 및 전방 거상 제한이 발생하였다. 삼각근 위축 소 견은 없을 때 원인은?",choices:["Suprascapular n. 손상", "SLAP(superior labrum anterior to posterior)", "Axillary n. 손상", "SST(supraspinatus)/IST(infraspinatus) tear", "Adhesive capsulitis"],answer:4,explanation:"",question_images:["images/유니온_1권_q134.jpg"],explanation_images:["images/유니온_1권_e134.jpg"]},
  {num:135,section:"유니온 1권",chapter:"견·주관절",question:"50세 남자가 우측 견관절 통증 및 근력저하로 내원하였다. 우측 견관절이 좌측에 비 해 외회전이 심하게 되며, 초음파 검사상 biceps long head tendon 이 내측으로 탈 구되는 소견이 관찰된다. 다음 중 양성 소견을 보이는 신체검사는?",choices:["Drop arm sign", "Empty can test", "Hornblower test", "External rotation lag sign", "Lift off test"],answer:5,explanation:"",question_images:["images/유니온_1권_q135.jpg"],explanation_images:["images/유니온_1권_e135.jpg"]},
  {num:136,section:"유니온 1권",chapter:"견·주관절",question:"견관절 전방 탈구 환자가 심한 이enoid 골 결손이 발생하였다. 이에 대한 치료로 오 구돌기 이전술을 시행하였다. 이때, 견관절 외전, 외회전 및 골두의 전방 안정성에 기 여하는 구조물은?",choices:["Biceps long head tendon", "Conjoined tendon", "Inferior glenohumeral ligament", "Coracoacromial ligament", "Coracohumeral ligament"],answer:2,explanation:"",question_images:["images/유니온_1권_q136.jpg"],explanation_images:["images/유니온_1권_e136.jpg"]},
  {num:137,section:"유니온 1권",chapter:"견·주관절",question:"견관절 전치환술 예정이다. 수술 도중 관절와 부분을 더 잘 보이게 하기 위해 가장 중요한 과정은?",choices:["견갑하근 유착 유리", "대흉근 부착부위 부분 절개", "상완 이두 장두건 부착부 유리", "하방 관절낭유리", "상방 관절낭 유리"],answer:4,explanation:"",question_images:["images/유니온_1권_q137.jpg"],explanation_images:["images/유니온_1권_e137.jpg"]},
  {num:138,section:"유니온 1권",chapter:"견·주관절",question:"23세 여자가 물건을 들 때 발생하는 양측 어깨 통증으로 내원하였다. 양측 견관절의 sulcus sign은 3+/3+ 이며, 양측 엄지가 전완부에 닿고, 양측 주관절의 10도 이상 과 신전되며, 양측 genu recurvatumO| 있다. 치료는?",choices:["견갑골 안정화 운동", "전방 관절낭 신장운동", "후방 관절낭 신장운동", "삼각근 후방 신장운동", "삼각근 전방 신장운동"],answer:1,explanation:"",question_images:["images/유니온_1권_q138.jpg"],explanation_images:["images/유니온_1권_e138.jpg"]},
  {num:139,section:"유니온 1권",chapter:"견·주관절",question:"21세 남자 환자가 견관절 전방 불안정성으로 내원하였다. 이학적 검사상 apprehension test 양성 소견이 있었다. M이와 CT에서 bony bankart Iesion0| 확 인되었고, 그 크기는 glenoid 전방 18% defect가 있었다. 상완골두에 Hill-Sachs lesion을 감안한 track을 계산했을 때 off track이었다. 이 환자의 적절한 치료는?",choices:["관절경적 bankart repair", "관절경적 bankart repair + remplissage", "관혈적 bankart repair + 하방 관절낭 중첩술", "오구돌기 이전술", "오구돌기 이전술 + 골이식"],answer:2,explanation:"",question_images:["images/유니온_1권_q139.jpg"],explanation_images:["images/유니온_1권_e139.jpg"]},
  {num:140,section:"유니온 1권",chapter:"견·주관절",question:"52세 여자 환자가 우측 어깨 통증을 주소로 내원하였다. 어깨 통증은 4개월 전부터 시작되어 1개월 전부터 심해졌으며 일상생활이 힘들고 주로 야간통을 호소하였다. MRI에서 특이소견은 없었으며, 수동적 관절 범위는 further flexion0| 120도, ER0| 30도, IR0| L5였다. 진통소염제 복용에도 증상이 호전되지 않을 때, 관절운동과 함 께 사용할만한 치료는?",choices:["관절강내 스테로이드 주사", "관절경적 관절낭 이완술", "마취하 도수조작술", "수압 팽창술", "체외충격파"],answer:1,explanation:"",question_images:["images/유니온_1권_q140.jpg"],explanation_images:["images/유니온_1권_e140.jpg"]},
  {num:141,section:"유니온 1권",chapter:"견·주관절",question:"심한 회전근개 관절병증을 앓고 있는 환자에서 견관절 역 전치환술(reverse total shoulder replacement arthroplasty)을 하고자 한다. 이 환자에서 수술 후 일상생 활에서 뒷머리를 빗질하고 수저를 들기 위한 인공관절 술식은?",choices:["155 degree neck shaft stem", "Lateralized humeral component", "Pectoralis major transfer", "Retroversion 0 degree head cutting", "Superior tilted glenoid component"],answer:2,explanation:"",question_images:["images/유니온_1권_q141.jpg"],explanation_images:["images/유니온_1권_e141.jpg"]},
  {num:142,section:"유니온 1권",chapter:"견·주관절",question:"주관절 외상과염 환자에서 extensor carpi radialis brevis(ECRB) 절제술 시행 후 통 증은 사라졌으나 손을 짚고 일어날 때 주관절 불안정성을 호소하였다. 상기 증상의 원인은?",choices:["수술부위 감염", "불충분한 신전건 제거", "내상과염 발생", "주관절 내측부인대손상", "주관절 외측측부인대손상"],answer:5,explanation:"",question_images:["images/유니온_1권_q142.jpg"],explanation_images:["images/유니온_1권_e142.jpg"]},
  {num:143,section:"유니온 1권",chapter:"견·주관절",question:"전방십자인대 보존적 치료에도 호전되지 않는 견관절 유착성 관절낭염 환자에서 관절경을 이용하 여 하방 관절낭 유리술 시행 후 신경 손상이 발생하였다. 이와 관련된 증상은?",choices:["견관절 외전 장애", "견관절 외회전 장애", "수근관절 굴곡장애", "수근관절 신전장애", "주관절 굴곡장애"],answer:1,explanation:"",question_images:["images/유니온_1권_q143.jpg"],explanation_images:["images/유니온_1권_e143.jpg"]},
  {num:144,section:"유니온 1권",chapter:"견·주관절",question:"27세 투수가 투구 후 우측 어깨 후방에 불편감과 통증을 호소하였다. 또한 제구력이 감소하고 신체검진 상 외회전의 증가 내회전의 감소가 관찰되었다. 적절한 진단은?",choices:["견갑하건파열", "이두근 장두 탈구", "유착성관절염", "내적 충돌증후군", "후방불안정"],answer:4,explanation:"",question_images:["images/유니온_1권_q144.jpg"],explanation_images:["images/유니온_1권_e144.jpg"]},
  {num:145,section:"유니온 1권",chapter:"견·주관절",question:"중년 남성이 낙상 후 요골두 골절이 발생하였다. 요골두 전위는 1mm였고, 단일 골편 은 요골두의 25%를 침범하였다. 국소 마취 후 주관절 회전 운동 시 제한은 없었다. 치료는?",choices:["1주 부목고정 후 관절운동", "골유합까지 부목고정 후 관절운동", "경피적 핀 고정술", "골편 제거술", "요골두 치환술"],answer:1,explanation:"",question_images:["images/유니온_1권_q145.jpg"],explanation_images:["images/유니온_1권_e145.jpg"]},
  {num:146,section:"유니온 1권",chapter:"족부·족관절",question:"40세 남성이 갑자기 시작된 우측 제 1 족지 중족지 관절의 부종, 통증, 열감을 주소 로 내원하였다, 1년 전에도 비슷한 증상이 있었고, 당시 1주만에 호전되었던 적이 있 다. 초음파상 double contour sign이 관찰되었다. 적절한 치료는?",choices:["요산 배설제", "요산 저하제", "항생제", "절개배농술", "스테로이드 국소 주사"],answer:5,explanation:"",question_images:["images/유니온_1권_q146.jpg"],explanation_images:["images/유니온_1권_e146.jpg"]},
  {num:147,section:"유니온 1권",chapter:"족부·족관절",question:"족관절 골절에서 경골의 후방 골절편의 관혈적 정복을 위해 후외측 접근을 하려고 한다. 다음 중 어느 방향으로 접근해야 하는가?",choices:["비골과 비골건 사이", "단비골건과장비골건 사이", "비골건과 장무지굴곡건 사이", "장무지굴곡건과 단무지굴곡건 사이", "장무지굴곡건과 아킬레스건 사이"],answer:3,explanation:"",question_images:["images/유니온_1권_q147.jpg"],explanation_images:["images/유니온_1권_e147.jpg"]},
  {num:148,section:"유니온 1권",chapter:"족부·족관절",question:"20세 남자가 2년 전 pilon fracture로 관혈적 정복술 및 내고정술 시행하였다. 이후 심한 족관절 통증을 호소하며, 관절 가동 범위는 50%로 감소하였다. 방사선 검사상 족관절의 역학적 정렬은 정상이었고, 족관절의 congruency는 유지되었으나, 경골과 거골의 간격이 감소해 있다. 가장 적절한 수술은?",choices:["관절경하 변연절제술", "과상 교정 절골술", "신전 관절 성형술", "족관절 유합술", "인공 족관절 치환술"],answer:3,explanation:"",question_images:["images/유니온_1권_q148.jpg"],explanation_images:["images/유니온_1권_e148.jpg"]},
  {num:149,section:"유니온 1권",chapter:"족부·족관절",question:"24세 여자가 4개월 전 우측 발목을 삐는 수상 이후 족관절 외측의 불안정성이 지 속되고 있다. 수상 당시 특별한 치료는 받지 않았다고 한다. 현재 이학적 검사상 신 경학적 증상은 없었고 족관절 외측 불안정성 지속되며, 내반 부하 영상 검사(varus stress「adiograph)상 좌측 거골각 4도, 우측 거골각 6도로 측정되었다. 가장 적절한 치료는?",choices:["보조기 착용 하 일상생활 복귀", "외번 근육 강화운동 및 재활운동", "신전지대건을 이용한 외측 건 봉합술 및 보강술", "비골건을 이용한 비해부학적 재건", "동종건을 이용한 해부학적 재건"],answer:2,explanation:"",question_images:["images/유니온_1권_q149.jpg"],explanation_images:["images/유니온_1권_e149.jpg"]},
  {num:150,section:"유니온 1권",chapter:"족부·족관절",question:"경골 관절염 치료로 과상부 경골 절골술(supramalleolar osteotomy)을 시행하기로 하였다. 필요한 적절한 tibial anterior surface angle의 각도는?",choices:["80", "85", "90", "95", "100"],answer:4,explanation:"",question_images:["images/유니온_1권_q160.jpg"],explanation_images:["images/유니온_1권_e160.jpg"]},
  {num:151,section:"유니온 1권",chapter:"족부·족관절",question:"젊은 남자가 스키를 타다가 발목을 접질렀다. 계단을 오르내릴 때 불편감을 느끼고, 족근관절 족배굴곡시 후외측에서 클릭이 느껴졌고 해당 부위 압통이 있었다. 현재 환자 상태를 유발한 해부학적 구조는?",choices:["Superior peroneal retinaculum", "Inferior peroneal retinaculum", "Calcaneofibular ligament", "Superior extensor retinaculum", "Inferior extensor retinaculum"],answer:1,explanation:"",question_images:["images/유니온_1권_q150.jpg"],explanation_images:["images/유니온_1권_e150.jpg"]},
  {num:152,section:"유니온 1권",chapter:"족부·족관절",question:"45세 여자가 족부 제 1족지 건막류 부위 통증과 외반 변형이 있었다. 무지외반각도 (HVA)는 50도, 중족지간각도(IMA)는 20도였다. 신체검진 상 1st ray instability?)- 존재하였다. 이 환자를 수술할 때, 원위 연부조직 유리술과 함께 시행할 술기는?",choices:["1st중족_족지골 유합술", "1st 중곡골 원위 절골술", "1st 중족골 간부 절골술", "1st 중곡골 근위 절골술", "1st 족근-중족골 유합술"],answer:5,explanation:"",question_images:["images/유니온_1권_q151.jpg"],explanation_images:["images/유니온_1권_e151.jpg"]},
  {num:153,section:"유니온 1권",chapter:"족부·족관절",question:"23세 군인이 훈련할 때 뒤꿈치 통증이 심해졌다. 외상의 병력은 없었고 신체검사 상 종골 양측을 압박할 때 통증이 유발되었다. 처음 치료로 적절한 것은?",choices:["활동경감", "스트레칭 운동", "비스테로이드성 소염제", "석고고정", "종골 골극 절제"],answer:1,explanation:"",question_images:["images/유니온_1권_q152.jpg"],explanation_images:["images/유니온_1권_e152.jpg"]},
  {num:154,section:"유니온 1권",chapter:"족부·족관절",question:"50세 여자가 4주전부터 뒤꿈치 통증이 발생하였다. 아침에 일어나서 첫 발을 디딜 때 통증이 심하였으며, 조금 지나면 괜찮다가 많이 걸으면 다시 아파하였다. 치료로 가장 적절한 것은?",choices:["스트레칭 운동", "스테로이드 국소주사", "4주간 석고 고정", "체외충격파", "족저근막 부분절제 및 종골 골극 절제술"],answer:1,explanation:"",question_images:["images/유니온_1권_q153.jpg"],explanation_images:["images/유니온_1권_e153.jpg"]},
  {num:155,section:"유니온 1권",chapter:"족부·족관절",question:"60세 여자 환자가 족관절 내과 전하측 통증으로 내원하였다. 신체검사 상 후경골근 주행 방향을 따라 압통이 있었으며, 일측 발뒤꿈치 올림(single heel rise)을 하지 못 하였고 기립 시 내측 세로궁 소실이 있었다. 관절 강직은 없었고 방사선 검사에서 관 절염은 없었다. 거골두의 15%가 덮여있지 않았다. 3개월간 비스테로이드성 소염제, 물리치료, 교정 깔창 등 시행하였으나 호전은 없었다. 다음 단계 치료로 적절한 것 은?",choices:["스테로이드 국소 주사", "후경골근 활액막 제거술", "거골하관절 제동", "종골 내측 전위 절골술", "삼중 관절 고정술"],answer:4,explanation:"",question_images:["images/유니온_1권_q154.jpg"],explanation_images:["images/유니온_1권_e154.jpg"]},
  {num:156,section:"유니온 1권",chapter:"족부·족관절",question:"당뇨병이 있는 55세 환자로 첨족이 있으며 족저부에 골과 건이 노출되어있다. 건을 따라 농이 나오는 상태이다. 족배 동맥 혈류는 촉지 되었으나 혈관조영술상 중등도 동맥 협착을 보이고 있다. 가장 먼저 해야 할 치료는?",choices:["변연절제술", "아킬레스 건 연장술", "전접촉 석고고정", "중족골 절단술", "혈관성형술"],answer:5,explanation:"",question_images:["images/유니온_1권_q155.jpg"],explanation_images:["images/유니온_1권_e155.jpg"]},
  {num:157,section:"유니온 1권",chapter:"족부·족관절",question:"70세 남자가 10년 전 좌측 족관절 유합술 시행하였다. 6개월 전부터 우측 발목 통증 으로 보행 힘들어 내원하였다. 단순 방사선상 K-L grade IV의 관절염 소견과 내반 변 형이 10도 있었다. 신체검진 상 불안정성은 없다. 상기 환자의 치료로 적절한 것은?",choices:["과상부 교정절골술", "과상부 교정절골술 및 관절경적 변연절제술", "관절경적 변연절제술", "과상부 교정절골술 및 인공관절 치환술", "족관절 인공관절 전치환술"],answer:5,explanation:"",question_images:["images/유니온_1권_q156.jpg"],explanation_images:["images/유니온_1권_e156.jpg"]},
  {num:158,section:"유니온 1권",chapter:"족부·족관절",question:"20세 남자 환자가 울퉁불퉁한 길을 걷기 힘들어한다. 족저부 내측 통증을 호소하였 고 내과 하방에 단단한 융기가 촉지되었다. 진단명은?",choices:["거골 골연골 병변", "거종결합", "족근관 증후군", "요 내반족", "후 경골건 부전증"],answer:2,explanation:"",question_images:["images/유니온_1권_q157.jpg"],explanation_images:["images/유니온_1권_e157.jpg"]},
  {num:159,section:"유니온 1권",chapter:"족부·족관절",question:"70세 남자 환자가 당뇨족으로 중족골 절단을 고려하고 있다. 중족골 절단 시 보존 해 야하는 건으로 알맞은 것은?",choices:["단비골건/전경골건", "단비골건/후경골건", "삼비골건/전경골건", "삼비골건/후경골건", "장비골건/후경골건"],answer:1,explanation:"",question_images:["images/유니온_1권_q158.jpg"],explanation_images:["images/유니온_1권_e158.jpg"]},
  {num:160,section:"유니온 1권",chapter:"족부·족관절",question:"45세 남자가 발목에 간헐적인 통증이 있었다. 통증은 활동 시 심해지다 저절로 호전 되는 양상을 반복하였다. 신체검사에서 발목 전내측에 압통이 있었다. 방사선 검사 에서 거골 내측의 음영 감소가 관찰되었다. 이 질환의 가장 흔한 원인은?",choices:["감염성 질환", "내분비 질환", "무혈성 괴사", "염증성 질환", "외상"],answer:5,explanation:"",question_images:["images/유니온_1권_q159.jpg"],explanation_images:["images/유니온_1권_e159.jpg"]},
  {num:1,section:"유니온 2권",chapter:"수부",question:"다음 A와 같은 소견이 보여 B와 같은 수술을 하였다. 수술 중 그림 C와 같은 작업을 시행하였다. 그림 C 수술 과정에 대한 설명으로 적절한 것은?",choices:["주상골 신전 변형 교정", "월상골 신전 변형 교정", "주상골 굴곡 변형 교정", "월상골 굴곡 변형 교정", "삼각골 신전 변형 교정"],answer:2,explanation:"",question_images:["images/유니온_2권_q001.jpg"],explanation_images:["images/유니온_2권_e001.jpg"]},
  {num:2,section:"유니온 2권",chapter:"수부",question:"불안정성 주두 골절로 금속판 고정술을 받고 사진과 같은 손의 마비가 발생하였다. 손상 받은 신경은?",choices:["요골신경", "전골간신경", "정중신경", "척골신경", "후골간신경"],answer:2,explanation:"",question_images:["images/유니온_2권_q002.jpg"],explanation_images:["images/유니온_2권_e002.jpg"]},
  {num:3,section:"유니온 2권",chapter:"수부",question:"50세 여자 환자 3개월 전 원위 요골 골절에 대해 수술적 치료를 시행 받은 후 석고고 정을 하였다. 석고를 제거한 후부터 수부의 부종을 동반한 통증과 저린감이 발생하 였다. 수근관절의 full ROM이 가능하지 않았다. 근전도 검사상 이상 소견은 관찰되 지 않았다. 다음 중 적절한 진단은?",choices:["신전건 부전", "굴곡건 부전", "수근관 증후군", "CRPS Type I", "CRPS Type II"],answer:4,explanation:"",question_images:["images/유니온_2권_q003.jpg"],explanation_images:["images/유니온_2권_e003.jpg"]},
  {num:4,section:"유니온 2권",chapter:"수부",question:"50세 남자가 악화되는 손목의 척측 통증으로 내원하였다. 신체검사는 동영상과 같 으며 방사선 검사는 아래 사진과 같았다. 이 환자의 적절한 진단은? 동영상에서, 수근관절을 척측 변위하고 회외전하면 tendon의 poppingO| 관찰된다. (https://youtu.be/PNcKBIm96us)",choices:["Flexor carpi radialis instability", "Scapholunate dissociation", "Extensor carpi ulnaris instability", "Distal radio니nar joint instability", "Ulnar impaction syndrome"],answer:3,explanation:"",question_images:["images/유니온_2권_q004.jpg"],explanation_images:["images/유니온_2권_e004.jpg"]},
  {num:5,section:"유니온 2권",chapter:"수부",question:"손목의 요측 부위 통증이 몇 개월 전 시작하여 최근 악화되었다. 환자의 방사선 사진 과 MRI 사진이다. 적절한 진단은?",choices:["Scaphoid nonunion", "Ganglion cyst", "Scapholunate dissociation", "Scaphotrapeziotrapezoidal arthritis", "Wrist infection"],answer:4,explanation:"",question_images:["images/유니온_2권_q005.jpg"],explanation_images:["images/유니온_2권_e005.jpg"]},
  {num:6,section:"유니온 2권",chapter:"수부",question:"20세 남자 환자가 손목 통증을 호소하여 촬영한 방사선 사진 소견이다. Percutaneous screw fixation을 어느 방향으로 하는가?",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_2권_q006.jpg"],explanation_images:["images/유니온_2권_e006.jpg"]},
  {num:7,section:"유니온 2권",chapter:"수부",question:"축전성 다지증(preaxial polydactyly) 중 가장 흔한 유형은?",choices:["Wassel type 1", "Wassel type 2", "Wassel type 3", "Wassel type 4", "Wassel type 5"],answer:4,explanation:"",question_images:["images/유니온_2권_q092.jpg"],explanation_images:["images/유니온_2권_e092.jpg"]},
  {num:8,section:"유니온 2권",chapter:"수부",question:"4개월 전 우측 전완부의 골절로 수술 후 심한 통증이 있었으나 경과관찰 하였다. 이 후 발생한 변형으로 내원한 환자로 손목은 굴곡, 무지는 내전, 제 2,3,4,5 수지의 중 수지 관절은 신전, 지간 관절은 굴곡 상태로 구축되었다. 중수지 관절은 신전은 가능 하나 후속 굴곡은 30도까지만 가능하였다. 정중신경과 척골신경이 분포하는 영역에 서 감각의 30% 손실이 있었다. 이 환자에게 가장 적절한 치료는?",choices:["Dynamic splinting & stretching", "Tendon lengthening", "Muscle sliding", "Tendon transfer", "Muscle transfer using the gracilis muscle"],answer:3,explanation:"",question_images:["images/유니온_2권_q007.jpg"],explanation_images:["images/유니온_2권_e007.jpg"]},
  {num:9,section:"유니온 2권",chapter:"수부",question:"tendon repair suture에서 core suture는 몇 strand인7b?",choices:["2", "3", "4", "6", "12"],answer:4,explanation:"",question_images:["images/유니온_2권_q008.jpg"],explanation_images:["images/유니온_2권_e008.jpg"]},
  {num:10,section:"유니온 2권",chapter:"수부",question:"상완골 골절 이후 high radial nerve palsy가 발생하였다. 이후 신경이전술을 시행하 였지만 엄지를 제외한 제 2-5 수지의 신전 기능은 회복되었으나, 엄지의 신전은 회 복되지 않았다. 건이전술을 고려할 때 자주 사용되는 donor tendon은?",choices:["Palmaris longus", "Flexor carpi radialis", "Extensor carpi radialis longus", "Extensor carpi radialis brevis", "Flexor indicis proprius"],answer:1,explanation:"",question_images:["images/유니온_2권_q009.jpg"],explanation_images:["images/유니온_2권_e009.jpg"]},
  {num:11,section:"유니온 2권",chapter:"수부",question:"30세 남자 환자가 넘어진 후 발생한 후 엄지 통증을 주소로 내원하였다. 방사선 사 진상 아래와 같았다. 이에 대한 수술을 할 때 중수골의 간부를 정복하기 위한 방향 은?",choices:["내전 굴곡 회내전", "내전 신전 회내전", "외전 굴곡 회외전", "외전 신전 회내전", "외전 신전 회외전"],answer:4,explanation:"",question_images:["images/유니온_2권_q010.jpg"],explanation_images:["images/유니온_2권_e010.jpg"]},
  {num:12,section:"유니온 2권",chapter:"수부",question:"65세 류마티스 관절염 환자로 수개월 전부터 사진 A와 같은 임상 증상을 보였고 수 부 감각의 이상 소견은 발견되지 않았다. 촬영한 단순 방사선 사진은 아래와 같다. 가 장 적절한 치료는?",choices:["건이전술", "건봉합술", "건이전술 + 척골 단축술", "신경탐색술", "건이전술 + 원위 척골 절제술"],answer:5,explanation:"",question_images:["images/유니온_2권_q011.jpg"],explanation_images:["images/유니온_2권_e011.jpg"]},
  {num:13,section:"유니온 2권",chapter:"견·주관절",question:"50세 남자가 팔을 뻗으며 넘어진 이후 좌측 어깨 주위 통증이 있다. 동영상과 같은 신체검사 소견이 관찰되었다 (팔꿈치를 구부려서 뒤쪽으로 내회전시킨 후 검사자는 대상자의 등 뒤에서 손바닥에 저항을 가함 = lift-off test). 방사선 사진에서는 특별한 이상 소견은 없었으며, 연부조직의 이상을 평가하기 위해 초음파 검사를 계획하였다. 환자의 병변을 관찰하기 가장 좋은 검사 자세와 초음파 변환기의 위치는?",choices:["Supraspinatus long axis view", "Supraspinatus short axis view", "Infraspinatus long axis view", "Biceps long head short axis view", "Subscapularis long axis view"],answer:5,explanation:"",question_images:["images/유니온_2권_q093.jpg"],explanation_images:["images/유니온_2권_e093.jpg"]},
  {num:14,section:"유니온 2권",chapter:"견·주관절",question:"반복적인 어깨 탈구 환자의 견관절 MR arthrogram이다. 화살표가 표시하는 구조를 관절경 영상에서 고르시오.",choices:["1", "2", "3", "4", "5"],answer:5,explanation:"",question_images:["images/유니온_2권_q012.jpg"],explanation_images:["images/유니온_2권_e012.jpg"]},
  {num:15,section:"유니온 2권",chapter:"견·주관절",question:"극심한 견관절 통증을 주소로 응급실로 내원한 환자로, 단순 방사선 사진 (A, B) 및 견갑하건의 short axis view이다. 다음 질환의 병기는?",choices:["Pre-calcific stage", "Formative phase", "Resting phase", "Resorptive phase", "Post-calcific stage"],answer:4,explanation:"",question_images:["images/유니온_2권_q013.jpg"],explanation_images:["images/유니온_2권_e013.jpg"]},
  {num:16,section:"유니온 2권",chapter:"견·주관절",question:"아래 사진은 좌측 견관절의 삼각흉근 도달법의 동영상이다. 화살표가 가리키는 해부 학적 구조물은?",choices:["Biceps brachii long head", "Brachialis muscle", "Conjoined tendon", "Pectoralis major muscle", "Subscapularis muscle"],answer:4,explanation:"",question_images:["images/유니온_2권_q014.jpg"],explanation_images:["images/유니온_2권_e014.jpg"]},
  {num:17,section:"유니온 2권",chapter:"견·주관절",question:"1개월 전 두부 손상으로 의식이 없던 25세 남자가 의식이 회복된 후 발생한 주관절 주위 통증 및 운동 범위 제한을 주소로 내원하였다. 아래 방사선 사진과 핵의학 검사 결과이다. 가장 적절한 치료는?",choices:["방사선 추시 관찰", "관절 수동술", "관혈적 절제술", "관혈적 관절막 봉합술", "관절경적 관절막 절제술"],answer:1,explanation:"",question_images:["images/유니온_2권_q015.jpg"],explanation_images:["images/유니온_2권_e015.jpg"]},
