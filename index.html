  {name:"2025 인트레이닝",icon:"📙",file:"2025 인트레이닝 복원.pdf"},
  {name:"2025년 1차 기출",icon:"📒",file:"2025 전문의 1차 기출.docx"},
  {name:"2026 전문의 시험",icon:"📝",file:"2026년 전문의 시험.pdf"}
];
const SECTIONS=SECTION_DEFS.map(s=>({...s,questions:QUESTIONS.filter(q=>q.section===s.name)}));

let currentQ=null,currentQIdx=-1,currentSectionIdx=-1,wrongNotes=[],memoNotes=[],viewData={},answerData={},repeatMarks={},currentMemoTab='wrong',currentMemoFilter='all',appInitialized=false;
let viewMode='welcome';
/* ☕ 신규 기능 상태 */
let mnemonics=[],studyLog={},examHistory=[],dailyGoal=20,pendingMemoImg=null,userExpl=[],pendingExplImg=null,explEditOpen=false,editingExplId=null;
let flashDeck=[],flashIdx=0,flashFlipped=false,flashStudied=null,flashTitle='',flashTotal=0;
let examQuestions=[],examIdx=0,examAnswers={},examStartTs=0,examTimerId=null,examLimitSec=0,examConfig={mode:'section',sections:[],chapters:[],count:20,timer:true};

function escapeHtml(t){const d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML;}
function timeAgo(ts){const d=Date.now()-ts,s=Math.floor(d/1000);if(s<60)return'방금 전';const m=Math.floor(s/60);if(m<60)return m+'분 전';const h=Math.floor(m/60);if(h<24)return h+'시간 전';const dy=Math.floor(h/24);if(dy<30)return dy+'일 전';return new Date(ts).toLocaleDateString('ko-KR');}
function getQKey(q){if(!q)return '';return q.section+'_'+(q.chapter||'')+'_'+q.num;}

function migrateAnswerData(){let changed=0;const qMap={};QUESTIONS.forEach(q=>{qMap[getQKey(q)]=q;});Object.keys(answerData).forEach(k=>{const q=qMap[k];if(!q)return;const a=answerData[k];const qAns=parseInt(q.answer,10);const shouldBeCorrect=a.selected===qAns;if(a.correct!==shouldBeCorrect){a.correct=shouldBeCorrect;changed++;}});if(changed>0)syncToCloud();return changed;}

/* 단원 신규부여(504문항)로 qKey가 'section__num'→'section_단원_num'으로 바뀜 → 기존 진도 데이터 키 이전(데이터 보존) */
function migrateChapterKeys(){
  let moved=0;const oldToNew={};
  QUESTIONS.forEach(q=>{if(!q.chapter)return;const newK=getQKey(q);const oldK=q.section+'__'+q.num;if(oldK!==newK)oldToNew[oldK]=newK;});
  const remapObj=(obj)=>{if(!obj)return;Object.keys(oldToNew).forEach(oldK=>{const newK=oldToNew[oldK];if(obj[oldK]!==undefined){if(obj[newK]===undefined)obj[newK]=obj[oldK];delete obj[oldK];moved++;}});};
  remapObj(answerData);remapObj(viewData);remapObj(repeatMarks);
  [memoNotes,mnemonics,userExpl].forEach(arr=>{if(!Array.isArray(arr))return;arr.forEach(it=>{if(it&&it.qKey&&oldToNew[it.qKey]){it.qKey=oldToNew[it.qKey];moved++;}});});
  if(moved>0)syncToCloud();
  return moved;
}
function initApp(){
  if(appInitialized)return;appInitialized=true;
  document.getElementById('userBar').style.display='flex';
  migrateChapterKeys();
  migrateAnswerData();
  buildBookList();updateStats();updateMemoCount();renderMemoPanel();initMemoResize();
  renderDashboard();updateNavMini();
}

function buildBookList(){
  const list=document.getElementById('bookList');list.innerHTML='';
  SECTIONS.forEach((sec,si)=>{
    const qs=sec.questions;
    const done=qs.filter(q=>answerData[getQKey(q)]).length;
    const correct=qs.filter(q=>{const a=answerData[getQKey(q)];return a&&a.correct;}).length;
    const wrong=done-correct;
    const pct=qs.length?Math.round(done/qs.length*100):0;
    const item=document.createElement('div');
    item.className='book-item'+(currentSectionIdx===si?' active':'');
    item.onclick=()=>showGrid(si);
    let stats;
    if(qs.length===0){stats='<span class="book-stat-empty">문제 준비 중</span>';}
    else{stats='<span class="book-stat-total">'+qs.length+'문제</span>'+(correct?'<span class="book-stat-done">✓'+correct+'</span>':'')+(wrong?'<span class="book-stat-wrong">✗'+wrong+'</span>':'')+'<span class="book-stat-pct">'+pct+'%</span>';}
    item.innerHTML='<div class="book-icon">'+sec.icon+'</div><div class="book-title">'+sec.name+'</div><div class="book-stats">'+stats+'</div>'+(qs.length?'<div class="book-progress"><div class="book-progress-bar" style="width:'+pct+'%"></div></div>':'');
    list.appendChild(item);
  });
}

function showGrid(si){
  currentSectionIdx=si;viewMode='grid';currentQ=null;
  document.getElementById('welcomeScreen').style.display='none';
  document.getElementById('quizContainer').style.display='none';
  document.getElementById('flashContainer').style.display='none';
  document.getElementById('examContainer').style.display='none';
  document.getElementById('gridContainer').style.display='block';
  document.getElementById('backBtn').style.display='none';
  stopExamTimer();setNav(null);
  document.getElementById('headerTitle').textContent=SECTIONS[si].name;
  document.getElementById('headerProgress').textContent='';
  buildBookList();
  if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');}
  renderGrid(si);
  document.getElementById('contentArea').scrollTop=0;
}

function renderGrid(si){
  const sec=SECTIONS[si],qs=sec.questions;
  if(qs.length===0){
    document.getElementById('gridContainer').innerHTML='<div class="grid-view"><h2>'+sec.icon+' '+sec.name+'</h2><div class="empty-state"><div class="es-icon">🗂️</div><h3>아직 문제가 등록되지 않았습니다</h3><p>이 섹션의 원본 파일에서 문제를 추출해 채워 넣을 예정입니다.<br>원하시는 파일을 알려주시면 문제를 입력해 드립니다.</p><div class="es-file">📄 '+escapeHtml(sec.file)+'</div></div></div>';
    return;
  }
  const done=qs.filter(q=>answerData[getQKey(q)]).length;
  const correct=qs.filter(q=>{const a=answerData[getQKey(q)];return a&&a.correct;}).length;
  let h='<div class="grid-view"><h2>'+sec.icon+' '+sec.name+'</h2>';
  h+='<div class="grid-sub">'+qs.length+'문제 · '+done+'문제 풀이 완료 (정답 '+correct+', 오답 '+(done-correct)+')</div>';
  h+='<div class="grid-controls"><button class="active" onclick="gridFilter(\'all\',this)">전체</button><button onclick="gridFilter(\'unsolved\',this)">안 푼 문제</button><button onclick="gridFilter(\'wrong\',this)">오답만</button></div>';
  const hasChapters=qs.some(q=>q.chapter&&q.chapter!=='일반');
  if(hasChapters){
    const chapterOrder=[];const chapterMap={};
    qs.forEach((q,qi)=>{const ch=q.chapter||'기타';if(!chapterMap[ch]){chapterMap[ch]=[];chapterOrder.push(ch);}chapterMap[ch].push({q,qi});});
    chapterOrder.forEach(ch=>{
      const items=chapterMap[ch];
      const gDone=items.filter(it=>answerData[getQKey(it.q)]).length;
      const gCorrect=items.filter(it=>{const a=answerData[getQKey(it.q)];return a&&a.correct;}).length;
      h+='<div class="q-group"><div class="q-group-title"><span>📂 '+escapeHtml(ch)+' ('+items.length+')</span><span class="q-group-stats">'+gDone+'/'+items.length+' 풀이'+(gCorrect?' · ✓'+gCorrect:'')+'</span></div><div class="q-grid">';
      items.forEach(it=>{h+=qCardHtml(it.q,si,it.qi);});
      h+='</div></div>';
    });
  }else{
    const CHUNK=30;const numGroups=Math.ceil(qs.length/CHUNK);
    for(let g=0;g<numGroups;g++){
      const start=g*CHUNK,end=Math.min((g+1)*CHUNK,qs.length);
      const groupQs=qs.slice(start,end);
      const gDone=groupQs.filter(q=>answerData[getQKey(q)]).length;
      const gCorrect=groupQs.filter(q=>{const a=answerData[getQKey(q)];return a&&a.correct;}).length;
      const label=groupQs[0].num+'~'+groupQs[groupQs.length-1].num+'번';
      h+='<div class="q-group"><div class="q-group-title"><span>📂 '+label+'</span><span class="q-group-stats">'+gDone+'/'+groupQs.length+' 풀이'+(gCorrect?' · ✓'+gCorrect:'')+'</span></div><div class="q-grid">';
      groupQs.forEach((q,gi)=>{h+=qCardHtml(q,si,start+gi);});
      h+='</div></div>';
    }
  }
  h+='</div>';
  document.getElementById('gridContainer').innerHTML=h;
}
function qCardHtml(q,si,qi){
  const k=getQKey(q),a=answerData[k],v=viewData[k];
  let cls='q-card';if(a){cls+=a.correct?' answered-correct':' answered-wrong';}
  if(wrongNotes.some(n=>n.qKey===k))cls+=' has-note';
  const views=v?v.count+'회':'';
  return '<div class="'+cls+'" data-qkey="'+k+'" data-status="'+(a?(a.correct?'correct':'wrong'):'unsolved')+'" data-noted="'+(wrongNotes.some(n=>n.qKey===k)?'1':'0')+'" onclick="loadQuestion(SECTIONS['+si+'].questions['+qi+'])"><div class="q-card-num">'+q.num+'</div>'+(views?'<div class="q-card-views">'+views+'</div>':'')+'</div>';
}

function gridFilter(mode,btn){
  document.querySelectorAll('.grid-controls button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.q-card').forEach(c=>{
    const status=c.getAttribute('data-status'),noted=c.getAttribute('data-noted');let show=true;
    if(mode==='unsolved')show=status==='unsolved';else if(mode==='wrong')show=status==='wrong';else if(mode==='noted')show=noted==='1';
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.q-group').forEach(g=>{const cards=g.querySelectorAll('.q-card');const anyVisible=Array.from(cards).some(c=>c.style.display!=='none');g.style.display=anyVisible?'':'none';});
}

function goBack(){
  if(viewMode==='quiz'&&currentSectionIdx>=0){showGrid(currentSectionIdx);}
  else{goHome();}
}

function openLightbox(src){const lb=document.createElement('div');lb.className='lightbox';lb.onclick=()=>lb.remove();lb.innerHTML='<img src="'+src+'">';document.body.appendChild(lb);}

function loadQuestion(q){
  currentQ=q;currentQIdx=QUESTIONS.indexOf(q);viewMode='quiz';pendingMemoImg=null;pendingExplImg=null;explEditOpen=false;editingExplId=null;
  const k=getQKey(q);
  if(!viewData[k])viewData[k]={count:0,lastViewed:0};
  viewData[k].count++;viewData[k].lastViewed=Date.now();syncToCloud();
  document.getElementById('welcomeScreen').style.display='none';
  document.getElementById('gridContainer').style.display='none';
  document.getElementById('flashContainer').style.display='none';
  document.getElementById('examContainer').style.display='none';
  document.getElementById('quizContainer').style.display='block';
  document.getElementById('backBtn').style.display='inline-block';
  stopExamTimer();setNav(null);
  document.getElementById('headerTitle').textContent=q.section+' · Q'+q.num;
  const secQs=SECTIONS.find(s=>s.name===q.section);
  const doneInSec=secQs?secQs.questions.filter(qq=>answerData[getQKey(qq)]).length:0;
  const totalInSec=secQs?secQs.questions.length:0;
  document.getElementById('headerProgress').textContent=doneInSec+'/'+totalInSec+' 풀이 완료';
  if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');}
  renderQuiz();buildBookList();
  document.getElementById('contentArea').scrollTop=0;
}

function renderQuiz(){
  const q=currentQ,k=getQKey(q),c=document.getElementById('quizContainer');
  const v=viewData[k];let vh='';
  if(v&&v.count>0)vh='<div class="meta-views">👁 '+v.count+'회 · '+timeAgo(v.lastViewed)+' <button class="meta-minus-btn" onclick="decrementView(\''+k+'\')">−1</button><button class="meta-reset-btn" onclick="resetView(\''+k+'\')">✕</button></div>';
  const isMarked=isMarkedForRepeat(k);
  const repeatBtn='<button class="meta-repeat-btn" onclick="toggleRepeatMark(\''+k+'\')" title="'+(isMarked?'반복 표시 해제':'반복 표시 추가')+'" style="background:'+(isMarked?'var(--repeat)':'#fff')+';color:'+(isMarked?'#fff':'var(--text2)')+';border:1px solid '+(isMarked?'var(--repeat)':'var(--border2)')+';padding:4px 11px;border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;margin-left:auto;font-family:inherit">🔁 '+(isMarked?'반복 표시됨':'반복 표시')+'</button>';
  let h='<div class="quiz-card"><div class="quiz-meta" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><div class="meta-section">'+escapeHtml(q.section)+'</div><div class="meta-num">문제 '+q.num+'</div>'+repeatBtn+vh+'</div>';
  h+='<div class="quiz-question">'+escapeHtml(q.question);
  if(q.question_images&&q.question_images.length)q.question_images.forEach(img=>{h+='<br><img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});
  h+='</div>';
  const ea=answerData[k];
  h+='<div class="quiz-choices" id="choicesArea">';
  const qAns=parseInt(q.answer,10);
  q.choices.forEach((ch,i)=>{const n=i+1;let cls='choice-btn';if(ea){cls+=' disabled';if(n===qAns)cls+=' correct';else if(n===ea.selected)cls+=' wrong';else cls+=' dimmed';}h+='<button class="'+cls+'" data-choice="'+n+'" onclick="selectAnswer('+n+')"><span class="choice-num">'+n+'</span><span class="choice-text">'+escapeHtml(ch)+'</span></button>';});
  h+='</div>';
  if(ea)h+=renderResult(q,ea.selected);
  h+=renderNoteSection(q);
  h+=mnemSectionHtml(q);
  const secQs=SECTIONS.find(s=>s.name===q.section);
  if(secQs){
    const qi=secQs.questions.indexOf(q);
    h+='<div class="quiz-nav">';
    h+='<div style="display:flex;gap:10px;flex-wrap:wrap">';
    if(qi>0)h+='<button onclick="loadQuestion(SECTIONS['+SECTIONS.indexOf(secQs)+'].questions['+(qi-1)+'])">← 이전</button>';
    h+='<button class="qnav-list" onclick="goBack()">📋 목록</button>';
    h+='</div>';
    if(qi<secQs.questions.length-1)h+='<button class="primary" onclick="loadQuestion(SECTIONS['+SECTIONS.indexOf(secQs)+'].questions['+(qi+1)+'])">다음 →</button>';else h+='<div></div>';
    h+='</div>';
  }
  h+='</div>';c.innerHTML=h;renderPendingImg();renderPendingExplImg();
}

function selectAnswer(num){
  const q=currentQ,k=getQKey(q);if(answerData[k])return;
  const qAns=parseInt(q.answer,10);const ic=num===qAns;
  answerData[k]={selected:num,correct:ic,timestamp:Date.now()};recordStudy(ic);syncToCloud();
  document.querySelectorAll('.choice-btn').forEach(b=>{const n=parseInt(b.getAttribute('data-choice'));b.classList.add('disabled');if(n===qAns)b.classList.add('correct');else if(n===num&&!ic)b.classList.add('wrong');else b.classList.add('dimmed');});
  document.getElementById('choicesArea').insertAdjacentHTML('afterend',renderResult(q,num));
  if(ic)launchConfetti();
  buildBookList();updateStats();updateMemoCount();
}
function renderResult(q,sel){
  const qAns=parseInt(q.answer,10);const ic=sel===qAns;const k=getQKey(q);
  let h='<div class="result-banner '+(ic?'correct':'wrong')+'"><span style="flex:1"><span class="result-icon">'+(ic?'✅':'❌')+'</span> '+(ic?'정답입니다!':'오답 — 정답은 '+qAns+'번입니다')+'</span><button class="retry-btn" onclick="resetOneAnswer()">🔄 다시 풀기</button></div>';
  h+='<div class="explanation-box"><h3><span>📖 해설</span><button class="expl-edit-btn" title="내 해설 추가·수정" onclick="toggleExplEdit()">✏️</button></h3>';
  // 원본 해설 (수정 불가)
  const hasBuiltin=q.explanation||q.reference||(q.explanation_images&&q.explanation_images.length);
  if(q.explanation)h+='<div class="expl-text">'+escapeHtml(q.explanation)+'</div>';
  if(q.reference)h+='<div class="expl-ref">📚 '+escapeHtml(q.reference)+'</div>';
  if(q.explanation_images&&q.explanation_images.length){h+='<div class="expl-images">';q.explanation_images.forEach(img=>{h+='<img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});h+='</div>';}
  if(!hasBuiltin)h+='<div class="expl-none">등록된 해설이 없습니다. 우측 상단 ✏️ 로 직접 추가할 수 있어요.</div>';
  // 내가 추가한 해설 (수정·삭제 가능)
  const mine=userExpl.filter(n=>n.qKey===k).sort((a,b)=>a.created-b.created);
  const editing=editingExplId?mine.find(n=>n.id===editingExplId):null;
  if(mine.length){h+='<div class="uexpl-mine">';mine.forEach(n=>{
    h+='<div class="uexpl-item"><div class="uexpl-badge">✏️ 내 해설'+(n.edited?' (수정됨)':'')+'</div>'
      +(n.text?'<div class="uexpl-text">'+escapeHtml(n.text)+'</div>':'')
      +(n.img?'<img class="uexpl-img" src="'+n.img+'" onclick="openLightbox(this.src)">':'')
      +'<div class="uexpl-actions-row"><button class="uexpl-mini" onclick="editExpl('+n.id+')">✎ 수정</button><button class="uexpl-mini del" onclick="deleteUserExpl('+n.id+')">🗑 삭제</button></div></div>';
  });h+='</div>';}
  // 편집기 (✏️ 클릭 시)
  if(explEditOpen){
    h+='<div class="uexpl-editor"><div class="uexpl-editor-title">'+(editing?'✎ 내 해설 수정':'＋ 내 해설 추가')+'</div>';
    h+='<textarea class="uexpl-input" id="uexplInput" placeholder="이 문제의 해설을 직접 입력하세요...  ( 📷 사진은 Ctrl+V 붙여넣기 또는 아래 [사진 첨부] )" onpaste="handleExplPaste(event)">'+(editing?escapeHtml(editing.text||''):'')+'</textarea>';
    h+='<div class="uexpl-actions"><label class="uexpl-file">📷 사진 첨부<input type="file" accept="image/*" onchange="handleExplFile(event)" style="display:none"></label><span style="flex:1"></span><button class="uexpl-cancel" onclick="cancelExplEdit()">취소</button><button class="uexpl-save" onclick="saveUserExpl()">'+(editing?'수정 저장':'추가')+'</button></div>';
    h+='<div id="uexplPreview" class="memo-img-preview" style="display:none"></div></div>';
  }
  h+='</div>';
  return h;
}
function renderNoteSection(q){
  const k=getQKey(q);
  let h='<div class="note-section"><div class="note-input-row"><textarea class="note-input" id="memoNoteInput" placeholder="외워야 할 내용 메모...  ( 📷 스크린샷 복사 후 Ctrl+V 로 붙여넣기 )" onpaste="handleMemoPaste(event)"></textarea><button class="note-add-btn memo-btn" onclick="addMemoNote()">📝 메모</button></div>';
  h+='<div id="memoImgPreview" class="memo-img-preview" style="display:none"></div>';
  const mn=memoNotes.filter(n=>n.qKey===k);
  if(mn.length){h+='<div class="note-list">';mn.forEach(n=>{h+='<div class="note-item">'+(n.text?'<div>'+escapeHtml(n.text)+'</div>':'')+(n.img?'<img class="note-img" src="'+n.img+'" onclick="openLightbox(this.src)">':'')+'<div class="note-time">'+timeAgo(n.created)+'</div><button class="note-del" onclick="deleteNote(\'memo\','+n.id+')">×</button></div>';});h+='</div>';}
  h+='</div>';return h;
}
function decrementView(k){if(viewData[k]&&viewData[k].count>0){viewData[k].count--;if(viewData[k].count===0)delete viewData[k];syncToCloud();buildBookList();if(currentQ&&getQKey(currentQ)===k)renderQuiz();}}
function resetView(k){delete viewData[k];syncToCloud();buildBookList();if(currentQ&&getQKey(currentQ)===k)renderQuiz();}
function resetAllViews(){if(!confirm('전체 조회수를 초기화하시겠습니까?'))return;viewData={};syncToCloud();buildBookList();updateStats();}
function resetOneAnswer(){if(!currentQ)return;const k=getQKey(currentQ);if(!answerData[k])return;delete answerData[k];syncToCloud();renderQuiz();buildBookList();updateStats();updateMemoCount();}
function resetAllAnswers(){if(!confirm('모든 풀이 기록을 초기화하시겠습니까?'))return;answerData={};syncToCloud();buildBookList();updateStats();if(viewMode==='grid'&&currentSectionIdx>=0)renderGrid(currentSectionIdx);}
function addMemoNote(){const i=document.getElementById('memoNoteInput'),t=i.value.trim();if((!t&&!pendingMemoImg)||!currentQ)return;const k=getQKey(currentQ);memoNotes.push({id:Date.now(),qKey:k,section:currentQ.section,qNum:currentQ.num,qText:currentQ.question.substring(0,50),text:t,img:pendingMemoImg||null,created:Date.now()});i.value='';pendingMemoImg=null;syncToCloud();renderQuiz();updateMemoCount();renderMemoPanel();}
function deleteNote(type,id){if(type==='wrong')wrongNotes=wrongNotes.filter(n=>n.id!==id);else memoNotes=memoNotes.filter(n=>n.id!==id);syncToCloud();if(currentQ)renderQuiz();buildBookList();updateStats();updateMemoCount();renderMemoPanel();}
function _setTxt(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
function updateStats(){const wc=Object.values(answerData).filter(a=>!a.correct).length;const cc=Object.values(answerData).filter(a=>a.correct).length;_setTxt('statTotal',QUESTIONS.length);_setTxt('statCorrect',cc);_setTxt('statWrong',wc);_setTxt('statNotes',memoNotes.length);_setTxt('wrongCount',wc);}
function updateMemoCount(){document.getElementById('memoCount').textContent=memoNotes.length;updateRepeatCount();}
function updateRepeatCount(){const el=document.getElementById('repeatCount');if(el)el.textContent=Object.keys(repeatMarks).filter(k=>repeatMarks[k]&&repeatMarks[k].marked).length;}
function isMarkedForRepeat(qKey){return !!(repeatMarks[qKey]&&repeatMarks[qKey].marked);}
function toggleRepeatMark(qKey){const cur=isMarkedForRepeat(qKey);repeatMarks[qKey]={marked:!cur,ts:Date.now()};syncToCloud();updateRepeatCount();if(currentQ&&getQKey(currentQ)===qKey)renderQuiz();if(document.getElementById('memoPanel').classList.contains('open')&&currentMemoTab==='repeat')renderRepeatList();buildBookList();}
function showRepeatNote(){const p=document.getElementById('memoPanel');if(!p.classList.contains('open'))p.classList.add('open');switchMemoTab('repeat');document.getElementById('memoWrongPreview').style.display='none';}
function renderRepeatList(){
  const markedKeys=Object.keys(repeatMarks).filter(k=>repeatMarks[k]&&repeatMarks[k].marked);
  const markedQs=QUESTIONS.filter(q=>markedKeys.includes(getQKey(q)));
  let f;
  if(currentMemoFilter==='all')f=markedQs;
  else if(String(currentMemoFilter).indexOf('ch:')===0){const g=currentMemoFilter.slice(3);f=markedQs.filter(q=>normChapter(q.chapter)===g);}
  else f=markedQs.filter(q=>q.section===currentMemoFilter);
  const l=document.getElementById('repeatList');
  if(!f.length){l.innerHTML='<div class="memo-empty">반복 표시한 문제가 없습니다<br><span style="font-size:11px;color:var(--text3);margin-top:8px;display:block">문제 풀이 화면에서 🔁 버튼을 누르면 여기에 모입니다</span></div>';return;}
  let h='';
  f.sort((a,b)=>{const ta=repeatMarks[getQKey(a)].ts||0;const tb=repeatMarks[getQKey(b)].ts||0;return tb-ta;}).forEach(q=>{
    const k=getQKey(q);const ans=answerData[k];let statusBadge='';
    if(ans){if(ans.correct)statusBadge='<span style="background:var(--correct);color:#fff;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:4px">정답</span>';else statusBadge='<span style="background:var(--wrong);color:#fff;padding:1px 6px;border-radius:8px;font-size:10px;margin-left:4px">오답('+ans.selected+'→'+q.answer+')</span>';}
    const _g=normChapter(q.chapter);const _cb=_g?'<span class="chap-badge">'+escapeHtml((CHAPTER_ICON[_g]||'🧩')+' '+_g)+'</span>':'';
    h+='<div class="memo-item" data-qkey="'+k+'" onclick="jumpToQ(\''+k+'\',\''+String(q.section).replace(/\x27/g,"\\\x27")+'\','+q.num+')" title="클릭 → 문제로 이동"><div class="memo-q">'+_cb+'🔁 '+escapeHtml(q.section)+' Q'+q.num+statusBadge+'</div><div class="memo-text" style="font-size:12px;color:var(--text2);margin-top:2px">'+escapeHtml(q.question.substring(0,60))+'...</div><button class="memo-del" title="반복 표시 해제" onclick="event.stopPropagation();toggleRepeatMark(\''+k+'\')">×</button></div>';
  });
  l.innerHTML=h;
}
function toggleMemo(){const p=document.getElementById('memoPanel');p.classList.toggle('open');if(p.classList.contains('open'))switchMemoTab('memo');}
function closeMemo(e){if(e){e.stopPropagation();e.preventDefault();}document.getElementById('memoPanel').classList.remove('open');}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');}
function switchMemoTab(t){
  currentMemoTab=t;currentMemoFilter='all';
  document.getElementById('memoTabWrong').style.display=t==='wrong'?'':'none';document.getElementById('memoTabWrong').classList.toggle('active',t==='wrong');
  document.getElementById('memoTabMemo').style.display=t==='memo'?'':'none';document.getElementById('memoTabMemo').classList.toggle('active',t==='memo');
  const repTab=document.getElementById('memoTabRepeat');if(repTab){repTab.style.display=t==='repeat'?'':'none';repTab.classList.toggle('active',t==='repeat');}
  document.getElementById('memoPanelTitle').innerHTML=t==='wrong'?'❌ 오답노트':(t==='repeat'?'🔁 반복노트':'📝 메모');
  const prev=document.getElementById('memoWrongPreview');if(t!=='wrong')prev.style.display='none';
  const cb=document.getElementById('clearTabBtn');if(cb)cb.innerHTML=t==='wrong'?'🗑 오답 전체 초기화':(t==='repeat'?'🗑 반복 전체 해제':'🗑 메모 전체 삭제');
  renderFilterChips();renderMemoPanel();
}
function renderFilterChips(){
  const b=document.getElementById('memoFilterBar');b.innerHTML='';
  const a=document.createElement('button');a.className='memo-filter-chip'+(currentMemoFilter==='all'?' active':'');a.textContent='전체';a.onclick=()=>{currentMemoFilter='all';renderFilterChips();renderMemoPanel();};b.appendChild(a);
  SECTIONS.forEach(s=>{
    let cnt=0;
    if(currentMemoTab==='wrong'){cnt=QUESTIONS.filter(q=>q.section===s.name&&answerData[getQKey(q)]&&!answerData[getQKey(q)].correct).length;}
    else if(currentMemoTab==='repeat'){cnt=QUESTIONS.filter(q=>q.section===s.name&&isMarkedForRepeat(getQKey(q))).length;}
    else{cnt=memoNotes.filter(n=>n.section===s.name).length;}
    if(cnt===0)return;
    const c=document.createElement('button');c.className='memo-filter-chip'+(currentMemoFilter===s.name?' active':'');c.textContent=s.name+' ('+cnt+')';c.onclick=()=>{currentMemoFilter=s.name;renderFilterChips();renderMemoPanel();};b.appendChild(c);
  });
  if(currentMemoTab==='wrong'||currentMemoTab==='repeat'){
    let added=false;
    examGenres().forEach(g=>{
      let cnt;
      if(currentMemoTab==='wrong')cnt=QUESTIONS.filter(q=>normChapter(q.chapter)===g.genre&&answerData[getQKey(q)]&&!answerData[getQKey(q)].correct).length;
      else cnt=QUESTIONS.filter(q=>normChapter(q.chapter)===g.genre&&isMarkedForRepeat(getQKey(q))).length;
      if(cnt===0)return;
      if(!added){const dv=document.createElement('span');dv.className='memo-filter-divider';dv.textContent='│ 단원';b.appendChild(dv);added=true;}
      const id='ch:'+g.genre;
      const c=document.createElement('button');c.className='memo-filter-chip chap'+(currentMemoFilter===id?' active':'');c.textContent=(CHAPTER_ICON[g.genre]||'🧩')+' '+g.genre+' ('+cnt+')';c.onclick=()=>{currentMemoFilter=id;renderFilterChips();renderMemoPanel();};b.appendChild(c);
    });
  }
}
function renderMemoPanel(){
  renderFilterChips();
  if(currentMemoTab==='wrong'){renderWrongList();return;}
  if(currentMemoTab==='repeat'){renderRepeatList();return;}
  const ns=memoNotes;const f=currentMemoFilter==='all'?ns:ns.filter(n=>n.section===currentMemoFilter);
  const l=document.getElementById('memoList');
  if(!f.length){l.innerHTML='<div class="memo-empty">메모가 없습니다<br><span style="font-size:11px;color:var(--text3);margin-top:8px;display:block">문제 아래 메모 입력란에서 추가하세요</span></div>';return;}
  let h='';
  f.sort((a,b)=>b.created-a.created).forEach(n=>{h+='<div class="memo-item note" onclick="jumpToQ(\''+n.qKey+'\',\''+String(n.section).replace(/\x27/g,"\\\x27")+'\','+n.qNum+')" title="클릭 → 문제로 이동"><div class="memo-q">'+escapeHtml(n.section)+' Q'+n.qNum+' · '+escapeHtml(n.qText)+'...</div>'+(n.text?'<div class="memo-text">'+escapeHtml(n.text)+'</div>':'')+(n.img?'<img class="memo-img" src="'+n.img+'" onclick="event.stopPropagation();openLightbox(this.src)">':'')+'<button class="memo-del" onclick="event.stopPropagation();deleteNote(\'memo\','+n.id+')">×</button></div>';});
  l.innerHTML=h;
}
function renderWrongList(){
  const wrongQs=QUESTIONS.filter(q=>{const a=answerData[getQKey(q)];return a&&!a.correct;});
  let f;
  if(currentMemoFilter==='all')f=wrongQs;
  else if(String(currentMemoFilter).indexOf('ch:')===0){const g=currentMemoFilter.slice(3);f=wrongQs.filter(q=>normChapter(q.chapter)===g);}
  else f=wrongQs.filter(q=>q.section===currentMemoFilter);
  const l=document.getElementById('wrongList');
  if(!f.length){l.innerHTML='<div class="memo-empty">오답이 없습니다 🎉</div>';document.getElementById('memoWrongPreview').style.display='none';return;}
  let h='';
  f.forEach(q=>{const k=getQKey(q);const a=answerData[k];const txt=q.question.substring(0,60);const g=normChapter(q.chapter);const cb=g?'<span class="chap-badge">'+escapeHtml((CHAPTER_ICON[g]||'🧩')+' '+g)+'</span>':'';h+='<div class="memo-item wrong" data-qkey="'+k+'" onclick="jumpToQ(\''+k+'\',\''+String(q.section).replace(/\x27/g,"\\\x27")+'\','+q.num+')" title="클릭 → 문제로 이동"><div class="memo-q">'+cb+escapeHtml(q.section)+' Q'+q.num+'</div><div class="memo-text" style="font-size:12px;color:var(--text2);margin-top:2px">'+escapeHtml(txt)+'...</div><div style="font-size:11px;color:var(--wrong);margin-top:3px;font-weight:600">내 답: '+a.selected+'번 → 정답: '+q.answer+'번</div><button class="memo-del" title="이 오답 기록 삭제(재풀이 가능)" onclick="event.stopPropagation();deleteWrongOne(\''+k+'\')">×</button></div>';});
  l.innerHTML=h;
}
function deleteWrongOne(qKey){if(!confirm('이 문제의 오답 기록을 삭제할까요? (다시 풀 수 있습니다)'))return;delete answerData[qKey];syncToCloud();renderMemoPanel();updateMemoCount();updateStats();buildBookList();if(currentQ&&getQKey(currentQ)===qKey)renderQuiz();}
function jumpToQ(qKey,fbSection,fbNum){
  let q=QUESTIONS.find(q=>getQKey(q)===qKey);
  if(!q&&fbSection!=null&&fbNum!=null){q=QUESTIONS.find(qq=>qq.section===fbSection&&String(qq.num)===String(fbNum));}
  if(!q){alert('해당 문제를 찾을 수 없습니다.');return;}
  const si=SECTIONS.findIndex(s=>s.name===q.section);if(si>=0)currentSectionIdx=si;
  if(window.innerWidth<=900){const p=document.getElementById('memoPanel');if(p)p.classList.remove('open');}
  loadQuestion(q);
}
function showWrongNote(){const p=document.getElementById('memoPanel');if(!p.classList.contains('open'))p.classList.add('open');switchMemoTab('wrong');document.getElementById('memoWrongPreview').style.display='none';}
function exportNotes(){
  let t='===== 전문의 시험 공부 노트 =====\n\n';
  const wrongQs=QUESTIONS.filter(q=>{const a=answerData[getQKey(q)];return a&&!a.correct;});
  if(wrongQs.length){t+='[ 오답노트 ]\n\n';wrongQs.forEach(q=>{const a=answerData[getQKey(q)];t+='['+q.section+' Q'+q.num+'] '+q.question.substring(0,80)+'\n  내 답: '+a.selected+'번 / 정답: '+q.answer+'번\n\n';});}
  const repQs=QUESTIONS.filter(q=>isMarkedForRepeat(getQKey(q)));
  if(repQs.length){t+='\n[ 반복노트 ]\n\n';repQs.forEach(q=>{t+='['+q.section+' Q'+q.num+'] '+q.question.substring(0,80)+'\n\n';});}
  if(memoNotes.length){t+='\n[ 메모 ]\n\n';memoNotes.forEach(n=>{t+='['+n.section+' Q'+n.qNum+'] '+n.text+'\n\n';});}
  const b=new Blob([t],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='전문의시험_노트.txt';a.click();
}
function clearCurrentTab(){
  if(currentMemoTab==='wrong'){if(!confirm('모든 오답 기록을 초기화하시겠습니까?'))return;answerData={};syncToCloud();renderMemoPanel();updateMemoCount();updateStats();if(currentQ)renderQuiz();buildBookList();return;}
  if(currentMemoTab==='repeat'){if(!confirm('모든 반복 표시를 해제하시겠습니까?'))return;repeatMarks={};syncToCloud();renderMemoPanel();updateRepeatCount();if(currentQ)renderQuiz();buildBookList();return;}
  if(!confirm('현재 탭의 모든 메모를 삭제하시겠습니까?'))return;memoNotes=[];syncToCloud();renderMemoPanel();updateMemoCount();if(currentQ)renderQuiz();
}
function initMemoResize(){
  const p=document.getElementById('memoPanel'),h=document.getElementById('memoResizeHandle');if(!h||!p)return;
  let sx,sw,r=false;
  h.addEventListener('mousedown',e=>{e.preventDefault();r=true;sx=e.clientX;sw=p.offsetWidth;h.classList.add('active');document.body.style.cursor='col-resize';document.body.style.userSelect='none';});
  document.addEventListener('mousemove',e=>{if(!r)return;p.style.width=Math.max(280,Math.min(800,sw+(sx-e.clientX)))+'px';p.style.minWidth=p.style.width;});
  document.addEventListener('mouseup',()=>{if(!r)return;r=false;h.classList.remove('active');document.body.style.cursor='';document.body.style.userSelect='';});
}
document.addEventListener('keydown',e=>{
  if(!currentQ||viewMode!=='quiz')return;
  if(document.activeElement.tagName==='TEXTAREA'||document.activeElement.tagName==='INPUT')return;
  const k=getQKey(currentQ);
  if(answerData[k]){
    if(e.key==='ArrowRight'){const sec=SECTIONS.find(s=>s.name===currentQ.section);if(sec){const qi=sec.questions.indexOf(currentQ);if(qi<sec.questions.length-1)loadQuestion(sec.questions[qi+1]);}}
    if(e.key==='ArrowLeft'){const sec=SECTIONS.find(s=>s.name===currentQ.section);if(sec){const qi=sec.questions.indexOf(currentQ);if(qi>0)loadQuestion(sec.questions[qi-1]);}}
    if(e.key==='Escape'||e.key==='Backspace')goBack();
    return;
  }
  const n=parseInt(e.key);if(n>=1&&n<=currentQ.choices.length)selectAnswer(n);
});
</script>

<!-- ===== ☕ 신규 기능: 대시보드 · 암기카드 · 모의고사 · 니모닉 · 시각효과 ===== -->
<script>
/* ---------- 공통 유틸 ---------- */
function jsStr(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function _dateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
function todayStr(){return _dateStr(new Date());}
function _examDateStr(ms){const d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtTime(s){s=Math.max(0,s|0);const m=Math.floor(s/60),ss=s%60;return m+':'+String(ss).padStart(2,'0');}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function closeSidebarMobile(){const s=document.getElementById('sidebar');if(s)s.classList.remove('open');const o=document.getElementById('sidebarOverlay');if(o)o.classList.remove('open');}
function _mergeStudyLog(a,b){const out=Object.assign({},a||{});const bb=b||{};for(const k of Object.keys(bb)){if(!out[k])out[k]={solved:bb[k].solved||0,correct:bb[k].correct||0};else out[k]={solved:Math.max(out[k].solved||0,bb[k].solved||0),correct:Math.max(out[k].correct||0,bb[k].correct||0)};}return out;}

/* ---------- 학습 로그 / 스트릭 ---------- */
function recordStudy(correct){const d=todayStr();if(!studyLog[d])studyLog[d]={solved:0,correct:0};studyLog[d].solved++;if(correct)studyLog[d].correct++;}
function computeStreak(){const day=new Date();if(!(studyLog[_dateStr(day)]&&studyLog[_dateStr(day)].solved>0))day.setDate(day.getDate()-1);let streak=0;while(streak<2000){const ds=_dateStr(day);if(studyLog[ds]&&studyLog[ds].solved>0){streak++;day.setDate(day.getDate()-1);}else break;}return streak;}
function last7Days(){const out=[],wd=['일','월','화','수','목','금','토'],today=new Date();for(let i=6;i>=0;i--){const d=new Date(today);d.setDate(today.getDate()-i);const ds=_dateStr(d),e=studyLog[ds];out.push({solved:e?e.solved:0,label:wd[d.getDay()],today:i===0});}return out;}

/* ---------- 내비 / 홈 ---------- */
function setNav(which){['navHome','navFlash','navExam'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.remove('active');});const map={home:'navHome',flash:'navFlash',exam:'navExam'};if(which&&map[which]){const e=document.getElementById(map[which]);if(e)e.classList.add('active');}updateNavMini();}
function updateNavMini(){const w=QUESTIONS.filter(q=>{const a=answerData[getQKey(q)];return a&&!a.correct;}).length;const r=Object.keys(repeatMarks).filter(k=>repeatMarks[k]&&repeatMarks[k].marked).length;const n=w+r;const e=document.getElementById('navFlashMini');if(e){if(n>0){e.textContent=n;e.style.display='';}else{e.style.display='none';}}}
function goHome(){
  viewMode='welcome';currentQ=null;currentSectionIdx=-1;stopExamTimer();
  ['gridContainer','quizContainer','flashContainer','examContainer'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none';});
  document.getElementById('welcomeScreen').style.display='';
  document.getElementById('backBtn').style.display='none';
  document.getElementById('headerTitle').textContent='홈 · 대시보드';
  document.getElementById('headerProgress').textContent='';
  setNav('home');renderDashboard();buildBookList();
  if(window.innerWidth<=768)closeSidebarMobile();
  document.getElementById('contentArea').scrollTop=0;
}

/* ---------- 진도링 / 카운트업 / 색상 / 애니메이션 ---------- */
function ringHtml(pct,color,valText,label,size){
  size=size||120;pct=Math.max(0,Math.min(100,pct||0));
  const r=52,C=2*Math.PI*r,off=C*(1-pct/100),sw=12;
  return '<div class="ring-wrap" style="width:'+size+'px;height:'+size+'px">'
   +'<svg class="pring" width="'+size+'" height="'+size+'" viewBox="0 0 120 120">'
   +'<circle class="pring-track" cx="60" cy="60" r="'+r+'" fill="none" stroke-width="'+sw+'"/>'
   +'<circle class="pring-fill" cx="60" cy="60" r="'+r+'" fill="none" stroke-width="'+sw+'" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+C.toFixed(1)+'" data-off="'+off.toFixed(1)+'" style="--rc:'+color+'"/>'
   +'</svg><div class="ring-center"><div class="ring-val">'+valText+'</div><div class="ring-lbl">'+label+'</div></div></div>';
}
function heatColor(pct){if(pct>=80)return'var(--correct)';if(pct>=60)return'#57c08c';if(pct>=40)return'var(--gold)';return'var(--wrong)';}
function animateDash(){setTimeout(function(){
  document.querySelectorAll('.pring-fill[data-off]').forEach(el=>{el.style.strokeDashoffset=el.dataset.off;});
  document.querySelectorAll('[data-fill]').forEach(el=>{el.style.width=el.dataset.fill;});
  document.querySelectorAll('[data-bh]').forEach(el=>{el.style.height=el.dataset.bh;});
},90);}
function runCountUps(){document.querySelectorAll('.cnt[data-to]').forEach(function(el){const to=parseFloat(el.dataset.to)||0,suf=el.dataset.suf||'',dur=950;let start=null;el.textContent='0'+suf;function step(ts){if(start===null)start=ts;const p=Math.min(1,(ts-start)/dur);el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);});}
function launchConfetti(){
  const layer=document.createElement('div');layer.className='confetti-layer';
  const colors=['#0c4a37','#10684c','#1f9b6d','#27b276','#1f9d5b','#2f8f86','#7fd6a6'];
  for(let i=0;i<22;i++){const p=document.createElement('div');p.className='confetti-piece';
    p.style.left=(Math.random()*100)+'vw';p.style.background=colors[i%colors.length];
    p.style.setProperty('--cx',(Math.random()*200-100)+'px');p.style.setProperty('--cr',(Math.random()*720-220)+'deg');
    p.style.animationDuration=(1.6+Math.random()*1.5)+'s';p.style.animationDelay=(Math.random()*0.25)+'s';
    if(Math.random()<.5){p.style.width='7px';p.style.height='7px';p.style.borderRadius='50%';}
    layer.appendChild(p);}
  document.body.appendChild(layer);setTimeout(()=>layer.remove(),3300);
}

/* ---------- 대시보드 ---------- */
function renderDashboard(){
  const el=document.getElementById('welcomeScreen');if(!el)return;
  const realQs=QUESTIONS.filter(q=>q.section!=='📖 사용법');
  const total=realQs.length;
  const answered=realQs.filter(q=>answerData[getQKey(q)]).length;
  const correct=realQs.filter(q=>{const a=answerData[getQKey(q)];return a&&a.correct;}).length;
  const acc=answered?Math.round(correct/answered*100):0;
  const prog=total?Math.round(answered/total*100):0;
  const streak=computeStreak();
  const td=studyLog[todayStr()],todaySolved=td?td.solved:0;
  const goalPct=dailyGoal?Math.min(100,Math.round(todaySolved/dailyGoal*100)):0;
  let h='<div id="dashView" class="dash">';
  /* hero */
  h+='<div class="dash-hero"><div class="dh-hi">반가워요 👋 합격까지 한 걸음씩</div><div class="dh-title">오늘의 학습 ☕</div>';
  h+='<div class="dh-row">';
  h+='<div class="streak-badge"><span class="flame">🔥</span><div><div class="sb-num"><span class="cnt" data-to="'+streak+'" data-suf="일"></span></div><div class="sb-lbl">연속 학습</div></div></div>';
  h+='<div class="goal-chip"><span>🎯 오늘 <b>'+todaySolved+'</b> / '+dailyGoal+'문제</span><div class="goal-bar"><i data-fill="'+goalPct+'%" style="width:0"></i></div><button class="goal-edit" title="목표 변경" onclick="editGoal()">✎</button></div>';
  h+='</div></div>';
  /* rings */
  h+='<div class="dash-rings">';
  h+='<div class="ring-card">'+ringHtml(prog,'var(--accent)',prog+'%','진도율',118)+'<div class="rc-sub">'+answered+' / '+total+' 문제</div></div>';
  h+='<div class="ring-card">'+ringHtml(acc,heatColor(acc),acc+'%','정답률',118)+'<div class="rc-sub">'+correct+' / '+answered+' 정답</div></div>';
  h+='<div class="ring-card">'+ringHtml(goalPct,'var(--gold)',todaySolved+'/'+dailyGoal,'오늘 목표',118)+'<div class="rc-sub">하루 '+dailyGoal+'문제</div></div>';
  h+='</div>';
  /* quick actions */
  h+='<div class="dash-card"><div class="dc-head"><div class="dc-title">⚡ 바로 시작</div></div><div class="quick-actions">';
  h+='<button class="qa-btn" onclick="continueStudy()"><div class="qa-ico">▶️</div><div><div class="qa-tt">이어서 풀기</div><div class="qa-ds">안 푼 문제부터</div></div></button>';
  h+='<button class="qa-btn" onclick="startFlash(deckWrong(),\'오답 복습\')"><div class="qa-ico">❌</div><div><div class="qa-tt">오답 복습 카드</div><div class="qa-ds">틀린 문제 다시</div></div></button>';
  h+='<button class="qa-btn" onclick="openFlashSetup()"><div class="qa-ico">🎴</div><div><div class="qa-tt">암기카드</div><div class="qa-ds">뒤집어 외우기</div></div></button>';
  h+='<button class="qa-btn" onclick="openExamSetup()"><div class="qa-ico">📝</div><div><div class="qa-tt">모의고사</div><div class="qa-ds">실전 채점</div></div></button>';
  h+='</div></div>';
  /* heatmap */
  const secs=SECTIONS.filter(s=>s.questions.length>0&&s.name!=='📖 사용법');
  if(secs.length){
    h+='<div class="dash-card"><div class="dc-head"><div class="dc-title">🗺 섹션별 정답률</div><div class="dc-hint">클릭 → 문제 목록</div></div><div class="heatmap">';
    secs.forEach(s=>{const si=SECTIONS.indexOf(s);const an=s.questions.filter(q=>answerData[getQKey(q)]).length;const co=s.questions.filter(q=>{const a=answerData[getQKey(q)];return a&&a.correct;}).length;const sp=an?Math.round(co/an*100):0;
      h+='<div class="heat-row" onclick="showGrid('+si+')"><div class="hr-name">'+escapeHtml(s.icon+' '+s.name)+'</div>';
      if(an)h+='<div class="hr-bar"><i data-fill="'+sp+'%" style="width:0;background:'+heatColor(sp)+'"></i></div><div class="hr-pct">'+co+'/'+an+' · '+sp+'%</div>';
      else h+='<div class="hr-empty">아직 안 풀었어요</div><div class="hr-pct" style="color:var(--text3)">'+s.questions.length+'문제</div>';
      h+='</div>';});
    h+='</div></div>';
    /* weakness */
    const weak=secs.map(s=>{const an=s.questions.filter(q=>answerData[getQKey(q)]).length;const co=s.questions.filter(q=>{const a=answerData[getQKey(q)];return a&&a.correct;}).length;return{s:s,an:an,acc:an?co/an*100:101};}).filter(x=>x.an>=1&&x.acc<70).sort((a,b)=>a.acc-b.acc).slice(0,4);
    h+='<div class="dash-card"><div class="dc-head"><div class="dc-title">🎯 집중 공략 (약점)</div></div>';
    if(weak.length){weak.forEach(x=>{const si=SECTIONS.indexOf(x.s);h+='<span class="weak-tag" onclick="showGrid('+si+')">'+escapeHtml(x.s.name)+' '+Math.round(x.acc)+'%</span>';});}
    else{h+='<div style="font-size:12.5px;color:var(--text2)">아직 약점을 분석할 데이터가 부족하거나, 모든 섹션이 양호해요 👍</div>';}
    h+='</div>';
  }
  /* activity */
  const days=last7Days();const maxS=Math.max(1,...days.map(d=>d.solved));
  h+='<div class="dash-card"><div class="dc-head"><div class="dc-title">📈 최근 7일 학습량</div></div><div class="activity-bars">';
  days.forEach(d=>{const bh=d.solved?Math.round(6+d.solved/maxS*72):4;h+='<div class="act-day'+(d.today?' today':'')+'"><div class="ad-num">'+(d.solved||'')+'</div><div class="ad-bar'+(d.solved?'':' zero')+'" data-bh="'+bh+'px" style="height:0"></div><div class="ad-lbl">'+d.label+'</div></div>';});
  h+='</div></div>';
  /* management */
  h+='<div class="dash-card"><div class="dc-head"><div class="dc-title">🛠 관리</div></div><div class="reset-views" style="display:flex;gap:10px;flex-wrap:wrap;margin:0">';
  h+='<button onclick="resetAllViews()">🔄 조회수 초기화</button><button onclick="resetAllAnswers()">🗑 풀이 기록 초기화</button><button onclick="exportNotes()">📥 노트 내보내기</button>';
  h+='</div></div>';
  h+='</div>';
  el.innerHTML=h;animateDash();runCountUps();
}
function editGoal(){const v=prompt('하루 목표 문제 수를 입력하세요',dailyGoal);if(v==null)return;const n=parseInt(v,10);if(!n||n<1){alert('1 이상의 숫자를 입력하세요');return;}dailyGoal=n;syncToCloud();renderDashboard();}
function continueStudy(){const realQs=QUESTIONS.filter(q=>q.section!=='📖 사용법');const next=realQs.find(q=>!answerData[getQKey(q)]);if(!next){alert('모든 문제를 풀었어요! 🎉 오답·반복 복습을 추천합니다.');return;}const si=SECTIONS.findIndex(s=>s.name===next.section);if(si>=0)currentSectionIdx=si;loadQuestion(next);}

/* ---------- 니모닉 (암기법) ---------- */
function mnemSectionHtml(q){
  const k=getQKey(q);
  let h='<div class="mnem-box"><div class="mnem-head">💡 암기법 · 니모닉</div>';
  h+='<div class="mnem-input-row"><textarea class="mnem-input" id="mnemInput" placeholder="두문자어·연상법·암기 팁을 적어두세요 (예: 손목뼈 — 손배월삼, 대유두구...)"></textarea><button class="mnem-add" onclick="addMnem()">추가</button></div>';
  const mn=mnemonics.filter(n=>n.qKey===k);
  mn.forEach(n=>{h+='<div class="mnem-item">'+escapeHtml(n.text)+'<button class="mnem-del" title="삭제" onclick="deleteMnem('+n.id+')">×</button></div>';});
  h+='</div>';return h;
}
function addMnem(){const i=document.getElementById('mnemInput');if(!i||!currentQ)return;const t=i.value.trim();if(!t)return;const k=getQKey(currentQ);mnemonics.push({id:Date.now(),qKey:k,section:currentQ.section,qNum:currentQ.num,text:t,created:Date.now()});i.value='';syncToCloud();renderQuiz();updateNavMini();}
function deleteMnem(id){mnemonics=mnemonics.filter(n=>n.id!==id);syncToCloud();if(currentQ)renderQuiz();}

/* ---------- 내 해설(보충) — 텍스트 + 사진 ---------- */
function toggleExplEdit(){explEditOpen=!explEditOpen;editingExplId=null;pendingExplImg=null;if(currentQ)renderQuiz();}
function editExpl(id){const n=userExpl.find(x=>x.id===id);if(!n)return;editingExplId=id;explEditOpen=true;pendingExplImg=n.img||null;if(currentQ)renderQuiz();}
function cancelExplEdit(){explEditOpen=false;editingExplId=null;pendingExplImg=null;if(currentQ)renderQuiz();}
function saveUserExpl(){
  const i=document.getElementById('uexplInput');if(!currentQ)return;
  const t=i?i.value.trim():'';
  if(!t&&!pendingExplImg){alert('해설 내용이나 사진을 입력하세요');return;}
  if(editingExplId){const n=userExpl.find(x=>x.id===editingExplId);if(n){n.text=t;n.img=pendingExplImg||null;n.edited=Date.now();}}
  else{const k=getQKey(currentQ);userExpl.push({id:Date.now(),qKey:k,section:currentQ.section,qNum:currentQ.num,text:t,img:pendingExplImg||null,created:Date.now()});}
  editingExplId=null;pendingExplImg=null;explEditOpen=false;
  syncToCloud();renderQuiz();
}
function deleteUserExpl(id){if(!confirm('내가 추가한 이 해설을 삭제할까요?'))return;userExpl=userExpl.filter(n=>n.id!==id);if(editingExplId===id){editingExplId=null;explEditOpen=false;}pendingExplImg=null;syncToCloud();if(currentQ)renderQuiz();}
function handleExplPaste(e){
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(let i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image')===0){
      const file=items[i].getAsFile();if(!file)continue;e.preventDefault();
      try{showSync('syncing','🖼 이미지 처리 중...');}catch(_){}
      compressImage(file,function(d){pendingExplImg=d;renderPendingExplImg();try{showSync('synced','✅ 사진 첨부됨');}catch(_){}});
      return;
    }
  }
}
function handleExplFile(e){
  const f=e.target&&e.target.files&&e.target.files[0];if(!f)return;
  try{showSync('syncing','🖼 이미지 처리 중...');}catch(_){}
  compressImage(f,function(d){pendingExplImg=d;renderPendingExplImg();try{showSync('synced','✅ 사진 첨부됨');}catch(_){}});
  try{e.target.value='';}catch(_){}
}
function renderPendingExplImg(){
  const el=document.getElementById('uexplPreview');if(!el)return;
  if(pendingExplImg){el.style.display='';el.innerHTML='<div class="mip-wrap"><img src="'+pendingExplImg+'"><button class="mip-del" onclick="clearPendingExplImg()">✕ 사진 제거</button><span class="mip-tag">📷 첨부됨 — [＋ 해설 추가]를 누르면 함께 저장됩니다</span></div>';}
  else{el.style.display='none';el.innerHTML='';}
}
function clearPendingExplImg(){pendingExplImg=null;renderPendingExplImg();}

/* ---------- 암기카드 (플래시카드) ---------- */
function deckWrong(){return QUESTIONS.filter(q=>{const a=answerData[getQKey(q)];return a&&!a.correct;});}
function deckRepeat(){return QUESTIONS.filter(q=>isMarkedForRepeat(getQKey(q)));}
function deckMnem(){return QUESTIONS.filter(q=>mnemonics.some(m=>m.qKey===getQKey(q)));}
function deckAll(){return QUESTIONS.filter(q=>q.section!=='📖 사용법');}
function deckSection(name){return QUESTIONS.filter(q=>q.section===name);}
function _flashShow(){['welcomeScreen','gridContainer','quizContainer','examContainer'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});document.getElementById('flashContainer').style.display='block';document.getElementById('backBtn').style.display='none';document.getElementById('headerProgress').textContent='';setNav('flash');if(window.innerWidth<=768)closeSidebarMobile();}
function deckBtn(ico,tt,ct,onclick){const dis=ct===0?' disabled':'';return '<button class="deck-btn"'+dis+' onclick="'+onclick+'"><div class="dk-ico">'+ico+'</div><div class="dk-tt">'+tt+'</div><div class="dk-ct">'+ct+'장</div></button>';}

  h+=deckBtn('🔁','반복 표시',deckRepeat().length,"startFlash(deckRepeat(),'반복 표시')");
  h+=deckBtn('💡','니모닉 카드',deckMnem().length,"startFlash(deckMnem(),'니모닉 카드')");
  h+=deckBtn('📚','전체 문제',deckAll().length,"startFlash(deckAll(),'전체 문제')");
  h+='</div>';

  h+='</div></div>';

function startFlash(list,title){
  if(!list||!list.length){alert('해당하는 카드가 없습니다.');return;}
  flashDeck=shuffle(list);flashIdx=0;flashFlipped=false;flashStudied=new Set();flashTotal=flashDeck.length;flashTitle=title||'카드';
  viewMode='flash';_flashShow();document.getElementById('headerTitle').textContent='🎴 '+flashTitle;
  renderFlash();document.getElementById('contentArea').scrollTop=0;
}
function flashRateHtml(){return '<div class="flash-rate"><button class="rate-btn hard" onclick="rateFlash(\'hard\')"><span class="rb-k">🔴</span>어려움</button><button class="rate-btn mid" onclick="rateFlash(\'mid\')"><span class="rb-k">🟡</span>보통</button><button class="rate-btn easy" onclick="rateFlash(\'easy\')"><span class="rb-k">🟢</span>쉬움</button></div>';}
function renderFlash(){
  const c=document.getElementById('flashContainer');
  if(flashIdx>=flashDeck.length){renderFlashDone();return;}
  const q=flashDeck[flashIdx],k=getQKey(q);
  const prog=flashTotal?Math.round(flashStudied.size/flashTotal*100):0;
  let h='<div class="flash-wrap">';
  h+='<div class="flash-progress"><div class="fp-bar"><i data-fill="'+prog+'%" style="width:0"></i></div><div class="fp-txt">'+flashStudied.size+' / '+flashTotal+' 학습</div></div>';
  h+='<div class="flashcard'+(flashFlipped?' flipped':'')+'" id="flashCardEl" onclick="cardTap()"><div class="flash-inner">';
  h+='<div class="flash-face front"><div class="ff-tag">'+escapeHtml(q.section)+' · Q'+q.num+'</div>';
  if(q.question)h+='<div class="ff-q">'+escapeHtml(q.question)+'</div>';
  if(q.question_images&&q.question_images.length)q.question_images.forEach(img=>{h+='<img src="'+img+'">';});
  if(!q.question&&!(q.question_images&&q.question_images.length))h+='<div class="ff-q">(이미지 없는 문제입니다)</div>';
  h+='<div class="ff-hint">탭하면 정답이 보입니다 👆</div></div>';
  h+='<div class="flash-face back"><div class="ff-tag">정답 · 해설</div><div class="ff-ans">✅ 정답: '+q.answer+'번</div>';
  if(q.explanation)h+='<div style="font-size:13.5px;line-height:1.6;color:var(--body-text);white-space:pre-wrap">'+escapeHtml(q.explanation)+'</div>';
  if(q.explanation_images&&q.explanation_images.length)q.explanation_images.forEach(img=>{h+='<img src="'+img+'">';});
  mnemonics.filter(n=>n.qKey===k).forEach(n=>{h+='<div class="flash-mnem"><b>💡 암기법:</b> '+escapeHtml(n.text)+'</div>';});
  h+='<div class="ff-hint">얼마나 잘 외웠나요? 아래에서 평가하세요 👇</div></div>';
  h+='</div></div>';
  h+='<div id="flashControls">'+(flashFlipped?flashRateHtml():'<button class="flash-flip-btn" onclick="event.stopPropagation();flipFlash()">👁 정답·해설 보기</button>')+'</div>';
  h+='<div class="flash-bottom-nav"><button onclick="flashPrev()">← 이전</button><button onclick="goHome()">종료</button></div>';
  h+='</div>';
  c.innerHTML=h;animateDash();
}
function cardTap(){if(!flashFlipped)flipFlash();}
function flipFlash(){flashFlipped=true;const el=document.getElementById('flashCardEl');if(el)el.classList.add('flipped');const ctr=document.getElementById('flashControls');if(ctr)ctr.innerHTML=flashRateHtml();}
function rateFlash(rating){const q=flashDeck[flashIdx];if(q){flashStudied.add(getQKey(q));if(rating==='hard')flashDeck.push(q);}flashIdx++;flashFlipped=false;renderFlash();}
function flashPrev(){if(flashIdx>0){flashIdx--;flashFlipped=false;renderFlash();}}
function renderFlashDone(){const c=document.getElementById('flashContainer');c.innerHTML='<div class="flash-wrap"><div class="flash-done"><div class="fd-ico">🎉</div><h2>'+flashStudied.size+'장 학습 완료!</h2><p>「'+escapeHtml(flashTitle)+'」 덱을 모두 돌았어요.<br>꾸준함이 합격을 만듭니다 ☕</p><div style="display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap"><button class="exam-start-btn" style="width:auto;padding:13px 22px" onclick="openFlashSetup()">🎴 다른 덱 학습</button><button class="exam-start-btn" style="width:auto;padding:13px 22px;background:#fff;color:var(--text2);border:1px solid var(--border2);box-shadow:none" onclick="goHome()">🏠 홈으로</button></div></div></div>';launchConfetti();}

/* ---------- 모의고사 ---------- */
/* 단원(분야) 정규화 — 표기 다른 같은 장르 묶기. 데이터(q.chapter/qKey)는 안 건드림 */
function normChapter(ch){ch=(ch||'').trim();if(!ch||ch==='예시'||ch==='기타'||ch==='일반')return'';if(ch==='족부'||ch==='족관절'||ch==='족부족관절')return'족부·족관절';if(ch==='견관절'||ch==='견주관절')return'견·주관절';return ch;}
const CHAPTER_ICON={'총론':'📘','척추':'🦴','슬관절':'🦵','고관절':'🦿','외상':'🚑','견·주관절':'💪','족부·족관절':'🦶','소아':'🧒','종양':'🎗️','수부':'✋'};
function examGenres(){const map={};QUESTIONS.forEach(q=>{if(q.section==='📖 사용법')return;const g=normChapter(q.chapter);if(!g)return;if(!map[g])map[g]={genre:g,total:0,withChoices:0};map[g].total++;if(q.choices&&q.choices.length>0)map[g].withChoices++;});return Object.values(map).sort((a,b)=>b.withChoices-a.withChoices);}
function qInGenres(q,genres){const g=normChapter(q.chapter);return !!g&&genres.indexOf(g)>=0;}
function examPoolCount(){
  if(examConfig.mode==='chapter'){return QUESTIONS.filter(q=>q.section!=='📖 사용법'&&q.choices&&q.choices.length>0&&qInGenres(q,examConfig.chapters)).length;}
  let n=0;examConfig.sections.forEach(name=>{const s=SECTIONS.find(x=>x.name===name);if(s)n+=s.questions.filter(q=>q.choices&&q.choices.length>0).length;});return n;
}
function _examShow(){['welcomeScreen','gridContainer','quizContainer','flashContainer'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});document.getElementById('examContainer').style.display='block';document.getElementById('backBtn').style.display='none';document.getElementById('headerProgress').textContent='';setNav('exam');if(window.innerWidth<=768)closeSidebarMobile();}
function openExamSetup(){
  viewMode='exam';currentQ=null;stopExamTimer();_examShow();
  document.getElementById('headerTitle').textContent='📝 모의고사';
  const secs=SECTIONS.filter(s=>s.questions.length>0&&s.name!=='📖 사용법');
  examConfig.sections=(examConfig.sections||[]).filter(n=>secs.some(s=>s.name===n));
  if(!examConfig.sections.length)examConfig.sections=secs.map(s=>s.name);
  const genres=examGenres().map(g=>g.genre);
  examConfig.chapters=(examConfig.chapters||[]).filter(n=>genres.indexOf(n)>=0);
  /* 단원은 기본 '전체 선택 안 함' — 사용자가 직접 고름 */
  if(examConfig.mode!=='chapter')examConfig.mode='section';
  renderExamSetup(secs);
}
function renderExamSetup(secs){
  const c=document.getElementById('examContainer');
  let h='<div class="exam-wrap"><div class="exam-setup"><h2>📝 모의고사</h2><div class="es-sub">실제 시험처럼 풀어보세요. 푸는 동안엔 정답이 보이지 않고, 제출하면 채점·분석해 드립니다.</div>';
  h+='<div class="exam-cfg"><span class="ec-label">🧭 출제 기준</span><div class="exam-mode-row">';
  h+='<button class="mode-chip'+(examConfig.mode==='section'?' on':'')+'" onclick="setExamMode(\'section\')">📂 시험별</button>';
  h+='<button class="mode-chip'+(examConfig.mode==='chapter'?' on':'')+'" onclick="setExamMode(\'chapter\')">🧩 단원별(분야)</button></div>';
  if(examConfig.mode==='chapter'){
    const allG=examGenres().map(g=>g.genre);const allOn=allG.length>0&&examConfig.chapters.length>=allG.length;
    h+='<span class="ec-label">🧩 단원 선택 (분야) <button class="link-btn" onclick="toggleAllChapters()">'+(allOn?'전체 해제':'전체 선택')+'</button></span><div class="exam-sec-list">';
    examGenres().forEach(g=>{const on=examConfig.chapters.includes(g.genre);h+='<button class="exam-sec-chip'+(on?' on':'')+'" onclick="toggleExamChapter(\''+jsStr(g.genre)+'\')">'+escapeHtml((CHAPTER_ICON[g.genre]||'🧩')+' '+g.genre)+' ('+g.withChoices+')</button>';});
    h+='</div>';
    h+=examConfig.chapters.length?'<div class="dc-hint" style="margin:-6px 0 4px">단원이 지정된 문제(2026·2023 2차·인트레이닝 등)에서 분야별로 출제됩니다.</div>':'<div class="dc-hint" style="margin:-6px 0 4px;color:var(--wrong);font-weight:700">출제할 단원을 1개 이상 선택하세요.</div>';
  }else{
    h+='<span class="ec-label">📂 출제 범위 (시험)</span><div class="exam-sec-list">';
    secs.forEach(s=>{const on=examConfig.sections.includes(s.name);h+='<button class="exam-sec-chip'+(on?' on':'')+'" onclick="toggleExamSec(\''+jsStr(s.name)+'\')">'+escapeHtml(s.icon+' '+s.name)+' ('+s.questions.length+')</button>';});
    h+='</div>';
  }
  const avail=examPoolCount();
  h+='<span class="ec-label">🔢 문항 수 <span style="color:var(--text3);font-weight:600">(범위 내 '+avail+'문제)</span></span><div class="exam-count-row" id="examCountRow">';
  [10,20,40].forEach(n=>{h+='<button class="count-chip'+(examConfig.count===n?' on':'')+'" onclick="setExamCount('+n+',this)">'+n+'문제</button>';});
  h+='<button class="count-chip'+(examConfig.count==='all'?' on':'')+'" onclick="setExamCount(\'all\',this)">전체</button></div>';
  h+='<span class="ec-label">⏱ 타이머</span><div class="toggle-row"><div class="tg'+(examConfig.timer?' on':'')+'" id="examTimerToggle" onclick="toggleExamTimer()"></div><span>제한 시간 사용 (문항당 약 1분)</span></div>';
  h+='</div>';
  h+='<button class="exam-start-btn"'+(avail===0?' disabled':'')+' onclick="startExam()">🚀 모의고사 시작</button>';
  if(examHistory.length){
    h+='<div class="dash-card" style="margin-top:18px"><div class="dc-head"><div class="dc-title">📊 최근 모의고사 기록</div><button onclick="clearExamHistory()" style="background:none;border:none;color:var(--text3);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit">전체 삭제</button></div><div class="heatmap">';
    examHistory.slice(0,10).forEach(r=>{const pct=Math.round(r.correct/r.total*100);h+='<div class="heat-row exam-hist-row" onclick="openExamResult('+r.id+')" title="클릭 → 결과·해설 다시보기"><div class="hr-name">'+_examDateStr(r.date)+'</div><div class="hr-bar"><i data-fill="'+pct+'%" style="width:0;background:'+heatColor(pct)+'"></i></div><div class="hr-pct">'+r.correct+'/'+r.total+' · '+pct+'%</div><button class="exam-hist-del" title="이 기록 삭제" onclick="event.stopPropagation();deleteExam('+r.id+')">×</button></div>';});
    h+='</div><div class="dc-hint" style="margin-top:9px">기록을 클릭하면 그때 푼 문제와 해설을 다시 볼 수 있어요.</div></div>';
  }
  h+='</div></div>';
  c.innerHTML=h;animateDash();
}
function toggleExamSec(name){const i=examConfig.sections.indexOf(name);if(i>=0){if(examConfig.sections.length<=1)return;examConfig.sections.splice(i,1);}else{examConfig.sections.push(name);}const secs=SECTIONS.filter(s=>s.questions.length>0&&s.name!=='📖 사용법');renderExamSetup(secs);}
function setExamMode(m){examConfig.mode=m;const secs=SECTIONS.filter(s=>s.questions.length>0&&s.name!=='📖 사용법');renderExamSetup(secs);}
function toggleExamChapter(g){const i=examConfig.chapters.indexOf(g);if(i>=0){examConfig.chapters.splice(i,1);}else{examConfig.chapters.push(g);}const secs=SECTIONS.filter(s=>s.questions.length>0&&s.name!=='📖 사용법');renderExamSetup(secs);}
function toggleAllChapters(){const all=examGenres().map(g=>g.genre);examConfig.chapters=(examConfig.chapters.length>=all.length)?[]:all.slice();const secs=SECTIONS.filter(s=>s.questions.length>0&&s.name!=='📖 사용법');renderExamSetup(secs);}
function setExamCount(n,btn){examConfig.count=n;document.querySelectorAll('#examCountRow .count-chip').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');}
function toggleExamTimer(){examConfig.timer=!examConfig.timer;const t=document.getElementById('examTimerToggle');if(t)t.classList.toggle('on',examConfig.timer);}
function startExam(){
  let pool=[];
  if(examConfig.mode==='chapter'){pool=QUESTIONS.filter(q=>q.section!=='📖 사용법'&&qInGenres(q,examConfig.chapters));}
  else{examConfig.sections.forEach(name=>{const s=SECTIONS.find(x=>x.name===name);if(s)pool=pool.concat(s.questions);});}
  pool=pool.filter(q=>q.choices&&q.choices.length>0);
  if(!pool.length){alert('출제할 문제가 없습니다. 범위를 확인하세요.');return;}
  pool=shuffle(pool);
  const cnt=examConfig.count==='all'?pool.length:Math.min(examConfig.count,pool.length);
  examQuestions=pool.slice(0,cnt);examAnswers={};examIdx=0;examStartTs=Date.now();examLimitSec=examConfig.timer?cnt*60:0;
  stopExamTimer();if(examLimitSec>0)examTimerId=setInterval(examTick,1000);
  _examShow();document.getElementById('headerTitle').textContent='📝 모의고사 진행 중';
  renderExam();document.getElementById('contentArea').scrollTop=0;
}
function examTick(){if(examLimitSec<=0)return;const elapsed=Math.floor((Date.now()-examStartTs)/1000);const rem=examLimitSec-elapsed;const el=document.getElementById('examTimer');if(el){el.textContent='⏱ '+fmtTime(Math.max(0,rem));el.classList.toggle('warn',rem<=60);}if(rem<=0){stopExamTimer();alert('⏰ 시간이 종료되어 자동 제출합니다.');submitExam(true);}}
function stopExamTimer(){if(examTimerId){clearInterval(examTimerId);examTimerId=null;}}
function renderExam(){
  const c=document.getElementById('examContainer');const q=examQuestions[examIdx];if(!q)return;
  const total=examQuestions.length,answered=Object.keys(examAnswers).length;
  let h='<div class="exam-wrap"><div class="exam-topbar">';
  if(examLimitSec>0){const rem=Math.max(0,examLimitSec-Math.floor((Date.now()-examStartTs)/1000));h+='<div class="exam-timer'+(rem<=60?' warn':'')+'" id="examTimer">⏱ '+fmtTime(rem)+'</div>';}
  else{h+='<div class="exam-timer" id="examTimer">⏱ '+fmtTime(Math.floor((Date.now()-examStartTs)/1000))+'</div>';}
  h+='<div class="et-prog">'+answered+' / '+total+' 응답</div><button class="et-submit" onclick="submitExam(false)">제출</button></div>';
  h+='<div class="exam-omr">';
  examQuestions.forEach((qq,i)=>{h+='<button class="omr-cell'+(examAnswers[i]?' answered':'')+(i===examIdx?' current':'')+'" onclick="examGoto('+i+')">'+(i+1)+'</button>';});
  h+='</div>';
  h+='<div class="quiz-meta" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><div class="meta-section">'+escapeHtml(q.section)+'</div><div class="meta-num">'+(examIdx+1)+'번째 · 원본 Q'+q.num+'</div></div>';
  h+='<div class="quiz-question">'+escapeHtml(q.question);
  if(q.question_images&&q.question_images.length)q.question_images.forEach(img=>{h+='<br><img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});
  h+='</div><div class="quiz-choices">';
  const sel=examAnswers[examIdx];
  q.choices.forEach((ch,i)=>{const n=i+1,on=sel===n;h+='<button class="choice-btn" style="'+(on?'border-color:var(--accent);background:var(--accent-soft)':'')+'" onclick="examSelect('+n+')"><span class="choice-num"'+(on?' style="background:var(--accent);color:#fff"':'')+'>'+n+'</span><span class="choice-text">'+escapeHtml(ch)+'</span></button>';});
  h+='</div><div class="quiz-nav"><button onclick="examPrev()"'+(examIdx===0?' disabled style="opacity:.4"':'')+'>← 이전</button>';
  h+=(examIdx<total-1)?'<button class="primary" onclick="examNext()">다음 →</button>':'<button class="primary" onclick="submitExam(false)">✅ 제출하기</button>';
  h+='</div></div>';
  c.innerHTML=h;
}
function examSelect(n){examAnswers[examIdx]=n;renderExam();}
function examGoto(i){examIdx=i;renderExam();}
function examPrev(){if(examIdx>0){examIdx--;renderExam();document.getElementById('contentArea').scrollTop=0;}}
function examNext(){if(examIdx<examQuestions.length-1){examIdx++;renderExam();document.getElementById('contentArea').scrollTop=0;}}
function submitExam(auto){
  const total=examQuestions.length,answered=Object.keys(examAnswers).length;
  if(!auto&&answered<total){if(!confirm((total-answered)+'문제가 아직 비어 있습니다. 그래도 제출할까요?'))return;}
  stopExamTimer();
  let correct=0;const wrong=[],perSection={},perChapter={};
  examQuestions.forEach((q,i)=>{const sel=examAnswers[i]||null,ans=parseInt(q.answer,10),ok=sel===ans,sn=q.section,g=normChapter(q.chapter);if(!perSection[sn])perSection[sn]={total:0,correct:0};perSection[sn].total++;if(g){if(!perChapter[g])perChapter[g]={total:0,correct:0};perChapter[g].total++;}if(ok){correct++;perSection[sn].correct++;if(g)perChapter[g].correct++;}else{wrong.push({qKey:getQKey(q),section:q.section,num:q.num,chapter:g,sel:sel,ans:ans});}});
  const items=examQuestions.map((q,i)=>({qKey:getQKey(q),sel:examAnswers[i]||null,section:q.section,num:q.num}));
  const res={id:Date.now(),date:Date.now(),total:total,correct:correct,timeSec:Math.floor((Date.now()-examStartTs)/1000),mode:examConfig.mode,sections:examConfig.sections.slice(),chapters:(examConfig.chapters||[]).slice(),perSection:perSection,perChapter:perChapter,wrong:wrong,items:items};
  examHistory.unshift(res);if(examHistory.length>30)examHistory=examHistory.slice(0,30);syncToCloud();
  if(total&&correct/total>=0.6)launchConfetti();
  renderExamResult(res);document.getElementById('contentArea').scrollTop=0;
}
function renderExamResult(res){
  const c=document.getElementById('examContainer');const pct=res.total?Math.round(res.correct/res.total*100):0;
  const items=_examItems(res);
  const grade=pct>=80?'🏆 우수':pct>=60?'👍 양호':pct>=40?'💪 분발':'🌱 기초부터';
  let h='<div class="exam-result"><div class="er-hero">'+ringHtml(pct,heatColor(pct),pct+'%',res.correct+'/'+res.total,140);

  h+='</div></div>';
  if(res.perChapter&&Object.keys(res.perChapter).length){h+='<div class="dash-card"><div class="dc-head"><div class="dc-title">🧩 단원별 정답률</div></div><div class="heatmap">';
    Object.keys(res.perChapter).sort((a,b)=>res.perChapter[b].total-res.perChapter[a].total).forEach(g=>{const p=res.perChapter[g],sp=Math.round(p.correct/p.total*100);h+='<div class="heat-row" style="cursor:default"><div class="hr-name">'+escapeHtml((CHAPTER_ICON[g]||'🧩')+' '+g)+'</div><div class="hr-bar"><i data-fill="'+sp+'%" style="width:0;background:'+heatColor(sp)+'"></i></div><div class="hr-pct">'+p.correct+'/'+p.total+' · '+sp+'%</div></div>';});
    h+='</div></div>';}
  if(res.wrong.length){h+='<div class="dash-card"><div class="dc-head"><div class="dc-title">❌ 틀린/안 푼 문제 ('+res.wrong.length+')</div><div class="dc-hint">클릭 → 해설 보기</div></div><div class="memo-list" style="padding:0">';
    res.wrong.forEach(w=>{const selTxt=w.sel?('내 답 '+w.sel+'번'):'미응답';const ri=items.findIndex(it=>it.qKey===w.qKey);const cb=w.chapter?'<span class="chap-badge">'+escapeHtml((CHAPTER_ICON[w.chapter]||'🧩')+' '+w.chapter)+'</span>':'';h+='<div class="memo-item wrong" onclick="startExamReview('+res.id+','+(ri<0?0:ri)+')"><div class="memo-q">'+cb+escapeHtml(w.section)+' Q'+w.num+'</div><div style="font-size:11.5px;color:var(--wrong);margin-top:3px;font-weight:600">'+selTxt+' → 정답 '+w.ans+'번</div></div>';});
    h+='</div></div>';}
  h+='<button class="exam-start-btn" style="margin-top:16px" onclick="startExamReview('+res.id+',0)">📖 푼 문제 · 해설 전체 다시보기</button>';
  h+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">';

  h+='<button class="exam-start-btn" style="flex:1;min-width:140px;background:#fff;color:var(--text2);border:1px solid var(--border2);box-shadow:none" onclick="goHome()">🏠 홈으로</button>';
  h+='</div></div>';
  c.innerHTML=h;animateDash();
}
function examApplyWrong(id){const res=examHistory.find(r=>r.id===id);if(!res)return;if(!confirm('이 모의고사에서 틀린 문제들을 오답노트에 저장할까요? (기존 풀이 기록을 덮어쓸 수 있습니다)'))return;let n=0;res.wrong.forEach(w=>{if(w.sel){answerData[w.qKey]={selected:w.sel,correct:false,timestamp:Date.now()};n++;}});syncToCloud();updateStats();buildBookList();updateMemoCount();renderMemoPanel();updateNavMini();alert(n+'문제를 오답노트에 저장했어요.');}
function deleteExam(id){if(!confirm('이 모의고사 기록을 삭제할까요?'))return;examHistory=examHistory.filter(r=>r.id!==id);syncToCloud();openExamSetup();}
function clearExamHistory(){if(!examHistory.length)return;if(!confirm('모든 모의고사 기록을 삭제할까요?'))return;examHistory=[];syncToCloud();openExamSetup();}
function openExamResult(id){const res=examHistory.find(r=>r.id===id);if(!res)return;_examShow();document.getElementById('headerTitle').textContent='📝 모의고사 결과';renderExamResult(res);document.getElementById('contentArea').scrollTop=0;}

/* ---------- 모의고사 풀이 다시보기 ---------- */
function _examItems(res){return (res.items&&res.items.length)?res.items:((res.wrong||[]).map(w=>({qKey:w.qKey,sel:w.sel,section:w.section,num:w.num})));}
/* qKey(섹션_분야_번호)에서 섹션·번호 복원 — 섹션/분야명엔 '_'가 없다는 전제 */
function _parseQKey(k){k=String(k||'');const li=k.lastIndexOf('_');if(li<0)return{section:'',num:k};const num=k.slice(li+1);const rest=k.slice(0,li);const fi=rest.indexOf('_');return{section:fi>=0?rest.slice(0,fi):rest,num:num};}
/* 다시보기용 문제 조회 — 섹션 재빌드로 분야/번호가 바뀌어 qKey가 달라져도 섹션+번호로 강인하게 찾음 */
function _findReviewQ(it){
  if(!it)return null;
  let q=QUESTIONS.find(x=>getQKey(x)===it.qKey);if(q)return q;
  let sec=(it.section!=null)?it.section:null,num=(it.num!=null)?it.num:null;
  if(sec==null||num==null){const pp=_parseQKey(it.qKey);if(sec==null)sec=pp.section;if(num==null)num=pp.num;}
  if(sec&&num!=null){q=QUESTIONS.find(x=>x.section===sec&&String(x.num)===String(num));if(q)return q;}
  return null;
}
function startExamReview(id,idx){const res=examHistory.find(r=>r.id===id);if(!res)return;_examShow();document.getElementById('headerTitle').textContent='📖 모의고사 다시보기';try{renderExamReview(res,idx||0);}catch(e){console.error('[examReview] 렌더 실패:',e);openExamResult(id);return;}document.getElementById('contentArea').scrollTop=0;}
function renderExamReview(res,idx){
  const items=_examItems(res);const total=items.length;const c=document.getElementById('examContainer');
  if(!total){c.innerHTML='<div class="exam-wrap"><div class="exam-topbar"><button class="et-submit" style="background:#fff;color:var(--text2);border:1px solid var(--border2)" onclick="openExamResult('+res.id+')">← 결과</button></div><div class="empty-state"><div class="es-icon">🗂️</div><p>이 기록에는 다시 볼 문제 데이터가 없습니다.<br><span style="font-size:12px;color:var(--text3)">(예전 방식으로 저장되어 푼 문제 목록이 없는 기록이에요)</span></p></div></div>';return;}
  if(idx<0)idx=0;if(idx>=total)idx=total-1;
  const it=items[idx];const q=_findReviewQ(it);
  let h='<div class="exam-wrap">';
  h+='<div class="exam-topbar"><button class="et-submit" style="background:#fff;color:var(--text2);border:1px solid var(--border2)" onclick="openExamResult('+res.id+')">← 결과</button><div class="et-prog">다시보기 '+(idx+1)+' / '+total+'</div></div>';
  h+='<div class="exam-omr">';
  items.forEach((iit,i)=>{const qq=_findReviewQ(iit);const ok=qq&&iit.sel&&iit.sel===parseInt(qq.answer,10);let st='';if(iit.sel)st=ok?'background:var(--correct-bg);border-color:var(--correct);color:var(--correct)':'background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)';h+='<button class="omr-cell'+(i===idx?' current':'')+'" style="'+st+'" onclick="startExamReview('+res.id+','+i+')">'+(i+1)+'</button>';});
  h+='</div>';
  if(!q){const pp=_parseQKey(it.qKey);const sec=(it.section!=null?it.section:pp.section)||'';const num=(it.num!=null?it.num:pp.num);h+='<div class="empty-state"><div class="es-icon">❓</div><p>'+(sec?escapeHtml(sec)+' ':'')+(num!=null&&num!==''?'Q'+escapeHtml(String(num)):'이 문제')+' 데이터를 찾을 수 없습니다.<br><span style="font-size:12px;color:var(--text3)">문제가 새로 정리되어 번호가 바뀌었을 수 있어요 · 내 답: '+(it.sel?it.sel+'번':'미응답')+'</span></p></div>';h+='<div class="quiz-nav"><button onclick="startExamReview('+res.id+','+(idx-1)+')"'+(idx===0?' disabled style="opacity:.4"':'')+'>← 이전</button>';h+=(idx<total-1)?'<button class="primary" onclick="startExamReview('+res.id+','+(idx+1)+')">다음 →</button>':'<button class="primary" onclick="openExamResult('+res.id+')">결과로 →</button>';h+='</div></div>';c.innerHTML=h;return;}
  const ans=parseInt(q.answer,10);const ok=it.sel===ans;
  h+='<div class="quiz-meta" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><div class="meta-section">'+escapeHtml(q.section)+'</div><div class="meta-num">원본 Q'+q.num+'</div>';
  h+='<span style="margin-left:auto;padding:3px 11px;border-radius:12px;font-size:11.5px;font-weight:800;'+(it.sel?(ok?'background:var(--correct-bg);color:var(--correct)':'background:var(--wrong-bg);color:var(--wrong)'):'background:var(--mint2);color:var(--text2)')+'">'+(it.sel?(ok?'✅ 정답':'❌ 오답'):'⬜ 미응답')+'</span></div>';
  h+='<div class="quiz-question">'+escapeHtml(q.question);
  if(q.question_images&&q.question_images.length)q.question_images.forEach(img=>{h+='<br><img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});
  h+='</div><div class="quiz-choices">';
  (q.choices||[]).forEach((ch,i)=>{const n=i+1;let cls='choice-btn disabled';if(n===ans)cls+=' correct';else if(n===it.sel)cls+=' wrong';else cls+=' dimmed';h+='<button class="'+cls+'"><span class="choice-num">'+n+'</span><span class="choice-text">'+escapeHtml(ch)+'</span></button>';});
  h+='</div>';
  h+='<div style="font-size:12.5px;color:var(--text2);font-weight:700;margin:2px 0 12px">내 답: '+(it.sel?it.sel+'번':'미응답')+' · 정답: '+ans+'번</div>';
  if(q.explanation||q.reference||(q.explanation_images&&q.explanation_images.length)){
    h+='<div class="explanation-box"><h3>📖 해설</h3>';
    if(q.explanation)h+='<div class="expl-text">'+escapeHtml(q.explanation)+'</div>';
    if(q.reference)h+='<div class="expl-ref">📚 '+escapeHtml(q.reference)+'</div>';
    if(q.explanation_images&&q.explanation_images.length){h+='<div class="expl-images">';q.explanation_images.forEach(img=>{h+='<img src="'+img+'" onclick="openLightbox(\''+img+'\')" loading="lazy">';});h+='</div>';}
    h+='</div>';
  }else{h+='<div class="explanation-box" style="color:var(--text2);font-size:13px">등록된 해설이 없습니다.</div>';}
  h+='<div class="quiz-nav"><button onclick="startExamReview('+res.id+','+(idx-1)+')"'+(idx===0?' disabled style="opacity:.4"':'')+'>← 이전</button>';
  h+=(idx<total-1)?'<button class="primary" onclick="startExamReview('+res.id+','+(idx+1)+')">다음 →</button>':'<button class="primary" onclick="openExamResult('+res.id+')">결과로 →</button>';
  h+='</div></div>';
  c.innerHTML=h;
}

/* ---------- 메모 이미지 붙여넣기 ---------- */
function handleMemoPaste(e){
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(let i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image')===0){
      const file=items[i].getAsFile();if(!file)continue;
      e.preventDefault();
      try{showSync('syncing','🖼 이미지 처리 중...');}catch(_){}
      compressImage(file,function(dataUrl){pendingMemoImg=dataUrl;renderPendingImg();try{showSync('synced','✅ 이미지 첨부됨');}catch(_){}});
      return;
    }
  }
}
function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      let w=img.width,h=img.height;const maxD=1000;
      if(w>=h&&w>maxD){h=Math.round(h*maxD/w);w=maxD;}else if(h>w&&h>maxD){w=Math.round(w*maxD/h);h=maxD;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      let q=0.72,out;try{out=cv.toDataURL('image/jpeg',q);}catch(err){out=ev.target.result;}
      while(out.length>300000&&q>0.4){q-=0.1;out=cv.toDataURL('image/jpeg',q);}
      cb(out);
    };
    img.onerror=function(){alert('이미지를 읽지 못했습니다.');};
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function renderPendingImg(){
  const el=document.getElementById('memoImgPreview');if(!el)return;
  if(pendingMemoImg){el.style.display='';el.innerHTML='<div class="mip-wrap"><img src="'+pendingMemoImg+'"><button class="mip-del" onclick="clearPendingImg()">✕ 이미지 제거</button><span class="mip-tag">📷 첨부됨 — [📝 메모]를 누르면 함께 저장됩니다</span></div>';}
  else{el.style.display='none';el.innerHTML='';}
}
function clearPendingImg(){pendingMemoImg=null;renderPendingImg();}
</script>
<script>
/* ✨ 사이드바 라임 글로우 — 평소엔 아주 미세하게 떠다니고, 포인터가 사이드바(헤더+문제집 목록) 위에 오면 부드럽게 따라옴 */
(function(){
  var sb=document.getElementById('sidebar'); if(!sb) return;
  var reduce=false; try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  var gx=16,gy=8,t=0,ptr=false,pmx=16,pmy=8;
  sb.addEventListener('pointermove',function(e){
    var r=sb.getBoundingClientRect();
    ptr=true;
    pmx=(e.clientX-r.left)/r.width*100;
    pmy=(e.clientY-r.top)/r.height*100;
  });
  sb.addEventListener('pointerleave',function(){ptr=false;});
  function frame(){
    t+=1;
    var ax=16+Math.sin(t*0.0080)*11+Math.cos(t*0.0037)*6;   /* 평소 미세 드리프트(상단 머묾) */
    var ay=10+Math.sin(t*0.0060)*6 +Math.cos(t*0.0110)*3;
    var tx=ptr?pmx:ax, ty=ptr?pmy:ay, k=ptr?0.13:0.045;     /* 포인터엔 더 빠르게 추종 */
    gx+=(tx-gx)*k; gy+=(ty-gy)*k;
    sb.style.setProperty('--gx',gx.toFixed(2)+'%');
    sb.style.setProperty('--gy',gy.toFixed(2)+'%');
    requestAnimationFrame(frame);
  }
  if(reduce){ sb.style.setProperty('--gx','16%'); sb.style.setProperty('--gy','8%'); }
  else requestAnimationFrame(frame);
})();
</script>
