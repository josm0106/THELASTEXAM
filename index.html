  {num:18,section:"유니온 2권",chapter:"견·주관절",question:"70세 환자가 우측 견관절 통증을 주소로 내원하였다. 신체검진 상 Hornblower sign 양성이었다. 환자의 MRI로 적절한 것은?",choices:["Supraspinatus muscle insertion site tear and retraction", "Massive rotator cuff tear (supraspinatus ~ infraspinatus)", "Teres minor tear and posterior capsule tear at the humerus", "Subscapularis tendon tear", "AVN induced osteoarthritis"],answer:3,explanation:"",question_images:["images/유니온_2권_q094.jpg"],explanation_images:["images/유니온_2권_e094.jpg"]},
  {num:19,section:"유니온 2권",chapter:"견·주관절",question:"심한 회전근개 관절병증을 앓고 있는 환자에서 견관절 역 전치환술（reverse total shoulder replacement arthroplasty）을 하고자 한다. 그림 （가） 에 비해서 그림 （나） 삽입물의 장점은 무엇인가?",choices:["내회전 범위 증가", "외회전 범위 증가", "Scapular notching의 증가", "Acromial stress fracture의 감소", "외전 범위의 증가"],answer:2,explanation:"",question_images:["images/유니온_2권_q016.jpg"],explanation_images:["images/유니온_2권_e016.jpg"]},
  {num:20,section:"유니온 2권",chapter:"척추",question:"10세 소아 환자의 방사선 사진이다. 이 환자가 취하는 자세로 적절한 것은?",choices:["고관절 굴곡 + 슬관절 굴곡", "고관절 과신전 + 슬관절 굴곡", "고관절 굴곡 + 슬관절 과신전", "고관절 과신전 + 슬관절 과신전", "고관절 굴곡 + 슬관절 정상 정렬"],answer:1,explanation:"",question_images:["images/유니온_2권_q017.jpg"],explanation_images:["images/유니온_2권_e017.jpg"]},
  {num:21,section:"유니온 2권",chapter:"척추",question:"41세 남자가 4시간 전 추락사고로 응급실에 내원하였다. 진찰 소견상 양 하지의 불 완전한 운동신경의 마비를 보였으며 항문반사와 구해면체 반사는 양성이었고 항문 주위 감각은 보존되어있었다. 단순 방사선 사진과 MRI 사진은 다음과 같았다. 이 환 자의 치료로 가장 적절한 것은?",choices:["보조기 착용", "전방 감압 및 유합술", "후방 감압 및 유합술", "전후방 감압 및 유합술", "경과 관찰"],answer:4,explanation:"",question_images:["images/유니온_2권_q018.jpg"],explanation_images:["images/유니온_2권_e018.jpg"]},
  {num:22,section:"유니온 2권",chapter:"척추",question:"60세 남자가 허리 통증과 방사통을 주소로 내원하였다. 아래 영상 검사를 진행하였 다. 원인이 되는 구조물은?",choices:["우측 제 4 요추", "좌측 제 4 요추", "우측 제 5 요추", "좌측 제 5 요추", "좌측 제 1 천추"],answer:3,explanation:"",question_images:["images/유니온_2권_q019.jpg"],explanation_images:["images/유니온_2권_e019.jpg"]},
  {num:23,section:"유니온 2권",chapter:"척추",question:"제 4-5 요추 후방 요추체간 유합술 과정에서 cage를 삽입하는 중 경막을 내측으로 견인하면서 신경근이 손상되었다. 다음 중 감각 이상을 보일 가능성이 가장 높은 구",choices:["1", "2", "3", "4", "5"],answer:3,explanation:"",question_images:["images/유니온_2권_q020.jpg"],explanation_images:["images/유니온_2권_e020.jpg"]},
  {num:24,section:"유니온 2권",chapter:"척추",question:"교통사고 이후 경부통으로 응급실에 내원하였다. 다음 방사선 검사에서 보이는 경추 손상의 기전은?",choices:["수직 압박 손상", "신연 굴곡 손상", "신연 신전 손상", "압박 굴곡 손상", "압박 신연 손상"],answer:4,explanation:"",question_images:["images/유니온_2권_q021.jpg"],explanation_images:["images/유니온_2권_e021.jpg"]},
  {num:25,section:"유니온 2권",chapter:"척추",question:"40세 환자가 경부통과 함께 우측 상지 방사통으로 내원하였다. 아래와 같은 자세를 취하면 증상이 완화된다. 시행한 MRI 검사는 다음과 같다. 화살표 병변으로 인해 발 생하는 방사통의 전형적인 위치는?",choices:["1", "2", "3", "4", "5"],answer:4,explanation:"",question_images:["images/유니온_2권_q022.jpg"],explanation_images:["images/유니온_2권_e022.jpg"]},
  {num:26,section:"유니온 2권",chapter:"척추",question:"70세 환자가 보행이상과 양손의 어눌함으로 아래 수술을 하였다. 우측 접근을 하였 고 수술 후 쉰 목소리가 발생하였다. 이때 손상된 구조물은?",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_2권_q023.jpg"],explanation_images:["images/유니온_2권_e023.jpg"]},
  {num:27,section:"유니온 2권",chapter:"척추",question:"64세 여자 환자가 하지 방사통이 심하여 촬영한 MRI 사진(L3-4, L4-5 central spinal stenosis with ligamentum flavum hypertrophy)이다. 위 환자의 방사통의 위치는?",choices:["① (문제 이미지의 dermatome 도식 참조)", "② (문제 이미지의 dermatome 도식 참조)", "③ (문제 이미지의 dermatome 도식 참조)", "④ (문제 이미지의 dermatome 도식 참조)", "⑤ (문제 이미지의 dermatome 도식 참조)"],answer:5,explanation:"정답: 5번. 문제의 MRI 소견은 L3-4, L4-5 central canal stenosis with ligamentum flavum hypertrophy. Cauda equina nerve root의 해부학적 배열상 중앙(central)에는 S2-S5 nerve roots가 위치하고, L5 nerve root는 dura의 전외측에 배치되어 있다. 따라서 central stenosis가 주된 병변일 때는 중앙에 위치한 S2-S5 root가 먼저 압박되어 회음부/안장마비(saddle anesthesia) 양상의 방사통이 주 증상이 된다. Key point: L4-5 level cauda equina root의 해부학적 배열을 기억할 것 (central = sacral roots, lateral = lumbar roots).",question_images:["images/유니온_2권_q095.jpg"],explanation_images:["images/유니온_2권_e095.jpg"]},
  {num:28,section:"유니온 2권",chapter:"척추",question:"20세 남자 환자가 심부 감각과 고유 감각이 소실되었다. 하지만 통각과 온도 감각 신경은 보존되었고, 운동신경도 보존되었다. 환자의 MRI 사진이다. 적절한 진단은?",choices:["Posterior cord syndrome", "Anterior cord syndrome", "Central cord syndrome", "Brown-sequard syndrome", "Cauda equina syndrome"],answer:1,explanation:"",question_images:["images/유니온_2권_q024.jpg"],explanation_images:["images/유니온_2권_e024.jpg"]},
  {num:29,section:"유니온 2권",chapter:"척추",question:"척추의 시상면 균형을 분석하는데 골반지표를 계측하는 것이 필수이다. 요추 후만의 환자를 치료할 때 아래 그림의 다 와 임상적으로 가장 관련이 깊은 것은? Horizontal Femoral Head",choices:["흉추 후만각", "시상수직 축", "요추전만각", "경추전만각", "요천추 측만각"],answer:3,explanation:"",question_images:["images/유니온_2권_q025.jpg"],explanation_images:["images/유니온_2권_e025.jpg"]},
  {num:30,section:"유니온 2권",chapter:"척추",question:"75세 여환이 다음과 같은 변형이 있을 때 나타날 수 있는 소견을 고르시오",choices:["경추전만각증가", "요추 전만각 감소", "슬관절 신전", "고관절 신전", "골반 retroversion"],answer:1,explanation:"",question_images:["images/유니온_2권_q026.jpg"],explanation_images:["images/유니온_2권_e026.jpg"]},
  {num:31,section:"유니온 2권",chapter:"척추",question:"경추 경막외 신경 차단술 후 호흡곤란을 호소하다 전신마비가 발생하였다. 증상을 유발할 가능성이 높은 것은?",choices:["식도 손상", "경막 손상", "신경근 손상", "아나필라틱 반응", "혈관 내 약물 주입"],answer:5,explanation:"",question_images:["images/유니온_2권_q027.jpg"],explanation_images:["images/유니온_2권_e027.jpg"]},
  {num:32,section:"유니온 2권",chapter:"고관절",question:"25세 체조 선수로 2달 전 체조 경기 중 수상한 이후 지속적인 좌측 고관절 통증을 호 소하는 환자이다. 상기 환자의 자기 공명 영상검사 및 관절경 소견이다. 진단은?",choices:["Labral tear", "Ligamentum teres tear", "Acetabular cartilage injury", "Osteochondral defect", "Osteonecrosis of femoral head"],answer:2,explanation:"",question_images:["images/유니온_2권_q028.jpg"],explanation_images:["images/유니온_2권_e028.jpg"]},
  {num:33,section:"유니온 2권",chapter:"고관절",question:"24세 축구선수가 심한 외상력 없이 4개월전부터 발생한 우측 치골, 사타구니 통증을 주소로 내원하였다. 촬영한 단순 방사선 사진은 정상이었으나 MRI에서 아래와 같은 소견이 관찰되었다. 다음 중 증상의 유발한 원인이 되는 근육은?",choices:["Abdominis external oblique", "Adductor longus", "Abdominis internal oblique", "Rectus femoris", "Sartorius"],answer:2,explanation:"",question_images:["images/유니온_2권_q029.jpg"],explanation_images:["images/유니온_2권_e029.jpg"]},
  {num:34,section:"유니온 2권",chapter:"고관절",question:"46세 남자가 우측 서혜부 통증을 주소로 내원하였다. 신체검사 상 전방 충돌은 음성 이었다. 아래 영상 검사를 시행하였다. 적절한 진단은?",choices:["골수염", "대퇴 경부 골절", "대퇴 골두 괴사", "피로하 골절", "대퇴골두 충돌 증후군"],answer:3,explanation:"",question_images:["images/유니온_2권_q030.jpg"],explanation_images:["images/유니온_2권_e030.jpg"]},
  {num:35,section:"유니온 2권",chapter:"고관절",question:"요통과 하지 방사통 그리고 고관절 통증이 있는 환자가 내원하였다. 환자는 인공관 절 전치환술과 요추 후방 유합술을 시행 예정이다. 먼저 인공관절 전치환술을 시행 하고 (1), 6개월 후 요추 후방 유합술을 (2) 시행하였다. 이후 고관절 탈구가 (3) 발생 할 때, 탈구의 방향 (A)과 revision 시 비구컵의 위치 (B)는 어떻게 해야 하는가? 그림 1 그림 2 그림 3",choices:["전방 - 전염각 증가", "후방 - 전염각 증가", "후방 - 전염각 감소", "전방 - 전염각 감소", "측방 - 전염각 증가"],answer:2,explanation:"",question_images:["images/유니온_2권_q031.jpg"],explanation_images:["images/유니온_2권_e031.jpg"]},
  {num:36,section:"유니온 2권",chapter:"고관절",question:"81세 환자가 우측 dual mobility cup을 이용하여 수술하였다. 이후 고관절 탈구가 （그림 1） 되어 응급실 내원하여 도수 정복 （그림 2）을 시행하였다. 정복 후 촬영한 방 사선 영상 사진이다. 이에 적절한 치료는? 그림 1 그림 2",choices:["비구컵 재치환", "스템 재치환", "관혈적 정복 및 라이너 교체", "도수 정복 및 외전 보조기 착용", "라이너 치환"],answer:5,explanation:"",question_images:["images/유니온_2권_q032.jpg"],explanation_images:["images/유니온_2권_e032.jpg"]},
  {num:37,section:"유니온 2권",chapter:"고관절",question:"42세 여자 환자가 파행과 하지 부동을 주소로 내원하였다. 과거력상 우측 결핵성 고 관절염으로 고관절 유합술을 시행 받았다. 수 년전부터 좌측 고관절의 간헐적 통증 과 심한 요통으로 보행이 어려울 정도이나 척추의 다른 질환은 없었다. 좌측 고관절 과 양 슬관절 운동 범위는 정상일 때 가장 적절한 치료는?",choices:["보존적 치료", "하지연장술", "대전자 이전술", "절제 관절 성형술", "고관절 전치환술"],answer:5,explanation:"",question_images:["images/유니온_2권_q033.jpg"],explanation_images:["images/유니온_2권_e033.jpg"]},
  {num:38,section:"유니온 2권",chapter:"고관절",question:"다음 중 high offset stem을 적용한 것은 무엇인가? (빨간색 점은 acetabular cup의 중심, 노란색 점은 femoral head의 중심이다.)",choices:["노란점이 빨간점과 수직 높이는 같고, 빨간점보다 lateral에 위치", "노란점이 빨간점과 수직 높이는 같고, 빨간점보다 medial에 위치", "노란점이 빨간점보다 위에 위치하고 lateral에 위치", "노란점이 빨간점보다 아래에 위치하고 medial에 위치", "노란점이 빨간점과 완전히 일치"],answer:5,explanation:"",question_images:["images/유니온_2권_q096.jpg"],explanation_images:["images/유니온_2권_e096.jpg"]},
  {num:39,section:"유니온 2권",chapter:"고관절",question:"25세 남자가 외상 후 전자간 골절이 발생하였다. 이때 적절한 치료는?",choices:["Compression hip screw", "IVhjItiple pinning", "Intramedullary nailing", "Lateral anatomical plate", "Extenral fixator"],answer:3,explanation:"",question_images:["images/유니온_2권_q034.jpg"],explanation_images:["images/유니온_2권_e034.jpg"]},
  {num:40,section:"유니온 2권",chapter:"고관절",question:"인공 고관절 전치환술에서 direct anterior approach를 시행하였다. 이때 사용하는 internervous plane의 경계는 어떻게 되는가?",choices:["대퇴신경-상둔신경", "대퇴신경 - 하둔신경", "외측 대퇴피신경 - 대퇴신경", "좌골신경-하둔신경", "좌골신경-상둔신경"],answer:2,explanation:"",question_images:["images/유니온_2권_q035.jpg"],explanation_images:["images/유니온_2권_e035.jpg"]},
  {num:41,section:"유니온 2권",chapter:"고관절",question:"대퇴골 골수강내 금속정 고정술을 하려고 한다. Trochanteric nail을 사용할 때, 방 사선 사진에서 올바른 entry point의 조합으로 옳은 것은?",choices:["1-ㄱ", "2-ㄱ", "3-ㄱ", "1-ㄴ", "2-ㄴ"],answer:5,explanation:"",question_images:["images/유니온_2권_q036.jpg"],explanation_images:["images/유니온_2권_e036.jpg"]},
  {num:42,section:"유니온 2권",chapter:"고관절",question:"Percutaneous sacroiliac screw를 삽입하기 위해 intraoperative C-arm 사진을 촬 영하였다. 화살표가 가리키는 방향으로 screw insertion시 발생하는 합병증은?",choices:["L3 root", "L4 root", "L5 root", "SI root", "S2 root"],answer:3,explanation:"",question_images:["images/유니온_2권_q037.jpg"],explanation_images:["images/유니온_2권_e037.jpg"]},
  {num:43,section:"유니온 2권",chapter:"고관절",question:"다음과 같은 수술 후 사진이 관찰되는 환자가 병적 보행을 주소로 내원하였다. 우측 고관절 통증은 없는 상태로 다음 환자가 보이는 보행은 어떤 보행인가?",choices:["Antalgic gait", "Tandem gait", "Ataxic gait", "Vaulting gait", "Waddling gait"],answer:4,explanation:"",question_images:["images/유니온_2권_q038.jpg"],explanation_images:["images/유니온_2권_e038.jpg"]},
  {num:44,section:"유니온 2권",chapter:"슬관절",question:"10년 전 인공슬관절 치환술을 받은 60세 환자가 3달 전부터 수술한 무릎의 통증과 종창을 주소로 내원하였다. 혈액검사에서 ESR 57mm/hr, CRP 5.5mg/dL（정상 : 0.5 이하）였다. 관절 천자 검사에서 백혈구 12,800/mm3, 다형핵호중구 76%였고, 균배 양검사에서 메 티실린 내성 황색포도상구균이 확인되었다. 가장 적절한 치료법은?",choices:["경과 관찰", "변연절제술", "항생제 치료", "1단계 재치환술", "2단계 재치환술"],answer:5,explanation:"",question_images:["images/유니온_2권_q039.jpg"],explanation_images:["images/유니온_2권_e039.jpg"]},
  {num:45,section:"유니온 2권",chapter:"슬관절",question:"외반슬 환자를 인공슬관절 전치환술을 계획하였다. 수술 중 gap을 재었더니 flexion gap은 대칭적이었으나, extension gap은 외측 구획이 내측 구획보다 tight 하였다. 가장 먼저 유리할 구조물은?",choices:["내측 슬개대퇴인대", "장경대", "외측측부인대", "반막양근", "후외방 관절막"],answer:2,explanation:"",question_images:["images/유니온_2권_q040.jpg"],explanation_images:["images/유니온_2권_e040.jpg"]},
  {num:46,section:"유니온 2권",chapter:"슬관절",question:"24세 남자가 우측 슬관절의 통증을 주소로 내원하였다. MRI 검사에서 외측 반월상 연골판의 전각의 longitudinal tear가 발견되었다. 관절경 outside-in technique 로 봉합을 하였다. 이때, 만들어야 할 portal의 위치로 알맞은 것은? (1은 표준 anteromedial portal이다.)",choices:["(1)보다 상외측", "(1)보다 상내측", "⑴", "(1)보다 하외측", "(1)보다 하내측"],answer:2,explanation:"",question_images:["images/유니온_2권_q041.jpg"],explanation_images:["images/유니온_2권_e041.jpg"]},
  {num:47,section:"유니온 2권",chapter:"슬관절",question:"근위 경골 고평부 골절에서 가장 흔하게 생기는 인대파열은?",choices:["내측측부인대", "외측측부인대", "전방십자인대", "후방십자인대", "슬개대퇴인대"],answer:1,explanation:"",question_images:["images/유니온_2권_q042.jpg"],explanation_images:["images/유니온_2권_e042.jpg"]},
  {num:48,section:"유니온 2권",chapter:"슬관절",question:"간헐적으로 부위가 명확하지 않은 좌측 무릎 통증을 호소하는 14세 남자의 MRI 사 진이다. Tanner stage 3 였다. 방사선 사진 상, trochlear angle0| 147’, congruence angle 22’, caton-deschamps ratio 1.0, TT-TG distance 22mm였다. 이전에는 0| 런 통증 있던 적이 없었다. 가장 적절한 치료는?",choices:["관혈적 골연골편 정복술", "관혈적 골연골편 정복술 + 내측슬개대퇴인대 재건술", "관혈적 골연골편 정복술 + 내측슬개대퇴인대 재건술 + 경골결절 내측 이전술", "관혈적 골연골편 정복술 + 내측슬개대퇴인대 재건 + 경골결절 전내측 이전술", "외측인대유리술 + 내측슬개대퇴 인대 재건술"],answer:2,explanation:"",question_images:["images/유니온_2권_q043.jpg"],explanation_images:["images/유니온_2권_e043.jpg"]},
  {num:49,section:"유니온 2권",chapter:"슬관절",question:"25세 남자 환자가 3달 전 농구 중 무릎을 다쳤다. 이후 반복적으로 발생하는 슬개골 탈구로 내원하였다. 총 3회 탈구 이력이 있다. 방사선 사진과 MRI 사진은 다음과 같 다. 슬관절 굴곡-신전시 동영상은 아래와 같다. 적절한 치료는? 동영상: 굴곡시 슬개 골이 정복되었다가, 신 전시 슬개골이 lateral subhuxation 된다.",choices:["내측 슬개대퇴인대 재건술", "외측지대 유리술", "보조기 착용", "경골 외반 절골술", "경골결절 원위 이전술"],answer:1,explanation:"",question_images:["images/유니온_2권_q044.jpg"],explanation_images:["images/유니온_2권_e044.jpg"]},
  {num:50,section:"유니온 2권",chapter:"슬관절",question:"25세 축구선수가 1주일 전 점프를 하면서 착지하는 과정에서 넘어진 후 슬관절 통 증을 호소하였다. 신체검진 상 lachman test는 3+ 내측측부인대 근위부에 압통이 있었고, flexion 3O’valgus stress test 3+, extension valgus stress test 2+ 였다‘. MRI 소견은 아래와 같았다. 알맞은 치료는?",choices:["전방십자인대 재건술 + 내측측부인대 보존적 치료", "전방십자인대 재건술 + 내측측부인대 봉합술", "전방십자인대 보존적 치료 + 내측측부인대 봉합술", "보조기 치료", "장하지 석고 고정"],answer:2,explanation:"",question_images:["images/유니온_2권_q045.jpg"],explanation_images:["images/유니온_2권_e045.jpg"]},
  {num:51,section:"유니온 2권",chapter:"슬관절",question:"인공슬관절 전치환술을 하던 중 다음과 같은 기구로 대퇴 치환물 크기를 측정하였 다. 크기가 2와 3 사이가 나와서 2번을 선택하였다. 이때 생기는 부작용에 대한 치료 로 알맞은 것은?",choices:["원위 대퇴부 metal block 보강", "후방 관절막 유리술", "전방 내측측부인대 유리술", "경골 후방경사 증가", "근위 경골 추가 절제"],answer:2,explanation:"",question_images:["images/유니온_2권_q046.jpg"],explanation_images:["images/유니온_2권_e046.jpg"]},
  {num:52,section:"유니온 2권",chapter:"슬관절",question:"좌측 슬관절 전치환술 후 추시 관찰 중 아래와 같은 영상 검사 소견이 있어 재 치환 술을 하였다. 사진과 같은 수술장 소견을 보였을 때, 골결손에 대한 처치로 가장 적절 한것은?",choices:["Morselized bone graft", "Structural allo-bone prosthesis component", "Arthrodesis", "Bone cement", "Further cutting"],answer:2,explanation:"",question_images:["images/유니온_2권_q047.jpg"],explanation_images:["images/유니온_2권_e047.jpg"]},
  {num:53,section:"유니온 2권",chapter:"슬관절",question:"55세 환자가 인공슬관절 전치환술을 5년 전 시행하였다. 넘어진 후 슬관절 통증으로 촬영한 방사선 사진이다. 치환물의 해리 소견은 없었을 때 적절한 치료법은?",choices:["역행성 골수강 내정", "긴 금속판 고정술", "주대를 사용한 재치환술", "종양 치환물", "보존적 치료"],answer:2,explanation:"",question_images:["images/유니온_2권_q048.jpg"],explanation_images:["images/유니온_2권_e048.jpg"]},
  {num:54,section:"유니온 2권",chapter:"슬관절",question:"25세 남자가 후방십자인대 파열로 재건술을 계획 중이다. 이때 대퇴골, 경골 tunnel 의 적절한 위치의 조합은?",choices:["1-ㄱ", "1-ㄴ", "1-ㄷ", "2-ㄱ", "2-ㄴ"],answer:2,explanation:"",question_images:["images/유니온_2권_q049.jpg"],explanation_images:["images/유니온_2권_e049.jpg"]},
  {num:55,section:"유니온 2권",chapter:"슬관절",question:"55세 환자가 6개월 전 발생한 외상 후 지속되는 좌측 슬관절 불안정성을 주소로 내 원하였다. 슬관절 신체검진 및 보행 시 (A,B) 양상과 후방 부하 방사선 사진(C), 촬영 한 자기 공명 영상 검사(D)이다. 일차적으로 먼저 시행해야 할 치료는?",choices:["전방십자인대 재건술", "후방십자인대 재건술", "후외측인대 재건술", "내측 개방형 근위 경골 외반 절골술", "외측 폐쇄형 근위 경골 외반 절골술"],answer:4,explanation:"",question_images:["images/유니온_2권_q050.jpg"],explanation_images:["images/유니온_2권_e050.jpg"]},
  {num:56,section:"유니온 2권",chapter:"족부·족관절",question:"38세 여성 환자의 방사선 사진이다. 과거력상 류마토이드 관절염으로 치료받고 있 으며, 보조기 착용 및 교정으로도 전족부의 불편 및 통증이 지속되었다. 가장 적절한 치료는 무엇인가?",choices:["원위 중족골 골절술", "근위 중족골 골절술", "제 1 중족족지 관절 고정술", "제 1 중족족지 관절 고정술 + 제 2,3,4,5 중족골 단축 절골술", "제 1 중족족지 관절 고정술 + 제 2,3,4,5 중족골두 절제 성형술"],answer:5,explanation:"",question_images:["images/유니온_2권_q051.jpg"],explanation_images:["images/유니온_2권_e051.jpg"]},
  {num:57,section:"유니온 2권",chapter:"족부·족관절",question:"64세 여자가 좌측 족관절의 종창 및 발적이 있지만 통증은 없다. 환자는 제2형 당뇨 병을 20년째 앓고 있었다. 외상력은 없었다. 전 접촉 석고 고정 후에도 변형과 종창 이 진행할 때 가장 적절한 치료는?",choices:["변연절제술", "관혈적 정복술", "유합술", "인공관절 전치환술", "절제 관절성형술"],answer:3,explanation:"",question_images:["images/유니온_2권_q052.jpg"],explanation_images:["images/유니온_2권_e052.jpg"]},
  {num:58,section:"유니온 2권",chapter:"족부·족관절",question:"전거비인대 봉합술을 위한 족관절 working portal로 적절한 위치는?",choices:["A", "B", "C", "D", "E"],answer:4,explanation:"",question_images:["images/유니온_2권_q053.jpg"],explanation_images:["images/유니온_2권_e053.jpg"]},
  {num:59,section:"유니온 2권",chapter:"족부·족관절",question:"22세 남자가 외상 후 발생한 족관절 통증을 주소로 내원하였다. 아래 방사선 사진이 다. 정복을 방해하는 구조물은?",choices:["Tibialis posterior tendon （Medial malleolus와 골절편 사이）", "Tibialis posterior tendon （Talus와 medial malleolus 사이）", "Flexor hallucis longus tendon", "Peroneus tendon", "Periosteum"],answer:2,explanation:"",question_images:["images/유니온_2권_q054.jpg"],explanation_images:["images/유니온_2권_e054.jpg"]},
  {num:60,section:"유니온 2권",chapter:"족부·족관절",question:"6개월 전부터 시작된 우측 족관절 통증으로 시행한 임상 사진 및 초음파 영상(varus stress 시 talus와 fibula 과도하게 벌어짐)이다. 수술적인 치료를 결정하고 족관절 관절경 검사를 시행할 때, 초음파 검사 결과에 부합하는 가장 알맞은 관절경 소견은?",choices:["AiTFL (anterior inferior tibiofibular ligament)", "PiTFL (posterior inferior tibiofibular ligament)", "ATFL (anterior talofibular ligament)", "CFL (calcaneofibular ligament)"],answer:3,explanation:"정답: 3번 (ATFL). Ankle sprain에서 ATFL rupture 진단을 위해 초음파 검사를 한다. Probe는 lateral ankle에서 fibula의 anterior margin → posterior 방향으로 oblique하게 위치시키고, varus stress 시 talus-fibula가 과도하게 벌어짐을 확인한다. 본 문제의 동영상에서도 varus stress 시 talus-fibula가 과도하게 벌어져 ATFL tension이 없음을 확인. 보기 ①은 AiTFL, ②는 PiTFL, ③은 ATFL, ④는 CFL의 관절경 소견이다. Key point: Ankle arthroscopy에서 AiTFL, PiTFL, ATFL, deltoid ligament 4가지를 구분할 수 있어야 한다.",question_images:["images/유니온_2권_q097.jpg"],explanation_images:["images/유니온_2권_e097.jpg"]},
  {num:61,section:"유니온 2권",chapter:"족부·족관절",question:"64세 여자가 10년 전 좌측 족관절, 거골하관절 유합술을 시행하였다. 6개월 전부터 우측 발목 통증으로 보행이 힘들어 내원하였다. 단순 방사선 사진에서 grade IV의 관절염 소견과 내반 변형이 10도 있었다. 신체검진 상 불안정성은 없었다. 상기 환자 의 치료로 적절한 것은?",choices:["과상부 교정절골술", "과상부 교정절골술 및 관절경적 변연절제술", "관절경적 변연절제술", "과상부 교정절골술 및 인공관절 전치환술", "족관절 인공관절 전치환술"],answer:5,explanation:"",question_images:["images/유니온_2권_q055.jpg"],explanation_images:["images/유니온_2권_e055.jpg"]},
  {num:62,section:"유니온 2권",chapter:"족부·족관절",question:"다음과 같은 자세의 운동 처방을 하였을 때, 증상이 악화 될 가능성이 있어 권장되지 않은 질환은?",choices:["Insertional achilles tendinopathy", "Noninsertional achilles tendinopathy", "Retrocalcaneal bursitis", "Plantar fasciitis", "Flexible flat foot"],answer:3,explanation:"",question_images:["images/유니온_2권_q056.jpg"],explanation_images:["images/유니온_2권_e056.jpg"]},
  {num:63,section:"유니온 2권",chapter:"외상",question:"다음 골절 손상에서 소독용으로 사용할 수 있는 물질은?",choices:["Saline", "Polymyxin", "Chloroxylenol", "Idophor", "Hydrogen peroxide"],answer:1,explanation:"",question_images:["images/유니온_2권_q057.jpg"],explanation_images:["images/유니온_2권_e057.jpg"]},
  {num:64,section:"유니온 2권",chapter:"외상",question:"방사선 사진상 아래의 골절에 대해 관혈적 정복 및 금속판 고정술을 시행하였다. 금 속판의 원리는?",choices:["neutralizing", "bridging", "buttress", "compression", "tension band"],answer:3,explanation:"",question_images:["images/유니온_2권_q058.jpg"],explanation_images:["images/유니온_2권_e058.jpg"]},
  {num:65,section:"유니온 2권",chapter:"외상",question:"원위 대퇴골 골절에서 금속판과 나사를 이용한 내고정을 하고자 한다. 다음과 같은 자세에서 수술하는 이유는 어떤 구조물을 이완시키기 위함인가?",choices:["Hip adductor muscles", "Gastrocnemius muscle", "Hamstring muscle", "Vastus lateralis", "Iliotibial band"],answer:2,explanation:"",question_images:["images/유니온_2권_q059.jpg"],explanation_images:["images/유니온_2권_e059.jpg"]},
  {num:66,section:"유니온 2권",chapter:"외상",question:"환자가 버스에 깔린 상태로 수상한 뒤 다발성 골절로 내원하였다. 좌측 대퇴골은 외 회전, 우측 고관절은 내회전 되어 있는 상태였다. 이에 대해 수술적 치료를 시행하였 다. Young and burgers classification 상의 분류는 무엇인가?",choices:["APC type 2", "APC type 3", "LC type 1", "LC type 2", "LC type 3"],answer:5,explanation:"",question_images:["images/유니온_2권_q060.jpg"],explanation_images:["images/유니온_2권_e060.jpg"]},
  {num:67,section:"유니온 2권",chapter:"외상",question:"대퇴골 간부 골절로 골수강내 금속정 고정술을 시행하였다. 이후 intramedullary nail을 dynamization을 고려하기 위해 적절하게 interlocking screw가 삽입 되어 있 는 경우는?",choices:["12 + —1L_", "13 + -11_", "12 + “I【=", "12 + 그 1三", "12 + 刀 2"],answer:2,explanation:"",question_images:["images/유니온_2권_q061.jpg"],explanation_images:["images/유니온_2권_e061.jpg"]},
  {num:68,section:"유니온 2권",chapter:"외상",question:"57세 남자 환자가 3시간 전에 교통사고로 인해 좌측 원위 대퇴 골절이 발생하 여 내원하였다. 진찰 소견에서 외부로 노출된 상처는 없었으나 전반적인 부종 및 ecchymosis가 보였고 촉진을 하였을 때 crepitus가 있었고 피부색은 창백했다. 혈 압은 120/80mmHg, HR 90회였다. 우측 발등의 족배동맥의 맥박이 촉지 되지 않아 angio CT를 시행하였다. 다음 환자에서 가장 적절한 치료는?",choices:["대퇴 골절 부위 절단술", "혈관 문합 + 외고정술", "혈관 문합 + 골수정 내고정술", "혈관 문합 + 외고정술 + 변연절제술", "혈관 문합 + 골수정 내고정술 + 변연절제술"],answer:4,explanation:"",question_images:["images/유니온_2권_q062.jpg"],explanation_images:["images/유니온_2권_e062.jpg"]},
  {num:69,section:"유니온 2권",chapter:"소아",question:"우측 족부 외측에 동통과 압통을 호소하는 10세 여아의 방사선 사진이다. 체중부하 시 통증이 발생하였으며 resisted eversion 시 pain이 증가하였다. 진단은?",choices:["Sever’s disease", "5th metatarsal base stress fracture", "Iselin’s disease", "Sequestrum", "Sinding larsen johansson syndrome"],answer:3,explanation:"",question_images:["images/유니온_2권_q063.jpg"],explanation_images:["images/유니온_2권_e063.jpg"]},
  {num:70,section:"유니온 2권",chapter:"소아",question:"뇌성마비(cerebral palsy) 환자에서 일단계 다수준 수술(single-event multilevel surgery) 후 좋은 결과를 기대할 수 있는 수술 전 환아의 보행 형태는? (가: crouch gait, 나: spastic scissoring gait, 다: Trendelenburg gait, 라: ataxic gait, 마: athetoid gait)",choices:["가 (crouch gait)", "나 (spastic scissoring gait)", "다 (Trendelenburg gait)", "라 (ataxic gait)", "마 (athetoid gait)"],answer:2,explanation:"",question_images:["images/유니온_2권_q098.jpg"],explanation_images:["images/유니온_2권_e098.jpg"]},
  {num:71,section:"유니온 2권",chapter:"소아",question:"5세 소아 환아가 주관절 통증을 주소로 내원하였다. 촬영한 방사선 사진이 다음과 같 다. 수술 중에 정복이 잘 되었는지 가장 정확하게 환인할 수 있는 view는 무엇인가?",choices:["Arthrogram", "Internal oblique view", "External oblique view", "Jones view", "Valgus stress view"],answer:2,explanation:"",question_images:["images/유니온_2권_q064.jpg"],explanation_images:["images/유니온_2권_e064.jpg"]},
  {num:72,section:"유니온 2권",chapter:"소아",question:"출생 당시 우측 발달성 고관절 이형성증으로 생후 7개월에 도수 정복 및 고수상 석고 고정으로 치료하였다. 이후 1 년마다 외래에서 방사선 사진을 촬영하며 외래 추시 하 였다. 2세에 촬영한 방사선 사진 (A) 와 금번 7세의 나이로 촬영한 방사선 사진 (B) 이다. 다음과 같이 보이는 이유는? A W티CHT BEARING B",choices:["비동심성정복", "성장판 조기유합", "대퇴골두 무혈성 괴사", "관절운동 제한", "재탈구"],answer:2,explanation:"",question_images:["images/유니온_2권_q065.jpg"],explanation_images:["images/유니온_2권_e065.jpg"]},
  {num:73,section:"유니온 2권",chapter:"소아",question:"10cm°| 대퇴골 단축이 있는 환자에서 대퇴골 연장술을 시행하였다. 수술 후 방사선 사진이다. 아래 그림과 같은 방법으로 연장술을 시행했을 때 예상되는 결과는?",choices:["Mechanical axis의 내반", "Mechanical axis의 외반", "Anatomical axis의 외측이동", "Anatomical axis의 내측이동", "Anatomical axis의 후측이동"],answer:2,explanation:"",question_images:["images/유니온_2권_q066.jpg"],explanation_images:["images/유니온_2권_e066.jpg"]},
  {num:74,section:"유니온 2권",chapter:"소아",question:"발달성 고관절 이형성증 환아에서 파블릭 보장구를 채울 때 착용 순서로 옳은 것은? A： Shoulder strap B： Anterolateral strap C： Foot strap D： Posterolateral strap",choices:["A-B-C-D", "A-C-B-D", "D-A-B-C", "C-D-A-B", "C-B-A-D"],answer:2,explanation:"",question_images:["images/유니온_2권_q067.jpg"],explanation_images:["images/유니온_2권_e067.jpg"]},
  {num:75,section:"유니온 2권",chapter:"소아",question:"다음은 Ponseti method에 의한 선천성 만곡족(clubfoot) 치료의 여러 조작 사진이다 (가: midfoot adductus 교정, 나: forefoot pronation/cavus 교정, 다: equinus 교정, 라: Denis-Browne 보조기, 마: 마지막 석고고정 위치). 가장 첫 번째로 시행해야 하는 조작은?",choices:["가 (midfoot adductus 교정)", "나 (forefoot pronation/cavus 교정)", "다 (equinus 교정)", "라 (Denis-Browne 보조기 착용)", "마 (족관절 20도 족배굴곡, 70도 외전 위치 석고고정)"],answer:2,explanation:"",question_images:["images/유니온_2권_q099.jpg"],explanation_images:["images/유니온_2권_e099.jpg"]},
  {num:76,section:"유니온 2권",chapter:"소아",question:"8세 소아가 완관절 부위 수상 후 A와 같은 골절이 있어 도수 정복 후 만족할 만한 정 복을 얻은 후 2주에 내원하였다. 단순 방사선 사진은 B와 같다. 현 시점에서 가장 옳 은 치료법을 고르시오. 그림 A 그림 B",choices:["현 상태로 석고붕대 고정", "도수 정복 및 석고붕대 고정", "도수 정복 미 내고정술", "수술적 정복 및 내고정술", "교정 절골술 및 내고정술"],answer:1,explanation:"",question_images:["images/유니온_2권_q068.jpg"],explanation_images:["images/유니온_2권_e068.jpg"]},
  {num:77,section:"유니온 2권",chapter:"소아",question:"다음 사진들은 소아에서 보일 수 있는 다양한 tibia bowing의 양상이다(1~4: Type II~IV congenital pseudoarthrosis of tibia, 5: posteromedial bowing of tibia). 이 중 그 경과가 가장 양호하여 단순 추시 관찰이 가능할 것으로 생각되는 것은?",choices:["Type II congenital pseudoarthrosis of tibia (전외측 각형성)", "Type III congenital pseudoarthrosis of tibia", "Type IV congenital pseudoarthrosis of tibia", "Anterolateral bowing of tibia", "Posteromedial bowing of tibia (후내측 각형성)"],answer:5,explanation:"",question_images:["images/유니온_2권_q100.jpg"],explanation_images:["images/유니온_2권_e100.jpg"]},
  {num:78,section:"유니온 2권",chapter:"소아",question:"6세 아의 방사선 사진이다. 혈액 검사 상 25-hydroxyvitamin D가 40ng/ml(정 상, 30-80nm/ml), parathyroid hormone 56pg/ml(정상, 14-72pg/ml), alkaline phosphatase 200, U/L(정상, 35-130U/L)이었다. 유전자 검사 상 COL10A1 유전 자의 이상이 진단되었다. 진단은?",choices:["골간단 연골 이형성증(metaphyseal chondrodysplasia)", "구루병 (rickets)", "국소 섬유연골 이형성증(focal fibrocartilgenous dysplasia)", "블라운트씨 병(Blount disease)", "섬유성 골 이형성증(fibrous dysplasia)"],answer:1,explanation:"",question_images:["images/유니온_2권_q069.jpg"],explanation_images:["images/유니온_2권_e069.jpg"]},
  {num:79,section:"유니온 2권",chapter:"소아",question:"보행 이상을 보이는 환아의 방사선 사진이다. 이 환자의 수술적 치료를 결정하고 예 후에 가장 연관된 방사선 계측치는?",choices:["대퇴전염각", "대퇴경간각", "비구지수", "Center-edge 각", "Hilgenreiner-epiphyseal 각"],answer:5,explanation:"",question_images:["images/유니온_2권_q070.jpg"],explanation_images:["images/유니온_2권_e070.jpg"]},
  {num:80,section:"유니온 2권",chapter:"소아",question:"소아 환자가 수지를 수상하여 내원하였다. 다음과 같은 방사선 소견 미 임상 소견을 보일 때, 적절한치료는?",choices:["관혈적 정복 및 핀고정술", "도수 정복 및 핀고정술", "신전부목", "신전제한블럭", "조갑상대 혈종제거술"],answer:1,explanation:"",question_images:["images/유니온_2권_q071.jpg"],explanation_images:["images/유니온_2권_e071.jpg"]},
  {num:81,section:"유니온 2권",chapter:"소아",question:"10세 남아로 슬관절 굴곡 상태로 바닥에 넘어지면서 발생한 슬관절 종창 및 통증을 주소로 내원하였다. 촬영한 영상 검사 소견은 다음과 같다. 가장 적절한 치료는?",choices:["신전 0도 석고고정", "굴곡 30도 석고고정", "도수 정복 및 외고정", "관혈적 정복 및 내고정", "조기 재활 운동"],answer:4,explanation:"",question_images:["images/유니온_2권_q072.jpg"],explanation_images:["images/유니온_2권_e072.jpg"]},
  {num:82,section:"유니온 2권",chapter:"소아",question:"2세 소아 환아가 주관절 통증을 주소로 내원하였다. 촬영한 방사선 사진이 다음과 같다. 수술 중에 정복이 잘 되었는지 가장 정확하게 확인할 수 있는 view는 무엇인 가?",choices:["Arthrogram", "Internal oblique view", "External oblique view", "Jones view", "Valgus stress view"],answer:1,explanation:"",question_images:["images/유니온_2권_q073.jpg"],explanation_images:["images/유니온_2권_e073.jpg"]},
  {num:83,section:"유니온 2권",chapter:"종양",question:"50세 남자 환자가 2개월 간 지속되는 좌측 무릎의 통증을 주소로 내원하였다. 이에 촬영한 MRI는 다음과 같다. 해당 종양의 FISH 검사 시 발견되는 융합 전사체를 고르 시오.",choices:["APSCR-TFE3", "FUS-DDIT3", "SYT-SSX", "EWS-FLI1", "SSX1-SSX2"],answer:2,explanation:"",question_images:["images/유니온_2권_q074.jpg"],explanation_images:["images/유니온_2권_e074.jpg"]},
  {num:84,section:"유니온 2권",chapter:"종양",question:"55세 남자가 건강검진을 위해 촬영한 방사선 사진에서 이상 소견이 관찰되어 골주사 검사를 시행하였다（그림 A）. 환자가 점차 우측 고관절 통증이 심해지면서 걸음걸이 가 힘들어 절골술 수술을 시행하였다（그림 B）. 환자의 적절한 진단은? RT 그림 A 그림 B",choices:["내연골종 (enchondroma)", "동맥류성 골낭증(aneurysmal cyst)", "비골화성 유종(non-ossifying fibroma)", "섬유종 골이형성증(fibrous dysplasia)", "연골모세포종(chondroblastoma)"],answer:4,explanation:"",question_images:["images/유니온_2권_q075.jpg"],explanation_images:["images/유니온_2권_e075.jpg"]},
  {num:85,section:"유니온 2권",chapter:"종양",question:"74세 남자가 견관절 통증으로 시행한 방사선 사진이다. 원발성 암을 모르는 상태에 서 가장 가능성이 높은 암은?",choices:["폐암", "신장암", "전립선암", "갑상선", "간암"],answer:3,explanation:"",question_images:["images/유니온_2권_q076.jpg"],explanation_images:["images/유니온_2권_e076.jpg"]},
  {num:86,section:"유니온 2권",chapter:"종양",question:"27세 여성 환자가 1달 전부터 손목 통증을 호소하여 MRI을 촬영하였다. 환자에게 절 절한 치료는?",choices:["Wide excision + autobone graft", "Extended curettage + autobone graft", "Wide excision + cementation", "Extended curettage + cementation", "Extended curettage + wrist fusion"],answer:4,explanation:"",question_images:["images/유니온_2권_q077.jpg"],explanation_images:["images/유니온_2권_e077.jpg"]},
  {num:87,section:"유니온 2권",chapter:"종양",question:"53세 남자가 사구체신염으로 cyclosporin과 steroid을 복용중이다. 피부에 울긋불 긋한 병변이 발생하여 조직검사를 시행하니, human herpes virus 80| 관찰되었다. 사구체신염 약제를 감량하니 증상이 호전되었다. 적절한 진단은?",choices:["Kaposi sarcoma", "Merk이 tumor", "Squamous cell carcinoma", "M이anoma", "Dermatofibrosarcoma protuberens"],answer:1,explanation:"",question_images:["images/유니온_2권_q078.jpg"],explanation_images:["images/유니온_2권_e078.jpg"]},
  {num:88,section:"유니온 2권",chapter:"종양",question:"55세 남자가 8개월 전부터 악화되는 허빅지 통증으로 내원하였다. 촬영한 방사선, MRI 검사는 다음과 같다. 적절한 치료 방법은?",choices:["소파술", "소파술 후 방사선 치료", "광범위 절제술", "광범위 절제술 후 방사선 치료", "광범위 절제술 후 항암 치료"],answer:1,explanation:"",question_images:["images/유니온_2권_q079.jpg"],explanation_images:["images/유니온_2권_e079.jpg"]},
  {num:89,section:"유니온 2권",chapter:"총론",question:"10세 소아 환자가 6개월 전 원위 요골 골절로 다가F를 시행하였다. 수술 후 1개월 째 부터 손목관절에 통증과 종창 및 열감이 있어 항생제 치료를 시작하였다. 붉은 화살 이 가르키는 구조물은?",choices:["Sequestrum", "Involucrum", "이oaca", "Subperiosteal abscess", "Brodie’s abscess"],answer:1,explanation:"",question_images:["images/유니온_2권_q080.jpg"],explanation_images:["images/유니온_2권_e080.jpg"]},
  {num:90,section:"유니온 2권",chapter:"총론",question:"53세 남자가 수 일전부터 우측 슬관절 통증 및 부종이 심해 내원하였다. 과거 제 1족 지 중족지관절에 비슷한 증상이 있었다. 혈액검사 상 백혈구는 13,200/mm3（정상 4,000-10,000/mm3）였고, ESR 60mm/h（정상 0-10mm/h）, CRP 10.52mg/dl（정 상＜0.5mg/dl）, Uric acid 6.5mg/dL （정상 3.5-7.2mg/dL） 였다. 관절천자액을 현미 경을 봤을 때 아래와 같았다. 일차로 사용하는 약제는?",choices:["Allopurinol", "Cephazolin", "Colchine", "Probenecid", "Corticosteroid"],answer:3,explanation:"",question_images:["images/유니온_2권_q081.jpg"],explanation_images:["images/유니온_2권_e081.jpg"]},
  {num:91,section:"유니온 2권",chapter:"총론",question:"골표지자는 골다공증 치료제의 효과를 평가하는 가장 강력한 수단이다. 다음 형태를 보이는 골다공증 약제를 고르시오?",choices:["Bisphosphonate", "Denosumab", "PTH", "Anti-sclerostin antibody", "Calcium"],answer:4,explanation:"골다공증 치료제의 효과를 평가하는 골표지자는 골형성 지표와 골흡수 지표 2가지가 있다. 골형성 표지자는 PICP, PINP, osteocalcin, serum ALP이다(문제의 serum procollagen 1 N-terminal extension peptide가 여기에 속한다). 골흡수 표지자는 acid phosphatase, CTx, NTx 이다(문제의 type 1 collagen C-telopeptide가 여기에 속한다).<br>Anti-sclerostin antibody(Romosozumab)를 복용하면 12개월 동안 골형성 표지자는 증가하고, 골흡수 표지자는 감소한다.<br>Bisphosphonate를 복용하면 골형성 지표와 골흡수 지표가 모두 감소한다. 골흡수 지표가 4-6주 후 먼저 감소하며, 그 후에 골형성 지표도 3-6개월 후 감소한다.",question_images:["images/유니온_2권_q082.jpg"],explanation_images:["images/유니온_2권_e082.jpg"]},
  {num:92,section:"유니온 2권",chapter:"총론",question:"31세의 류마티스 여자 환자가 양쪽 무릎과 발목을 포함한 여러 관절에 부종을 동반한 통증이 있다. 혈액검사 상 rheumatoid factor는 음성, anti-CCP는 양성이었다. Methotrexate와 leflunomide를 적정 용량으로 6개월 사용중이나 효과가 없었다. 다음으로 사용할 수 있는 약제는?",choices:["Abatacept", "Sulfasalazine", "Steroid", "Celecoxib", "Hydroxychloroquine"],answer:1,explanation:"양성적 약용을 위한 관찰의 정차(remission)에 이르게 되면 DMARD 치료가 시행되는데 단계는 다음과 같다.<br>1. Methotrexate는 주로 처음에 사용하는 cDMARD로 사용된다.<br>2. Methotrexate로 조절되지 않을 경우 sulfasalazine, hydroxychloroquine을 병용한다. 두 번째 option은 methotrexate와 leflunomide, 세 번째 option은 TNF inhibitor(etanercept, adalimumab)를 사용할 수 있다.<br>3. Biologic DMARD(bDMARD) abatacept는 이전에 cDMARD 병용치료(methotrexate와 TNF inhibitor)에도 효과가 없을 때 시도할 수 있다. Abatacept와 methotrexate or cDMARD 병용치료도 시도할 수 있다.",question_images:["images/유니온_2권_q083.jpg"],explanation_images:["images/유니온_2권_e083.jpg"]},
  {num:93,section:"유니온 2권",chapter:"총론",question:"80세 환자가 직장암으로 항암치료를 받던 중 발생한 39도의 고열, 혈압저하, 좌측 둔부 통증 및 열감이 있었다. CT 및 MRI 소견이 다음과 같을 때, 원인균으로 가장 가능성이 높은 것은?",choices:["Clostridium perfringens", "Staphylococcus aureus", "Staphylococcus epidermidis", "Streptococcus mutans", "Streptococcus pyogenes"],answer:1,explanation:"Gas gangrene이 CT와 MRI에서 thigh에 분포하고 있다. 현재 고열과 혈압저하 등 septic shock의 임상증상을 보이고 있다. Gas production organism은 흔히 Clostridium perfringens, Escherichia coli가 원인이다.",question_images:["images/유니온_2권_q084.jpg"],explanation_images:["images/유니온_2권_e084.jpg"]},
  {num:94,section:"유니온 2권",chapter:"총론",question:"인공 고관절 치환술 후 발생하는 마모 기전중 전단 응력에 의해 발생하는 기전은 어떤 것인가?",choices:["표면 마모", "연마 마모", "점착 마모", "피로성 마모", "부식성 마모"],answer:3,explanation:"점착 마모(adhesive wear)란 서로 표면을 맞대고 이동하는 물체에서, 마찰력에 의해 맞닿아 있는 면적에 전단 응력이 작용하면서 미세하게 파편이 떨어져 나가는 마모이다. 흔히 가장 흔하게 볼 수 있다. 인공 고관절 치환술에서는 점착 마모와 연마 마모(abrasive wear)가 흔하며, 인공 슬관절 치환술에서는 피로 마모(fatigue wear)가 흔하다.",question_images:["images/유니온_2권_q085.jpg"],explanation_images:["images/유니온_2권_e085.jpg"]},
  {num:95,section:"유니온 2권",chapter:"총론",question:"다음 물체들 중 torsional stiffness가 가장 큰 것을 고르시오.",choices:["원형 (속이 찬 원기둥)", "튜브 (속이 빈 중공 원기둥)", "삼각형", "사각형", "I형 빔"],answer:2,explanation:"Stiffness란 외부 응력이 주어졌을 때, 물체가 이에 저항하는 지지력을 일컫는다. 흔히 stiffness는 물체의 질과 물체의 형태 2가지에 의해 결정된다. 물체의 형태에 따라 stiffness가 다르며, 그중 물체의 형태에 의한 stiffness를 관성 능률(moment of inertia)이라고 한다. Torsional stiffness는 극관성 모멘트(polar moment of inertia, Ip = Ix + Iy)에 의해 결정된다.<br>같은 밀도와 질량을 가지고 있다면 구멍이 빈 중공 원형(hollow tube)의 극관성모멘트가 가장 크다.<br>• Torsional stiffness: 중공 원통 > 원기둥 > I형 순으로 높다.<br>• Bending stiffness: I형 > 원통 > 원기둥 순으로 높다.",question_images:["images/유니온_2권_q086.jpg"],explanation_images:["images/유니온_2권_e086.jpg"]},
  {num:96,section:"유니온 2권",chapter:"총론",question:"다음은 allograft의 예를 보여주고 있다. (A)에 해당하는 allograft가 (B)에 해당하는 allograft 보다 더 강한 특성은?",choices:["Osteoconduction", "Osteoinduction", "Cellularity", "Compressive force resistance", "Tensile force resistance"],answer:1,explanation:"그림 A는 cancellous allobone이고, 그림 B는 strut(cortical) allobone이다.<br>먼저 osteoconduction은 trabecula가 풍부하여 donor cell이 들어가기 쉬운 cancellous bone이 더 좋다. 반면 strut allograft는 cortical bone으로 치밀하여 compressive, tensile force에 대한 resistance가 크다. 반면 allobone은 osteogenesis, vascularity는 모두 없다.",question_images:["images/유니온_2권_q087.jpg"],explanation_images:["images/유니온_2권_e087.jpg"]},
  {num:97,section:"유니온 2권",chapter:"총론",question:"다음과 같은 현상을 방지하기 위해 해야 할 것으로 가장 적절한 것은?",choices:["감마선 조사", "지르코니아 입자 추가", "탄소 장력 증가", "표면 열처리", "항산화제 첨가"],answer:2,explanation:"Ceramic은 인체적합도가 높고 마찰계수가 낮아 인공관절 bearing으로 많이 쓰인다. 흔히 알루미나(alumina), 지르코니아(zirconia) 등이 있다. 제 4세대의 가장 큰 단점은 brittle하여 ceramic-ceramic bearing에서 골절이 보고되고 있다.<br>Brittle한 단점을 고치기 위해 발전되어 왔고, 3세대 세라믹 인공 관절면(forte, BIOLOX)에서 지르코니아를 첨가한 4세대 세라믹 인공 관절면(delta, BIOLOX)를 개발하였다.<br>지르코니아를 첨가하여 알루미나 사이로 생긴 균열이 지르코니움에게 흡수당하여 더 이상 진행되지 않는 특성을 보여 파손을 줄여 주었다.",question_images:["images/유니온_2권_q088.jpg"],explanation_images:["images/유니온_2권_e088.jpg"]},
  {num:98,section:"유니온 2권",chapter:"총론",question:"다음의 관절연골 그림에서 수분 함유량이 가장 많은 층은?",choices:["1", "2", "3", "4", "5"],answer:1,explanation:"연골 층은 위에서부터 (1에서 5까지) 차례대로 표재층(superficial zone), 이행층(transitional zone), 중간층(middle zone), 석회화 연골층(calcified zone)으로 이루어져 있다. E(=5)는 연골하골(subchondral bone)이다. 이 중 표재층이 물의 함유량은 가장 많고 단백다당(proteoglycan) 함유량은 가장 적어 인장력에 잘 견딘다.",question_images:["images/유니온_2권_q089.jpg"],explanation_images:["images/유니온_2권_e089.jpg"]},
  {num:99,section:"유니온 2권",chapter:"총론",question:"사진은 장관골의 골단판 조직 소견이다. 소아 성장판 골절 시, Salter-Harris type II가 발생하는 층은?",choices:["1", "2", "3", "4", "5"],answer:4,explanation:"성장판 층은 위에서부터 차례대로 reserve zone, proliferative zone, maturation zone, hypertrophic zone, vascular invasion zone이다. 보기 1번은 epiphysis bone, 2번은 reserve zone, 3번은 proliferative zone, 4번은 hypertrophic zone이다.<br>비후대(hypertrophic zone)는 세포 분열이 종결되고, 크기가 약 5~10배로 커지게 된다. 비후대는 산소 분압이 낮고, 혈관이 없어 손상에 가장 취약하다. Salter-Harris type II 골절과 SCFE 등이 모두 비후대에서 골절이 된다.",question_images:["images/유니온_2권_q090.jpg"],explanation_images:["images/유니온_2권_e090.jpg"]},
  {num:100,section:"유니온 2권",chapter:"총론",question:"원위 상완골 골절에서 관혈적 정복 및 내고정술을 하였다. 수술 후 손목과 무지의 능동적 신전운동이 안되었다. 초음파 검사 시행 시에는 신경 및 혈관의 주행에는 이상이 없었다. 근전도 검사에서 근세동 전위(fibrillation potential) 및 양성 예각화(positive sharp wave)와 같은 신경손상의 침 근전도 양성 소견을 보인다. 신경 손상 후 대부분의 환자에서 양성 소견이 뚜렷하게 나타나기 시작하는 시기 및 신경 손상의 정도는?",choices:["1주 / 신경단열(neurotmesis)", "1주 / 신경진탕(neuropraxia)", "1주 / 축색단열(axonotmesis)", "3주 / 신경진탕(neuropraxia)", "3주 / 축색단열(axonotmesis)"],answer:5,explanation:"신경 손상 후 근전도 검사에서 뚜렷한 소견은 3-4주 후부터 관찰된다. 척추 주위근에는 2주 후, 사지의 원위부 근육은 3~4주가 경과한 후에 근전도에서 myofibrillation과 positive sharp wave가 현저하게 나타난다.<br>Neuropraxia(신경진탕)은 조직검사에서 myelin의 mild한 injury가 관찰되고 axon에는 이상이 없다. 반면 Axonotmesis(축색단열)은 조직검사에서 myelin과 axon에 injury가 관찰되며, 임상적으로 Tinel sign이 관찰된다. Neurotmesis(신경단열)은 조직검사상 myelin, axon 외에도 epineurium에도 손상이 발생한다.",question_images:["images/유니온_2권_q091.jpg"],explanation_images:["images/유니온_2권_e091.jpg"]},
  {num:1,section:"유니온 3권",chapter:"수부",question:"수근부 장측의 해부학적 구조에서 월상골 주위 탈구시 월상골의 장측 탈구가 잘 일 어나는 약한 공간이 있다. 이 곳의 경계를 이루는 인대 구조물은? Carpal bones Hamate Trapezoid Capitate — Pisiform Triquetrum — Lunate -----------Trapezium Scaphoid",choices:["Long radiolunate ligament - scapholunate ligament", "Long radiolunate ligament - short radiolunate ligament", "Radioscaphocapitate ligament - long radiolunate ligament", "Radioscaphocapitate ligament - triquetrocapitate ligament", "Radioscaphocapitate ligament - ulnotriqetral ligament"],answer:3,explanation:"",question_images:["images/유니온_3권_q001.jpg"],explanation_images:["images/유니온_3권_e001.jpg"]},
  {num:2,section:"유니온 3권",chapter:"수부",question:"38세 남자가 6개월 전부터 좌측 수부 소지구근부위의 통증과 환지, 소지의 감각이 상이 있었다. 시간이 지나면서 환지와 소지에 갈퀴손 변형(claw hand deformity)이 보였으며 손에 힘이 떨어졌다. 영상 검사는 다음과 같을 때 가장 적절한 치료는?",choices:["관혈적 정복 및 내고정술", "관혈적 정복 및 내고정술 + 척골신경 감압술", "골편 절제술", "골편 절제술 + 척골신경 감압술", "척골신경 감압술"],answer:4,explanation:"",question_images:["images/유니온_3권_q002.jpg"],explanation_images:["images/유니온_3권_e002.jpg"]},
  {num:3,section:"유니온 3권",chapter:"수부",question:"70세 여자가 3년 전부터 손목 통증이 있었다. 보존적 치료에도 통증이 지속되었고 영상 검사가 다음과 같을 때 가장 적절한 치료는?",choices:["근위 수근열 절제술", "사중관절 유합술", "요골 단축술", "유두골 단축술", "혈관부착 골이식술"],answer:1,explanation:"",question_images:["images/유니온_3권_q003.jpg"],explanation_images:["images/유니온_3권_e003.jpg"]},
  {num:4,section:"유니온 3권",chapter:"수부",question:"68세 남자가 2년 전부터 좌측 손목에 통증이 있었고 한 달 전부터 수지 움직임 제한 이 발생하였다. 신체검사는 동영상과 같으며 방사선 검사 및 MRI 검사는 아래 사진 과 같았다. 이 환자에게 시행할 수 있는 적절한 치료는? 동영상에서, 수지 신전시 4,5번째 손가락의 신전 불가 (Plastic surgery key)",choices:["관절경하 Wafer 술식", "원위요척관절 재건술 + 신전건 봉합술", "척골 단축술 + 신전건 봉합술", "척골 단축술 + 신전건 재건술", "Sauve-Kapandji 술식 + 신전건 재건술"],answer:5,explanation:"",question_images:["images/유니온_3권_q004.jpg"],explanation_images:["images/유니온_3권_e004.jpg"]},
  {num:5,section:"유니온 3권",chapter:"수부",question:"60세 환자가 3개월 전 날카로운 유리에 수상 후 건 봉합 수술을 받았다. 이후 관절운 동을 시작하면서 우측 중지에 부종과 통증이 발생하였다. 신체검사에서 수동적으로 는 신전이 되지만 굴곡 상태에서는 능동적 신전이 되지 않았다. 손상된 구조물은?",choices:["Central slip", "Interosseous tendon", "Lateral band", "Sagittal band", "Terminal tendon"],answer:1,explanation:"",question_images:["images/유니온_3권_q005.jpg"],explanation_images:["images/유니온_3권_e005.jpg"]},
  {num:6,section:"유니온 3권",chapter:"수부",question:"3년 전부터 시작된 우측 제5수지 변형이 있는 59세 환자의 수술 전 사진이다. 이 환 자의 수지 변형에 가장 기여하는 병적 구조물은?",choices:["Central cord", "Lateral digital cord", "Pretendinous cord", "Retrovascular cord", "Spiral cord"],answer:3,explanation:"",question_images:["images/유니온_3권_q006.jpg"],explanation_images:["images/유니온_3권_e006.jpg"]},
  {num:7,section:"유니온 3권",chapter:"수부",question:"류마티스 관절염으로 치료 중인 50세 환자가 3년 전부터 악화되는 좌측 엄지손가락 중수지관절 통증이 있었다. 외상력은 없고 신체검사에서 중수지관절의 불안정성과 운동범위 제한이 있었다. 영상 검사가 다음과 같을 때 가장 적절한 치료는?",choices:["관절유합술", "관혈적정복 및 내고정", "도수정복 및 석고고정", "인공관절치환술", "인대재건술"],answer:1,explanation:"",question_images:["images/유니온_3권_q007.jpg"],explanation_images:["images/유니온_3권_e007.jpg"]},
  {num:8,section:"유니온 3권",chapter:"수부",question:"60세 환자가 우측 엄지손가락이 꺾인 뒤 우측 엄지손가락 중 수지관절에 통증과 부 종이 발생하였다. 영상 검사와 MRI가 다음과 같다. 수술 사진에서 보이는 구조물 (1) 와 (2)로 적절한 것은?",choices:["1： 무지내전근건막, 2: 요측측부인대", "1： 무지내전근건막, 2： 척측측부인대", "1： 무지외전근막, 2： 요측측부인대", "1： 척측측부인대, 2： 무지내전근건막", "1： 척측측부인대, 2： 무지외전근건막"],answer:4,explanation:"",question_images:["images/유니온_3권_q008.jpg"],explanation_images:["images/유니온_3권_e008.jpg"]},
  {num:9,section:"유니온 3권",chapter:"수부",question:"33세 환자가 5년 전 넘어진 후 발생한 손목 통증이 지속되었다. 신체검사에서 해부 학적 취약함 (anatomical snuffbox)에 압통이 있었고, 방사선 검사, MRI가 다음과 같았다. 가장 적절한 치료는?",choices:["경피적 나사못 고정술", "근위열 절제술", "사중유합술", "쐐기골 이식술 및 나사못 고정술", "혈관부착 골 이식술"],answer:5,explanation:"",question_images:["images/유니온_3권_q009.jpg"],explanation_images:["images/유니온_3권_e009.jpg"]},
  {num:10,section:"유니온 3권",chapter:"수부",question:"55세 환자가 좌측 3수지 첨부에 다음과 같은 손상이 있고 손상 부위에서 원위지골이 관찰되었다. 가장 적절한 치료는?",choices:["Cross finger flap", "Homodigital neurovascular island flap", "이차적 치유", "피부 이식", "V-Y flap"],answer:2,explanation:"",question_images:["images/유니온_3권_q010.jpg"],explanation_images:["images/유니온_3권_e010.jpg"]},
  {num:11,section:"유니온 3권",chapter:"수부",question:"다음 중 물갈퀴 공간(web space)을 만들기 위한 피판으로 가장 적절한 것은?",choices:["보기 1", "보기 2", "보기 3", "보기 4", "[보기 5 - 누락]"],answer:3,explanation:"",question_images:["images/유니온_3권_q095.jpg"],explanation_images:["images/유니온_3권_e095.jpg"]},
  {num:12,section:"유니온 3권",chapter:"수부",question:"수지 및 수장의 감염시 발생한 고름이 모여 공간을 형성할 수 있는 장소로 아래 그림 의 심수지굴곡건과 A 사이의 공간을 B라고 한다. 적절한 조합은?",choices:["A: flexor retinaculum, B: carpal tunnel", "A: hypothenar muscle, B： hypothenar space", "A: lumbrical muscle, B： mid-palmar space", "A: pronator quadratus muscle, B: Parona's space", "A: thenar muscle, B： thenar space"],answer:4,explanation:"",question_images:["images/유니온_3권_q011.jpg"],explanation_images:["images/유니온_3권_e011.jpg"]},
  {num:13,section:"유니온 3권",chapter:"견·주관절",question:"50세 남자가 팔을 뻗으며 넘어진 이후 좌측 어깨 주위 통증이 있다. 동영상과 같은 신체검사 소견이 관찰되었다. 방사선 사진에서는 특별한 이상 소견은 없었으며, 연부조직의 이상을 평가하기 위해 초음파 검사를 계획하였다. 환자의 병변을 관찰하기 가장 좋은 검사 자세와 초음파 변환기의 위치는?",choices:["보기 1", "보기 2", "보기 3", "보기 4", "보기 5"],answer:5,explanation:"",question_images:["images/유니온_3권_q096.jpg"],explanation_images:["images/유니온_3권_e096.jpg"]},
  {num:14,section:"유니온 3권",chapter:"견·주관절",question:"20세 남자가 우측 어깨 주위 통증과 힘이 빠지는 증상이 있다. 견관절의 외회전이 좌측에 비해 악화되었다. 어깨 주위 육안소견은 사진과 같다. 단순 방사선 사진에서 는 특별한 이상소견은 없었고, MRI 영상은 다음과 같았다. 이 경우 압박되는 신경을 상완신경총 그림에서 고르시오.",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_3권_q012.jpg"],explanation_images:["images/유니온_3권_e012.jpg"]},
  {num:15,section:"유니온 3권",chapter:"견·주관절",question:"해부학적 인공견관절 치환술을 시행할 때 삼각근과 회전근개의 lever arm을 유지하 기 위해 복원해야 할 lateral humeral offset은?",choices:["HF", "GF", "DE", "AC", "MH"],answer:1,explanation:"",question_images:["images/유니온_3권_q013.jpg"],explanation_images:["images/유니온_3권_e013.jpg"]},
  {num:16,section:"유니온 3권",chapter:"견·주관절",question:"반복적인 어깨 탈구 환자의 견관절 MR arthrogram이다. 화살표가 표시하는 구조를 관절경 영상에서 고르시오.",choices:["1", "2", "3", "4", "5"],answer:5,explanation:"",question_images:["images/유니온_3권_q014.jpg"],explanation_images:["images/유니온_3권_e014.jpg"]},
  {num:17,section:"유니온 3권",chapter:"견·주관절",question:"좌측 주관절에 축성압박, 외반, 회외전력을 가했을 때 다음과 같은 소견이 관찰되었 다. 주관절 주위 인대 중 가장 손상이 심할 것이 예상되는 구조는? Reduction",choices:["1", "2", "3", "4", "5"],answer:5,explanation:"",question_images:["images/유니온_3권_q015.jpg"],explanation_images:["images/유니온_3권_e015.jpg"]},
  {num:18,section:"유니온 3권",chapter:"견·주관절",question:"60세 남자가 퇴행성 관절염으로 해부학적 견관절 전치환술을 예정 중이다. 다음 영 상을 보고 불량한 예후와 연관이 있는 영상으로 가장 적절한 것은?",choices:["1", "2", "3", "4", "5"],answer:3,explanation:"",question_images:["images/유니온_3권_q016.jpg"],explanation_images:["images/유니온_3권_e016.jpg"]},
  {num:19,section:"유니온 3권",chapter:"견·주관절",question:"상완골 근위부 골절(proximal humerus fracture)의 방사선 사진이다. 다음 중 인공관절 치환술을 해야 할 가능성이 가장 높은 골절을 고르시오.",choices:["보기 1", "보기 2", "보기 3", "보기 4", "[보기 5 - 누락]"],answer:2,explanation:"",question_images:["images/유니온_3권_q097.jpg"],explanation_images:["images/유니온_3권_e097.jpg"]},
  {num:20,section:"유니온 3권",chapter:"척추",question:"교통사고 이후 경부통으로 응급실에 내원하였다. 다음 방사선 검사에서 보이는 경추 손상의 기전은?",choices:["수직 압박 손상", "신연 굴곡 손상", "신연 신전 손상", "압박 굴곡 손상", "압박 신연 손상"],answer:4,explanation:"",question_images:["images/유니온_3권_q017.jpg"],explanation_images:["images/유니온_3권_e017.jpg"]},
  {num:21,section:"유니온 3권",chapter:"척추",question:"후외측 도달법을 이용한 내시경 하 추간판 절제술을 시행할 때 가장 적절한 내시경 삽입 위치는?",choices:["1", "2", "3", "4", "5"],answer:3,explanation:"",question_images:["images/유니온_3권_q018.jpg"],explanation_images:["images/유니온_3권_e018.jpg"]},
  {num:22,section:"유니온 3권",chapter:"척추",question:"요추부의 최소 침습적 극외측 추체간 유합술에서 화살표의 다음 부위에 케이지를 삽 입할 때 가장 손상되기 쉬운 신경은?",choices:["대퇴신경", "외측 대퇴피부신경", "음부대퇴신경", "좌골신경", "폐쇄신경"],answer:3,explanation:"",question_images:["images/유니온_3권_q019.jpg"],explanation_images:["images/유니온_3권_e019.jpg"]},
  {num:23,section:"유니온 3권",chapter:"척추",question:"제 4-5 요추간 추간판의 MRI 검사이다. 양성으로 예측되는 신체검사는?",choices:["Bowstring test", "Femoral nerve stretching test", "Patrick test", "Straight leg raising test", "Thomas test"],answer:4,explanation:"",question_images:["images/유니온_3권_q020.jpg"],explanation_images:["images/유니온_3권_e020.jpg"]},
  {num:24,section:"유니온 3권",chapter:"척추",question:"척추의 시상면 균형을 분석하는데 골반지표를 계측하는 것이 필수이다. 다음의 지표 중 자세의 변화와 상관없이 항상 일정한 것은?",choices:["가", "나", "다", "라", "나+라"],answer:3,explanation:"",question_images:["images/유니온_3권_q021.jpg"],explanation_images:["images/유니온_3권_e021.jpg"]},
  {num:25,section:"유니온 3권",chapter:"척추",question:"70세 남자 환자의 방사선 검사이다. 화살표 표시 병변으로 인해 발생하는 방사통의 전형적인 위치는? Figure 1. Figure 3.",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_3권_q022.jpg"],explanation_images:["images/유니온_3권_e022.jpg"]},
  {num:26,section:"유니온 3권",chapter:"척추",question:"경부통, 상지 방사통 및 보행 시 균형 이상이 있는 52세 여자의 CT및 MRI 검사이다. 이 환자에서 관찰되는 가장 특징적인 신체검사는?",choices:["Addison’s test", "Finkelstein’s test", "Inverted radial reflex", "Kernig’s sign", "Spurling test"],answer:3,explanation:"",question_images:["images/유니온_3권_q023.jpg"],explanation_images:["images/유니온_3권_e023.jpg"]},
  {num:27,section:"유니온 3권",chapter:"척추",question:"류마티스 관절염으로 치료중인 52세 여자가 섬세한 손동작 장애와 보행 장애가 있 다. 상하지 건반사가 모두 항진되어 있으며, 호프만 검사가 양성이다. 가장 가능성 높 은진단은?",choices:["Basilar invagination with brain stem dysfunction", "Cervical radiculopathy", "Compressive myelopathy by C 1-2 instability", "Compressive myelopathy by osteophyte", "Drug-induced peripheral neuropathy"],answer:3,explanation:"",question_images:["images/유니온_3권_q024.jpg"],explanation_images:["images/유니온_3권_e024.jpg"]},
  {num:28,section:"유니온 3권",chapter:"척추",question:"52세 남자가 실내에서 미끄러져 넘어진 이후 등 통증과 보행 이상이 발생하였다. 가 장 적절한 치료는?",choices:["Endoscopic discectomy", "Laminectomy only", "Single level posterior fusion with laminectomy", "Long level posterior fusion with laminectomy", "Pedicle subtraction osteotomy and laminectomy"],answer:4,explanation:"",question_images:["images/유니온_3권_q025.jpg"],explanation_images:["images/유니온_3권_e025.jpg"]},
  {num:29,section:"유니온 3권",chapter:"척추",question:"26세 남자 환자가 6개월 이상 지속적인 경부통으로 내원하였다. 통증은 밤마다 악화 되었으며, NSAID로 조절이 되었다. 가장 적절한 진단은?",choices:["Osteochondroma", "Osteosarcoma", "Enchondroma", "Osteoid osteoma", "OPLL"],answer:4,explanation:"",question_images:["images/유니온_3권_q026.jpg"],explanation_images:["images/유니온_3권_e026.jpg"]},
  {num:30,section:"유니온 3권",chapter:"척추",question:"신경근육성 척추측만증으로 경과 관찰 중 아래와 같이 진행되는 것이 확인되었다. 척추 변형과 관련하여 가장 문제가 되는 것은?",choices:["골반 경사", "늑간신경병증", "마미증후군", "척수견인증후군", "폐쇄성 장마비"],answer:1,explanation:"",question_images:["images/유니온_3권_q027.jpg"],explanation_images:["images/유니온_3권_e027.jpg"]},
  {num:31,section:"유니온 3권",chapter:"척추",question:"다운증후군이 있는 2세 남아가 보행 장애가 발생하였다. 이 환자에서 가장 적절한 치료는?",choices:["관찰", "경추 보조기", "윤조끼 보조기", "관혈적 정복 및 후방유합술", "치상돌기 부골 절제"],answer:4,explanation:"",question_images:["images/유니온_3권_q028.jpg"],explanation_images:["images/유니온_3권_e028.jpg"]},
  {num:32,section:"유니온 3권",chapter:"고관절",question:"아래 그림의 도달법（그림A）을 이용한 좌측 고관절 인공관절 전치환술을 시행하였다. 신체 검사에서 한 발로 섰을 때 그림 B와 같은 소견이 관찰되고, 방사선 사진은 그림 C와 같다. 손상 가능성이 가장 높은 구조물은?",choices:["1", "2", "3", "4", "5"],answer:1,explanation:"",question_images:["images/유니온_3권_q029.jpg"],explanation_images:["images/유니온_3권_e029.jpg"]},
  {num:33,section:"유니온 3권",chapter:"고관절",question:"40세 환자가 2년전 짧은 경부를 가진 36mm 세라믹 대퇴 골두를 이용한 우측 고관 절 인공관절 전치환술을 시행받았다. 이후 지속적인 재발성 후방 탈구가 있다. 탈구 정복 후 방사선 사진과 CT 사진이다. 가장 적절한 치료는?",choices:["구속형 라이너 치환술", "긴 경부를 가진 대퇴 삽입물 치환술", "대퇴 스템 재치환술", "비구컵 재치환술", "외전근 재건술"],answer:4,explanation:"",question_images:["images/유니온_3권_q030.jpg"],explanation_images:["images/유니온_3권_e030.jpg"]},
  {num:34,section:"유니온 3권",chapter:"고관절",question:"고관절 관절경술을 시행하고 있다. 어느 삽입구를 만들기 위한 절차인가?",choices:["내측 삽입구", "원위 전외측 부삽입구", "전방삽입구", "전외측 삽입구", "후외측 삽입구"],answer:3,explanation:"",question_images:["images/유니온_3권_q031.jpg"],explanation_images:["images/유니온_3권_e031.jpg"]},
  {num:35,section:"유니온 3권",chapter:"고관절",question:"21세 여자가 우측 고관절 통증이 있다. 진단을 위해 방사선 검사 중 고관절의 전방 피복(anterior coverage)을 확인할 수 있는 가장 적절한 검사는?",choices:["보기 1", "보기 2", "보기 3", "보기 4", "보기 5"],answer:2,explanation:"",question_images:["images/유니온_3권_q098.jpg"],explanation_images:["images/유니온_3권_e098.jpg"]},
  {num:36,section:"유니온 3권",chapter:"고관절",question:"81세 남자가 넘어진 후 좌측 고관절 통증이 생겼다 평소 일상 활동에 제한이 없고 고 혈압으로 정기적인 내과 진료를 받고 있는 것 이외에는 건강상의 특별한 문제는 없 다. 방사선 검사는 아래와 같다. 가장 적절한 치료는?",choices:["다발성 나사못 고정술", "골이식 및 다발성 나사못 고정술", "압박고나사 고정술", "금속정 고정술", "인공관절치환술"],answer:5,explanation:"",question_images:["images/유니온_3권_q032.jpg"],explanation_images:["images/유니온_3권_e032.jpg"]},
  {num:37,section:"유니온 3권",chapter:"고관절",question:"32세 여자가 출산 후 지속적인 양측 둔부 통증이 있다. 신체 검사에서 신경학적 이상 소견은 없으며, 천장 관절의 신연 및 압박 검사에서 음성이었다. 혈액검사는 정상이 었다. 방사선 검사 및 CT 검사이다. 가장 적절한 진단은?",choices:["강직성 척추염", "유방암의 천장관절 전이", "장골 치 밀화 골염", "천장관절 증후군", "천장관절 결핵성 관절염"],answer:3,explanation:"",question_images:["images/유니온_3권_q033.jpg"],explanation_images:["images/유니온_3권_e033.jpg"]},
  {num:38,section:"유니온 3권",chapter:"고관절",question:"8개월전 세라믹 골두 골절로 금속-폴리에틸렌 관절면을 이용한 우측 고관절 인공관 절 재치환술을 시행 받았다. （그림 A） 수술 후 3년이 지나자 고관절 통증이 발생하여 촬영한 방사선 검사 （그림 B）와 재치환술시 수술실 소견 （그림 C,D）은 다음과 같다. 마모의 기전으로 가장 적절한 것은?",choices:["미동 마모 (fretting wear)", "부식 마모 (corrosive wear)", "연마 마모 (abrasive wear)", "점착 마모 (adhesive wear)", "피로 마모 (fatigue wear)"],answer:3,explanation:"",question_images:["images/유니온_3권_q034.jpg"],explanation_images:["images/유니온_3권_e034.jpg"]},
  {num:39,section:"유니온 3권",chapter:"고관절",question:"고관절 인공관절치환술에서 사용되는 무시멘트형(cementless) 삽입물은 표면처리를 통해 숙주골과의 골고정을 얻는다. 다음 중 골표면성장(bone ongrowth)을 얻기 위한 표면처리 방법으로 가장 적절한 것은?",choices:["보기 1", "보기 2", "보기 3", "보기 4", "보기 5"],answer:2,explanation:"정답: 2번 (grit-blasted surface)<br><br><b>Bone ongrowth</b>를 얻기 위한 표면처리:<br>- Grit-blasted surface<br>- Plasma-sprayed surface (titanium 또는 hydroxyapatite)<br>- 대표 stem: type 3C grit-blasted stem<br><br><b>Bone ingrowth</b>를 얻기 위한 표면처리:<br>- Sintered beads<br>- Diffusion bonded fiber mesh<br>- Highly porous tantalum coating<br><br><b>그림별 분류</b><br>- 그림 1: sintered beads (ingrowth)<br>- <b>그림 2: grit-blasted surface (ongrowth) ← 정답</b><br>- 그림 3, 4: highly porous tantalum coating (ingrowth)<br>- 그림 5: diffusion bonded fiber mesh coating (ingrowth)",question_images:["images/유니온_3권_q099.jpg"],explanation_images:["images/유니온_3권_e099.jpg"]},
  {num:40,section:"유니온 3권",chapter:"고관절",question:"단순 횡형의 대퇴 전자하 골절로 대전자부 삽입 골수내정을 사용하였다. 그림의 변 형과 의인성 골절 （화살표）이 발생하였을 때, 수술 중 사용된 골수내정의 삽입점으로 가장 가능성이 높은 것은?",choices:["대전자부 내측-전방", "대전자부 외측-전방", "대전자부 내측-후방", "대전자부 외측-후방", "대전자부 중심-중심"],answer:2,explanation:"",question_images:["images/유니온_3권_q035.jpg"],explanation_images:["images/유니온_3권_e035.jpg"]},
  {num:41,section:"유니온 3권",chapter:"고관절",question:"73세 여자의 좌측 대퇴골 방사선 및 MRI 검사이다. 좌측 대퇴부의 통증이나 압통은 없다. 골밀도 검사에서 요추 및 대퇴 경부의 T-score는 각각 -3.4 및 -2.3로 비스포 스포네이트 제제를 3년간 복용하였다. 2개월 전 우측 비전형 대퇴간부 골절로 수술 을 받았다. 현시점에서 이 환자의 좌측 대퇴골에 대한 치료 방법 및 근거로 가장 적 절한 것은?",choices:["보존적 치료 - 골밀도 검사", "보존적 치료 - 증상", "예방적 골수내정 고정 - 골절 부위", "예방적 골수내정 고정 - MRI 검사", "예방적 골수내정 고정 - 증상"],answer:2,explanation:"",question_images:["images/유니온_3권_q036.jpg"],explanation_images:["images/유니온_3권_e036.jpg"]},
  {num:42,section:"유니온 3권",chapter:"고관절",question:"좌측 서혜부 통증이 있는 환자의 방사선 검사와 CT 검사이다. 통증은 운동이나 장시 간 앉아있을 때 악화된다. 신체검사에서 통증이 유발되었으나 운동 범위의 감소는 없다. 환자의 골 변형으로 인해 가장 먼저 손상 받을 것으로 예상되는 구조물은?",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_3권_q037.jpg"],explanation_images:["images/유니온_3권_e037.jpg"]},
  {num:43,section:"유니온 3권",chapter:"고관절",question:"우측 고관절 통증이 있는 환자의 수술 전 기립 골반 전후면 및 요천추부 측면 방사선 사진이다. 고관절 인공관절 전치환술을 시행하였고, 삽입물은 안전범위 내에 정상적 으로 삽입되었다. 발생 가능성이 가장 높은 합병증은?",choices:["비구삽입물 주위 골절", "신경 손상", "이소성 골화", "탈구", "하지부동"],answer:4,explanation:"",question_images:["images/유니온_3권_q038.jpg"],explanation_images:["images/유니온_3권_e038.jpg"]},
  {num:44,section:"유니온 3권",chapter:"슬관절",question:"좌측 슬관절에 대한 관절경 검사 동영상이다. 손상된 구조물로 가장 가능성이 높은 것은?",choices:["Anterior cruciate ligament", "Lateral patellofemoral ligament", "Popliteofibular ligament", "Posterior oblique ligament", "Superficial medial collateral ligament"],answer:3,explanation:"",question_images:["images/유니온_3권_q039.jpg"],explanation_images:["images/유니온_3권_e039.jpg"]},
  {num:45,section:"유니온 3권",chapter:"슬관절",question:"좌측 슬관절에 대한 수술 동영상이다. 보이는 현상과 가장 연관성이 높은 손상 구조 물은? 초기 소견 (A) Anterior draw 시행 후 보이는 소견(B)",choices:["내측슬개대퇴인대", "내측측부인대", "외측측부인대", "전방십자인대", "후방십자인대"],answer:5,explanation:"",question_images:["images/유니온_3권_q040.jpg"],explanation_images:["images/유니온_3권_e040.jpg"]},
  {num:46,section:"유니온 3권",chapter:"슬관절",question:"35세 남자가 1년 전부터 지속적으로 반복되는 우측 슬관절 동통과 부종으로 인해 일상생활에 지장이 있다. 방사선 검사에서 하지 정렬은 정상이다. MRI 검사에서 3.5cm 크기의 ICRS grade 4a 관절연골 손상이 대퇴 활차에 관찰된다. 가장 적절한 치료는?",choices:["경과관찰", "미세골절술", "자가골연골이식술", "자가 연골세포이식술", "자가골수유래세포이식술"],answer:4,explanation:"",question_images:["images/유니온_3권_q041.jpg"],explanation_images:["images/유니온_3권_e041.jpg"]},
  {num:47,section:"유니온 3권",chapter:"슬관절",question:"25세 남자의 우측 슬관절 전방십자인대 수술 후 방사선 사진이다. 환자는 수술 후 슬 관절 불안정성은 호전되었지만 굴곡 제한이 발생하였다. 시간 경과와 함께 굴곡 제 한이 사라지면서, 슬관절 불안정이 다시 발생하였다. 가장 적절한 치료는? （파란 삼각형은 대퇴골 screw의 위치를 나타낸다.）",choices:["보존적 치료", "후외측인대 복합체 재건술 추가", "전외측인대 재건술 추가", "1단계 전방십자인대 재재건술", "2단계 전방십자인대 재재건술"],answer:4,explanation:"",question_images:["images/유니온_3권_q042.jpg"],explanation_images:["images/유니온_3권_e042.jpg"]},
  {num:48,section:"유니온 3권",chapter:"슬관절",question:"간헐적으로 부위가 명확하지 않은 좌측 무릎 통증을 호소하는 17세 남자의 MRI 사진 이다. 가장 적절한 치료는?",choices:["경과 관찰", "석고 붕대 고정", "미세골절술", "골연골편 고정", "자가골연골이식술"],answer:4,explanation:"",question_images:["images/유니온_3권_q043.jpg"],explanation_images:["images/유니온_3권_e043.jpg"]},
  {num:49,section:"유니온 3권",chapter:"슬관절",question:"22세 환자로 요가 운동 중 다리 꺾이며 우측 무릎 통증 발생하였다. 이전에 동측 무 릎에 유사한 수상이 2차례 있어 석고 고정 치료를 시행한 바 있었다. MRI에서 화살 표로 표시된 부분을 재건할 때 이식건의 대퇴부 고정위치로 가장 적절한 부위는? ligament sMCL (proximal tibial) Meniscofemoral ligament sMCLtdisu! tibial)",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_3권_q044.jpg"],explanation_images:["images/유니온_3권_e044.jpg"]},
  {num:50,section:"유니온 3권",chapter:"슬관절",question:"기켠 전 좌측 무릎에 가동형 내측 단일구획 슬관절 치환술을 받은 60세 환자이다. 2 일 전 바닥에서 일어나는 중 파열음과 함께 통증, 관절운동 제한이 시작되었다. 방사 선 사진에서 가장 가능성이 높은 진단은?",choices:["골융해", "무균성 해리", "치환물 주위 감염", "치환물 주위 골절", "폴리에틸렌 삽입물 탈구"],answer:5,explanation:"",question_images:["images/유니온_3권_q045.jpg"],explanation_images:["images/유니온_3권_e045.jpg"]},
  {num:51,section:"유니온 3권",chapter:"슬관절",question:"방사선 사진과 같이 경골 내측에 심한 골 결손이 있는 환자에서 슬관절 전치환술을 시행할 때, 골 결손 부위 전체를 포함하여 10mm 이상의 경골외과가 절제된다면 손 상 가능성이 높아 주의를 요하는 구조물은?",choices:["대퇴이두근", "비복근의 외측 두", "슬와건", "외측측부인대", "장경대"],answer:5,explanation:"",question_images:["images/유니온_3권_q046.jpg"],explanation_images:["images/유니온_3권_e046.jpg"]},
  {num:52,section:"유니온 3권",chapter:"슬관절",question:"4년 전 좌측 슬관절전치환술을 시행한 76세 환자에게 2개월 전부터 무릎 통증이 점 점 증가하였다. 신체검사에서 무릎발적, 부종, 관절운동 제한이 있었다. 혈액검사에 서 ESR 57mm/hr, CRP 5.5mg/dL（정상 : 0.5 이하）였다. 관절 천자 검사에서 백혈구 12,800/mm3, 다형핵호중구 76%였고, 균배양검사에서 메티실린내성 황색포도상구 균이 확인되었다. 가장 적절한 치료법은?",choices:["경과 관찰", "변연절제술", "항생제 치료", "1단계 재치환술", "2단계 재치환술"],answer:5,explanation:"",question_images:["images/유니온_3권_q047.jpg"],explanation_images:["images/유니온_3권_e047.jpg"]},
  {num:53,section:"유니온 3권",chapter:"슬관절",question:"55세 남자가 6개월 전 등산 후 발생하였고. 3개월 전 스노우보드를 탄 후 악회된 우 측 무릎 통증이 있다. 하지전장 방사선 사진(A), 후방스트레스 방사선 사진(B), MRI 서진(C)이 아래와 같고, 보전적 치료에 호전이 없어 수술적 치료가 필요하다면 가장 적절한 치료는? 그림 A 그림 C",choices:["내측 단일구획치환술", "내측 반월연골판 이식술+내측 대퇴과 미세절골술", "내측 개방형 근위경골절골술", "외측 폐쇄형 근위경골절골술", "슬관절전치환술"],answer:3,explanation:"",question_images:["images/유니온_3권_q048.jpg"],explanation_images:["images/유니온_3권_e048.jpg"]},
  {num:54,section:"유니온 3권",chapter:"슬관절",question:"다음 그림과 같은 방법으로 반월연골판 파열에 대해 수술하려고 한다. 가장 적절한 적응증은?",choices:["anterior horn tear", "mii이e horn tear", "peripheral capsular tear", "posterior horn tear", "root tear"],answer:1,explanation:"",question_images:["images/유니온_3권_q049.jpg"],explanation_images:["images/유니온_3권_e049.jpg"]},
  {num:55,section:"유니온 3권",chapter:"슬관절",question:"후방십자인대 견열 골절에서 관절면의 위치를 파악하기 위해 C-arm guide하에 슬 와부 굴곡 주름(flexion crease) 위에 K 강선을 위치시켰다(A). K 강선의 C-arm 사 진(B)에서 위치는?",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_3권_q050.jpg"],explanation_images:["images/유니온_3권_e050.jpg"]},
  {num:56,section:"유니온 3권",chapter:"총론",question:"골표지자는 골다공증 치료제의 효과를 평가하는 가장 강력한 수단이다. Bisphophonatesfi 사용했을 때 예상되는 골표지자의 변화 양상은? ■SINP —Type I c에agen C-telopeptide 0> 6uelp -----SINP -----Type I collagen C-teiopeptide",choices:["1", "2", "3", "4", "5"],answer:3,explanation:"",question_images:["images/유니온_3권_q051.jpg"],explanation_images:["images/유니온_3권_e051.jpg"]},
  {num:57,section:"유니온 3권",chapter:"총론",question:"골수염이 의심되어 그림과 같이 골수강내 항생제 시멘트를 삽입하였다. 항생제의 유 출이 기대되는 기간은?",choices:["1주", "4주", "6개월", "1년", "4년"],answer:2,explanation:"",question_images:["images/유니온_3권_q052.jpg"],explanation_images:["images/유니온_3권_e052.jpg"]},
  {num:58,section:"유니온 3권",chapter:"총론",question:"5세 환아가 특별한 외상 없이 전일부터 발생한 슬관절부 통증이 있다. 환하는 걷지 않으려고 하며 세우면 다리를 짚지 않으려고 한다. 신체검사에서 근위 하퇴부에 압 통과 열감이 있으며 관절운동 범위는 양호하였다. 체온은 38.8도였으며, 혈액검사 상 백혈구는 20,000/mm3였고, CRP는 6.5mg/dl（정상＜0.5mg/dl）, ESR 32mm/ 미정상 0-10mm/h） 였다. 영상검사소견은 다음과 같다. 가장 우선적으로 시행하여 야 할 조치는?",choices:["경험적 항생제 투여", "골 천자술 및 세균 배양", "다발성 천공술", "슬관절 관절막 절제술", "HLA-B27, 류마토이드 인자, 항핵항체 검사"],answer:2,explanation:"",question_images:["images/유니온_3권_q053.jpg"],explanation_images:["images/유니온_3권_e053.jpg"]},
  {num:59,section:"유니온 3권",chapter:"총론",question:"4세 여아가 양쪽 무릎과 발목을 포함한 여러 관절에 부종을 동반한 통증이 있다. 전 신적 열이 2주전부터 간헐적으로 있었으며, 열이 있을 때 피부에는 사진과 같은 병 변이 나타났다가 열이 떨어지면 사라졌다. 상기도 감염의 징후는 없었다. 혈액검사 에서 백혈구는 15,000/mm3（정상 4,000-10,000/mm3）였고, ESR 45mm/h（정상 0-10mm/h）, CRP 7.2mg/dl（정상<0.5mg/dl）, rheumatoid factor는 7IU/ml（정상 <14IU/ml）이었다. 혈액배양 검사는 음성이었다. 가장 가능성이 높은 진단은?",choices:["Felty syndrome", "Juvenile systemic rheumatoid arthritis", "psoriatic arthritis", "rheumatic fever", "systemic lupus erythematosus"],answer:2,explanation:"",question_images:["images/유니온_3권_q054.jpg"],explanation_images:["images/유니온_3권_e054.jpg"]},
  {num:60,section:"유니온 3권",chapter:"총론",question:"16개월 된 소아가 내반슬을 보여 내원했다. 다음과 같은 혈액검사 및 방사선 사진을 보였을 때 원인으로 가장 적절한 것은? Test 측정치 정상치 Serum 25OHD level 55 ng/ml 30-80 ng/ml Serum ALP level 19 U/L 35-130 U/L Serum calcium level 10.3 mg/dl 8.5-10.2 mg/이 Serum PTH level 50 pg/ml 14-72 pg/ml Serum phosphorus level 1.3 mg/dl 2.5-4.5 mg/이",choices:["1-a-hydroxylase", "성장호르몬", "인슐린", "제23형 섬유모세포 성장인자(fibroblast growth factor type 23)", "제3형 섬유모세포 성장인자 수용체"],answer:4,explanation:"",question_images:["images/유니온_3권_q055.jpg"],explanation_images:["images/유니온_3권_e055.jpg"]},
  {num:61,section:"유니온 3권",chapter:"족부·족관절",question:"18세 군인이 6개월 전부터 지속된 족관절 내측의 통증이 있다. 불규칙한 지면을 걷 기가 힘들고, 신체검사에서 거골하관절의 움직임이 소실되었다. 방사선 사진(A) 및 CT 사진(B)은 다음과 같다. 가장 가능성이 있는 진단은?",choices:["거골골연골병변", "부주상골 증후군", "족관절 내측 불안정증", "족근골 결합", "족근동 증후군"],answer:4,explanation:"",question_images:["images/유니온_3권_q056.jpg"],explanation_images:["images/유니온_3권_e056.jpg"]},
  {num:62,section:"유니온 3권",chapter:"족부·족관절",question:"46세 여자가 우측 족부 제1족지 건막류(bunion) 부위 통증과 외반 변형이 있고, 방 사선 사진은 다음과 같다. 가장 적절한 치료는?",choices:["근위중족골 절골술", "윈위중족골 절골술", "근위중족골 절골술+근위족지 절골술", "윈위종족골 절골술+외측 연부조직 유리술", "근위중족골 절골술+외측 연부조직 유리술"],answer:5,explanation:"",question_images:["images/유니온_3권_q057.jpg"],explanation_images:["images/유니온_3권_e057.jpg"]},
  {num:63,section:"유니온 3권",chapter:"족부·족관절",question:"49세 남자가 장시간 걸은 후 발 뒤꿈치 통증이 있다. 아침에 자고 일어나 첫발을 디 딜 때 통증이 심하며 방사선 사진은 다음과 같다. 일차 치료로 가장 적절한 것은?",choices:["스트레칭", "깔창", "스테로이드 주사", "체외 충격파", "근막 유리술"],answer:1,explanation:"",question_images:["images/유니온_3권_q058.jpg"],explanation_images:["images/유니온_3권_e058.jpg"]},
  {num:64,section:"유니온 3권",chapter:"족부·족관절",question:"67세 남자가 5년 전 뇌수술을 받았으며 현재 좌측 하지 마비와 함께 걸을 때 통증이 있다. 신체검사에서 좌측 족관절의 첨족 변형이 관측되고 능동적인 족관절 운동이 불가능하며, 방사선 사진에서 족관절 간격은 유지되었다. 가장 적절한 치료는?",choices:["경과 관찰", "아킬레스건 연장술", "후경골건 건이전술", "족관절 유합술", "족관절 인공관절치환술"],answer:4,explanation:"",question_images:["images/유니온_3권_q059.jpg"],explanation_images:["images/유니온_3권_e059.jpg"]},
  {num:65,section:"유니온 3권",chapter:"족부·족관절",question:"6개월 전부터 시작된 우측 족관절 통증으로 시행한 임상 사진 및 초음파 영상이다. 수술적인 치료를 결정하고 족관절 관절경 검사를 시행할 때 초음파 검사 결과에 부 합하는 가장 알맞은 관절경 소견은?",choices:["1", "2", "3", "4", "5"],answer:3,explanation:"",question_images:["images/유니온_3권_q060.jpg"],explanation_images:["images/유니온_3권_e060.jpg"]},
  {num:66,section:"유니온 3권",chapter:"족부·족관절",question:"64세 여자가 좌측 족관절의 종창 및 발적이 있다. 환자는 제2형 당뇨병을 20년째 앓 고 있고, 특이한 외상력은 없었다. 통증이 심하지 않고, 방사선 사진은 다음과 같다. 전접촉 석고 고정 후에도 변형과 종창이 진행할 때 가장 적절한 치료는?",choices:["도수 정복술", "변연 절제술", "절제 관절성형술", "관절유합술", "인공관절치환술"],answer:4,explanation:"",question_images:["images/유니온_3권_q061.jpg"],explanation_images:["images/유니온_3권_e061.jpg"]},
  {num:67,section:"유니온 3권",chapter:"족부·족관절",question:"6개월 전 스키 타다 넘어진 후 지속되는 족관절 외측부 통증에 대해 실시한 초음파 영상 및 임상 사진이다. 수술로 재건해야 할 수조물은?",choices:["상비골근지대(superior peroneal retinaculum)", "상신전지대(superior extensor retinaculum)", "전하경비인대(anterior inferior tibiofibular ligament)", "하비골근지대(inferior peroneal retinaculum)", "하신전지대(inferior extensor retinaculum)"],answer:1,explanation:"정답: 1번 (Superior peroneal retinaculum, SPR)<br><br><b>임상 소견 — Acute peroneal tendon dislocation/subluxation</b><br>- 스키, 축구 등에서 갑작스러운 족관절 과신전 또는 외전 + 강한 비골근 수축<br>- Superior peroneal retinaculum (SPR) 파열 → peroneal tendon이 fibula 후방에서 전방으로 탈구<br>- 또는 fibula 견연 골절(rim fracture)을 동반<br><br><b>초음파 소견</b><br>- Peroneal tendon이 fibular groove에서 anterior로 위치 (subluxation/dislocation)<br>- SPR의 연속성 소실<br><br><b>치료</b><br>- 활동 적은 환자: 보존적 (cast immobilization 6주)<br>- 급성 + 활동성 환자, 만성 재발: <b>SPR 재건술/봉합술</b><br>- Fibular groove deepening 동반 가능<br><br><b>해부학</b><br>- SPR: peroneal tendon을 fibular groove 내에 잡아주는 1차 안정화 구조<br>- 외측 malleolus 후방에 부착",question_images:["images/유니온_3권_q062.jpg"],explanation_images:["images/유니온_3권_e062.jpg"]},
  {num:68,section:"유니온 3권",chapter:"외상",question:"다음 중 골절 치유 기전(healing mechanism)이 다른 것은?",choices:["보기 1", "보기 2", "보기 3", "보기 4", "보기 5"],answer:1,explanation:"",question_images:["images/유니온_3권_q100.jpg"],explanation_images:["images/유니온_3권_e100.jpg"]},
  {num:69,section:"유니온 3권",chapter:"외상",question:"원위 상환골, 간부 골절로 보존적 치료 중 우측 엄지손가락의 신진 재한이 발생하였 다. 손상된 신경으로 가장 가능성이 높은 것은?",choices:["근피신경", "액와신경", "요골신경", "정중신경", "척골신경"],answer:3,explanation:"",question_images:["images/유니온_3권_q063.jpg"],explanation_images:["images/유니온_3권_e063.jpg"]},
  {num:70,section:"유니온 3권",chapter:"외상",question:"교통사고 후 발생한 근위 경골 골절로 부목고정 후 하지 전체에 악화되는 통증 및 종 창을 호소하였다. 윈위부의 맥박은 정상이었으며 족관절의 수동 신전시 극심한 통증 이 있다. 가장적절한 처치는?",choices:["부목제거 및 하지거상", "골건인술", "근막 절개술 및 외고정술", "근막 절개술 및 최소 침습적 금속판 고정술", "관혈적 금속판 고정술"],answer:3,explanation:"",question_images:["images/유니온_3권_q064.jpg"],explanation_images:["images/유니온_3권_e064.jpg"]},
  {num:71,section:"유니온 3권",chapter:"외상",question:"전후방 압박형(anteroposterior compression) 골반 골절에서 후방 골반환의 CT 사 진이 다. A 손상과 B 손상을 구분하는 주요 손상 구조물은?",choices:["장요인대", "전방천장관절인대", "천결절인대", "천극인대", "후방천장관절인대"],answer:5,explanation:"",question_images:["images/유니온_3권_q065.jpg"],explanation_images:["images/유니온_3권_e065.jpg"]},
  {num:72,section:"유니온 3권",chapter:"외상",question:"원위 대퇴골 골절(A,B)에 대하여 금속판 내고정을 하고자 한다. 관절면 골절의 노출 과 외측으로 금속판을 삽입하기 위한 가장 적절한 수술 접근법은?",choices:["direct lateral approach", "lateral parapatellar approach", "medial parapatellar approach", "minimally invasive lateral approach", "posterolareral approach"],answer:2,explanation:"",question_images:["images/유니온_3권_q066.jpg"],explanation_images:["images/유니온_3권_e066.jpg"]},
  {num:73,section:"유니온 3권",chapter:"외상",question:"고관절 탈구에 대해 도수 정복을 시행하여 concentric 장복을 얻었다(A). CT 검사에 서 비구 후벽의 변연부(marginal) 골절과 대퇴 골두 하부에 골절이 동반되었다(B). 영상 검사와 고관절의 스트레스 검사(C)를 고려한 가장 적절한 치료는? 그림 A 그림 B 그림 C",choices:["경과 관찰", "대퇴 골두 골편 제거술", "비구 후벽 골편 제거술", "비구 후벽 내고정술", "비구 후벽 및 대퇴 골두 내고정술"],answer:5,explanation:"",question_images:["images/유니온_3권_q067.jpg"],explanation_images:["images/유니온_3권_e067.jpg"]},
  {num:74,section:"유니온 3권",chapter:"소아",question:"2주 된 영아의 선천성 첨내반족을 Ponseti 방법으로 치료한다. 다음 중 수술적 치료를 고려해야 하는 소견은?",choices:["내측 깊은 피부 주름", "주상골(navicula)과 내과(medial malleolus)의 고착", "전족부 내전(adduction)", "전족부 회내전(pronation)", "뒤꿈치 위 주름 없는 equinus"],answer:2,explanation:"",question_images:["images/유니온_3권_q068.jpg"],explanation_images:["images/유니온_3권_e068.jpg"]},
  {num:75,section:"유니온 3권",chapter:"소아",question:"1개월 된 영아의 기저귀를 갈아줄 때, 왼쪽 고관절의 외전(abduction)이 오른쪽에 비하여 줄어들어 있고, 넓적다리 안쪽의 피부 주름도 오른쪽에 비하여 깊었다. 확진 을 위하여 가장 적절한 검사는?",choices:["bone scan", "CT", "MRI", "ultrasonography", "PET"],answer:4,explanation:"",question_images:["images/유니온_3권_q069.jpg"],explanation_images:["images/유니온_3권_e069.jpg"]},
  {num:76,section:"유니온 3권",chapter:"소아",question:"7세 환아의 방사선 사진이다. 슬관절 신전상태에서 우측 고관절 회전이 30도로 제 한되어 있다. 적합한 병기는?",choices:["Catteral 2 group", "Herring B/C border", "initial stage", "reossification stage", "Stulberg 1 group"],answer:3,explanation:"",question_images:["images/유니온_3권_q070.jpg"],explanation_images:["images/유니온_3권_e070.jpg"]},
  {num:77,section:"유니온 3권",chapter:"소아",question:"내족지 보행하는 9세 환아로 고관절 내회전은 80780°, 외회전은 40740°, 대퇴-촉 부각(thight-foot angle)은 20720°, 발뒤꿈치 이분선(he이 bisector line)이 제2-3 족지 사이를 통과하였다. 보행 시 발 진행각(foot progression angle)은 -30730。이 었다. 가장 적절한 치료는?",choices:["내측 설상골 절골술(medial cuneiform osteotomy)", "대퇴골 감염 절골술(femoral derotation osteotomy)", "원위 경골 외회전 절골술(supramalle이ar rotation osteotomy)", "입방골 폐쇄 절골술(cuboid closing osteotomy)", "종골 연장 절골술(calcaneal lengthening osteotomy)"],answer:2,explanation:"",question_images:["images/유니온_3권_q071.jpg"],explanation_images:["images/유니온_3권_e071.jpg"]},
  {num:78,section:"유니온 3권",chapter:"소아",question:"발달성 고관절 이형성증 진단을 위해 초음파 시행 시 다음과 같은 표준 영상을 얻기 위해서 가장 먼저 고려해야 하는 구조물은?",choices:["가-대퇴 골두(femoral head)", "나-비구순(labrum)", "다-심방연골(triradiate cartilage)", "라-장골(ilinm)", "마-좌골(ischium)"],answer:4,explanation:"",question_images:["images/유니온_3권_q072.jpg"],explanation_images:["images/유니온_3권_e072.jpg"]},
  {num:79,section:"유니온 3권",chapter:"소아",question:"6세 환아가 원위 대퇴골 골절에 동반된 성장판 손상으로 진행성 외반 및 굴곡 변형 이 관찰되었다. 방사선 검사와 자기공영 영상 검사는 다음과 같았다. 적절한 치료는?",choices:["경과 관찰", "골교 제거술", "교정 잘골술", "비대칭 성장판 억제술", "원위 대퇴골 성장판 유합술"],answer:4,explanation:"",question_images:["images/유니온_3권_q073.jpg"],explanation_images:["images/유니온_3권_e073.jpg"]},
  {num:80,section:"유니온 3권",chapter:"소아",question:"6세 환아의 다음 골절을 관헐적 정복술로 치료할 때 골유합 측면에서 가능한 보존해 야 하는 골절편 주변 부위는?",choices:["근위부 전방", "근위부 후방", "성장판", "원위부 전방", "원위부 후방"],answer:2,explanation:"",question_images:["images/유니온_3권_q074.jpg"],explanation_images:["images/유니온_3권_e074.jpg"]},
  {num:81,section:"유니온 3권",chapter:"소아",question:"4세 환아의 다음 골절은 석고고정으로 치료한다. 가장 주위해야 할 합병증은?",choices:["과성장", "내반고", "단축", "무혈성 괴사", "외반고"],answer:2,explanation:"",question_images:["images/유니온_3권_q075.jpg"],explanation_images:["images/유니온_3권_e075.jpg"]},

  {num:84,section:"유니온 3권",chapter:"소아",question:"8세 환아가 3주 전 태권도 중 발생한 우측 고관절 통증이 지속되어 목발을 이용하여 도 보행이 불가능하였다. 신경모세포종 치료 중이며, 비만과 성장장애로 인해 6개월 전부터 성장호르몬 치료를 시작하였다. 가장 적절한 치료는?",choices:["우측 정복 없는 핀 고정술", "우측 정복 없는 핀 고정술과 골연골 성형술", "우측 정복 없는 핀 고정술과 좌측 예방적 핀 고정술", "우측정복후핀고정술", "우측 정복 후 핀 고정술과 좌측 예방적 핀 고정술"],answer:3,explanation:"",question_images:["images/유니온_3권_q078.jpg"],explanation_images:["images/유니온_3권_e078.jpg"]},
  {num:85,section:"유니온 3권",chapter:"소아",question:"6개월 환아의 방사선 사진이다. 압통이나 부종은 관찰되지 않았다. 진단은?",choices:["근위 대퇴골 부분 결손", "대퇴골 경부 골절", "발달성 고관절 탈구", "발달성 내빈고", "화농성 관절염 합병증"],answer:1,explanation:"",question_images:["images/유니온_3권_q079.jpg"],explanation_images:["images/유니온_3권_e079.jpg"]},
  {num:86,section:"유니온 3권",chapter:"소아",question:"4세까지 내반슬에 대해 정기적 관찰을 한 환아의 방사선 사진이다. 진단은?",choices:["골간단 연골 이형성증(metaphyseal chondrodysplasia)", "구루병(rickets)", "국소 섬유연골 이형성증(focal fibrocartilgenous dysplasia)", "블라운트씨 병(Blount disease)", "섬유성 골 이형성증(fibrous dysplasia)"],answer:3,explanation:"",question_images:["images/유니온_3권_q080.jpg"],explanation_images:["images/유니온_3권_e080.jpg"]},

  {num:88,section:"유니온 3권",chapter:"종양",question:"60세 여자가 6개월 전부터 양쪽 발은 앞으로 뻗을 때 뒤쪽으로 튀어나오는 등쪽 종 괴가 있으나 통증이나 압통은 없다. 환자의 MRI 사진과 조직 검사 사진은 다음과 같 다. 진단은?",choices:["섬유종증(fibromatosis)", "지방종(lipoma)", "키무라씨병(Kimura disease)", "탄력섬유종(elastofibroma)", "혈관종(hemangioma)"],answer:4,explanation:"",question_images:["images/유니온_3권_q082.jpg"],explanation_images:["images/유니온_3권_e082.jpg"]},
  {num:89,section:"유니온 3권",chapter:"종양",question:"축구 경기 도중에 발생한 외상으로 내원한 14세 남아의 골절유무를 확인 위해 촬영 한 방사선 사진에서 경골 골병변이 발견되었다(A), 치료 없이 2년간 추적 관찰한 사 진이다(B). 진단은?",choices:["내연골증(enchondroma)", "동핵류성 골낭증(aneurysmal cyst)", "비골화성 유종(non-ossifying fibroma)", "섬유종 골이형성증(fibrous dysplasia)", "연골모세포종(chondroblastoma)"],answer:3,explanation:"",question_images:["images/유니온_3권_q083.jpg"],explanation_images:["images/유니온_3권_e083.jpg"]},

  {num:92,section:"유니온 3권",chapter:"종양",question:"26세 여자가 약 6개월 전부터 만져지고 점차 커지는 우측 대퇴부의 종괴가 있다. 조 직검사 FISH(fluorescence in situ hybridization)에서 APSCR1-TFE3 유전자 전위 가 관찰되고 MRI(A：T1 강조 영상, B：T1 지방억제 조영증강 영상)는 다음과 같다. 진 단은?",choices:["직엽성 지방육종(myxoid liposarcoma)", "포상연부육종(afveolar soft part saracoma)", "평활군육종(leiomyosarcoma)", "활막육종(synoval sarcoma)", "횡문근육종 (rhabdomyosarcoma)"],answer:2,explanation:"",question_images:["images/유니온_3권_q086.jpg"],explanation_images:["images/유니온_3권_e086.jpg"]},

  {num:94,section:"유니온 3권",chapter:"총론",question:"파골세포 생리작용을 표현한 그림이다. 골다공증 치료제인 denosumab의 표적이 되는 물질은?",choices:["cathepsin K", "lysosomes", "RANK", "RANKL", "sclerostin"],answer:4,explanation:"",question_images:["images/유니온_3권_q088.jpg"],explanation_images:["images/유니온_3권_e088.jpg"]},
  {num:95,section:"유니온 3권",chapter:"총론",question:"방사선 사진과 같은 골절을 일으키는 외력의 형태는?",choices:["굴곡력", "압축력", "인장력", "전달력", "회전력"],answer:5,explanation:"",question_images:["images/유니온_3권_q089.jpg"],explanation_images:["images/유니온_3권_e089.jpg"]},
  {num:96,section:"유니온 3권",chapter:"총론",question:"불안정성 주두 골절로 금속판 고정술을 받고 사진과 같은 손의 마비가 발생하였다. 손상 받은 신경은?",choices:["요골신경", "전골간신경", "장중신경", "척골신경", "후골간신경"],answer:2,explanation:"",question_images:["images/유니온_3권_q090.jpg"],explanation_images:["images/유니온_3권_e090.jpg"]},
  {num:97,section:"유니온 3권",chapter:"총론",question:"류마티스관절염으로 항류마티스약제인 methotrexate를 복용 중인 환자의 연구개 (soft palate) 사진이다. 이로한 합병증을 예방하기 위해 동시에 처방해야 하는 약제 는?",choices:["비오틴", "비타민 A", "비타민 C", "비타민 D", "엽산"],answer:5,explanation:"",question_images:["images/유니온_3권_q091.jpg"],explanation_images:["images/유니온_3권_e091.jpg"]},
  {num:98,section:"유니온 3권",chapter:"총론",question:"16세 남자가 높은 곳에서 뛰어내린 후 발생한 경골 간부의 비전위성 선형골절로 비 수술적인 치료를 진행 중이다. 수상 직후에는 ( A )를 시행하다가, 어느 정도 유합이 진행되면, 슬관절의 굴곡, 신전이 가능하고 체중 부하를 허용할 수 있는 ( B )로 대치 하여 완전한 유합까지 유지하였다. A와 B에 들어갈 석고 고정 방법의 가장 적절한 조합은?",choices:["가-나", "가-다", "다-나", "라-나", "라-다"],answer:2,explanation:"",question_images:["images/유니온_3권_q092.jpg"],explanation_images:["images/유니온_3권_e092.jpg"]},
  {num:99,section:"유니온 3권",chapter:"총론",question:"자가 건 이식편을 사용하여 관찰 인대 재건술을 시행하였다. 수술 후 관절 사용이 증 가하면서 건 이식편의 길이가 늘어나, 수술직후 보다 관절 안정성이 감소하는 현상 을 설명하기에 가장 적절한 물성은?",choices:["인성(toughness)", "응력 집중(stress concentration)", "취성(brittleness)", "탄성 (elasticity)", "포복(creep)"],answer:5,explanation:"",question_images:["images/유니온_3권_q093.jpg"],explanation_images:["images/유니온_3권_e093.jpg"]},
  {num:100,section:"유니온 3권",chapter:"총론",question:"개방성 골절로 입원한 환자에게 항생제 피부검사를 시행하여 적절한 예방적 항생제 를 투여하였으나, 약물 알레르기 과거력을 확인하지 않고 tramadol을 통증 조절을 위해 투여한 다음 과민성 쇼크(anaphylactic shock)가 발생하였다. 법적 분쟁이 발 생하였다면 의료진은 어떠한 의무를 다하지 못한 것에 대한 책임을 져야 하는가?",choices:["기록 의무", "동의 의무", "설명 의무", "주의 의무", "지도 의무"],answer:4,explanation:"",question_images:["images/유니온_3권_q094.jpg"],explanation_images:["images/유니온_3권_e094.jpg"]},
  {num:1,section:"유니온 4권",chapter:"수부",question:"37세 남자가 1년 전 낙상하여 발생한 우측 손목관절 통증을 호소하며 내원하였다. 내원 시 방사선 사진 및 수술장 소견은 다음과 같았고, 주상골 정복이 가능하였다. 가 장적절한치료는?",choices:["경피적 핀 고정술", "근위 수근골 절제술", "수근관절 유합술", "주상월상골간 인대 제건술", "후방 관절낭 봉합술"],answer:4,explanation:"",question_images:["images/유니온_4권_q001.jpg"],explanation_images:["images/유니온_4권_e001.jpg"]},
  {num:2,section:"유니온 4권",chapter:"수부",question:"20세 남자 환자가 1일 전 넘어지며 손바닥을 짚었다. 손목 통증을 호소하여 촬영한 방사선 사진 소견이다. Percutaneous screw fixation을 어느 방향으로 하는가?",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_4권_q002.jpg"],explanation_images:["images/유니온_4권_e002.jpg"]},
  {num:3,section:"유니온 4권",chapter:"수부",question:"68세 여자 환자가 2년 전 원위 요골 골절로 보존적 치료를 받았다. 방사선 사진은 아 래와 같았다. 70세 여자가 3년 전부터 손목 통증이 있었다. 보존적 치료에도 통증이 지속되었고 영상 검사가 다음과 같을 때 가장 적절한 치료는?",choices:["원위 요골 교정 절골술", "사중관절 유합술", "척골 단축술", "유두골 단축술", "Sauve-kapandji procedure"],answer:3,explanation:"",question_images:["images/유니온_4권_q003.jpg"],explanation_images:["images/유니온_4권_e003.jpg"]},
  {num:4,section:"유니온 4권",chapter:"수부",question:"68세 남자가 넘어지면 원위 상완골 골절로 관혈적 정복 및 내고정술을 시행하였다. 수술 후 1년이 지나고, 수상환 주관절의 굴곡 구축이 5도, 후속 굴곡이 120도 였다. 원인이 되는 구조물은?",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_4권_q004.jpg"],explanation_images:["images/유니온_4권_e004.jpg"]},

  {num:8,section:"유니온 4권",chapter:"수부",question:"25세 남자가 3년 전 전완부의 osteochondroma 제거술을 받았다. 이후 아래와 같이 수지의 신전 제한이 발생하였다. 이때 무지의 신전을 위해 건이전술을 고려할 때 자 주 사용되는 donor tendon (A)과 제 2-5 수지의 신전을 위해 자주 사용되는 donor tendon (B)는 ? 그림 A 그림 B",choices:["Palmaris longus - Flexor carpi radialis", "Flexor carpi radialis - Palmaris longus", "Palmaris longus - Extensor carpi radialis brevis", "Extensor carpi radialis brevis - Palmaris longus", "Flexor indicis proprius - Flexor carpi radialis"],answer:1,explanation:"",question_images:["images/유니온_4권_q008.jpg"],explanation_images:["images/유니온_4권_e008.jpg"]},

  {num:54,section:"유니온 4권",chapter:"슬관절",question:"21세 남자 환자가 반복되는 좌측 슬관절 통증과 부종으로 내원하였다. Q angle은 25 도, TT-TG은 23mm, Insall-salvati ratio는 1.2로 관측되었다. 하지 정렬은 정상이였 으며, 슬개골 외측 관절연골에 전층 결손 chondromalacia 소견이 있었다. 이 환자에 게 적절한 수술적 치료를 고르시오",choices:["경골결절 내측이전술", "경골결절 전내측이전술", "내측슬개대퇴인대 재건술", "내측슬개대퇴인대 경첩술", "Lateral release"],answer:2,explanation:"",question_images:["images/유니온_4권_q054.jpg"],explanation_images:["images/유니온_4권_e054.jpg"]},
  {num:55,section:"유니온 4권",chapter:"슬관절",question:"60세 여성이 2주 전 계단을 오르다가 무릎에서 뚝 소리가 난 후 지속되는 슬관절 통 증으로 촬영한 방사선 사진과 MRI 사진이다. 대퇴-슬관절-발목 각도는 내반 4도 였 다. 적절한 치료방법은?",choices:["보존적 치료", "HTO", "TKA", "연골판 부분절제술", "연골판 봉합술"],answer:5,explanation:"",question_images:["images/유니온_4권_q055.jpg"],explanation_images:["images/유니온_4권_e055.jpg"]},
  {num:56,section:"유니온 4권",chapter:"총론",question:"상완골 외측부 통증을 호소하는 67세 여자가 내원하였다. 방사선 사진 검사에서 동 측 견관절의 회전근개 파열이 관찰되었다. 이 환자에서 보이는 통증의 종류는?",choices:["국소 통증", "방사 통증", "신경 통증", "연관 통증", "체성 통증"],answer:4,explanation:"",question_images:["images/유니온_4권_q056.jpg"],explanation_images:["images/유니온_4권_e056.jpg"]},
  {num:57,section:"유니온 4권",chapter:"총론",question:"인공고관절 전치환술 시 골 시멘트를 이용하여 인공관절을 견고히 고정하였다. 골 시멘트가 생체 내에서 고정되는 기전은?",choices:["골유도(osteoinduction)", "기계적 맞물림(interdigitation)", "신생혈관 형성(neovasc니arization)", "생체 결합(biointegration)", "화학적 결합(chemical integration)"],answer:2,explanation:"",question_images:["images/유니온_4권_q057.jpg"],explanation_images:["images/유니온_4권_e057.jpg"]},
  {num:58,section:"유니온 4권",chapter:"총론",question:"감염, II 초음파를 통한 아킬레스 건 검사를 진행하던 중 초음파의 probe의 각도에 따라 다음 과 같은 현상이 나타났다. 이 현상을 무엇이라고 하는가?",choices:["Acoustic shadowing", "Acoustic enhancement", "Poor contact effect", "Anisotropy", "Reverberation"],answer:4,explanation:"",question_images:["images/유니온_4권_q058.jpg"],explanation_images:["images/유니온_4권_e058.jpg"]},
  {num:59,section:"유니온 4권",chapter:"총론",question:"감염, 대人 골다공증 치료제인 denosumad의 표적이 되는 세포는?",choices:["1", "2", "3", "4", "5"],answer:2,explanation:"",question_images:["images/유니온_4권_q059.jpg"],explanation_images:["images/유니온_4권_e059.jpg"]},
  {num:60,section:"유니온 4권",chapter:"총론",question:"류마티스 관절염을 진단하는데 민감도, 특이도가 높아 다른 관절염과 구분할 수 있 는 검사로 2010년도에 ACR 진단기준으로 추가된 항목은?",choices:["ANA2", "RF", "Anti-CCP", "ESR", "CRP"],answer:3,explanation:"",question_images:["images/유니온_4권_q060.jpg"],explanation_images:["images/유니온_4권_e060.jpg"]},
  {num:61,section:"유니온 4권",chapter:"족부·족관절",question:"60세 당뇨병 환자에서 1년 동안 지속되는 제 2 중족골두 족저부의 약 1cm x 1.5cm 크기의 궤양이 있었다. 궤양은 피하조직까지만 노출되어 있었으며 발적은 없었다. 족부의 동맥은 잘 촉지되었으며 ABI 0.95 이다. 피부 감각은 감소되어 있었다. 가장 적잘한 치료는?",choices:["베타딘 드레싱", "음압 상처 치료", "전 접촉 석고 붕대 고정", "피부 이식", "변연 절제술 후 일차 봉합술"],answer:3,explanation:"",question_images:["images/유니온_4권_q061.jpg"],explanation_images:["images/유니온_4권_e061.jpg"]},
  {num:62,section:"유니온 4권",chapter:"족부·족관절",question:"70세 남자가 10년 전 우측 족관절 유합술 시행하였다. 6개월 전부터 좌측 발목 통증 으로 보행 힘들어 내원하였다. 단순 방사선 사진을 촬영하였다. 신체검진 상 불안정 성은 없다. 상기 환자의 치료로 적절한 것은?",choices:["과상부 교정절골술", "과상부 교정절골술 및 관절경적 변연절제술", "관절경적 변연절제술", "과상부 교정절골술 및 인공관절 치환술", "족관절 인공관절 전치환술"],answer:5,explanation:"",question_images:["images/유니온_4권_q062.jpg"],explanation_images:["images/유니온_4권_e062.jpg"]},
  {num:63,section:"유니온 4권",chapter:"족부·족관절",question:"45세 여자가 우측 제 2 족지 족배부에 painful callus로 내원하였다. 해당 caHus는 제 2 족지 PIP joint의 dorsal side에 위치 하였으며, PIP 및 DIP는 flexion 되어 있었 다. 제 2 족지 중족골두를 손가락으로 들어올리면서 족관절을 배굴시킬 때 해당 변 형이 교정되지 않았다. 적절한 치료는?",choices:["2nd 근위지관절의 절제 관절성형술", "굴곡건 이전술 (Flexor to extensor transfer)", "2nd 중족족지 관절유합술", "Weil osteotomy", "장족지신전근 연장술"],answer:1,explanation:"",question_images:["images/유니온_4권_q063.jpg"],explanation_images:["images/유니온_4권_e063.jpg"]},

  {num:65,section:"유니온 4권",chapter:"족부·족관절",question:"20세 축구선수가 발목 전외측의 통증을 호소한다. 족배굴곡시 통증이 악화되었다. 환자에서 문제가 되는 구조물은?",choices:["Superior extensor retinaculum", "Calcaneofibular ligament", "Bassett’s ligament", "Anterior talus osteophyte", "Anterior talofibular ligament"],answer:3,explanation:"",question_images:["images/유니온_4권_q065.jpg"],explanation_images:["images/유니온_4권_e065.jpg"]},
  {num:66,section:"유니온 4권",chapter:"족부·족관절",question:"Cavovarus foot을 주소로 내원한 환자에서 다음과 같은 검사에서 후족부 내반이 교 정되었다. 이 환자에서 시행할 수 있는 수술 방법은?",choices:["종골 외측 연장술", "1st metatarsal dorsal closing wedge osteotomy", "Calcaneal lateralization osteotomy", "Triple arthrodesis", "Subtalar arthrodesis"],answer:2,explanation:"",question_images:["images/유니온_4권_q066.jpg"],explanation_images:["images/유니온_4권_e066.jpg"]},

  {num:68,section:"유니온 4권",chapter:"외상",question:"40세 남자가 낙상 이후 발생하 골반환 손상에 대해 다음과 같은 수술적 접근법을 사 용하여 수술 하였다. 이 접근법으로 손상 받기 쉬운 신경의 작용으로 옳은 것은?",choices:["고관절 내전", "무릎 신전", "고관절 굴곡", "고관절 외전", "족저 굴곡"],answer:1,explanation:"",question_images:["images/유니온_4권_q068.jpg"],explanation_images:["images/유니온_4권_e068.jpg"]},
  {num:69,section:"유니온 4권",chapter:"외상",question:"60세 남자가 낙상 이후 발생한 근위 경골 고평부에 골절로 내원하였다. 영상 검사는 다음과 같을 때, 손상 시 femur의 손상 기전과 위치는?",choices:["내반 + 내회전 + 굴곡", "내반 + 외회전 + 굴곡", "내반 + 외회전 + 신전", "외반 + 내회전 + 신전", "외반 + 외회전 + 신전"],answer:1,explanation:"",question_images:["images/유니온_4권_q069.jpg"],explanation_images:["images/유니온_4권_e069.jpg"]},
  {num:70,section:"유니온 4권",chapter:"외상",question:"교통사고 후 발생한 근위 경골 골절로 관혈적 정복 및 내고정술을 시행하였다. 수술 시 사용한 금속판의 기능으로 알맞게 짝지어진 것은?",choices:["지지-중립", "중립-지지", "지지 -지지", "중립-중립", "압박-압박"],answer:3,explanation:"",question_images:["images/유니온_4권_q070.jpg"],explanation_images:["images/유니온_4권_e070.jpg"]},
  {num:71,section:"유니온 4권",chapter:"외상",question:"36세 남자 환자가 경골 간부 골절로 골수강내 금속정을 정적 고정하였다 （그림 A）. 수술 후 1년 후 단순 방사선 소견이다 （그림 B）. 지속적인 경골 간부의 통증을 호소하 고 있다. 다음 중 가장 적절한 치료 방법은?",choices:["Long leg cast", "Dynamization", "Auto bone graft", "Exchange thicker nailing", "External fixator"],answer:4,explanation:"",question_images:["images/유니온_4권_q071.jpg"],explanation_images:["images/유니온_4권_e071.jpg"]},
