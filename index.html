<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="theme-color" content="#0c4a37">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>전문의 시험 공부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sidebar-w:254px;--memo-w:346px;
  /* 🤍🌿 화이트 베이스 + 라이트 그린 + 딥 그린 — 클린 에메랄드 (브라스 골드 폐기) */
  --bg:#f5faf7;
  --sidebar-bg:#ffffff;
  --panel:#f1f8f4;
  --card-bg:#ffffff;
  --accent:#10684c;--accent2:#1f9b6d;--accent-deep:#0c4a37;
  --accent-soft:rgba(16,104,76,.08);--accent-glow:rgba(31,155,109,.17);
  --mint:#e7f6ec;--mint2:#d6efdf;--mint3:#bfe6cd;
  --border:rgba(15,74,55,.12);--border2:rgba(15,74,55,.20);
  --heading1:#0c2c20;--heading2:#123a2b;--heading3:#1f4a39;--body-text:#314a3f;
  --text2:#5b7468;--text3:#647d70;
  --correct:#1f9d5b;--correct-bg:rgba(31,157,91,.12);
  --wrong:#d2544a;--wrong-bg:rgba(210,84,74,.10);
  --repeat:#2f8f86;
  --gold:#2f8f86;--gold-soft:rgba(47,143,134,.14);--gold-deep:#1f6e66;
  --shadow-sm:0 1px 3px rgba(18,58,43,.06),0 1px 2px rgba(18,58,43,.04);
  --shadow:0 4px 16px rgba(18,58,43,.08),0 2px 6px rgba(18,58,43,.05);
  --shadow-lg:0 16px 44px rgba(14,50,37,.15),0 6px 16px rgba(14,50,37,.09);
  --shadow-accent:0 10px 30px rgba(16,104,76,.26);
  --glass:rgba(255,255,255,.80);--glass-strong:rgba(255,255,255,.92);
  --radius:16px;--radius-lg:22px;
  --ring-track:#e2efe6;
  --serif:'Noto Serif KR','Nanum Myeongjo','Apple SD Gothic Neo',serif;
}
html,body{height:100%}
body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;background:var(--bg);color:var(--body-text);display:flex;height:100vh;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(900px 600px at 12% -8%,rgba(39,178,118,.10),transparent 60%),radial-gradient(760px 520px at 105% 8%,rgba(16,104,76,.08),transparent 55%),radial-gradient(680px 680px at 50% 118%,rgba(47,143,134,.06),transparent 60%);background-attachment:fixed}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.05ms!important}}

/* ====== SIDEBAR ====== */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--sidebar-bg);color:var(--body-text);display:flex;flex-direction:column;height:100vh;overflow:hidden;border-right:1px solid var(--border)}
.sidebar-header{padding:20px 20px 17px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%)}
.sidebar-header h1{font-size:15.5px;font-weight:800;color:#fff;letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.sidebar-header .sub{font-size:10.5px;color:rgba(255,255,255,.88);margin-top:5px;font-weight:500}
.user-bar{padding:9px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--mint)}
.user-bar .user-info{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:7px;font-weight:600}
.user-bar .user-icon{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.user-bar .logout-btn{padding:4px 10px;border:1px solid var(--border2);border-radius:7px;background:#fff;color:var(--text2);font-size:10.5px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.user-bar .logout-btn:hover{border-color:var(--wrong);color:var(--wrong)}

.book-list{flex:1;overflow-y:auto;padding:12px}
.book-list::-webkit-scrollbar{width:6px}.book-list::-webkit-scrollbar-thumb{background:var(--mint3);border-radius:3px}
.book-item{padding:13px 15px;margin-bottom:9px;border-radius:14px;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:var(--panel);position:relative}
.book-item:hover{background:var(--mint);border-color:var(--mint3);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.book-item.active{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 16px var(--accent-glow)}
.book-item .book-icon{font-size:19px;margin-bottom:5px}
.book-item .book-title{font-size:12.8px;font-weight:700;color:var(--heading2);line-height:1.4}
.book-item.active .book-title{color:var(--accent-deep)}
.book-item .book-stats{display:flex;gap:6px;margin-top:9px;font-size:10px;flex-wrap:wrap;align-items:center}
.book-item .book-stats span{padding:2px 8px;border-radius:8px;font-weight:700}
.book-stat-total{background:var(--mint2);color:var(--text2)}
.book-stat-done{background:rgba(31,157,91,.14);color:var(--correct)}
.book-stat-wrong{background:rgba(210,84,74,.12);color:var(--wrong)}
.book-stat-pct{margin-left:auto;background:var(--accent-soft);color:var(--accent-deep);font-weight:800}
.book-stat-empty{background:var(--mint2);color:var(--text3);font-weight:600}
.book-item .book-progress{margin-top:9px;height:4px;background:var(--mint2);border-radius:3px;overflow:hidden}
.book-item .book-progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .3s}

.sidebar-bottom{padding:0 12px 14px;display:flex;flex-direction:column;gap:7px}
.sidebar-bottom button{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:var(--panel);color:var(--body-text);font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s;font-family:inherit;font-weight:600}
.sidebar-bottom button:hover{background:var(--mint);border-color:var(--mint3)}
.sidebar-bottom .count{margin-left:auto;background:var(--accent);color:#fff;font-size:9.5px;padding:2px 8px;border-radius:9px;font-weight:700}
.sidebar-bottom .wrong-count{background:var(--wrong)}

/* ====== MAIN ====== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.main-header{padding:11px 28px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.72);backdrop-filter:blur(10px);font-size:13px;color:var(--text2);display:flex;align-items:center;gap:14px;min-height:48px;font-weight:600}
.main-header .back-btn{padding:6px 14px;border:1px solid var(--border2);border-radius:9px;background:#fff;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;display:none}
.main-header .back-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.main-header #headerTitle{font-weight:700;color:var(--heading2)}
.main-header #headerProgress{margin-left:auto;font-size:11.5px;color:var(--accent);font-weight:700}
.content-area{flex:1;overflow-y:auto;padding:22px 40px 70px}
.content-area::-webkit-scrollbar{width:8px}
.content-area::-webkit-scrollbar-thumb{background:var(--mint3);border-radius:4px}
.content-area::-webkit-scrollbar-thumb:hover{background:var(--accent2)}

/* ====== WELCOME ====== */
.welcome{text-align:center;padding-top:50px;max-width:780px;margin:0 auto}
.welcome .welcome-badge{display:inline-block;font-size:42px;margin-bottom:6px}
.welcome h2{font-size:27px;color:var(--heading1);margin-bottom:10px;font-weight:800;letter-spacing:-.5px}
.welcome p{color:var(--text2);font-size:14px;line-height:1.7}
.welcome .stats{display:flex;gap:16px;justify-content:center;margin-top:36px;flex-wrap:wrap}
.welcome .stats>div{background:var(--card-bg);border:1px solid var(--border);border-radius:18px;padding:20px 28px;min-width:118px;box-shadow:var(--shadow-sm)}
.welcome .stat-num{font-size:34px;font-weight:800;letter-spacing:-.5px}
.welcome .stat-num.blue{color:var(--accent)}.welcome .stat-num.green{color:var(--correct)}.welcome .stat-num.red{color:var(--wrong)}.welcome .stat-num.orange{color:var(--repeat)}
.welcome .stat-label{font-size:12px;color:var(--text2);margin-top:4px;font-weight:600}
.welcome .reset-views{margin-top:30px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.welcome .reset-views button{padding:9px 20px;border:1px solid var(--border2);border-radius:10px;background:#fff;color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit;font-weight:600}
.welcome .reset-views button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ====== QUESTION GRID ====== */
.grid-view{max-width:920px;margin:0 auto}
.grid-view h2{font-size:23px;font-weight:800;color:var(--heading1);margin-bottom:6px;letter-spacing:-.4px}
.grid-view .grid-sub{font-size:13px;color:var(--text2);margin-bottom:22px}
.grid-view .grid-controls{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.grid-controls button{padding:7px 15px;border:1px solid var(--border2);border-radius:9px;background:#fff;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.grid-controls button:hover{border-color:var(--accent);color:var(--accent)}
.grid-controls button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:9px}
.q-group{margin-bottom:24px}
.q-group-title{font-size:14px;font-weight:700;color:var(--accent-deep);margin-bottom:11px;padding:9px 15px;background:var(--accent-soft);border-radius:10px;border-left:3px solid var(--accent);display:flex;align-items:center;justify-content:space-between;gap:8px}
.q-group-stats{font-size:11px;color:var(--text2);font-weight:600}
.q-card{aspect-ratio:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--border2);background:#fff;transition:all .18s;position:relative;overflow:hidden}
.q-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 16px var(--accent-glow)}
.q-card .q-card-num{font-size:18px;font-weight:800;color:var(--heading2)}
.q-card .q-card-views{font-size:9px;color:var(--text3);margin-top:2px;font-weight:700}
.q-card.answered-correct{border-color:var(--correct);background:var(--correct-bg)}
.q-card.answered-correct .q-card-num{color:var(--correct)}
.q-card.answered-wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.q-card.answered-wrong .q-card-num{color:var(--wrong)}
.q-card.has-note::after{content:'';position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--repeat)}
.empty-state{text-align:center;padding:60px 24px;color:var(--text2)}
.empty-state .es-icon{font-size:54px;margin-bottom:14px}
.empty-state h3{font-size:18px;color:var(--heading2);font-weight:800;margin-bottom:10px}
.empty-state p{font-size:13.5px;line-height:1.8;color:var(--text2)}
.empty-state .es-file{display:inline-block;margin-top:14px;padding:8px 16px;background:var(--mint);border:1px solid var(--mint3);border-radius:10px;font-size:12.5px;color:var(--accent-deep);font-weight:700;word-break:break-all}

/* ====== QUIZ CARD ====== */
.quiz-card{max-width:840px;margin:0 auto}
.quiz-meta{background:linear-gradient(135deg,var(--mint) 0%,var(--mint2) 100%);border-radius:12px;padding:11px 16px;margin-bottom:13px;border-left:4px solid var(--accent);box-shadow:var(--shadow-sm)}
.quiz-meta .meta-section{font-size:11px;color:var(--accent-deep);font-weight:800;letter-spacing:.3px}
.quiz-meta .meta-num{font-size:13px;color:var(--text2);font-weight:600}
.quiz-meta .meta-views{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:rgba(31,157,91,.12);border-radius:12px;font-size:11px;color:var(--accent-deep);font-weight:600}
.quiz-meta .meta-minus-btn,.quiz-meta .meta-reset-btn{background:#fff;border:1px solid var(--border2);color:var(--accent-deep);padding:1px 7px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;transition:all .15s;margin-left:4px;font-family:inherit}
.quiz-meta .meta-minus-btn:hover,.quiz-meta .meta-reset-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.quiz-question{font-size:15.5px;font-weight:700;color:var(--heading1);line-height:1.6;margin-bottom:14px;padding:14px 18px;background:#fff;border-radius:12px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.quiz-question img{max-width:100%;border-radius:10px;margin:12px 0;box-shadow:var(--shadow);cursor:zoom-in;transition:transform .2s}
.quiz-question img:hover{transform:scale(1.01)}
.quiz-choices{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.choice-btn{display:flex;align-items:center;gap:11px;padding:11px 15px;border:2px solid var(--border2);border-radius:12px;background:#fff;cursor:pointer;transition:all .18s;text-align:left;font-family:inherit;font-size:14px;line-height:1.5;color:var(--body-text)}
.choice-btn:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(4px)}
.choice-btn .choice-num{min-width:27px;height:27px;border-radius:50%;background:var(--mint2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--text2);flex-shrink:0;transition:all .18s}
.choice-btn:hover .choice-num{background:var(--accent);color:#fff}
.choice-btn .choice-text{flex:1}
.choice-btn.correct{border-color:var(--correct);background:var(--correct-bg)}
.choice-btn.correct .choice-num{background:var(--correct);color:#fff}
.choice-btn.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.choice-btn.wrong .choice-num{background:var(--wrong);color:#fff}
.choice-btn.disabled{pointer-events:none}
.choice-btn.dimmed{opacity:.55}
.result-banner{padding:12px 16px;border-radius:12px;margin-bottom:13px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.result-banner.correct{background:var(--correct-bg);color:var(--correct);border:1px solid rgba(31,157,91,.25)}
.result-banner.wrong{background:var(--wrong-bg);color:var(--wrong);border:1px solid rgba(210,84,74,.2)}
.result-banner .result-icon{font-size:22px}
.retry-btn{background:#fff;color:var(--text2);border:1px solid var(--border2);border-radius:9px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:inherit}
.retry-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow-sm)}
.explanation-box{background:#fff;border-radius:12px;padding:14px 18px;border:1px solid var(--border);box-shadow:var(--shadow-sm);margin-bottom:13px;animation:slideIn .4s ease}
.explanation-box h3{font-size:14.5px;font-weight:800;color:var(--heading1);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.explanation-box .expl-text{font-size:13.8px;line-height:1.65;color:var(--body-text);white-space:pre-wrap}
.explanation-box .expl-ref{margin-top:9px;font-size:12px;color:var(--accent-deep);font-weight:700;padding:4px 11px;background:var(--accent-soft);border-radius:8px;display:inline-block}
.explanation-box .expl-images{margin-top:11px;display:flex;flex-direction:column;gap:9px}
.explanation-box .expl-images img{max-width:100%;border-radius:10px;box-shadow:var(--shadow);cursor:zoom-in;transition:transform .2s}
.explanation-box .expl-images img:hover{transform:scale(1.01)}
.note-section{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.note-input-row{display:flex;gap:8px}
.note-input{flex:1;padding:11px 15px;border:1px solid var(--border2);border-radius:11px;font-size:13px;font-family:inherit;resize:none;outline:none;min-height:42px;max-height:120px;line-height:1.5;transition:border .2s;background:#fff;color:var(--body-text)}
.note-input:focus{border-color:var(--accent)}
.note-input::placeholder{color:var(--text3)}
.note-add-btn{padding:11px 18px;border:none;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.note-add-btn.memo-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.note-add-btn.memo-btn:hover{filter:brightness(1.06);box-shadow:var(--shadow-sm)}
.note-list{margin-top:8px}
.note-item{background:#fff;border-radius:11px;padding:12px 16px;margin-bottom:8px;border-left:4px solid var(--accent);background:var(--accent-soft);font-size:13px;line-height:1.6;position:relative;box-shadow:var(--shadow-sm);white-space:pre-wrap;overflow-wrap:break-word}
.note-item .note-del{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--text3);font-size:16px;transition:color .15s;background:none;border:none}
.note-item .note-del:hover{color:var(--wrong)}
.note-item .note-time{font-size:10px;color:var(--text3);margin-top:4px}
.quiz-nav{display:flex;gap:10px;margin-top:16px;justify-content:space-between}
.quiz-nav button{padding:11px 24px;border:1px solid var(--border2);border-radius:11px;background:#fff;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;transition:all .15s}
.quiz-nav button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.quiz-nav button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.quiz-nav button.primary:hover{filter:brightness(1.06)}
.lightbox{position:fixed;inset:0;z-index:99999;background:rgba(10,30,20,.88);display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:95vw;max-height:95vh;border-radius:10px;box-shadow:0 4px 40px rgba(0,0,0,.5)}

/* ====== MEMO PANEL ====== */
.memo-panel{width:0;min-width:0;background:var(--sidebar-bg);color:var(--body-text);transition:all .3s ease;overflow:hidden;display:flex;flex-direction:column;height:100vh;border-left:1px solid var(--border);position:relative;box-shadow:-3px 0 14px rgba(20,80,55,.05)}
.memo-panel.open{width:var(--memo-w);min-width:var(--memo-w)}
.memo-panel-header{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--mint)}
.memo-panel-header h3{font-size:14px;font-weight:800;color:var(--heading2);display:flex;align-items:center;gap:6px}
.memo-close{cursor:pointer;color:var(--text2);font-size:20px;padding:4px;transition:color .15s;background:none;border:none}
.memo-close:hover{color:var(--wrong)}
.memo-filter-bar{display:flex;gap:6px;padding:9px 12px;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--panel)}
.memo-filter-bar::-webkit-scrollbar{height:4px}.memo-filter-bar::-webkit-scrollbar-thumb{background:var(--mint3);border-radius:2px}
.memo-filter-chip{padding:5px 11px;border:1px solid var(--border2);border-radius:13px;background:#fff;color:var(--text2);font-size:10.5px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:600;transition:all .15s}
.memo-filter-chip:hover{border-color:var(--accent);color:var(--accent)}
.memo-filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.memo-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.memo-tab-content{display:none;flex:1;flex-direction:column;overflow:hidden}
.memo-tab-content.active{display:flex}
.memo-list{flex:1;overflow-y:auto;padding:10px}
.memo-list::-webkit-scrollbar{width:6px}.memo-list::-webkit-scrollbar-thumb{background:var(--mint3);border-radius:3px}
.memo-empty{text-align:center;padding:48px 18px;color:var(--text3);font-size:12.5px;line-height:1.7}
.memo-item{background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:12.5px;line-height:1.55;position:relative;border-left:3px solid var(--accent);transition:background .15s;cursor:pointer}
.memo-item:hover{background:var(--mint)}
.memo-item.wrong{border-left-color:var(--wrong)}.memo-item.note{border-left-color:var(--accent)}
.memo-item .memo-q{font-size:10.5px;color:var(--accent-deep);margin-bottom:5px;font-weight:700}
.memo-item .memo-text{color:var(--body-text);white-space:pre-wrap;overflow-wrap:break-word}
.memo-item .memo-del{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--text3);font-size:15px;transition:color .15s;background:none;border:none}
.memo-item .memo-del:hover{color:var(--wrong)}
.memo-item.selected{background:var(--accent-soft);border-left:3px solid var(--accent)}
.memo-export{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px;background:var(--panel)}
.memo-export button{width:100%;padding:10px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:12.5px;cursor:pointer;font-weight:700;font-family:inherit;transition:all .15s}
.memo-export button:hover{filter:brightness(1.06)}
.memo-export .btn-secondary{background:#fff;border:1px solid var(--border2);color:var(--text2)}
.memo-export .btn-secondary:hover{filter:none;border-color:var(--wrong);color:var(--wrong)}
.memo-resize-handle{width:6px;cursor:col-resize;background:transparent;position:absolute;left:0;top:0;bottom:0;z-index:10;transition:background .2s}
.memo-resize-handle:hover,.memo-resize-handle.active{background:var(--accent)}
.memo-wrong-preview{border-top:1px solid var(--border);padding:14px 16px;max-height:45%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);flex-shrink:0}
.memo-wrong-preview .preview-header{font-size:12px;font-weight:800;color:var(--accent-deep);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.memo-wrong-preview .preview-header button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:14px;padding:2px 6px}
.memo-wrong-preview .preview-q{font-size:13px;line-height:1.6;color:var(--body-text);margin-bottom:8px}
.memo-wrong-preview .preview-choices{font-size:12px;color:var(--text2);line-height:1.7}
.memo-wrong-preview .preview-choices .correct-choice{color:var(--correct);font-weight:700}
.memo-wrong-preview .preview-choices .wrong-choice{color:var(--wrong);text-decoration:line-through}
.memo-wrong-preview .preview-go{margin-top:10px;padding:7px 14px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700}
.memo-wrong-preview .preview-go:hover{background:var(--accent);color:#fff}

/* ====== LOGIN ====== */
.login-overlay{position:fixed;inset:0;z-index:99999;background:linear-gradient(140deg,#ffffff 0%,#eef9f1 45%,#dcf0e2 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border:1px solid var(--border);border-radius:22px;padding:42px 38px 34px;width:360px;max-width:92vw;box-shadow:var(--shadow-lg)}
.login-box .login-logo{text-align:center;font-size:40px;margin-bottom:6px}
.login-box h2{color:var(--heading1);font-size:22px;text-align:center;margin-bottom:5px;font-weight:800;letter-spacing:-.4px}
.login-box .login-sub{color:var(--text2);font-size:12px;text-align:center;margin-bottom:22px;line-height:1.5}
.login-box label{display:block;color:var(--text2);font-size:11.5px;font-weight:700;margin-bottom:6px;margin-top:14px}
.login-box input[type="text"],.login-box input[type="password"]{width:100%;padding:12px 15px;border:1px solid var(--border2);border-radius:11px;background:var(--panel);color:var(--body-text);font-size:14px;font-family:inherit;outline:none;transition:all .2s}
.login-box input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.login-box .login-btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;margin-top:22px;font-family:inherit;transition:all .15s}
.login-box .login-btn:hover{filter:brightness(1.06);box-shadow:var(--shadow)}
.login-box .login-btn:disabled{opacity:.55;cursor:not-allowed}
.login-box .login-error{color:var(--wrong);font-size:12px;text-align:center;margin-top:12px;min-height:18px;font-weight:600}
.login-box .login-hint{color:var(--text3);font-size:11px;text-align:center;margin-top:14px;line-height:1.6}

.sync-indicator{position:fixed;top:52px;right:12px;z-index:9999;padding:5px 12px;border-radius:9px;font-size:11px;font-weight:700;display:none;box-shadow:var(--shadow);align-items:center}
/* 💾 항상 보이는 우측 상단 저장&동기화 버튼 (사이드바 하단 버튼이 모바일 브라우저 툴바에 가려지는 문제 회피) */
.sync-fab{position:fixed;top:8px;right:10px;z-index:9998;height:38px;padding:0 13px;border-radius:19px;border:none;background:linear-gradient(135deg,var(--lime,#b8f24a),var(--lime2,#a3e63a));color:var(--ink,#0e1813);font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(184,242,74,.35);display:flex;align-items:center;gap:5px;font-family:inherit}
.sync-fab:hover{filter:brightness(1.05)}
.sync-fab:active{transform:scale(.96)}
.sync-fab:disabled{opacity:.6;cursor:default}
.sync-indicator.syncing{display:flex;background:var(--accent);color:#fff}
.sync-indicator.synced{display:flex;background:var(--correct);color:#fff}
.sync-indicator.error{display:flex;background:var(--wrong);color:#fff}

.hamburger{display:none;position:fixed;top:9px;left:9px;z-index:200;width:42px;height:42px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--accent);font-size:20px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(10,40,28,.4);z-index:90;backdrop-filter:blur(2px)}
.mobile-memo-fab{display:none;position:fixed;bottom:22px;right:22px;z-index:140;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;font-size:23px;cursor:pointer;box-shadow:var(--shadow-lg);align-items:center;justify-content:center}

@media(max-width:768px){
  .hamburger{display:flex}.mobile-memo-fab{display:flex!important}
  .sidebar{position:fixed;left:-290px;top:0;width:272px;min-width:272px;z-index:100;transition:left .3s ease;box-shadow:4px 0 24px rgba(20,80,55,.2)}
  .sidebar.open{left:0}.sidebar-overlay.open{display:block}
  .main{width:100%}.main-header{padding:11px 16px 11px 60px;font-size:12px;gap:10px}
  .content-area{padding:14px 13px 150px}
  .quiz-card{padding:0}
  .quiz-meta{padding:12px 14px}
  .quiz-question{font-size:14.5px;padding:13px 15px;line-height:1.7}
  .quiz-question img{max-width:100%;height:auto}
  .choice-btn{padding:12px 13px;font-size:13.5px;gap:9px;border-radius:11px}
  .choice-btn:hover{transform:none}
  .choice-btn .choice-num{min-width:26px;height:26px;font-size:12px}
  .result-banner{padding:12px 14px;font-size:13.5px;gap:8px;flex-wrap:wrap}
  .retry-btn{padding:6px 12px;font-size:12px}
  .explanation-box{padding:14px 16px}
  .q-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px}
  .q-card{border-radius:10px}.q-card .q-card-num{font-size:15px}
  .q-group-title{font-size:13px;padding:8px 12px;flex-wrap:wrap}
  .note-input{font-size:13.5px}
  .quiz-nav button{font-size:13px;padding:11px 16px}
  .welcome{padding-top:30px}.welcome h2{font-size:22px}
  .welcome .stats{gap:10px}.welcome .stats>div{padding:16px 18px;min-width:0;flex:1;border-radius:14px}
  .welcome .stat-num{font-size:26px}
  .memo-panel.open{width:100%;min-width:100%;position:fixed;left:0;top:0;z-index:150}
  .main-header #headerProgress{display:none}
}
@media(max-width:400px){
  .content-area{padding:10px 9px 150px}
  .quiz-question{font-size:14px;padding:11px 13px}
  .choice-btn{padding:11px;font-size:13px}
  .q-grid{grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:5px}
  .q-card .q-card-num{font-size:14px}
}
::selection{background:var(--accent-glow)}

/* ==================================================================
   ✨ PREMIUM ENHANCEMENTS — 프리미엄 라이트 (기존 규칙 위에 덧입힘)
   ================================================================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes qPop{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(33,168,78,.40)}70%{box-shadow:0 0 0 14px rgba(33,168,78,0)}100%{box-shadow:0 0 0 0 rgba(33,168,78,0)}}
@keyframes popCheck{0%{transform:scale(.4);opacity:0}55%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes confettiFall{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--cx,0),105vh,0) rotate(var(--cr,540deg));opacity:0}}
@keyframes shimmer{0%{background-position:-380px 0}100%{background-position:380px 0}}
@keyframes flameFlicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(3deg)}}
@keyframes floatIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* glass header + sidebar shine */
.main-header{background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.6);box-shadow:0 1px 0 var(--border),0 6px 20px -16px rgba(20,80,55,.5)}
.sidebar{box-shadow:1px 0 0 var(--border),6px 0 24px -20px rgba(20,80,55,.4)}
.sidebar-header{position:relative;overflow:hidden}
.sidebar-header::after{content:'';position:absolute;top:-60%;right:-20%;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%);pointer-events:none}
.sidebar-header h1{position:relative;z-index:1}

/* book items — richer depth + animated bar shimmer */
.book-item{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s,border-color .2s}
.book-item:hover{transform:translateX(3px) translateY(-1px);box-shadow:var(--shadow)}
.book-item.active{transform:translateX(2px)}
.book-progress-bar{position:relative;overflow:hidden}
.book-progress-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:200px 100%;animation:shimmer 2.6s linear infinite}

/* sidebar nav (대시보드/암기카드/모의고사) */
.sidebar-nav{padding:10px 12px 4px;display:flex;flex-direction:column;gap:6px}
.sidebar-nav .nav-btn{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--heading2);font-size:12.8px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:9px;font-family:inherit;transition:all .16s}
.sidebar-nav .nav-btn:hover{background:var(--mint);border-color:var(--mint3);transform:translateX(2px)}
.sidebar-nav .nav-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:var(--shadow-accent)}
.sidebar-nav .nav-btn .nav-ico{font-size:16px}
.sidebar-nav .nav-btn .nav-mini{margin-left:auto;font-size:9.5px;font-weight:800;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:9px}
.sidebar-nav .nav-btn.active .nav-mini{background:rgba(255,255,255,.25);color:#fff}
.sidebar-divider{height:1px;background:var(--border);margin:10px 14px 4px}

/* q-card pop + deeper hover */
.q-card{animation:qPop .42s cubic-bezier(.2,.8,.2,1) both;box-shadow:var(--shadow-sm)}
.q-card:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 12px 24px var(--accent-glow)}
.q-grid .q-card:nth-child(1){animation-delay:.01s}.q-grid .q-card:nth-child(2){animation-delay:.03s}.q-grid .q-card:nth-child(3){animation-delay:.05s}.q-grid .q-card:nth-child(4){animation-delay:.07s}.q-grid .q-card:nth-child(5){animation-delay:.09s}.q-grid .q-card:nth-child(6){animation-delay:.11s}.q-grid .q-card:nth-child(7){animation-delay:.13s}.q-grid .q-card:nth-child(8){animation-delay:.15s}.q-grid .q-card:nth-child(9){animation-delay:.17s}.q-grid .q-card:nth-child(10){animation-delay:.19s}.q-grid .q-card:nth-child(n+11){animation-delay:.21s}

/* choice + nav micro-interactions */
.choice-btn{transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .16s,background .16s,box-shadow .16s}
.choice-btn:hover{box-shadow:0 6px 16px -8px var(--accent)}
.choice-btn.correct{animation:floatIn .35s ease both}
.quiz-nav button.primary{box-shadow:var(--shadow-accent)}
.quiz-nav button.primary:hover{transform:translateY(-2px)}

/* result banner pulse + icon pop */
.result-banner.correct{animation:slideIn .3s ease,pulseRing 1.2s ease .15s}
.result-banner .result-icon{display:inline-block;animation:popCheck .45s cubic-bezier(.2,.9,.3,1.3) both}

/* views fade up */
.grid-view,.quiz-card,#dashView,#flashView,#examView{animation:fadeUp .4s ease both}

/* ===== progress rings ===== */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.pring{transform:rotate(-90deg)}
.pring-track{stroke:var(--ring-track)}
.pring-fill{stroke:var(--rc,var(--accent));stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
.ring-center .ring-val{font-size:24px;font-weight:800;color:var(--heading1);letter-spacing:-.5px}
.ring-center .ring-lbl{font-size:10.5px;color:var(--text2);font-weight:700;margin-top:3px}

/* ===== confetti ===== */
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:99998;overflow:hidden}
.confetti-piece{position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;animation:confettiFall linear forwards}

/* ===== DASHBOARD ===== */
.dash{max-width:960px;margin:0 auto}
.dash-hero{background:linear-gradient(135deg,var(--accent-deep) 0%,var(--accent) 58%,#27b276 100%);border-radius:var(--radius-lg);padding:24px 26px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-accent)}
.dash-hero::after{content:'';position:absolute;top:-40%;right:-6%;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);pointer-events:none}
.dash-hero .dh-hi{font-size:13px;font-weight:600;opacity:.92}
.dash-hero .dh-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
.dash-hero .dh-row{display:flex;gap:14px;margin-top:18px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.streak-badge{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);padding:9px 15px;border-radius:14px}
.streak-badge .flame{font-size:22px;animation:flameFlicker 1.6s ease-in-out infinite;transform-origin:center bottom}
.streak-badge .sb-num{font-size:19px;font-weight:800;line-height:1}
.streak-badge .sb-lbl{font-size:10.5px;opacity:.9;font-weight:600;margin-top:1px}
.goal-chip{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);padding:9px 15px;border-radius:14px;font-size:12px;font-weight:600}
.goal-chip .goal-bar{width:96px;height:7px;border-radius:5px;background:rgba(255,255,255,.28);overflow:hidden}
.goal-chip .goal-bar i{display:block;height:100%;background:#fff;border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.goal-chip .goal-edit{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;width:24px;height:24px;cursor:pointer;font-size:13px;font-family:inherit}
.goal-chip .goal-edit:hover{background:rgba(255,255,255,.35)}

.dash-rings{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.ring-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s}
.ring-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ring-card .rc-sub{font-size:11.5px;color:var(--text2);font-weight:600}

.dash-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-top:16px;box-shadow:var(--shadow-sm)}
.dash-card .dc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.dash-card .dc-title{font-size:15px;font-weight:800;color:var(--heading1);display:flex;align-items:center;gap:7px}
.dash-card .dc-hint{font-size:11px;color:var(--text3);font-weight:600}

/* heatmap */
.heatmap{display:flex;flex-direction:column;gap:8px}
.heat-row{display:flex;align-items:center;gap:11px;cursor:pointer;padding:5px 7px;border-radius:10px;transition:background .15s}
.heat-row:hover{background:var(--mint)}
.heat-row .hr-name{flex:1;font-size:12.8px;font-weight:700;color:var(--heading2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.heat-row .hr-bar{flex:2;height:12px;border-radius:7px;background:var(--mint2);overflow:hidden;position:relative}
.heat-row .hr-bar i{display:block;height:100%;border-radius:7px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.heat-row .hr-pct{min-width:88px;text-align:right;font-size:11.5px;font-weight:700;color:var(--text2)}
.heat-row .hr-empty{flex:2;font-size:11px;color:var(--text3);font-weight:600}

/* weakness + quick actions */
.weak-tag{display:inline-flex;align-items:center;gap:6px;background:var(--wrong-bg);color:var(--wrong);border:1px solid rgba(210,84,74,.2);padding:6px 12px;border-radius:11px;font-size:12px;font-weight:700;margin:3px 5px 3px 0;cursor:pointer;transition:all .15s}
.weak-tag:hover{background:var(--wrong);color:#fff}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.qa-btn{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-family:inherit;text-align:left;transition:all .18s}
.qa-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--mint3);background:#fff}
.qa-btn .qa-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--accent-soft)}
.qa-btn .qa-tt{font-size:13.5px;font-weight:800;color:var(--heading1)}
.qa-btn .qa-ds{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px}

/* activity bars */
.activity-bars{display:flex;align-items:flex-end;gap:9px;min-height:112px;padding-top:6px}
.act-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
.act-day .ad-bar{width:100%;max-width:32px;border-radius:7px 7px 4px 4px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:4px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.act-day .ad-bar.zero{background:var(--mint2)}
.act-day .ad-num{font-size:10px;font-weight:800;color:var(--accent-deep)}
.act-day .ad-lbl{font-size:9.5px;color:var(--text3);font-weight:600}
.act-day.today .ad-lbl{color:var(--accent-deep);font-weight:800}

/* ===== MNEMONIC (암기법) in quiz ===== */
.mnem-box{margin-top:11px;background:linear-gradient(135deg,var(--gold-soft),rgba(47,143,134,.04));border:1px solid rgba(47,143,134,.25);border-radius:12px;padding:12px 15px}
.mnem-box .mnem-head{font-size:13px;font-weight:800;color:var(--gold-deep);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mnem-input-row{display:flex;gap:8px;align-items:stretch}
.mnem-fields{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.mnem-front{padding:9px 13px;border:1px solid rgba(47,143,134,.4);border-radius:10px;font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--body-text);font-weight:700}
.mnem-front:focus{border-color:var(--gold)}
.mnem-input{flex:1;padding:10px 13px;border:1px solid rgba(47,143,134,.4);border-radius:10px;font-size:13px;font-family:inherit;resize:none;outline:none;min-height:40px;max-height:120px;line-height:1.5;background:#fff;color:var(--body-text)}
.mnem-input:focus{border-color:var(--gold)}
.mnem-add{padding:10px 15px;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#fff;transition:filter .15s}
.mnem-add:hover{filter:brightness(1.06)}
.mnem-item{background:#fff;border-radius:10px;padding:10px 14px;margin-top:7px;border-left:3px solid var(--gold);font-size:13px;line-height:1.6;position:relative;box-shadow:var(--shadow-sm);white-space:pre-wrap;overflow-wrap:break-word}
.mnem-item.mnem-flip{cursor:pointer;white-space:normal;transition:background .15s}
.mnem-item.mnem-flip:hover{background:var(--gold-soft)}
.mnem-flip .mnf-front{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-right:18px}
.mnem-flip .mnf-q{font-weight:800;color:var(--gold-deep);font-size:14px}
.mnem-flip .mnf-hint{font-size:11px;color:var(--text3);font-weight:600}
.mnem-flip .mnf-back{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed rgba(47,143,134,.4);color:var(--body-text);font-weight:600;white-space:pre-wrap;overflow-wrap:break-word}
.mnem-flip.revealed .mnf-back{display:block}
.mnem-flip.revealed .mnf-hint{display:none}
.mnem-item .mnem-del{position:absolute;top:7px;right:9px;cursor:pointer;color:var(--text3);font-size:15px;background:none;border:none}
.mnem-item .mnem-del:hover{color:var(--wrong)}

/* ===== FLASHCARD ===== */
.flash-wrap{max-width:900px;margin:0 auto}
.flash-setup h2,.exam-setup h2{font-size:22px;font-weight:800;color:var(--heading1);margin-bottom:6px;letter-spacing:-.4px}
.flash-setup .fs-sub,.exam-setup .es-sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.deck-btn{padding:18px 16px;border-radius:15px;border:1px solid var(--border);background:var(--card-bg);cursor:pointer;font-family:inherit;text-align:left;transition:all .18s;box-shadow:var(--shadow-sm)}
.deck-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.deck-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
.deck-btn .dk-ico{font-size:24px}
.deck-btn .dk-tt{font-size:14.5px;font-weight:800;color:var(--heading1);margin-top:8px}
.deck-btn .dk-ct{font-size:11.5px;color:var(--text2);font-weight:700;margin-top:3px}

.flash-progress{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.flash-progress .fp-bar{flex:1;height:9px;border-radius:6px;background:var(--mint2);overflow:hidden}
.flash-progress .fp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width .4s}
.flash-progress .fp-txt{font-size:12px;font-weight:800;color:var(--accent-deep);white-space:nowrap}

.flashcard{perspective:1600px;min-height:540px;margin-bottom:16px}
.flash-inner{position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.8,.3,1);min-height:540px}
.flashcard.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:auto}
.flash-face.back{transform:rotateY(180deg);background:linear-gradient(180deg,#fff,var(--mint))}
.flash-face .ff-tag{font-size:11px;font-weight:800;color:var(--accent-deep);letter-spacing:.4px;margin-bottom:10px}
.flash-face .ff-q{font-size:17.5px;font-weight:700;color:var(--heading1);line-height:1.6}
.flash-face img{width:100%;max-width:100%;border-radius:10px;margin-top:12px;box-shadow:var(--shadow-sm)}
.flash-face .ff-ans{font-size:15px;font-weight:800;color:var(--correct);margin-bottom:8px}
.flash-face .ff-hint{margin-top:auto;font-size:11.5px;color:var(--text3);font-weight:700;text-align:center;padding-top:14px}
.flash-mnem{margin-top:10px;background:var(--gold-soft);border:1px solid rgba(47,143,134,.3);border-radius:11px;padding:10px 13px;font-size:13px;line-height:1.6;color:#1f5a54;white-space:pre-wrap;overflow-wrap:break-word}
.flash-mnem b{color:var(--gold-deep)}
.flash-rate{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px}
.rate-btn{padding:13px;border-radius:13px;border:1px solid var(--border2);background:#fff;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.rate-btn .rb-k{font-size:18px}
.rate-btn.hard:hover{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.rate-btn.mid:hover{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep)}
.rate-btn.easy:hover{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.flash-bottom-nav{display:flex;justify-content:space-between;gap:10px}
.flash-bottom-nav button{padding:10px 18px;border:1px solid var(--border2);border-radius:11px;background:#fff;color:var(--text2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.flash-bottom-nav button:hover{border-color:var(--accent);color:var(--accent)}
.flash-flip-btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:10px;box-shadow:var(--shadow-accent);transition:transform .15s}
.flash-flip-btn:hover{transform:translateY(-2px)}
.flash-done{text-align:center;padding:50px 20px}
.flash-done .fd-ico{font-size:60px;margin-bottom:12px;animation:popCheck .5s ease both}
.flash-done h2{font-size:24px;font-weight:800;color:var(--heading1);margin-bottom:8px}
.flash-done p{font-size:14px;color:var(--text2);line-height:1.7}

/* ===== EXAM MODE ===== */
.exam-wrap{max-width:840px;margin:0 auto}
.exam-cfg{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.exam-cfg .ec-label{font-size:12.5px;font-weight:800;color:var(--heading2);margin-bottom:9px;display:block}
.exam-sec-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.exam-sec-chip{padding:7px 13px;border-radius:11px;border:1px solid var(--border2);background:#fff;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.exam-sec-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.exam-sec-chip:disabled{opacity:.4;cursor:not-allowed}
.exam-count-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.count-chip{padding:9px 17px;border-radius:11px;border:1px solid var(--border2);background:#fff;color:var(--text2);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s}
.count-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--heading2)}
.tg{position:relative;width:46px;height:26px;border-radius:14px;background:var(--mint2);border:1px solid var(--border2);cursor:pointer;transition:background .2s;flex-shrink:0}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .2s}
.tg.on{background:var(--accent);border-color:var(--accent)}.tg.on::after{transform:translateX(20px)}
.exam-start-btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:var(--shadow-accent);transition:transform .15s}
.exam-start-btn:hover{transform:translateY(-2px)}
.exam-start-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.exam-cycle{background:var(--mint);border:1px solid var(--mint3);border-radius:14px;padding:13px 15px;margin-bottom:14px}
.exam-cycle.done{background:var(--correct-bg,rgba(33,168,78,.11));border-color:var(--correct)}
.exam-cycle .exc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.exam-cycle .exc-title{font-size:13px;font-weight:800;color:var(--accent-deep)}
.exam-cycle .exc-bar{height:8px;border-radius:6px;background:var(--ring-track,#e1ddcc);overflow:hidden;margin-bottom:8px}
.exam-cycle .exc-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.exam-cycle .exc-hint{font-size:11.5px;color:var(--text2);font-weight:600;line-height:1.5}
.exam-cycle .exc-hint b{color:var(--accent-deep);font-weight:800}

.exam-topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:11px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.exam-timer{font-size:18px;font-weight:800;color:var(--accent-deep);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.exam-timer.warn{color:var(--wrong);animation:flameFlicker 1s ease-in-out infinite}
.exam-topbar .et-prog{font-size:12.5px;color:var(--text2);font-weight:700;margin-left:auto}
.exam-topbar .et-submit{padding:8px 16px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.exam-topbar .et-submit:hover{filter:brightness(1.06)}
.exam-omr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.omr-cell{width:34px;height:34px;border-radius:9px;border:1px solid var(--border2);background:#fff;font-size:12px;font-weight:800;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .14s}
.omr-cell.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep)}
.omr-cell.current{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}

.exam-result{max-width:760px;margin:0 auto;animation:fadeUp .4s ease both}
.exam-result .er-hero{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
.exam-result .er-score{font-size:46px;font-weight:800;letter-spacing:-1px;margin:8px 0}
.exam-result .er-grade{font-size:14px;font-weight:700;color:var(--text2)}
.exam-result .er-meta{display:flex;gap:18px;justify-content:center;margin-top:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);font-weight:700}
.exam-result .er-meta b{color:var(--heading1)}

/* ===== mobile tweaks for new components ===== */
@media(max-width:768px){
  .dash-rings{grid-template-columns:repeat(3,1fr);gap:8px}
  .ring-card{padding:13px 6px}
  .dash-hero{padding:18px 18px}.dash-hero .dh-title{font-size:20px}
  .heat-row .hr-pct{min-width:64px;font-size:10.5px}
  .heat-row .hr-name{font-size:11.5px}
  .flashcard,.flash-inner{min-height:460px}
  .exam-result .er-score{font-size:38px}
  .omr-cell{width:30px;height:30px;font-size:11px}
}
@media(max-width:430px){
  .dash-rings .ring-card .rc-sub{font-size:10px}
  .quick-actions{grid-template-columns:1fr 1fr}
}

/* ✒️ 세리프(명조) 제목 + 클린 그린 디테일 — 화이트 베이스 고급 무드 */
.sidebar-header h1,.dash-hero .dh-title,.dash-card .dc-title,.grid-view h2,.flash-setup h2,.exam-setup h2,.flash-done h2,.empty-state h3,.login-box h2,.exam-result .er-score,.explanation-box h3,.ring-center .ring-val,.welcome h2{font-family:var(--serif)}
.dash-hero .dh-title{letter-spacing:.2px;font-weight:700}
.sidebar-header{border-bottom:1px solid rgba(255,255,255,.16)}
.grid-view h2,.flash-setup h2,.exam-setup h2{display:inline-block;padding-bottom:7px;border-bottom:2px solid var(--accent);letter-spacing:-.2px}
.dash-card .dc-title{letter-spacing:-.2px}
.book-item.active{box-shadow:inset 3px 0 0 var(--accent2),0 0 0 1px var(--accent),0 6px 16px var(--accent-glow)}
.quiz-meta{border-left:4px solid var(--accent)}
.login-box .login-logo{color:var(--accent)}
.choice-btn .choice-num{background:var(--mint2)}
.q-group-title{border-left:3px solid var(--accent)}

/* memo image paste */
.note-img{display:block;max-width:100%;margin-top:8px;border-radius:10px;box-shadow:var(--shadow-sm);cursor:zoom-in;border:1px solid var(--border)}
.memo-img{display:block;max-width:100%;margin-top:7px;border-radius:8px;box-shadow:var(--shadow-sm);cursor:zoom-in;border:1px solid var(--border)}
.memo-img-preview{margin-top:9px}
.memo-img-preview .mip-wrap{position:relative;display:inline-block;border:1px dashed var(--border2);border-radius:12px;padding:8px;background:var(--panel)}
.memo-img-preview img{max-width:230px;max-height:170px;border-radius:8px;display:block}
.memo-img-preview .mip-del{margin-top:7px;background:#fff;border:1px solid var(--border2);color:var(--wrong);border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.memo-img-preview .mip-tag{display:block;margin-top:5px;font-size:10.5px;color:var(--text2);font-weight:600}
.exam-hist-row{position:relative;padding-right:30px!important}
.exam-hist-del{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);font-size:17px;line-height:1;cursor:pointer;font-family:inherit;padding:3px 7px;border-radius:7px}
.exam-hist-del:hover{color:var(--wrong);background:var(--wrong-bg)}
/* 해설 박스 인라인 편집(내 해설) */
.explanation-box h3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.expl-edit-btn{background:var(--accent-soft);border:1px solid var(--border2);color:var(--accent-deep);border-radius:9px;min-width:32px;height:28px;font-size:14px;cursor:pointer;font-family:inherit;flex-shrink:0;transition:all .15s}
.expl-edit-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.expl-none{font-size:13px;color:var(--text2);padding:2px 0}
.uexpl-mine{margin-top:11px;display:flex;flex-direction:column;gap:8px}
.uexpl-item{background:var(--accent-soft);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:11px;padding:11px 14px}
.uexpl-badge{font-size:10.5px;font-weight:800;color:var(--accent-deep);margin-bottom:5px}
.uexpl-item .uexpl-text{font-size:13.8px;line-height:1.65;color:var(--body-text);white-space:pre-wrap}
.uexpl-item .uexpl-img{display:block;max-width:100%;margin-top:8px;border-radius:9px;box-shadow:var(--shadow-sm);cursor:zoom-in;border:1px solid var(--border)}
.uexpl-actions-row{display:flex;gap:7px;margin-top:9px}
.uexpl-mini{padding:5px 12px;border:1px solid var(--border2);background:#fff;color:var(--text2);border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.uexpl-mini:hover{border-color:var(--accent);color:var(--accent)}
.uexpl-mini.del:hover{border-color:var(--wrong);color:var(--wrong)}
.uexpl-editor{margin-top:11px;background:#fff;border:1px dashed var(--accent);border-radius:11px;padding:12px 14px}
.uexpl-editor-title{font-size:12.5px;font-weight:800;color:var(--accent-deep);margin-bottom:8px}
.uexpl-editor .uexpl-input{width:100%;padding:10px 13px;border:1px solid var(--border2);border-radius:10px;font-size:13.5px;font-family:inherit;resize:vertical;outline:none;min-height:62px;line-height:1.6;background:#fff;color:var(--body-text)}
.uexpl-editor .uexpl-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.uexpl-editor .uexpl-actions{display:flex;gap:8px;margin-top:9px;align-items:center}
.uexpl-save{padding:9px 18px;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.uexpl-save:hover{filter:brightness(1.07)}
.uexpl-cancel{padding:9px 15px;border:1px solid var(--border2);background:#fff;color:var(--text2);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.uexpl-cancel:hover{border-color:var(--wrong);color:var(--wrong)}
/* 내 해설(보충) */
.uexpl-box{margin-top:12px;background:linear-gradient(135deg,var(--accent-soft),rgba(36,67,58,.02));border:1px solid var(--border2);border-radius:13px;padding:14px 16px}
.uexpl-head{font-size:13.5px;font-weight:800;color:var(--accent-deep);display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.uexpl-head .uexpl-sub{font-size:10.5px;color:var(--text2);font-weight:600}
.uexpl-input{width:100%;padding:11px 14px;border:1px solid var(--border2);border-radius:11px;font-size:13.5px;font-family:inherit;resize:vertical;outline:none;min-height:58px;line-height:1.6;background:#fff;color:var(--body-text)}
.uexpl-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.uexpl-actions{display:flex;gap:8px;margin-top:9px;align-items:center}
.uexpl-file{display:inline-flex;align-items:center;padding:9px 14px;border:1px solid var(--border2);border-radius:10px;background:#fff;color:var(--text2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.uexpl-file:hover{border-color:var(--accent);color:var(--accent)}
.uexpl-add{margin-left:auto;padding:10px 20px;border:none;border-radius:11px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow-sm);transition:filter .15s}
.uexpl-add:hover{filter:brightness(1.07)}
.uexpl-list{margin-top:11px;display:flex;flex-direction:column;gap:8px}
.uexpl-item{background:#fff;border-radius:11px;padding:12px 15px;border-left:3px solid var(--accent);box-shadow:var(--shadow-sm);position:relative}
.uexpl-text{font-size:13.8px;line-height:1.65;color:var(--body-text);white-space:pre-wrap;padding-right:18px}
.uexpl-img{display:block;max-width:100%;margin-top:9px;border-radius:10px;box-shadow:var(--shadow-sm);cursor:zoom-in;border:1px solid var(--border)}
.uexpl-meta{font-size:10px;color:var(--text3);margin-top:6px;font-weight:600}
.uexpl-del{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--text3);font-size:17px;line-height:1;background:none;border:none}
.uexpl-del:hover{color:var(--wrong)}

/* ===================================================================
   🌑🟢 AgrisAI 무드 — 다크 글래스 셸 + 라이트 본문 + 라임 네온 (하이브리드)
   셸(사이드바·헤더·로그인·메모패널·히어로)=다크 글래스 / 문제 본문=화이트 유지
   =================================================================== */
:root{
  --lime:#b8f24a;--lime2:#a3e63a;--lime-deep:#7fbe1f;
  --lime-soft:rgba(184,242,74,.14);--lime-line:rgba(184,242,74,.34);--lime-glow:rgba(184,242,74,.45);
  --shell-bg:#0e1813;--shell-bg2:#13241b;
  --shell-card:rgba(255,255,255,.045);--shell-card2:rgba(255,255,255,.075);
  --shell-bd:rgba(255,255,255,.09);--shell-bd2:rgba(255,255,255,.17);
  --shell-tx:#e9f1ec;--shell-tx2:#96aa9e;--shell-tx3:#6b8076;
  --ink:#0e1813;
  /* 본문 하모나이즈: 한 톤 더 화이트 + 청록(팀)→올리브(라임 패밀리)로 통일 */
  --bg:#fbfefc;
  --repeat:#6f9e2c;--gold:#6f9e2c;--gold-soft:rgba(111,158,44,.14);--gold-deep:#56801f;
  /* 정답=프레시 그린(라임과 동족), 오답=정제 레드(핑크 배경 제거) */
  --correct:#21a84e;--correct-bg:rgba(33,168,78,.11);
  --wrong:#cf5346;--wrong-bg:rgba(207,83,70,.08);   /* 정제 브릭-코럴(핑크 아님) */
  /* 본문 버튼: 옅은 파스텔 그린(선택칸 그린 톤에 통일) — 다크텍스트 */
  --limebtn:#d7f0b3;--limebtn2:#c6e996;--limebtn-glow:rgba(170,210,120,.30);
}

/* ---- 사이드바 셸 ---- */
.sidebar{background:linear-gradient(180deg,#0e1813 0%,#0b130e 100%);border-right:1px solid var(--shell-bd);box-shadow:1px 0 0 var(--shell-bd),10px 0 44px -28px rgba(0,0,0,.75);position:relative}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;height:auto;background:radial-gradient(280px 230px at var(--gx,16%) var(--gy,8%),rgba(184,242,74,.24),transparent 60%);pointer-events:none;z-index:0;will-change:background}
.sidebar>*{position:relative;z-index:1}
.sidebar-header{background:linear-gradient(135deg,#12281b 0%,#0d1b13 100%);border-bottom:1px solid var(--shell-bd);overflow:hidden}
.sidebar-header::after{content:'';top:-52%;right:-16%;width:175px;height:175px;background:radial-gradient(circle,rgba(184,242,74,.32),transparent 62%)}
.sidebar-header h1{color:#fff;text-shadow:0 1px 14px rgba(184,242,74,.28)}
.sidebar-header .sub{color:var(--shell-tx2)}
.user-bar{background:rgba(255,255,255,.03);border-bottom:1px solid var(--shell-bd)}
.user-bar .user-info{color:var(--shell-tx2)}
.user-bar .user-icon{background:linear-gradient(135deg,var(--lime),var(--lime2));color:var(--ink);box-shadow:0 0 15px var(--lime-glow)}
.user-bar .logout-btn{background:var(--shell-card);border:1px solid var(--shell-bd);color:var(--shell-tx2)}
.user-bar .logout-btn:hover{border-color:#e57a6b;color:#ff9b8e;background:var(--shell-card2)}
.sidebar-nav .nav-btn{background:var(--shell-card);border:1px solid var(--shell-bd);color:var(--shell-tx)}
.sidebar-nav .nav-btn:hover{background:var(--shell-card2);border-color:var(--lime-line);transform:translateX(2px)}
.sidebar-nav .nav-btn.active{background:linear-gradient(135deg,var(--lime),var(--lime2));color:var(--ink);border-color:transparent;box-shadow:0 12px 28px -8px var(--lime-glow)}
.sidebar-nav .nav-btn .nav-mini{background:var(--lime-soft);color:var(--lime)}
.sidebar-nav .nav-btn.active .nav-mini{background:rgba(14,24,19,.24);color:var(--ink)}
.sidebar-divider{background:var(--shell-bd)}
.book-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13)}
.book-item{background:var(--shell-card);border:1px solid var(--shell-bd)}
.book-item:hover{background:var(--shell-card2);border-color:var(--lime-line);transform:translateX(3px) translateY(-1px);box-shadow:0 12px 28px -18px rgba(0,0,0,.85)}
.book-item .book-title{color:var(--shell-tx)}
.book-item.active{background:rgba(184,242,74,.10);border-color:var(--lime);box-shadow:inset 3px 0 0 var(--lime),0 0 0 1px rgba(184,242,74,.5),0 14px 32px -12px var(--lime-glow)}
.book-item.active .book-title{color:#fff}
.book-stat-total{background:rgba(255,255,255,.07);color:var(--shell-tx2)}
.book-stat-empty{background:rgba(255,255,255,.06);color:var(--shell-tx3)}
.book-stat-done{background:rgba(184,242,74,.16);color:var(--lime)}
.book-stat-wrong{background:rgba(255,120,104,.16);color:#ff9d8f}
.book-stat-pct{background:rgba(184,242,74,.16);color:var(--lime)}
.book-item .book-progress{background:rgba(255,255,255,.08)}
.book-item .book-progress-bar{background:linear-gradient(90deg,var(--lime2),var(--lime))}
.sidebar-bottom button{background:var(--shell-card);border:1px solid var(--shell-bd);color:var(--shell-tx)}
.sidebar-bottom button:hover{background:var(--shell-card2);border-color:var(--lime-line)}
.sidebar-bottom .count{background:var(--lime);color:var(--ink)}
.sidebar-bottom .wrong-count{background:#e06a5b;color:#fff}
.sidebar-bottom .sync-now-btn{background:linear-gradient(135deg,var(--lime),var(--lime2))!important;color:var(--ink)!important;border:none!important;font-weight:800;box-shadow:0 4px 14px rgba(184,242,74,.22)}
.sidebar-bottom .sync-now-btn:hover{filter:brightness(1.04);box-shadow:0 6px 18px rgba(184,242,74,.32)}
.sidebar-bottom .sync-now-btn:disabled{opacity:.6;cursor:default;filter:none}
.sidebar-bottom .sync-now-btn .lastsync{margin-left:auto;font-size:10.5px;font-weight:700;opacity:.72;color:var(--ink)}

/* ---- 상단 헤더 셸 ---- */
.main-header{background:rgba(11,19,14,.76);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--shell-bd);box-shadow:0 1px 0 var(--shell-bd);color:var(--shell-tx2)}

/* ---- 대시보드 히어로(라이트 본문 위 다크 글래스 카드) ---- */
.dash-hero{background:linear-gradient(135deg,#0e1c14 0%,#102a1c 55%,#143b26 100%);box-shadow:0 22px 54px -18px rgba(10,32,18,.6),0 0 0 1px rgba(184,242,74,.13)}
.dash-hero::after{background:radial-gradient(circle,rgba(184,242,74,.30),transparent 62%)}
.dash-hero .dh-hi{color:#c4ef85}
.streak-badge,.goal-chip{background:rgba(255,255,255,.08);border:1px solid rgba(184,242,74,.24)}
.goal-chip .goal-bar i{background:var(--lime)}

/* ---- 로그인 다크 글래스 ---- */
.login-overlay{background:radial-gradient(1100px 720px at 20% -12%,rgba(184,242,74,.13),transparent 55%),linear-gradient(150deg,#0b130e 0%,#0e1c14 55%,#090f0b 100%)}
.login-box{background:rgba(255,255,255,.055);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border:1px solid var(--shell-bd2);box-shadow:0 30px 72px rgba(0,0,0,.5),0 0 0 1px rgba(184,242,74,.08)}
.login-box h2{color:#fff}
.login-box .login-sub,.login-box label{color:var(--shell-tx2)}
.login-box .login-logo{color:var(--lime);text-shadow:0 0 24px var(--lime-glow)}
.login-box input[type="text"],.login-box input[type="password"]{background:rgba(255,255,255,.04);border:1px solid var(--shell-bd2);color:var(--shell-tx)}
.login-box input::placeholder{color:var(--shell-tx3)}
.login-box input:focus{border-color:var(--lime);background:rgba(255,255,255,.06);box-shadow:0 0 0 3px var(--lime-soft)}
.login-box .login-btn{background:linear-gradient(135deg,var(--lime),var(--lime2));color:var(--ink);box-shadow:0 16px 32px -8px var(--lime-glow)}
.login-box .login-hint{color:var(--shell-tx3)}

/* ---- 메모 패널 다크 글래스 ---- */
.memo-panel{background:linear-gradient(180deg,#0e1813,#0b130e);border-left:1px solid var(--shell-bd);box-shadow:-4px 0 30px rgba(0,0,0,.4)}
.memo-panel-header{background:rgba(255,255,255,.03);border-bottom:1px solid var(--shell-bd)}
.memo-panel-header h3{color:var(--shell-tx)}
.memo-filter-bar{background:rgba(255,255,255,.02);border-bottom:1px solid var(--shell-bd)}
.memo-filter-chip{background:var(--shell-card);border:1px solid var(--shell-bd);color:var(--shell-tx2)}
.memo-filter-chip:hover{border-color:var(--lime-line);color:var(--lime)}
.memo-filter-chip.active{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.memo-item{background:var(--shell-card)}
.memo-item:hover{background:var(--shell-card2)}
.memo-item .memo-text{color:var(--shell-tx)}
.memo-item .memo-q{color:var(--lime)}
.memo-item.selected{background:rgba(184,242,74,.12)}
.memo-empty{color:var(--shell-tx3)}
.memo-export{background:rgba(255,255,255,.02);border-top:1px solid var(--shell-bd)}
.memo-export button{background:linear-gradient(135deg,var(--lime),var(--lime2));color:var(--ink)}
.memo-export .btn-secondary{background:var(--shell-card);border:1px solid var(--shell-bd);color:var(--shell-tx2)}
.memo-wrong-preview{background:rgba(255,255,255,.02);border-top:1px solid var(--shell-bd)}
.memo-wrong-preview .preview-header{color:var(--lime)}
.memo-wrong-preview .preview-q{color:var(--shell-tx)}
.memo-wrong-preview .preview-choices{color:var(--shell-tx2)}
.memo-wrong-preview .preview-go{background:var(--shell-card);border:1px solid var(--lime-line);color:var(--lime)}
.memo-wrong-preview .preview-go:hover{background:var(--lime);color:var(--ink)}
.memo-resize-handle:hover,.memo-resize-handle.active{background:var(--lime)}

/* ---- 모바일 셸 버튼 ---- */
.hamburger{background:var(--shell-bg);border:1px solid var(--shell-bd);color:var(--lime)}
.mobile-memo-fab{background:linear-gradient(135deg,var(--lime),var(--lime2));color:var(--ink);box-shadow:0 14px 32px -6px var(--lime-glow)}
.sidebar-overlay{background:rgba(4,9,6,.62)}

/* ---- 라이트 본문에 라임 포인트(인터랙션) ---- */
.grid-controls button.active{background:var(--limebtn);color:#2c4a16;border-color:#9cc35a}
.grid-controls button:hover{border-color:var(--lime-deep);color:var(--lime-deep)}
.q-card:hover{border-color:var(--lime-deep);box-shadow:0 12px 24px -8px rgba(127,190,31,.42)}
.choice-btn:hover{border-color:var(--lime-deep);background:var(--lime-soft)}
.choice-btn:hover .choice-num{background:var(--lime-deep);color:var(--ink)}
.quiz-nav button.primary,.exam-start-btn,.flash-flip-btn{background:linear-gradient(135deg,var(--limebtn),var(--limebtn2));color:var(--ink);box-shadow:0 7px 16px -10px var(--limebtn-glow)}
.quiz-nav button.primary:hover,.exam-start-btn:hover,.flash-flip-btn:hover{filter:brightness(1.04);transform:translateY(-2px)}
.qa-btn .qa-ico{background:var(--lime-soft)}
.qa-btn:hover{border-color:var(--lime-line);box-shadow:0 10px 24px -10px rgba(127,190,31,.35)}
.exam-sec-chip.on,.count-chip.on{background:var(--limebtn);color:#2c4a16;border-color:#9cc35a}
.tg.on{background:#9cc35a;border-color:#9cc35a}
.deck-btn:hover{border-color:var(--lime-deep);box-shadow:0 12px 26px -10px rgba(127,190,31,.32)}
.omr-cell.current{box-shadow:0 0 0 2px var(--lime-deep);border-color:var(--lime-deep)}
/* 본문 액션 버튼을 홈과 동일한 라임 브랜드로 통일(딥그린·팀 버튼 제거→밝고 조화) */
.note-add-btn.memo-btn,.mnem-add,.uexpl-add,.uexpl-save,.exam-topbar .et-submit{background:linear-gradient(135deg,var(--limebtn),var(--limebtn2))!important;color:var(--ink)!important;box-shadow:0 7px 16px -10px var(--limebtn-glow)}
.note-add-btn.memo-btn:hover,.mnem-add:hover,.uexpl-add:hover,.uexpl-save:hover,.exam-topbar .et-submit:hover{filter:brightness(1.05)}
/* 니모닉 박스 = 올리브 톤(라임 패밀리)로 조화 */
.mnem-box{background:linear-gradient(135deg,var(--gold-soft),rgba(111,158,44,.04));border-color:rgba(111,158,44,.26)}
.mnem-input,.mnem-front{border-color:rgba(111,158,44,.4)}
.mnem-flip .mnf-back{border-top-color:rgba(111,158,44,.45)}
.flash-mnem{border-color:rgba(111,158,44,.3);color:var(--gold-deep)}
/* 메타바 클린화(뜬 민트 블록 제거) + 정답/오답 톤 조화(분홍 제거) */
.quiz-meta{background:#fff;border:1px solid var(--border);border-left:3px solid var(--lime-deep);box-shadow:var(--shadow-sm)}
.quiz-meta .meta-section{color:var(--heading1)}
.quiz-meta .meta-views{background:var(--lime-soft);color:var(--lime-deep)}
.choice-btn.correct{border-color:var(--correct);background:rgba(33,168,78,.10)}
.choice-btn.correct .choice-num{background:var(--correct);color:#fff}
.choice-btn.wrong{border-color:var(--wrong);background:#f4f6f6}
.choice-btn.wrong .choice-num{background:var(--wrong);color:#fff}
.result-banner.correct{background:rgba(33,168,78,.10);color:#1a8f41;border:1px solid rgba(33,168,78,.26)}
.result-banner.wrong{background:#f4f6f6;color:#b2402f;border:1px solid rgba(207,83,70,.24)}
.q-card.answered-correct{border-color:var(--correct);background:rgba(33,168,78,.10)}
.q-card.answered-correct .q-card-num{color:var(--correct)}
.q-card.answered-wrong{border-color:var(--wrong);background:#f4f6f6}
.q-card.answered-wrong .q-card-num{color:var(--wrong)}
/* 모의고사 출제 기준 토글(라이트 본문) + 오답/반복 단원 필터·뱃지(다크 패널/라이트 공용) */
.exam-mode-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mode-chip{padding:9px 17px;border-radius:11px;border:1px solid var(--border2);background:#fff;color:var(--text2);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .15s}
.mode-chip:hover{border-color:var(--lime-deep);color:var(--lime-deep)}
.mode-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px -8px var(--accent-glow)}
.link-btn{background:none;border:none;color:var(--lime-deep);font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit;padding:2px 4px;margin-left:4px;text-decoration:underline;text-underline-offset:2px}
.link-btn:hover{color:var(--accent)}
.quiz-nav button.qnav-list{background:var(--mint);border-color:var(--mint3);color:var(--accent-deep)}
.quiz-nav button.qnav-list:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.memo-filter-chip.chap{background:rgba(184,242,74,.10);border-color:rgba(184,242,74,.26);color:#c7e98a}
.memo-filter-chip.chap:hover{border-color:rgba(184,242,74,.5);color:#dff3a8}
.memo-filter-chip.chap.active{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.memo-filter-divider{display:inline-flex;align-items:center;font-size:9.5px;color:var(--shell-tx3);font-weight:800;padding:0 4px;white-space:nowrap;letter-spacing:.3px}
.chap-badge{display:inline-block;background:#cdeaa8;color:#2c4a16;border-radius:7px;padding:1px 7px;font-size:9.5px;font-weight:800;margin-right:5px;vertical-align:middle}
::selection{background:rgba(184,242,74,.28)}

/* ===== 🎯 주제별 문제풀이 (사이드바 단일 버튼 + 단원 선택 페이지 + 풀이모드 바 + 토스트) ===== */
.sb-topic{margin:8px 0 2px;padding:11px 2px 2px;border-top:1px solid var(--shell-bd)}
.sb-topic-btn{width:100%;display:flex;align-items:center;gap:9px;padding:12px 13px;border-radius:12px;border:1px solid var(--shell-bd);background:var(--shell-card);color:var(--shell-tx);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .16s}
.sb-topic-btn .sbt-ico{font-size:16px}
.sb-topic-btn .sbt-label{flex:1;text-align:left}
.sb-topic-btn .sbt-arrow{font-size:17px;color:var(--shell-tx3);font-weight:700;line-height:1}
.sb-topic-btn:hover{border-color:var(--lime-line);background:var(--shell-card2);color:var(--lime)}
.sb-topic-btn:hover .sbt-arrow{color:var(--lime)}
.sb-topic-btn.active{background:linear-gradient(135deg,var(--lime),var(--lime2));color:var(--ink);border-color:var(--lime);box-shadow:0 6px 16px -8px var(--lime-glow)}
.sb-topic-btn.active .sbt-arrow{color:var(--ink)}
.topic-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.topic-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px 16px 14px;border-radius:16px;border:1px solid var(--border2);background:#fff;cursor:pointer;font-family:inherit;text-align:left;transition:all .16s;box-shadow:var(--shadow-sm)}
.topic-card:hover{border-color:var(--lime-deep);transform:translateY(-3px);box-shadow:0 12px 26px -12px rgba(127,190,31,.5)}
.topic-card .tc-ico{font-size:26px;margin-bottom:3px}
.topic-card .tc-name{font-size:15px;font-weight:800;color:var(--heading1)}
.topic-card .tc-meta{font-size:11.5px;color:var(--text2);font-weight:600}
.topic-card .tc-bar{width:100%;height:5px;border-radius:3px;background:var(--mint2);overflow:hidden;margin-top:10px}
.topic-card .tc-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* 🎯 주제 문제 목록 — 액션 버튼 + 풀이 상태 범례 */
.topic-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tl-start{padding:10px 18px;border-radius:11px;border:1px solid #9cc35a;background:var(--limebtn);color:#2c4a16;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.tl-start:hover{filter:brightness(.97);transform:translateY(-1px)}
.tl-start.alt{background:#fff;border:1px solid var(--accent);color:var(--accent)}
.status-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:18px;font-size:12px;color:var(--text2);font-weight:600}
.status-legend .sl-item{display:flex;align-items:center;gap:6px}
.status-legend .sl-dot{width:15px;height:15px;border-radius:5px;border:2px solid var(--border2);background:#fff;flex:0 0 auto}
.status-legend .sl-dot.correct{border-color:var(--correct);background:var(--correct-bg)}
.status-legend .sl-dot.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.practice-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;margin-bottom:12px;border-radius:12px;background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;font-size:13px;font-weight:700;box-shadow:0 8px 20px -12px var(--accent)}
.practice-bar .pb-ico{font-size:16px}
.practice-bar .pb-prog{margin-left:7px;background:rgba(255,255,255,.22);padding:2px 10px;border-radius:9px;font-size:12px;font-weight:800}
.practice-bar .pb-exit{margin-left:auto;background:rgba(255,255,255,.16);border:none;color:#fff;font-size:12px;font-weight:700;padding:5px 11px;border-radius:9px;cursor:pointer;font-family:inherit;transition:background .15s}
.practice-bar .pb-exit:hover{background:rgba(255,255,255,.32)}
.pt-toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);background:#0e1813;color:#eaf7d8;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:99997;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;border:1px solid rgba(184,242,74,.34)}
.pt-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.resume-banner{width:100%;display:flex;align-items:center;gap:13px;padding:13px 16px;margin-bottom:16px;border-radius:16px;border:1px solid var(--lime-line);background:linear-gradient(135deg,#0e1c14,#13261a);color:#fff;cursor:pointer;font-family:inherit;text-align:left;transition:all .18s;box-shadow:0 10px 28px -14px rgba(127,190,31,.55)}
.resume-banner:hover{transform:translateY(-2px);border-color:var(--lime);box-shadow:0 14px 34px -12px rgba(184,242,74,.5)}
.resume-banner .rb-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(184,242,74,.16);flex-shrink:0}
.resume-banner .rb-body{flex:1;min-width:0}
.resume-banner .rb-tt{font-size:13.5px;font-weight:800;color:#fff;display:flex;align-items:center;gap:7px}
.resume-banner .rb-sub{font-size:12px;color:var(--lime);font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-banner .rb-badge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:7px}
.resume-banner .rb-badge.ok{background:rgba(33,168,78,.22);color:#7ee2a0}
.resume-banner .rb-badge.no{background:rgba(207,83,70,.22);color:#f0a59c}
.resume-banner .rb-badge.new{background:rgba(184,242,74,.18);color:var(--lime)}
.resume-banner .rb-go{flex-shrink:0;background:linear-gradient(135deg,var(--lime),var(--lime2));color:var(--ink);font-size:12.5px;font-weight:800;padding:9px 14px;border-radius:10px;white-space:nowrap}

<script>
const APP_VERSION='20260607-1526';
/* 🔁 캐시 강제 우회 새로고침 — iOS 사파리는 location.reload(true)를 무시하고 캐시를 다시 줘서
   새 버전이 영영 적용 안 되는 일이 있음. URL에 새 쿼리(?v=버전)를 붙여 강제로 새로 받게 함. */
function _hardReload(v){try{const base=location.origin+location.pathname;location.replace(base+'?v='+encodeURIComponent(v||(''+Date.now())));}catch(e){location.reload();}}
async function _checkForUpdate(){
  try{
    const r=await fetch('./index.html?_='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
    if(m&&m[1]&&m[1]!==APP_VERSION){
      let div=document.getElementById('_updateBanner');if(div)return;
      div=document.createElement('div');div.id='_updateBanner';
      div.style.cssText='position:fixed;top:14px;right:14px;background:linear-gradient(135deg,#0c4a37,#1f9b6d);color:#fff;padding:14px 20px;border-radius:12px;z-index:99999;font:14px sans-serif;box-shadow:0 8px 26px rgba(12,50,37,.30);cursor:pointer;user-select:none';
      div.title='클릭하면 즉시 새로고침';document.body.appendChild(div);
      let cnt=5;const render=()=>{div.innerHTML='🔄 새 버전 적용 중... <b>'+cnt+'초</b><br><span style=font-size:11px;opacity:.85>클릭하면 즉시 적용</span>';};
      render();div.onclick=()=>_hardReload(m[1]);
      const tm=setInterval(()=>{cnt--;if(cnt<=0){clearInterval(tm);_hardReload(m[1]);}else render();},1000);
    }
  }catch(e){console.warn('[Update] 체크 실패:',e);}
}
setTimeout(_checkForUpdate,30000);setInterval(_checkForUpdate,5*60*1000);window._checkForUpdate=_checkForUpdate;
</script>
